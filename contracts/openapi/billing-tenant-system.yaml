  /api/v1/invoices/{id}/payments:
    post:
      tags:
      - "Invoices"
      summary: "Pay an invoice"
      description: "Starts a payment of an open invoice and answers Stripe's hosted\
        \ page where the customer pays. The invoice is paid, and the debt paid off,\
        \ only when Stripe's verified result arrives. Send an `Idempotency-Key`; a\
        \ repeat of the same key and body answers the first result with `200`."
      operationId: "pay"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the invoice."
        required: true
        schema:
          type: "string"
      - name: "Idempotency-Key"
        in: "header"
        description: "A key the caller chooses so a retry is safe: the same key with\
          \ the same body answers the first result instead of acting twice, and the\
          \ same key with a different body is a conflict."
        required: true
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      responses:
        "200":
          description: "An earlier identical request already created it; that resource\
            \ is returned"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PayInvoiceResponse"
        "201":
          description: "The invoice and the payment that was started."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PayInvoiceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "422":
          description: "Stripe rejected the request."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: "Stripe could not be reached and the outcome is unknown. Repeat\
            \ the request with the same `Idempotency-Key`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
