        schema:
          type: "string"
          minLength: 1
          maxLength: 128
      - name: "type"
        in: "query"
        required: false
        description: "Return only activities of this type, exactly as the writer sent\
          \ it."
        schema:
          type: "string"
          maxLength: 64
      - name: "from"
        in: "query"
        required: false
        description: "The activity happened at or after this instant."
        schema:
          type: "string"
          format: "date-time"
      - name: "to"
        in: "query"
        required: false
        description: "The activity happened at or before this instant."
        schema:
          type: "string"
          format: "date-time"
      - name: "limit"
        in: "query"
        required: false
        description: "Page size, 1 to 200."
        schema:
          type: "integer"
          format: "int32"
          default: 50
          minimum: 1
          maximum: 200
      - name: "cursor"
        in: "query"
        required: false
        description: "The `next_cursor` of the previous page. Valid only with the\
          \ same filter."
