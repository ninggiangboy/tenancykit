        required: false
        schema:
          type: string
      - name: "filter[id][eq]"
        in: query
        description: '`id` eq the value.'
        required: false
        schema:
          type: string
          format: uuid
      - name: "filter[id][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `id`.
        required: false
        schema:
          type: string
      - name: "filter[id][neq]"
        in: query
        description: '`id` neq the value.'
