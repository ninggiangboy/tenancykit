# Email's permission catalog.
#
# codes are namespaced by the app that enforces them: <app>:<resource>:<action>. A role may hold only a code whose
# `scopes` include the role's scope.
#
# scopes: platform and/or tenant. grantable_to_tenant_system: whether an API credential may carry the code.
#
# Every code is tenant scope: a template, a receiver, an email, a campaign and a suppression all belong to one
# tenant's own customers, and no platform-scope caller has a legitimate use for them. Email is the app a Tenant's
# **own** system is expected to drive, so every code except `settings:manage` is grantable to a Tenant System
# credential. `settings:manage` is deliberately not grantable: it changes retention, the default sender and the
# publish rate, which is an administrative decision a person makes, not a machine.

- code: email:template:read
  description: Read a template, its revision history and render a preview.
  scopes: [tenant]
  grantable_to_tenant_system: true

- code: email:template:manage
  description: Create, update and delete a template and its revisions.
  scopes: [tenant]
  grantable_to_tenant_system: true

- code: email:receiver:read
  description: Read receivers, groups, memberships and segment previews.
  scopes: [tenant]
  grantable_to_tenant_system: true

- code: email:receiver:manage
  description: Create, update and delete receivers, groups, memberships and suppressions.
  scopes: [tenant]
  grantable_to_tenant_system: true

- code: email:email:send
  description: Send one or a batch of transactional emails.
  scopes: [tenant]
  grantable_to_tenant_system: true

- code: email:email:read
  description: Read a sent email, its events and the email list.
  scopes: [tenant]
  grantable_to_tenant_system: true

- code: email:campaign:read
  description: Read campaigns, campaign recipients and campaign statistics.
  scopes: [tenant]
  grantable_to_tenant_system: true

- code: email:campaign:manage
  description: Create, schedule, send, pause, resume, cancel and test a campaign.
  scopes: [tenant]
  grantable_to_tenant_system: true

- code: email:settings:manage
  description: Change the tenant's default sender, reply-to, body retention and campaign publish rate.
  scopes: [tenant]
  grantable_to_tenant_system: false
