---
openapi: "3.1.0"
info:
  title: "Attribution API"
  description: "The API a Tenant System uses to run tracked marketing links, report\
    \ conversions, read measurement and keep advertising cost, plus the public redirect\
    \ and collection endpoints a visitor's browser calls without credentials."
  version: "v1"
servers:
- url: "/attribution"
  description: "Any tenant hostname: <tenant-code>.<base-domain>/attribution"
tags:
- name: "Link redirects"
  description: "The public redirect of a tracked link: records a click and answers\
    \ 302, with refusals that reveal little."
- name: "Campaign spend"
  description: "A campaign's advertising cost: set manual days, bulk set, delete a\
    \ manual day and read the rows."
- name: "Conversions"
  description: "The postback a tenant's order flow calls and the read side of conversions\
    \ with their credits."
- name: "Data subjects"
  description: "Erasing one visitor's collected data."
- name: "Campaigns"
  description: "A tenant's campaigns, their attribution model and window."
- name: "Health check"
  description: "Answers the caller's tenant identity, proving the token, tenant scope\
    \ and permission check are wired."
- name: "Attribution settings"
  description: "The click parameter, the origins allowed to collect and the default\
    \ attribution window."
- name: "Link statistics"
  description: "A link's click totals and last thirty days."
- name: "Reports"
  description: "Time series, breakdowns, funnel, cohorts and cost reports, each as\
    \ JSON or CSV."
- name: "Goals"
  description: "The conversion keys a tenant's site and backend report."
- name: "Tracked links"
  description: "Create, edit, pause, resume and archive tracked links, mint personal\
    \ links in bulk and fetch a QR code."
- name: "Page-view collection"
  description: "The public endpoint a tenant's page snippet posts page views to. Anything\
    \ unacceptable answers 204 without storing."
paths:
  /system/v1/campaigns/{campaignId}/spend/{day}:
    put:
      tags:
      - "Campaign spend"
      summary: "Set a campaign's spend for one day"
      description: "Sets the manual advertising cost of the campaign on `day`, with\
        \ optional impressions and clicks. A currency the campaign does not use is\
        \ refused.\n\nCallers: tenant-system. Requires `attribution:spend:manage`."
      operationId: "setAsTenantSystem"
      parameters:
      - name: "campaignId"
        in: "path"
        description: "The id of the campaign."
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "day"
        in: "path"
        description: "The day, as `YYYY-MM-DD`."
        required: true
        schema:
          type: "string"
          format: "date"
      requestBody:
        description: "The cost of one day."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpendRequest"
        required: true
      responses:
        "200":
          description: "The cost of one day."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SpendResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-required-permission: "attribution:spend:manage"
      x-allowed-callers:
      - "tenant-system"
    delete:
      tags:
      - "Campaign spend"
      summary: "Delete a campaign's manual spend for one day"
      description: "Deletes only the manual cost of the campaign on `day`, leaving\
        \ any imported row in place. Answers `204`.\n\nCallers: tenant-system. Requires\
        \ `attribution:spend:manage`."
      operationId: "deleteAsTenantSystem"
      parameters:
      - name: "campaignId"
        in: "path"
        description: "The id of the campaign."
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "day"
        in: "path"
        description: "The day, as `YYYY-MM-DD`."
        required: true
        schema:
          type: "string"
          format: "date"
      responses:
        "204":
          description: "No Content"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-required-permission: "attribution:spend:manage"
      x-allowed-callers:
      - "tenant-system"
  /system/v1/links:
    get:
      tags:
      - "Tracked links"
      summary: "List links"
      description: "Pages through the tenant's tracked links, with the list-query\
        \ contract's filtering, sorting and paging.\n\n**Filtering, sorting and paging**\
        \ follow the list-query contract. Conditions in `filter[field][op]` are combined\
        \ with AND. For OR, use `filter[or][i][field][op]`: predicates sharing the\
        \ index `i` are AND-ed and the branches are OR-ed (at most 10 branches, 20\
        \ predicates in all, 100 values in an `in` list). `neq` and `nin` do not match\
        \ rows where the field is null. Send `limit` with either `offset` (at most\
        \ 10000) or the `cursor` taken from a previous page, never both. The body\
        \ is `{\"data\": [...], \"page\": null}`. `page_info=full` fills `page` with\
        \ `limit`, `offset`, `total` and `next_cursor`; `page_info=cursor` fills it\
        \ with `limit` and `next_cursor` alone, without counting the matching rows;\
        \ omit it for the rows alone.\n\nCallers: tenant-system. Requires `attribution:link:read`."
      operationId: "listAsTenantSystem"
      parameters:
      - name: "filter[campaign_id][eq]"
        in: "query"
        description: "`campaign_id` eq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[campaign_id][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `campaign_id`."
        required: false
        schema:
          type: "string"
      - name: "filter[campaign_id][is_null]"
        in: "query"
        description: "`true` for rows where `campaign_id` is null, `false` for rows\
          \ where it is set."
        required: false
        schema:
          type: "boolean"
      - name: "filter[campaign_id][neq]"
        in: "query"
        description: "`campaign_id` neq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[campaign_id][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `campaign_id`."
        required: false
        schema:
          type: "string"
      - name: "filter[created_at][eq]"
        in: "query"
        description: "`created_at` eq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][gt]"
        in: "query"
        description: "`created_at` gt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][gte]"
        in: "query"
        description: "`created_at` gte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `created_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[created_at][lt]"
        in: "query"
        description: "`created_at` lt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][lte]"
        in: "query"
        description: "`created_at` lte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][neq]"
        in: "query"
        description: "`created_at` neq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `created_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[expires_at][eq]"
        in: "query"
        description: "`expires_at` eq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[expires_at][gt]"
        in: "query"
        description: "`expires_at` gt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[expires_at][gte]"
        in: "query"
        description: "`expires_at` gte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[expires_at][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `expires_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[expires_at][is_null]"
        in: "query"
        description: "`true` for rows where `expires_at` is null, `false` for rows\
          \ where it is set."
        required: false
        schema:
          type: "boolean"
      - name: "filter[expires_at][lt]"
        in: "query"
        description: "`expires_at` lt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[expires_at][lte]"
        in: "query"
        description: "`expires_at` lte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[expires_at][neq]"
        in: "query"
        description: "`expires_at` neq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[expires_at][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `expires_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[external_ref][eq]"
        in: "query"
        description: "`external_ref` eq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[external_ref][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `external_ref`."
        required: false
        schema:
          type: "string"
      - name: "filter[external_ref][is_null]"
        in: "query"
        description: "`true` for rows where `external_ref` is null, `false` for rows\
          \ where it is set."
        required: false
        schema:
          type: "boolean"
      - name: "filter[external_ref][neq]"
        in: "query"
        description: "`external_ref` neq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[external_ref][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `external_ref`."
        required: false
        schema:
          type: "string"
      - name: "filter[external_ref][starts_with]"
        in: "query"
        description: "Case-insensitive prefix match on `external_ref`."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[id][eq]"
        in: "query"
        description: "`id` eq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[id][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `id`."
        required: false
        schema:
          type: "string"
      - name: "filter[id][neq]"
        in: "query"
        description: "`id` neq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[id][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `id`."
        required: false
        schema:
          type: "string"
      - name: "filter[kind][eq]"
        in: "query"
        description: "`kind` eq the value."
        required: false
        schema:
          type: "string"
          enum:
          - "PERSONAL"
          - "STANDARD"
      - name: "filter[kind][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `kind`."
        required: false
        schema:
          type: "string"
      - name: "filter[kind][neq]"
        in: "query"
        description: "`kind` neq the value."
        required: false
        schema:
          type: "string"
          enum:
          - "PERSONAL"
          - "STANDARD"
      - name: "filter[kind][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `kind`."
        required: false
        schema:
          type: "string"
      - name: "filter[max_clicks][eq]"
        in: "query"
        description: "`max_clicks` eq the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[max_clicks][gt]"
        in: "query"
        description: "`max_clicks` gt the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[max_clicks][gte]"
        in: "query"
        description: "`max_clicks` gte the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[max_clicks][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `max_clicks`."
        required: false
        schema:
          type: "string"
      - name: "filter[max_clicks][is_null]"
        in: "query"
        description: "`true` for rows where `max_clicks` is null, `false` for rows\
          \ where it is set."
        required: false
        schema:
          type: "boolean"
      - name: "filter[max_clicks][lt]"
        in: "query"
        description: "`max_clicks` lt the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[max_clicks][lte]"
        in: "query"
        description: "`max_clicks` lte the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[max_clicks][neq]"
        in: "query"
        description: "`max_clicks` neq the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[max_clicks][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `max_clicks`."
        required: false
        schema:
          type: "string"
      - name: "filter[slug][contains]"
        in: "query"
        description: "Case-insensitive substring match on `slug`."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[slug][eq]"
        in: "query"
        description: "`slug` eq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[slug][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `slug`."
        required: false
        schema:
          type: "string"
      - name: "filter[slug][neq]"
        in: "query"
        description: "`slug` neq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[slug][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `slug`."
        required: false
        schema:
          type: "string"
      - name: "filter[slug][starts_with]"
        in: "query"
        description: "Case-insensitive prefix match on `slug`."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[status][eq]"
        in: "query"
        description: "`status` eq the value."
        required: false
        schema:
          type: "string"
          enum:
          - "ACTIVE"
          - "ARCHIVED"
          - "PAUSED"
      - name: "filter[status][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `status`."
        required: false
        schema:
          type: "string"
      - name: "filter[status][neq]"
        in: "query"
        description: "`status` neq the value."
        required: false
        schema:
          type: "string"
          enum:
          - "ACTIVE"
          - "ARCHIVED"
          - "PAUSED"
      - name: "filter[status][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `status`."
        required: false
        schema:
          type: "string"
      - name: "filter[updated_at][eq]"
        in: "query"
        description: "`updated_at` eq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][gt]"
        in: "query"
        description: "`updated_at` gt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][gte]"
        in: "query"
        description: "`updated_at` gte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `updated_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[updated_at][lt]"
        in: "query"
        description: "`updated_at` lt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][lte]"
        in: "query"
        description: "`updated_at` lte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][neq]"
        in: "query"
        description: "`updated_at` neq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `updated_at`."
        required: false
        schema:
          type: "string"
      - name: "sort"
        in: "query"
        description: "Comma-separated sortable fields, each optionally prefixed with\
          \ `-` for descending: created_at, id. At most 4 fields; `id` is appended\
          \ to make the order total. Default: `-id`."
        required: false
        schema:
          type: "string"
      - name: "limit"
        in: "query"
        description: "Page size, 1 to 200."
        required: false
        schema:
          type: "integer"
          format: "int32"
          default: 50
          maximum: 200
          minimum: 1
      - name: "offset"
        in: "query"
        description: "Rows to skip, at most 10000. Not combinable with `cursor`."
        required: false
        schema:
          type: "integer"
          format: "int32"
          default: 0
          maximum: 10000
          minimum: 0
      - name: "cursor"
        in: "query"
        description: "The `next_cursor` of the previous page. Valid only with the\
          \ same filter and sort."
        required: false
        schema:
          type: "string"
      - name: "page_info"
        in: "query"
        description: "`full` fills `page` with the limit, offset, total and next cursor;\
          \ `cursor` fills it with the limit and the next cursor alone, so a walk\
          \ over a large listing is not counted; omit it for the rows alone."
        required: false
        schema:
          type: "string"
          enum:
          - "full"
          - "cursor"
      responses:
        "200":
          description: "A page of link response rows, with the paging facts when the\
            \ request asked for them."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageLinkResponse"
        "400":
          description: "A filter, sort, cursor or paging parameter is unknown, not\
            \ allowed for the field, or not valid for its type."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permission: "attribution:link:read"
      x-allowed-callers:
      - "tenant-system"
    post:
      tags:
      - "Tracked links"
      summary: "Create a tracked link"
      description: "Creates a link under a campaign with one or more destinations,\
        \ UTM parameters, an optional expiry, click cap and password. Every destination\
        \ is validated at save: one that points at the suite or a private address\
        \ is refused, because that check is what stops a link becoming a phishing\
        \ relay. The password is stored as a hash and never returned. The link's public\
        \ URL works at once. Answers `201`.\n\nCallers: tenant-system. Requires `attribution:link:manage`."
      operationId: "createAsTenantSystem"
      requestBody:
        description: "The link to create, or its new properties."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkRequest"
        required: true
      responses:
        "201":
          description: "A tracked link."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LinkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permission: "attribution:link:manage"
      x-allowed-callers:
      - "tenant-system"
  /system/v1/links/{id}/resume:
    post:
      tags:
      - "Tracked links"
      summary: "Resume a link"
      description: "Makes a paused link redirect again. Answers `204`.\n\nCallers:\
        \ tenant-system. Requires `attribution:link:manage`."
      operationId: "resumeAsTenantSystem"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the link."
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "204":
          description: "No Content"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-required-permission: "attribution:link:manage"
      x-allowed-callers:
      - "tenant-system"
  /system/v1/links/{id}/pause:
    post:
      tags:
      - "Tracked links"
      summary: "Pause a link"
      description: "Stops the link redirecting at once; only an active link redirects.\
        \ Answers `204`. Requires `attribution:link:manage`.\n\nCallers: tenant-system.\
        \ Requires `attribution:link:manage`."
      operationId: "pauseAsTenantSystem"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the link."
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "204":
          description: "No Content"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-required-permission: "attribution:link:manage"
      x-allowed-callers:
      - "tenant-system"
  /system/v1/links/{id}/archive:
    post:
      tags:
      - "Tracked links"
      summary: "Archive a link"
      description: "Archives the link so it no longer redirects. Answers `204`.\n\n\
        Callers: tenant-system. Requires `attribution:link:manage`."
      operationId: "archiveAsTenantSystem"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the link."
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "204":
          description: "No Content"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
