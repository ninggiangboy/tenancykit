# Descriptions of the request and response fields, parameters and bodies of Survey's API.
# Read by DescriptionsOpenApiCustomizer; see dev.ngb.core.openapi for the format.

# ---- parameters
param no = The number of the published version, starting at 1.
param version = The number of the published version.
param locale = The locale to render in. When omitted, the survey's default locale is used.
param from = The start of the window, inclusive.
param to = The end of the window, exclusive.
param group_by = What to split the funnel by: `source` (the default), `country` or `device_class`.
param visitToken = The visit token the respondent received when opening a link. It is the credential for the call.
param token = The signed token of the link.
param /p/l/{token}/open token = The signed token of the survey link the respondent opened. A malformed, unknown, revoked or expired token all answer the same `404`.
param pageId = The id of the page the respondent saw.
param query = The query string of the link, which carries the source facts to record.
param Referer = The page that referred the respondent, recorded with the visit.
param User-Agent = The respondent's browser, from which the device facts of the visit are taken.
param /api/v1/links/{linkId} linkId = The id of the link.
param /api/v1/surveys/{id}/versions/{no} no = The number of the published version, starting at 1.
param /api/v1/surveys/{id}/versions/{no}/simulate no = The number of the published version to run the answers through.
param /api/v1/surveys/{id}/draft/preview locale = The locale to render the draft in.
param /p/v/{visitToken}/schema locale = The locale to render the survey in.

# ---- shared fields
field id = The id.
field name = The display name.
field version = The version of the record. It is also the `ETag`, which a conditional change sends as `If-Match`.
field status = The current status.
field surveyId = The id of the survey.
field createdAt = When the record was created.
field updatedAt = When the record was last changed.
field locale = The locale of the text: for example the survey's translation to show.
field answers = The answers, keyed by question id.
field document = The survey document: its pages, questions, logic and translations.
field source = The source the visit or link is attributed to, such as a campaign name.
field externalRef = The tenant's own reference for the recipient.
field expiresAt = When the link stops working, or null.
field honeypot = The name of a decoy field. A real respondent never sees it, so a submit that fills it is discarded without telling the sender.
field url = The URL.
field description = A note about the endpoint.
field eventTypes = The event types the endpoint subscribes to.
field keyId = The id of the key the signing secret was written under.
field version = The version of the record. It is also the `ETag`, which a conditional change sends as `If-Match`.
field code = The code of the problem.
field vars = The computed variables, by name.
field score = The quiz score, or null when the version does not score.
field timezone = The IANA time zone, such as `Europe/Paris`.

# ---- surveys, drafts, versions
schema SurveyRequest = The survey to create.
schema SurveyRequest.name = The survey's name.
schema SurveyResponse = A survey and where it stands in its lifecycle.
schema SurveyResponse.status = `DRAFT`, `OPEN` or `CLOSED`.
schema SurveyResponse.currentVersionId = The id of the published version respondents see, or null before the first publish.
schema SurveyResponse.currentVersionNo = The number of that version, or null.
schema DraftRequest = The draft document to store.
schema DraftRequest.document = The whole document. It replaces the draft.
schema DraftResponse = A survey's draft, with the tag its next save has to carry.
schema ValidationResult = Every reason a document would not publish.
schema ValidationResult.errors = The problems, each with the pointer of the offending member. Empty when the document would publish.
schema ValidationError = One reason a document cannot be published or evaluated.
schema ValidationError.pointer = The JSON pointer to the offending member of the document.
schema ValidationError.code = The kind of problem.
schema ValidationError.message = What is wrong.
schema Problem = One problem with a document or an answer.
schema Problem.field = The question or member the problem is about.
schema Problem.code = The kind of problem. The value the sender gave is never echoed.
schema VersionResponse = One published version with its document. A published version never changes.
schema VersionResponse.id = The version's id.
schema VersionResponse.versionNo = The version's number.
schema VersionResponse.publishedAt = When the version was published.
schema VersionSummary = One published version, without its document.
schema VersionSummary.id = The version's id.
schema VersionSummary.versionNo = The version's number.
schema VersionSummary.publishedAt = When the version was published.

# ---- preview and simulation
schema PreviewView = The draft's pages as one locale renders them, in presentation order.
schema PreviewView.pages = The pages in presentation order.
schema PageView = One page of the preview.
schema PageView.id = The page's id.
schema PageView.title = The page's title in this locale.
schema PageView.questions = The page's questions.
schema QuestionView = One question as the preview shows it.
schema QuestionView.id = The question's id.
schema QuestionView.type = The question type.
schema QuestionView.required = Whether an answer is required.
schema QuestionView.label = The question text in this locale.
schema QuestionView.help = The help text in this locale, or null.
schema QuestionView.options = The options of a choice question.
schema OptionView = One option of a choice question.
schema OptionView.id = The option's id.
schema OptionView.value = The option's stable value, which an answer stores.
schema OptionView.label = The option's label in this locale.
schema SimulateRequest = The answers to run through the version's logic.
schema SimulateRequest.answers = The answers, keyed by question id.
schema FlowResult = What one run of the version's logic produces.
schema FlowResult.path = The ids of the pages visited, in order.
schema FlowResult.visible = Every question of the version, mapped to whether it is asked.
schema FlowResult.vars = Every computed variable's value.
schema FlowResult.errors = Every reason the version could not be evaluated, by pointer. A non-empty list means nothing ran.

# ---- settings
schema ChangeRequest = The settings to change. A field that is left out keeps its current value.
schema SettingsResponse = The tenant's survey defaults. Before the tenant changed any, they are the configured defaults.
field defaultLocale = The locale a new version starts from.
field abandonAfter = How long a visit may sit idle before it is counted as abandoned, as an ISO-8601 duration such as `PT30M`.
field uploadMaxBytes = The largest file a respondent may upload, in bytes.
field publicRatePerMinute = How many requests per minute the public surface accepts from one caller.

# ---- links
schema PublicLinkRequest = The public link to create.
schema PublicLinkRequest.source = The source the link is attributed to. A survey has at most one public link per source.
schema PersonalLinksRequest = The personal links to create, one per recipient.
schema PersonalLinksRequest.source = The source every recipient inherits unless its entry names its own.
schema PersonalLinksRequest.links = One entry per recipient.
schema RecipientRequest = One recipient of a personal link.
schema RecipientRequest.externalRef = The tenant's own reference for the recipient. It must be unique within the request.
schema RecipientRequest.source = This recipient's source, or null to use the default.
schema RecipientRequest.expiresAt = When this recipient's link stops working, or null.
schema LinkResponse = A link that opens a survey.
schema LinkResponse.kind = `PUBLIC` for the one link of a source, `PERSONAL` for a link made for one recipient.
schema LinkResponse.status = `ACTIVE` or `REVOKED`.
schema LinkResponse.url = The URL to hand out. It is rebuilt from the link id, so it is always current.

# ---- respondent surface
schema AnswersRequest = The respondent's answers.
schema UploadRequest = The file the respondent wants to upload.
schema UploadRequest.questionId = The id of the file question the upload is for.
schema UploadRequest.filename = The file's name.
schema UploadRequest.size = The file's size in bytes.
schema UploadRequest.mime = The file's media type.
schema Signed = A signed upload the browser then uses.
schema Signed.uploadId = The id of the upload.
schema Signed.url = The URL to send the file to.
schema Signed.headers = The headers the upload request must carry.
schema SubmitResult = The outcome of a submit.
schema SubmitResult.responseId = The id of the completed response.
schema SubmitResult.problems = The problems found when the submit is refused, by question and code. Empty on success.
schema OpenedResponse = A visit that was just started from a link.
schema OpenedResponse.visitToken = The opaque token the browser uses for every later call of this visit.
schema OpenedResponse.versionNo = The number of the published version the visit pinned.
schema OpenedResponse.flow = The version's logic evaluated for no answers, so the browser knows what to ask first.
schema SchemaResponse = The survey a visit fills.
schema SchemaResponse.versionNo = The number of the version the visit pinned.
schema SchemaResponse.document = The version's document, rendered for the visit.

# ---- analytics
schema FilterRequest = Which responses an aggregate covers.
schema FilterRequest.version = Only responses to this published version, or null for all.
schema FilterRequest.from = Only responses submitted at or after this time.
schema FilterRequest.to = Only responses submitted before this time.
schema FilterRequest.source = Only responses from this source.
schema FilterRequest.externalRef = Only responses of this recipient.
schema CrossTabRequest = The two questions to cross-tabulate, and which responses to count.
schema CrossTabRequest.version = Only responses to this published version, or null for all.
schema CrossTabRequest.from = Only responses submitted at or after this time.
schema CrossTabRequest.to = Only responses submitted before this time.
schema CrossTabRequest.source = Only responses from this source.
schema CrossTabRequest.externalRef = Only responses of this recipient.
schema CrossTabRequest.rowQuestionId = The question whose answers form the rows.
schema CrossTabRequest.columnQuestionId = The question whose answers form the columns.
schema TrendRequest = Which responses to count over time, and how to bucket them.
schema TrendRequest.version = Only responses to this published version, or null for all.
schema TrendRequest.from = Only responses submitted at or after this time.
schema TrendRequest.to = Only responses submitted before this time.
schema TrendRequest.source = Only responses from this source.
schema TrendRequest.externalRef = Only responses of this recipient.
schema TrendRequest.bucket = The size of each time bucket.
schema TrendRequest.timezone = The IANA time zone the buckets are cut in.
schema AggregateView = Per-question aggregates of a survey's responses.
schema AggregateView.responses = How many responses the aggregate covers.
schema AggregateView.questions = One entry per question.
schema AggregateView.crossTabs = The cross-tabulations that were asked for.
schema QuestionAggregate = One question's numbers.
schema QuestionAggregate.questionId = The id of the question.
schema QuestionAggregate.type = The question type.
schema QuestionAggregate.answered = How many responses answered this question at all.
schema QuestionAggregate.counts = The chosen options, keyed by the option's stable value.
schema QuestionAggregate.mean = The average of a numeric answer, or null.
schema QuestionAggregate.median = The median of a numeric answer, or null.
schema QuestionAggregate.distribution = The counts per numeric value or per NPS bucket.
schema QuestionAggregate.matrixCells = The counts per matrix cell, keyed by row and column id.
schema CrossTabView = How respondents answered one question within each answer to another.
schema CrossTabView.rowDimension = The question that forms the rows.
schema CrossTabView.columnDimension = The question that forms the columns.
schema CrossTabView.total = The number of responses counted in the table.
schema CrossTabView.cells = One entry per non-empty cell, keyed by a `row|column` pair of answers, with the number of responses.
schema TrendView = The number of responses per time bucket.
schema TrendView.bucket = The size of each time bucket.
schema TrendView.timezone = The IANA time zone the buckets were cut in.
schema TrendView.points = One count per bucket.
schema BucketCount = The responses in one time bucket.
schema BucketCount.bucket = The start of the bucket.
schema BucketCount.count = The number of responses in the bucket.
schema FunnelView = How many people opened a link, started answering, completed and stopped. Bot visits are excluded.
schema FunnelView.groupBy = What the rows split the funnel by.
schema FunnelView.rows = One row per group.
schema FunnelView.opened = How many opened a link.
schema FunnelView.started = How many started answering.
schema FunnelView.completed = How many completed the survey.
schema FunnelView.abandoned = How many stopped without completing.
schema Row = The funnel of one group.
schema Row.key = The group, such as a source or a country.
schema Row.opened = How many opened a link.
schema Row.started = How many started answering.
schema Row.completed = How many completed the survey.
schema Row.abandoned = How many stopped without completing.
schema Row.lastPage = The page respondents most often stopped at. It depends on the client reporting page views, so it is approximate.

# ---- responses, respondents, exports
schema ResponseRow = One response with its answers as submitted.
schema ResponseRow.versionId = The id of the version the response answered.
schema ResponseRow.status = `IN_PROGRESS` or `COMPLETED`.
schema ResponseRow.vars = The variables the server computed at submit.
schema ResponseRow.score = The quiz score the server computed at submit, or null.
schema ResponseRow.respondentIdentity = The identity the respondent gave, when the survey asks for one.
schema ResponseRow.startedAt = When the respondent started.
schema ResponseRow.submittedAt = When the respondent submitted, or null while in progress.
schema RespondentView = One respondent of a survey.
schema RespondentView.respondentIdentity = The identity the respondent gave, or null.
schema RespondentView.state = Where the respondent's visit stands: `OPENED`, `STARTED`, `COMPLETED` or `ABANDONED`.
schema RespondentView.lastActivityAt = When the visit was last active.
schema RespondentView.responseId = The id of the response, or null when none was started.
schema ExportRequest = Which responses to export.
schema ExportRequest.filter = The same filter a response list takes.
schema ExportView = A CSV export and its state.
schema ExportView.status = `QUEUED`, `RUNNING`, `DONE` or `FAILED`.
schema ExportView.rows = The number of rows written, once finished.
schema ExportView.requestedBy = Who asked for the export.
schema ExportView.finishedAt = When the export finished, or null.
schema ExportView.downloadUrl = A presigned download that expires in fifteen minutes, present once the export is `DONE`.

# ---- webhooks
schema CreateEndpointRequest = The endpoint to register.
schema CreateEndpointRequest.url = The HTTPS URL events are posted to. It must resolve to a public address.
schema CreateEndpointRequest.description = A note about the endpoint.
schema CreateEndpointRequest.eventTypes = The event types to subscribe to: `survey-version.published`, `survey.closed` or `survey-response.submitted`.
schema UpdateEndpointRequest = The fields to change. A field that is left out keeps its value.
schema UpdateEndpointRequest.status = `ACTIVE`, or `DISABLED` to pause delivery without losing queued events.
schema EndpointResponse = A webhook endpoint. The signing secret is not part of it.
schema EndpointResponse.status = `ACTIVE` or `DISABLED`.
schema EndpointResponse.secretRotatedAt = When the signing secret was last rotated, or null.
schema EndpointWithSecretResponse = An endpoint with its signing secret, shown once.
schema EndpointWithSecretResponse.endpoint = The endpoint.
schema EndpointWithSecretResponse.signingSecret = The secret that signs deliveries. It is shown only in this response and is never available again.
schema DeliveryResponse = One delivery of an event to an endpoint.
schema DeliveryResponse.endpointId = The id of the endpoint.
schema DeliveryResponse.eventId = The id of the event. A receiver should treat a repeated event id as a duplicate.
schema DeliveryResponse.eventType = The event's type.
schema DeliveryResponse.status = Where the delivery stands. `DEAD` means it exhausted its attempts.
schema DeliveryResponse.attempts = How many attempts have been made.
schema DeliveryResponse.nextAttemptAt = When the next attempt is due, or null.
schema DeliveryResponse.lastStatusCode = The HTTP status the receiver answered last, or null.
schema DeliveryResponse.lastError = The last error, or null.
schema DeliveryResponse.completedAt = When the delivery finished, or null.
schema DeliveryDetailResponse = A delivery with the body that was sent and every attempt.
schema DeliveryDetailResponse.delivery = The delivery.
schema DeliveryDetailResponse.body = The event body that is sent.
schema DeliveryDetailResponse.attempts = Every attempt, oldest first.
schema AttemptResponse = One attempt to deliver.
schema AttemptResponse.attemptNo = The attempt's number, starting at 1.
schema AttemptResponse.statusCode = The HTTP status the receiver answered, or null when no answer came.
schema AttemptResponse.error = The error, or null.
schema AttemptResponse.responseExcerpt = The start of the receiver's answer.
schema AttemptResponse.latencyMs = How long the attempt took, in milliseconds.
schema AttemptResponse.attemptedAt = When the attempt was made.

# ---- errors specific to an operation
error PUT /api/v1/surveys/{id}/draft 428 = The request has no `If-Match` header. This endpoint requires the tag the draft was read at, so a save is never last-write-wins.
error POST /api/v1/surveys/{id}/publish 428 = The request has no `If-Match` header. This endpoint requires the tag the draft was read at.
error POST /api/v1/surveys/{id}/publish 422 ValidationResult = The document does not validate. The body lists every offending pointer.
error POST /api/v1/webhook-endpoints 422 = The url is not https or does not resolve to a public address, or an event type is not known.
error GET /p/v/{visitToken}/draft 409 = The visit already completed, so there is no draft to resume.
error PUT /p/v/{visitToken}/draft 409 = The visit already completed, so its answers cannot go back to a draft.
error POST /p/v/{visitToken}/submit 428 = The request has no `Idempotency-Key` header, which this endpoint requires.
error POST /p/v/{visitToken}/submit 422 SubmitResult = The answers do not satisfy the survey. The body lists the question and code of every problem, never the value.
error POST /p/v/{visitToken}/submit 409 = The visit already completed, the survey's response cap is reached, or its window is closed.
error POST /api/v1/surveys/{id}/links 409 = A public link for this `source` already exists, or the survey is not open.
error POST /api/v1/surveys/{id}/links/personal 409 = The survey is not open.
error POST /api/v1/surveys/{id}/links/personal 422 = The same `externalRef` is named twice in the request. Nothing is written.

# ---- success statuses a handler answers by what it did
status POST /p/v/{visitToken}/uploads 201 =
error GET /p/v/{visitToken}/draft 404 = The visit token is malformed, unknown or expired. Every failure answers the same, so a caller cannot probe for live visits.
error PUT /p/v/{visitToken}/draft 404 = The visit token is malformed, unknown or expired. Every failure answers the same, so a caller cannot probe for live visits.
error POST /p/v/{visitToken}/uploads 404 = The visit token is malformed, unknown or expired. Every failure answers the same, so a caller cannot probe for live visits.
error POST /p/v/{visitToken}/submit 404 = The visit token is malformed, unknown or expired. Every failure answers the same, so a caller cannot probe for live visits.
error POST /p/v/{visitToken}/pages/{pageId}/view 404 = The visit token is malformed, unknown or expired. Every failure answers the same, so a caller cannot probe for live visits.
error GET /p/v/{visitToken}/schema 404 = The visit token is malformed, unknown or expired. Every failure answers the same, so a caller cannot probe for live visits.
error POST /p/l/{token}/open 404 = The link token is malformed, unknown, revoked or expired, or belongs to another tenant. Every failure answers the same, so a caller cannot probe for live links.
