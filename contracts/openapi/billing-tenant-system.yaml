    post:
      tags:
      - "Subscriptions"
      summary: "Subscribe a wallet to a plan"
      description: "Subscribes a customer's wallet (`walletId`) to a plan (`planId`)\
        \ and charges the first period at once. The cycle and currency come from the\
        \ plan and stay fixed for the life of the subscription. A first period the\
        \ wallet cannot pay leaves the subscription `PAST_DUE` rather than rejecting\
        \ it. Send an `Idempotency-Key`; a repeat of the same key and body answers\
        \ the first result with `200`."
      operationId: "subscribe"
      parameters:
      - name: "Idempotency-Key"
        in: "header"
        description: "A key the caller chooses so a retry is safe: the same key with\
          \ the same body answers the first result instead of acting twice, and the\
          \ same key with a different body is a conflict."
        required: true
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The subscription to start."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeRequest"
        required: true
      responses:
        "200":
          description: "An earlier identical request already created it; that resource\
            \ is returned"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionDetailResponse"
        "201":
          description: "A subscription with its history."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
      x-required-permission: "billing:subscription:manage"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
      security:
      - apiKey: []
  /api/v1/subscriptions/{id}/cancel:
    post:
      tags:
      - "Subscriptions"
      summary: "Cancel a subscription"
      description: "Cancels at the end of the period already paid, so the customer\
        \ keeps what was paid for, or at once when no paid period is running. Repeating\
        \ it changes nothing. Billing stops no resource: the Tenant System decides\
        \ what the end means for it."
      operationId: "cancel"
      parameters:
