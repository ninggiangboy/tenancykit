components:
  schemas:
    SpendRequest:
      type: "object"
      description: "The cost of one day."
      properties:
        amount:
          type: "string"
          description: "The cost as a decimal string, in major units of the campaign's\
            \ currency."
        currency:
          type: "string"
          description: "The currency, which must be the campaign's."
        impressions:
          type: "integer"
          format: "int64"
          description: "The number of impressions, or null."
        clicks:
          type: "integer"
          format: "int64"
          description: "The number of paid clicks, or null."
    SpendResponse:
      type: "object"
      description: "The cost of one day."
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "The id."
        campaignId:
          type: "string"
          format: "uuid"
          description: "The id of the campaign."
        day:
          type: "string"
          format: "date"
          description: "The day."
        source:
          type: "string"
          description: "Where the row came from: `MANUAL`, `GOOGLE_ADS` or `META_ADS`."
        amount:
          type: "number"
          description: "The amount, in major units of the currency."
        currency:
          type: "string"
          description: "The ISO 4217 currency code of the amounts."
        impressions:
          type: "integer"
          format: "int64"
          description: "The number of impressions, when known."
        clicks:
          type: "integer"
          format: "int64"
          description: "The number of clicks."
    SettingsRequest:
      type: "object"
      description: "The settings to store."
      properties:
        click_param:
          type: "string"
          description: "The name of the query parameter that carries the click id."
        allowed_origins:
          type: "array"
          description: "The origins allowed to post to the collection endpoint. Each\
            \ is an absolute `https` origin, or `http://localhost`; wildcards are\
            \ refused."
          items:
            type: "string"
        default_window_days:
          type: "integer"
          format: "int32"
          description: "The attribution window applied when a campaign does not set\
            \ its own, in days."
    SettingsView:
      type: "object"
      description: "The tenant's attribution settings."
      properties:
        clickParam:
          type: "string"
          description: "The name of the query parameter that carries the click id."
        allowedOrigins:
          type: "array"
          description: "The origins allowed to post to the collection endpoint."
          items:
            type: "string"
        defaultWindowDays:
          type: "integer"
          format: "int32"
          description: "The default attribution window in days."
    EventBatch:
      type: "object"
      description: "A batch of page views from a tenant's page."
      properties:
        events:
          type: "array"
          description: "The page views."
          items:
            $ref: "#/components/schemas/RawEvent"
        consent:
          type: "boolean"
          description: "Whether the visitor consented to identifiers. With `false`\
            \ the server drops the visitor and session ids."
    RawEvent:
      type: "object"
      description: "One collected page view."
      properties:
        eventId:
          type: "string"
          description: "An id for the event, unique to this page view."
        clickId:
          type: "string"
          description: "The signed click token a redirect appended to the destination\
            \ URL."
        visitorId:
          type: "string"
          description: "The pseudonymous id of the visitor, created by the page snippet."
        sessionId:
          type: "string"
          description: "The id of the visitor's session."
        path:
          type: "string"
          description: "The path of the page that was viewed."
        occurredAt:
          type: "string"
          description: "When the page was viewed, as an ISO-8601 instant."
    DestinationRequest:
      type: "object"
      description: "One place a link can send a visitor."
      properties:
        url:
          type: "string"
          description: "The destination URL. One that points at the suite or a private\
            \ address is refused."
        weight:
          type: "integer"
          format: "int32"
          description: "How often the destination is chosen among the ones that match,\
            \ from 1 to 1000."
        devices:
          type: "array"
          description: "The device classes the destination is for. Empty means any."
          items:
            type: "string"
        countries:
          type: "array"
          description: "The countries the destination is for. Empty means any."
          items:
            type: "string"
        fallback:
          type: "boolean"
          description: "Whether this is the one destination used when no rule matches."
    LinkRequest:
      type: "object"
      description: "The link to create, or its new properties."
      properties:
        campaignId:
          type: "string"
          format: "uuid"
          description: "The campaign the link belongs to."
        slug:
          type: "string"
          description: "The slug of the public URL."
        externalRef:
          type: "string"
          description: "The tenant's own reference for the recipient."
        expiresAt:
          type: "string"
          format: "date-time"
          description: "When the link stops redirecting, or null."
        maxClicks:
          type: "integer"
          format: "int64"
          description: "The most clicks the link redirects, or null for no cap."
        password:
          type: "string"
          description: "A password visitors must give before they are redirected.\
            \ On update, a blank value keeps the stored one."
        utm:
          type: "object"
          additionalProperties:
            type: "string"
          description: "The UTM parameters appended to the destination, by name, such\
            \ as `utm_source`."
        destinations:
          type: "array"
          description: "Where the link sends visitors, with the rules that choose\
            \ among them."
          items:
            $ref: "#/components/schemas/DestinationRequest"
    DestinationView:
      type: "object"
      description: "One destination of a link."
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "The id."
        url:
          type: "string"
          description: "The URL."
        position:
          type: "integer"
          format: "int32"
          description: "The order the destination was given in."
        weight:
          type: "integer"
          format: "int32"
          description: "How often the destination is chosen among the ones that match."
        fallback:
          type: "boolean"
          description: "Whether this is the destination used when no rule matches."
        devices:
          type: "array"
          description: "The device classes the destination is for. Empty means any."
          items:
            type: "string"
        countries:
          type: "array"
          description: "The countries the destination is for. Empty means any."
          items:
            type: "string"
    LinkResponse:
      type: "object"
      description: "A tracked link."
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "The id."
        campaignId:
          type: "string"
          format: "uuid"
          description: "The id of the campaign."
        slug:
          type: "string"
          description: "The short, URL-safe name."
        kind:
          type: "string"
          description: "`STANDARD` or `PERSONAL`."
        externalRef:
          type: "string"
          description: "The tenant's own reference for the recipient."
        status:
          type: "string"
          description: "`ACTIVE`, `PAUSED` or `ARCHIVED`. Only an active link redirects."
        url:
          type: "string"
          description: "The public URL to share."
        expiresAt:
          type: "string"
          format: "date-time"
          description: "When the link stops redirecting, or null."
        maxClicks:
          type: "integer"
          format: "int64"
          description: "The most clicks the link redirects, or null for no cap."
        hasPassword:
          type: "boolean"
          description: "Whether the link is protected by a password. The password\
            \ itself is never returned."
        utm:
          type: "object"
          additionalProperties:
            type: "string"
          description: "The UTM parameters appended to the destination, by name, such\
            \ as `utm_source`."
        destinations:
          type: "array"
          description: "Where the link sends visitors."
          items:
            $ref: "#/components/schemas/DestinationView"
        version:
          type: "integer"
          format: "int64"
          description: "The version of the record. It is also the `ETag`, which a\
            \ conditional change sends as `If-Match`."
        createdAt:
          type: "string"
          format: "date-time"
          description: "When the record was created."
        updatedAt:
          type: "string"
          format: "date-time"
          description: "When the record was last changed."
    BulkLinkRow:
      type: "object"
      description: "One personal link to mint."
      properties:
        externalRef:
          type: "string"
          description: "The tenant's own reference for the recipient."
    BulkRequest:
      type: "object"
      description: "The personal links to mint, one per row."
      properties:
        campaignId:
          type: "string"
          format: "uuid"
          description: "The campaign the links belong to."
        destination:
          type: "string"
          description: "The destination URL every link shares."
        utm:
          type: "object"
          additionalProperties:
            type: "string"
          description: "The UTM parameters every link shares."
        expiresAt:
          type: "string"
          format: "date-time"
          description: "When the links stop redirecting, or null."
        rows:
          type: "array"
          description: "One row per link."
          items:
            $ref: "#/components/schemas/BulkLinkRow"
    PersonalLink:
      type: "object"
      description: "A personal link that was minted."
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "The link's id."
        slug:
          type: "string"
          description: "The link's slug."
        url:
          type: "string"
          description: "The public URL to give to the recipient."
        externalRef:
          type: "string"
          description: "The tenant's own reference for the recipient."
    GoalRequest:
      type: "object"
      description: "The goal to create, or its new properties."
      properties:
        key:
          type: "string"
          description: "The conversion key the tenant's site and backend both report.\
            \ It cannot change."
        name:
          type: "string"
          description: "The display name."
        defaultValue:
          type: "string"
          description: "The value a conversion has when it reports none, as a decimal\
            \ string."
        currency:
          type: "string"
          description: "The ISO 4217 currency code of the amounts."
    GoalResponse:
      type: "object"
      description: "A goal."
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "The id."
        key:
          type: "string"
          description: "The conversion key the tenant's site and backend both report."
        name:
          type: "string"
          description: "The display name."
        defaultValue:
          type: "string"
          description: "The value a conversion has when it reports none, as a decimal\
            \ string, or null."
        currency:
          type: "string"
          description: "The ISO 4217 currency code of the amounts."
        status:
          type: "string"
          description: "`ACTIVE` or `ARCHIVED`."
    ConversionRequest:
      type: "object"
      description: "The conversion to record."
      properties:
        goalKey:
          type: "string"
          description: "The key of the goal that was reached."
        clickId:
          type: "string"
          description: "The click token of the visit that led to the conversion. Give\
            \ this or `visitorId`."
        visitorId:
          type: "string"
          description: "The visitor who converted. Give this or `clickId`."
        value:
          type: "string"
          description: "The value of the conversion as a decimal string."
        currency:
          type: "string"
