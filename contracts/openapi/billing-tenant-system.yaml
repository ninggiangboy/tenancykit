  /api/v1/payments/{id}/refunds:
    post:
      tags:
      - "Refunds"
      summary: "Refund a payment"
      description: "Sends money back to the customer's card, in full when `amount`\
        \ is omitted. The unspent balance is held at once, Stripe is asked, and the\
        \ wallet is debited only when Stripe confirms. Answers `409` when the amount\
        \ exceeds what is left to refund or the wallet has already spent it. Send\
        \ an `Idempotency-Key`; a repeat of the same key and body answers the first\
        \ result with `200`."
      operationId: "requestRefund"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the payment."
        required: true
        schema:
          type: "string"
      - name: "Idempotency-Key"
        in: "header"
        description: "A key the caller chooses so a retry is safe: the same key with\
          \ the same body answers the first result instead of acting twice, and the\
          \ same key with a different body is a conflict."
        required: true
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The refund to request."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRequest"
        required: true
      responses:
        "200":
          description: "An earlier identical request already created it; that resource\
            \ is returned"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RefundResponse"
        "201":
          description: "A refund of a payment."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RefundResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "The amount exceeds what is left to refund, or the wallet has\
            \ already spent it."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: "Stripe rejected the refund."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: "Stripe could not be reached and the outcome is unknown. Repeat\
            \ the request with the same `Idempotency-Key`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      x-required-permission: "billing:refund:create"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
      security:
      - apiKey: []
