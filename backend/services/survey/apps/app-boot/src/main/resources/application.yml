spring:
  application:
    name: survey
  profiles:
    # With no active profile (dev, bootRun and every default-mode test) both runtime profiles are active, which
    # keeps the all-in-one behaviour. The two profile files stay out of that run: each guards itself with an
    # on-profile expression so only a runtime that runs alone applies its settings.
    default: api,worker
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SURVEY_OIDC_ISSUER_URI:http://localhost:8081/realms/tenancykit}
          jwk-set-uri: ${SURVEY_OIDC_JWK_SET_URI:${SURVEY_OIDC_ISSUER_URI:http://localhost:8081/realms/tenancykit}/protocol/openid-connect/certs}
          audiences: survey
  datasource:
    url: ${SURVEY_DB_URL:jdbc:postgresql://localhost:5432/survey}
    username: ${SURVEY_DB_USER:survey_app}
    password: ${SURVEY_DB_PASSWORD:survey_app}
  rabbitmq:
    host: ${SURVEY_RABBITMQ_HOST:localhost}
    port: ${SURVEY_RABBITMQ_PORT:5672}
    username: ${SURVEY_RABBITMQ_USER:survey}
    password: ${SURVEY_RABBITMQ_PASSWORD:survey}
    # The relay marks an outbox row only after waitForConfirmsOrDie, which needs simple publisher confirms.
    publisher-confirm-type: simple
  flyway:
    locations: classpath:db/migration
    # Migrations run as the table owner; the application connects as survey_app, which owns nothing.
    url: ${SURVEY_MIGRATION_DB_URL:${SURVEY_DB_URL:jdbc:postgresql://localhost:5432/survey}}
    user: ${SURVEY_MIGRATION_DB_USER:survey_owner}
    password: ${SURVEY_MIGRATION_DB_PASSWORD:survey_owner}
    placeholders:
      # The baseline creates survey_app with this password. Without the placeholder Flyway aborts the whole set.
      appDbPassword: ${SURVEY_DB_PASSWORD:survey_app}
  task:
    scheduling:
      pool:
        size: ${SURVEY_SCHEDULER_POOL_SIZE:4}
      shutdown:
        await-termination: true
        await-termination-period: 30s

server:
  port: ${SURVEY_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,replicaState

suite:
  app-code: survey
  replica:
    platform-base-url: ${SURVEY_PLATFORM_BASE_URL:http://localhost:8082}
    client-id: ${PLATFORM_SURVEY_SERVICE_CLIENT_ID:survey}
    client-secret: ${PLATFORM_SURVEY_SERVICE_CLIENT_SECRET:survey}
    rebuild-on-start: ${SURVEY_REPLICA_REBUILD_ON_START:true}
    page-limit: 200
    request-timeout: PT10S
    platform-issuer: ${SURVEY_PLATFORM_ISSUER:http://localhost:8082}
    platform-jwk-set-uri: ${SURVEY_PLATFORM_JWK_SET_URI:http://localhost:8082/.well-known/jwks.json}
    # The worker's queue; the api runtime serves HTTP and consumes nothing.
    queue: survey.platform-events
    exchange: platform.events
    max-attempts: 3
    retry-backoff: PT0.5S
    refresh-skew: PT30S

survey:
  messaging:
    exchange: ${SURVEY_MESSAGING_EXCHANGE:platform.events}
    queue: ${SURVEY_MESSAGING_QUEUE:survey.platform-events}
  # Survey's own exchange. It produces three facts; no app consumes them yet.
  events:
    exchange: ${SURVEY_EVENTS_EXCHANGE:survey.events}
  relay:
    poll-delay: PT2S
    batch-size: 50
    max-attempts: 10
    backoff-base: PT10S
    backoff-cap: PT1H
    jitter: 0.2
    claim-deadline: PT30S
  jobs:
    enabled: ${SURVEY_JOBS_ENABLED:true}
    # At most this many tenants run at once across all jobs; keep it below the connection pool.
    tenant-parallelism: ${SURVEY_WORKER_TENANT_PARALLELISM:4}
  housekeeping:
    enabled: ${SURVEY_HOUSEKEEPING_ENABLED:true}
    inbox-retention: P30D
    dead-outbox-retention: P7D
    # A pending upload that never became part of a submit is deleted with its object after this.
    orphaned-upload-retention: PT24H
    # An unfinished visit that has been idle this long becomes ABANDONED; a tenant setting overrides it per survey.
    abandoned-visit-after: PT24H
    batch-size: 500
    interval: PT1H
  links:
    # New tokens carry this key id; verification accepts every key still listed, so a rotation keeps a link already
    # handed out working.
    active-key-id: ${SURVEY_LINK_KEY_ID:k1}
    public-base-url: ${SURVEY_PUBLIC_BASE_URL:http://localhost/survey}
    # The default is deliberately empty rather than a well-known string: LinkConfiguration refuses to start without a
    # key, so a deployment that forgets SURVEY_LINK_SECRET fails at boot instead of letting anyone mint a link token.
    keys:
      k1: ${SURVEY_LINK_SECRET:}
  geoip:
    # The DB-IP Lite country database. Absent is allowed: every country is then null and the health detail says so.
    path: ${SURVEY_GEOIP_PATH:}
  uploads:
    # The server's own S3 endpoint, and the host a respondent's browser reaches for a presigned PUT.
    endpoint: ${SURVEY_S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${SURVEY_S3_PUBLIC_ENDPOINT:http://localhost:9000}
    bucket: ${SURVEY_S3_BUCKET:survey-uploads}
    region: ${SURVEY_S3_REGION:us-east-1}
    access-key: ${SURVEY_S3_ACCESS_KEY:minio}
    secret-key: ${SURVEY_S3_SECRET_KEY:minio12345}
  webhooks:
    # Endpoint signing secrets are envelope-encrypted with this key. A deployment must supply it; there is no default,
    # so a forgotten key fails startup rather than storing a secret in the clear.
    master-key: ${SURVEY_SECRETS_MASTER_KEY:}
    master-key-id: ${SURVEY_SECRETS_MASTER_KEY_ID:k1}
    allow-insecure-targets: ${SURVEY_WEBHOOKS_ALLOW_INSECURE:false}
    batch-size: 25
    max-attempts: 10
    backoff-base: PT30S
    backoff-cap: PT6H
    lease: PT2M
    max-connections: 100
    max-connections-per-route: 25
    connection-request-timeout: PT2S
    connect-timeout: PT3S
    read-timeout: PT10S
    deadline: PT15S
  public-api:
    # Both are per instance and in memory, so with N instances the effective limit is N times the setting.
    rate-per-minute: ${SURVEY_PUBLIC_RATE_PER_MINUTE:120}
    max-body-bytes: ${SURVEY_PUBLIC_MAX_BODY_BYTES:262144}
