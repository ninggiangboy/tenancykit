schema PromotionCodeResponse.active = Whether it can still be redeemed.
schema DeactivateCouponRequest = How to deactivate the coupon.
schema DeactivateCouponRequest.revokeRedemptions = `true` also ends the running redemptions. By default they keep working.
schema AddCodeRequest = The promotion code to add.
schema AddCodeRequest.code = The code a customer enters.
schema AddCodeRequest.maxRedemptions = How many times the code may be redeemed, or null.
schema AddCodeRequest.redeemBy = The last moment it can be redeemed, or null.
schema RedeemRequest = The coupon to redeem. Give a `code`, or a `couponId` to attach it directly.
schema RedeemRequest.code = The promotion code to redeem.
schema RedeemRequest.couponId = The coupon to attach, which skips a code's own limits.
schema RedemptionResponse = A coupon redeemed onto a wallet.
schema RedemptionResponse.couponId = The coupon.
schema RedemptionResponse.couponName = The coupon's name.
schema RedemptionResponse.codeId = The promotion code used, or null when it was attached directly.
schema RedemptionResponse.status = `ACTIVE`, `ENDED` or `REVOKED`.
schema RedemptionResponse.maxApplications = How many charges it may discount, or null.
schema RedemptionResponse.applicationsUsed = How many charges it has discounted.
schema RedemptionResponse.maxTotalDiscount = The most it may discount in all, or null.
schema RedemptionResponse.discountTotal = How much it has discounted so far.
schema RedemptionResponse.redeemedAt = When it was redeemed.
schema RedemptionResponse.endsAt = When it stops applying, or null.
schema RedemptionResponse.endReason = Why it ended: `EXHAUSTED`, `REVOKED`, `COUPON_DEACTIVATED` or `GRANTED`.
schema RedemptionResponse.endedAt = When it ended, or null.

# ---- billing sessions and the portal
schema CreateRequest = The billing session to create.
schema CreateRequest.customerId = The customer the session is for. A Tenant System may name only customers mapped to it.
schema CreateRequest.returnUrl = Where the portal sends the customer back to. It must be in the tenant's allowlist.
schema CreateRequest.permissions = What the session may do in the portal.
schema CreateRequest.expiresInSeconds = How long the session lasts, in seconds.
schema CreateResponse = The billing session that was created.
schema CreateResponse.id = The session's id, which revokes it.
schema CreateResponse.portalUrl = The portal URL to open in the customer's browser. It carries the single-use exchange token, which is shown only here.
schema CreateResponse.permissions = What the session may do in the portal.
schema CreateResponse.expiresAt = When the session expires.
schema ReplaceRequest = The allowlist to store.
schema ReplaceRequest.urls = The URLs a billing session may return the customer to, replacing the stored list.
schema ExchangeRequest = The token to exchange.
schema ExchangeRequest.token = The single-use token from the portal URL's fragment.
schema ExchangeResponse = The portal session the exchange opened.
schema ExchangeResponse.session = The session.
schema ExchangeResponse.csrfToken = The CSRF token the portal sends back with writes.
schema ExchangeResponse.returnUrl = Where the portal sends the customer back to.
schema SessionResponse = A portal session.
schema SessionResponse.sessionId = The session's id.
schema SessionResponse.permissions = What the session may do in the portal.
schema SessionResponse.expiresAt = When the session expires.
schema HostedPageResponse = A Stripe-hosted page.
schema HostedPageResponse.url = The URL of the page to open.

# ---- webhooks
schema CreateEndpointRequest = The endpoint to register.
schema CreateEndpointRequest.url = The HTTPS URL events are posted to. It must resolve to a public address.
schema CreateEndpointRequest.eventTypes = The event types to subscribe to.
schema UpdateEndpointRequest = The fields to change. A field that is left out keeps its value.
schema UpdateEndpointRequest.status = `ACTIVE`, or `DISABLED` to pause delivery without losing queued events.
schema EndpointResponse = A webhook endpoint. The signing secret is not part of it.
schema EndpointResponse.status = `ACTIVE` or `DISABLED`.
schema EndpointResponse.secretRotatedAt = When the signing secret was last rotated, or null.
schema EndpointWithSecretResponse = An endpoint with its signing secret, shown once.
schema EndpointWithSecretResponse.endpoint = The endpoint.
schema EndpointWithSecretResponse.signingSecret = The secret that signs deliveries. It is shown only in this response and is never available again.
schema DeliveryResponse = One delivery of an event to an endpoint.
schema DeliveryResponse.endpointId = The id of the endpoint.
schema DeliveryResponse.eventId = The id of the event. A receiver should treat a repeated event id as a duplicate.
schema DeliveryResponse.eventType = The event's type.
schema DeliveryResponse.status = `PENDING`, `IN_PROGRESS`, `SUCCEEDED` or `DEAD`. `DEAD` means it exhausted its attempts.
schema DeliveryResponse.attempts = How many attempts have been made.
schema DeliveryResponse.nextAttemptAt = When the next attempt is due, or null.
schema DeliveryResponse.resendOf = The id of the delivery this one resends, or null.
schema DeliveryResponse.lastStatusCode = The HTTP status the receiver answered last, or null.
schema DeliveryResponse.lastError = The last error, or null.
schema DeliveryDetailResponse = A delivery with the body that was sent and every attempt.
schema DeliveryDetailResponse.delivery = The delivery.
schema DeliveryDetailResponse.body = The event body that is sent.
schema DeliveryDetailResponse.attempts = Every attempt, oldest first.

# ---- errors specific to an operation
error POST /api/v1/reservations 402 = The wallet cannot cover the amount.
error POST /api/v1/pricing/reservations 402 = The wallet cannot cover the estimated cost.
error POST /api/v1/pricing/usage-charges 402 = The wallet could not pay. The same request succeeds after a top-up.
error POST /api/v1/payments/{id}/refunds 409 = The amount exceeds what is left to refund, or the wallet has already spent it.
error POST /api/v1/payments/{id}/refunds 422 = Stripe rejected the refund.
error POST /api/v1/payments/{id}/refunds 502 = Stripe could not be reached and the outcome is unknown. Repeat the request with the same `Idempotency-Key`.
error POST /api/v1/payments/top-ups 422 = Stripe rejected the request.
error POST /api/v1/payments/top-ups 502 = Stripe could not be reached and the outcome is unknown. Repeat the request with the same `Idempotency-Key`.
error POST /api/v1/invoices/{id}/payments 422 = Stripe rejected the request.
error POST /api/v1/invoices/{id}/payments 502 = Stripe could not be reached and the outcome is unknown. Repeat the request with the same `Idempotency-Key`.
error POST /portal/api/top-ups 422 = Stripe rejected the request.
error POST /portal/api/top-ups 502 = Stripe could not be reached and the outcome is unknown. Repeat the request with the same `Idempotency-Key`.
error POST /portal/api/payment-methods 422 = Stripe rejected the request.
error POST /portal/api/payment-methods 502 = Stripe could not be reached. Repeat the request.
error PUT /api/v1/stripe/configuration/direct 422 = Stripe rejected the keys.
error PUT /api/v1/stripe/configuration/direct 502 = Stripe could not be reached. Repeat the request.
error POST /api/v1/stripe/configuration/connect 422 = Stripe rejected the request.
error POST /api/v1/stripe/configuration/connect 502 = Stripe could not be reached. Repeat the request.
error POST /api/v1/stripe/configuration/connect/link 502 = Stripe could not be reached. Repeat the request.
error POST /api/v1/stripe/configuration/refresh 502 = Stripe could not be reached. Repeat the request.
error POST /api/v1/invoices/{id}/void 409 = The invoice is paid, and a paid invoice cannot be voided.
error POST /api/v1/wallets 409 = The customer already has a wallet in this currency with different settings. A wallet's currency and mode never change.
error POST /api/v1/usage-events 409 = The `idempotencyKey` was already used with different content.
error POST /api/v1/customers 409 = The `Idempotency-Key` was already used with a different body.
error POST /api/v1/wallets/{walletId}/coupon-redemptions 404 = The wallet does not exist, or the code is unknown, inactive, expired or exhausted. Every refusal answers the same, so a caller cannot learn which.
error POST /stripe/webhooks/direct/{configurationId} 400 = The signature of the raw body could not be verified. The answer says nothing about why.
error POST /stripe/webhooks/connect 400 = The signature of the raw body could not be verified. The answer says nothing about why.
error POST /portal/api/session/exchange 401 = The token is unknown, already used, revoked or expired. The answer does not say which.

# ---- success statuses a handler answers by what it did
status POST /api/v1/billing-sessions/{id}/revoke 204 = The session was revoked.
status POST /api/v1/wallets 201 = The wallet was opened.
status POST /api/v1/wallets 200 = The customer already had this wallet with the same settings, so it is returned.
