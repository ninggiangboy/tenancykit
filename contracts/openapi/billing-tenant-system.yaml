        couponId:
          type: "string"
          description: "The coupon it redeems."
        maxRedemptions:
          type: "integer"
          format: "int64"
          description: "How many times the code may be redeemed, or null."
        redeemedCount:
          type: "integer"
          format: "int64"
          description: "How many times it was redeemed."
        redeemBy:
          type: "string"
