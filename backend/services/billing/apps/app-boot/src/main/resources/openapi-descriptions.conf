# Descriptions of the request and response fields, parameters and bodies of Billing's API.
# Amounts are integers in minor units of an ISO 4217 currency (cents, dong) unless a field says otherwise.
# Read by DescriptionsOpenApiCustomizer; see dev.ngb.core.openapi for the format.

# ---- parameters
param Stripe-Signature = The signature Stripe computed over the raw body. It is checked before anything in the body is read.
param configurationId = The id of the Stripe configuration the webhook endpoint belongs to.
param customerId = The id of the customer.
param externalUserId = The Tenant System's own id of the user the customer is mapped to.
param tenantSystemId = The id of the tenant system the user belongs to. A Tenant System caller omits it.
param walletId = The id of the wallet.
param from = The start of the period, inclusive.
param to = The end of the period, exclusive.
param metric = Only this metric. Repeat the parameter for several.
param /portal/api/usage/totals metric = Only this metric.
param /api/v1/usage-aggregates customerId = The id of the customer whose usage is totalled.

# ---- shared fields
field id = The id.
field status = The current status.
field customerId = The id of the customer.
field walletId = The id of the wallet.
field planId = The id of the pricing plan.
field chargeId = The id of the charge.
field currency = The ISO 4217 currency code of the amounts.
field amount = The amount in minor units of the currency.
field createdAt = When the record was created.
field updatedAt = When the record was last changed.
field completedAt = When it completed, or null.
field reason = The reason given.
field failureReason = Why it failed, or null.
field reference = A reference the caller chose, recorded with the record.
field ledgerEntryId = The id of the ledger entry it posted, or null.
field url = The URL.
field description = A note about the endpoint.
field eventTypes = The event types the endpoint subscribes to.
field keyId = The id of the key the secret was written under. The secret itself is never returned.
field displayName = The name shown for the customer.
field email = The customer's email address.
field periodStart = The start of the period.
field periodEnd = The end of the period.
field checkoutUrl = The Stripe-hosted page where the customer pays. Present only while the customer can still pay.
field quantity = The quantity as a decimal string with up to six decimal places.
field metric = The name of the metric.
field unit = The unit the metric is measured in.
field version = The version of the plan.
field idempotencyKey = A key that makes a retry return the same result.
field events = The number of events.
field replayed = Whether the answer is the earlier result of the same request, not a new one.
field index = The position of the item in the request, starting at 0.
field ttlSeconds = How long the hold lasts, in seconds.
field expiresAt = When it expires.
field occurredAt = When it happened.
field detail = Details of what happened.
field name = The name.
field code = The code, unique per tenant.
field total = The total amount.

# ---- money
schema MoneyDto = An amount of money.
schema MoneyDto.amount = The amount in minor units of the currency.
schema MoneyDto.currency = The ISO 4217 currency code.
schema OpenWalletRequest = The wallet to open.
schema OpenWalletRequest.mode = `PREPAID` (spends its balance) or `POSTPAID` (spends up to its credit limit and is billed later).
schema OpenWalletRequest.creditLimit = For a postpaid wallet, how much it may owe at most.
schema WalletResponse = A customer's wallet in one currency.
schema WalletResponse.mode = `PREPAID` or `POSTPAID`.
schema WalletResponse.balance = The money in the wallet.
schema WalletResponse.held = The part of the balance held by active reservations.
schema WalletResponse.available = The balance less the amount held by active reservations. A postpaid wallet may spend this plus its credit limit.
schema WalletResponse.creditLimit = How much a postpaid wallet may owe at most.
schema WalletResponse.outstanding = How much a postpaid wallet owes.
schema WalletResponse.lastSequence = The sequence number of the wallet's last ledger entry.
schema ReserveRequest = The hold to place on a wallet.
schema ReserveRequest.amount = The amount to hold, in minor units of the currency.
schema ReserveRequest.ttlSeconds = How long the hold lasts, in seconds. After that it is released.
schema ReserveRequest.reference = A reference the caller chose, such as the id of the resource that will run.
schema ReservationResponse = A hold on part of a wallet's balance.
schema ReservationResponse.status = `ACTIVE`, `CAPTURED`, `RELEASED` or `EXPIRED`.
schema ReservationResponse.amount = The amount held.
schema ReservationResponse.captured = The amount charged against the hold so far.
schema ReservationResponse.closedAt = When the hold was captured, released or expired, or null.
schema CaptureRequest = The actual cost to charge against a reservation.
schema CaptureRequest.amount = The actual cost, in minor units. Whatever the hold was above it is released.
schema ChargeRequest = The cost to charge to a wallet.
schema ChargeRequest.amount = The cost, in minor units.
schema ChargeRequest.usageRef = A reference to the usage the charge is for.
schema ChargeResponse = A charge made against a wallet.
schema ChargeResponse.status = `SUCCEEDED` or `FAILED`. A wallet that cannot pay yields a recorded `insufficient_funds` failure.
schema ChargeResponse.amount = What the wallet paid after discounts.
schema ChargeResponse.grossAmount = The amount before discounts.
schema ChargeResponse.discounts = The coupon discounts applied.
schema ChargeResponse.reservationId = The reservation it was captured from, or null.
schema ChargeResponse.usageRef = The usage reference, or null.
schema DiscountLineResponse = One coupon discount applied to a charge.
schema DiscountLineResponse.redemptionId = The redemption that gave the discount.
schema DiscountLineResponse.couponId = The coupon.
schema DiscountLineResponse.couponName = The coupon's name.
schema DiscountLineResponse.benefitType = The kind of benefit: `PERCENT_OFF`, `AMOUNT_OFF` or `WALLET_CREDIT`.
schema DiscountLineResponse.amount = The amount taken off.
schema DiscountLineDto = One coupon discount applied to an estimate.
schema DiscountLineDto.redemptionId = The redemption that would give the discount.
schema DiscountLineDto.couponId = The coupon.
schema DiscountLineDto.couponName = The coupon's name.
schema DiscountLineDto.benefitType = The kind of benefit: `PERCENT_OFF`, `AMOUNT_OFF` or `WALLET_CREDIT`.
schema DiscountLineDto.amount = The amount taken off.
schema LedgerEntryResponse = One entry of a wallet's append-only ledger.
schema LedgerEntryResponse.sequence = The entry's position in the wallet's ledger.
schema LedgerEntryResponse.type = `CREDIT` or `DEBIT`.
schema LedgerEntryResponse.amount = The amount of the entry.
schema LedgerEntryResponse.reservationId = The reservation the entry belongs to, or null.
schema LedgerEntryResponse.reversalOf = The id of the entry this one reverses, or null.
schema LedgerEntryResponse.actor = Who caused the entry.
schema ReverseRequest = The correction to post.
schema ReverseRequest.reason = Why the entry is reversed.
schema ReverseRequest.replacement = An entry to post in its place with the right amount, or null for none.
schema ReplacementRequest = The entry that replaces a reversed one.
schema ReplacementRequest.type = `CREDIT` or `DEBIT`.
schema ReplacementRequest.amount = The amount of the replacement, in minor units.
schema ReversalResponse = The entries a reversal posted.
schema ReversalResponse.reversal = The entry that negates the original.
schema ReversalResponse.replacement = The replacement entry, or null.

