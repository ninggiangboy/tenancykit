          maxLength: 255
      - name: "filter[subject][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `subject`."
        required: false
        schema:
          type: "string"
      - name: "filter[subject][starts_with]"
        in: "query"
        description: "Case-insensitive prefix match on `subject`."
        required: false
        schema:
          type: "string"
          maxLength: 255
