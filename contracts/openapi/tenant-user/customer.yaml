---
openapi: "3.1.0"
info:
  title: "Customer API"
  description: "The API a Tenant System uses to keep a Tenant's own customer data:\
    \ upsert customers one at a time or in batches, change their tags, field values\
    \ and consent, record orders with line items and returns, write activities, read\
    \ a customer back as one 360 profile, search and filter the customer list and\
    \ stream it as CSV, define the custom fields and consent topics the tenant uses,\
    \ erase a customer, and manage the signed webhooks customer sends to the Tenant's\
    \ own endpoints. customer reports every customer, order and erasure change as\
    \ a signed HTTP webhook to the Tenant's subscribed endpoints, never through a\
    \ broker exchange. The tenant is taken from the request's host and suite token,\
    \ never from a body: every call acts on one Tenant's data only, and no request\
    \ body carries a tenant."
  version: "v1"
servers:
- url: "/customer"
  description: "Any tenant hostname: <tenant-code>.<base-domain>/customer"
tags:
- name: "Customers"
  description: "Create or replace customers by the Tenant's own reference, change\
    \ them with If-Match, upsert in batches, and search and filter the list."
- name: "Customer profile"
  description: "One customer read back as a single 360 profile."
- name: "Orders"
  description: "Record orders with line items and returns, and read a customer's orders."
- name: "Activities"
  description: "Write activities against a customer, singly or in batches, and read\
    \ a customer's timeline."
- name: "Consent"
  description: "The consent topics a tenant defines and each customer's consent records."
- name: "Custom fields"
  description: "The custom fields a tenant defines for its customers."
- name: "Tags"
  description: "The tags the tenant's customers carry."
- name: "Exports"
  description: "Stream the customer list as CSV."
- name: "Erasure"
  description: "Erase a customer's personal data. The original reference can then\
    \ start a new customer."
- name: "Webhook endpoints"
  description: "Where the tenant wants this service's events delivered, and which\
    \ event types. The signing secret is returned only when an endpoint is created\
    \ or its secret rotated, never again."
- name: "Webhook deliveries"
  description: "The history of attempts to deliver an event to an endpoint, and resending\
    \ one that finished. A delivery that exhausted its attempts stays visible so it\
    \ can be resent."
paths:
  /api/v1/customers/{externalRef}:
    put:
      tags:
      - "Customers"
      summary: "Create or replace a customer"
      description: "Upserts one customer, keyed by the Tenant's own `externalRef`.\
        \ The response carries the customer's `ETag`; pass it as `If-Match` on the\
        \ next `PATCH`. An identical body changes nothing and bumps no version. An\
        \ order or an activity that names an unknown customer is refused; this endpoint\
        \ is how the customer is created.\n\nCallers: tenant-user. Requires `customer:customer:manage`."
      operationId: "putCustomer"
      parameters:
      - name: "externalRef"
        in: "path"
        required: true
        description: "The Tenant's reference for the customer, unique per tenant and\
          \ immutable."
        schema:
          type: "string"
          minLength: 1
          maxLength: 128
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpsert"
        required: true
      responses:
        "201":
          description: "The customer did not exist and was created. A `customer.created`\
            \ webhook is queued in the same transaction."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Customer"
        "200":
          description: "The customer existed: the representation was replaced, or\
            \ it was already identical and nothing changed."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "The `externalRef` in the body, when sent, names a different\
            \ reference than the path. Code `IDEMPOTENCY_CONFLICT`. The reference\
            \ of an erased customer is `erased:<id>`, so writing to it is `CUSTOMER_ERASED`;\
            \ the original reference starts a new customer."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "The body is not a valid customer: `displayName` is empty or\
            \ longer than 200 characters, `phone` is longer than 32, `email` is longer\
            \ than 254 or malformed, a `customFields` key is unknown or archived or\
            \ its value is of the wrong type, the customer would hold more than 50\
            \ tags, or the serialized field values exceed 16 KiB. Code `VALIDATION_FAILED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: "customer:customer:manage"
      x-allowed-callers:
      - "tenant-user"
    patch:
      tags:
      - "Customers"
      summary: "Change some of a customer's attributes, tags and field values"
      description: "Changes only the properties that are present. Requires `If-Match`:\
        \ the endpoint answers `428` without the header and `412` when the tag does\
        \ not match. `addTags` and `removeTags` change the tag set without replacing\
        \ it, and a `customFields` property merges into the stored values. The response\
        \ carries the new `ETag`.\n\nCallers: tenant-user. Requires `customer:customer:manage`."
      operationId: "patchCustomer"
      parameters:
      - name: "externalRef"
        in: "path"
        required: true
        description: "The Tenant's reference for the customer."
        schema:
          type: "string"
          minLength: 1
          maxLength: 128
      - name: "If-Match"
        in: "header"
        required: false
        description: "Required by this update; the endpoint answers `428` without\
          \ it and `412` when it does not match the current `ETag`."
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPatch"
        required: true
      responses:
        "200":
          description: "The customer after the change."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No customer with that `externalRef` in this tenant. Code `CUSTOMER_NOT_FOUND`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "The customer's personal data was erased; the ref an erased\
            \ customer keeps is `erased:<id>` and holds no writable data. Code `CUSTOMER_ERASED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          description: "A property of the body is not valid: `displayName` is empty\
            \ or longer than 200 characters, `phone` is longer than 32, `email` is\
            \ longer than 254 or malformed, a `customFields` key is unknown or archived\
            \ or its value is of the wrong type, or the customer would hold more than\
            \ 50 tags. Code `VALIDATION_FAILED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
      x-required-permission: "customer:customer:manage"
      x-allowed-callers:
      - "tenant-user"
    get:
      tags:
      - "Customers"
      summary: "Read a customer"
      description: "Reads one customer with its field values, tags and current consent\
        \ state. The response carries the customer's `ETag`.\n\nCallers: tenant-user.\
        \ Requires `customer:customer:read`."
      operationId: "getCustomer"
      parameters:
      - name: "externalRef"
        in: "path"
        required: true
        description: "The Tenant's reference for the customer."
        schema:
          type: "string"
          minLength: 1
          maxLength: 128
      responses:
        "200":
          description: "The customer."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No customer with that `externalRef` in this tenant. Code `CUSTOMER_NOT_FOUND`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: "customer:customer:read"
      x-allowed-callers:
      - "tenant-user"
  /api/v1/customers/batch:
    post:
      tags:
      - "Customers"
      summary: "Upsert a batch of customers"
      description: "Applies up to 1,000 customers, each in its own transaction and\
        \ in the order sent. The batch is `200` even when some items failed: a malformed\
        \ item fails alone and the others are written. Two items with the same `externalRef`\
        \ apply in order. A retry of the whole batch is safe, because every item is\
        \ idempotent by its `externalRef`.\n\nCallers: tenant-user. Requires `customer:customer:manage`."
      operationId: "createCustomerBatch"
      parameters:
      - name: "X-Request-Id"
        in: "header"
        required: false
        description: "The caller's own id for this call, recorded with it."
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCustomersRequest"
        required: true
      responses:
        "200":
          description: "One result per item, in the order sent. A `CREATED` item queued\
            \ its `customer.created` webhook; a `FAILED` item carries the code it\
            \ failed with."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BatchCustomersResponse"
        "400":
          description: "The envelope is malformed or has no `items` (`INVALID_REQUEST`),\
            \ or it holds more than 1,000 items (`BATCH_LIMIT_EXCEEDED`)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permission: "customer:customer:manage"
      x-allowed-callers:
      - "tenant-user"
  /api/v1/customers:
    get:
      tags:
      - "Customers"
      summary: "Search and list customers"
      description: "Searches the tenant's customers. `q` matches the `externalRef`\
        \ exactly, a phone-digit prefix, an email prefix or a name. Every `tag` parameter\
        \ must match, and a custom field, a consent topic and the creation time are\
        \ filterable. The list is paged with a keyset cursor: pass `cursor` from the\
        \ previous page with the same filter and sort; a cursor is opaque, it is refused\
        \ with a different filter or sort, and `page.next_cursor` is null on the last\
        \ page. Rows follow `sort`, and `id` is appended to make the order total.\n\
        \nCallers: tenant-user. Requires `customer:customer:read`."
      operationId: "listCustomers"
      parameters:
      - name: "q"
        in: "query"
        required: false
        description: "A search term: the `externalRef` exactly, a phone-digit prefix,\
          \ an email prefix or part of a name."
        schema:
          type: "string"
          maxLength: 255
      - name: "tag"
        in: "query"
        required: false
        description: "A tag the customer must carry. Repeat the parameter to require\
          \ every named tag."
        schema:
          type: "array"
          items:
            type: "string"
      - name: "field.<key>"
        in: "query"
        required: false
        description: "Equality on the value of the custom field `<key>`, one parameter\
          \ per key. The value must match the field definition's type."
        schema:
          type: "string"
      - name: "field.<key>.gte"
        in: "query"
        required: false
        description: "The value of the custom field `<key>` is at or above this value.\
          \ `NUMBER` and `DATE` fields only."
        schema:
          type: "string"
      - name: "field.<key>.lte"
        in: "query"
        required: false
        description: "The value of the custom field `<key>` is at or below this value.\
          \ `NUMBER` and `DATE` fields only."
        schema:
          type: "string"
      - name: "consent.<topic>"
        in: "query"
        required: false
        description: "The current state of the consent topic `<topic>`, one parameter\
          \ per topic: `granted` (the latest event grants it), `revoked` (the latest\
          \ event revokes it) or `none` (the customer has no event for it)."
        schema:
          type: "string"
          enum:
          - "granted"
          - "revoked"
          - "none"
      - name: "createdFrom"
        in: "query"
        required: false
        description: "The customer was created at or after this instant."
        schema:
          type: "string"
          format: "date-time"
      - name: "createdTo"
        in: "query"
        required: false
        description: "The customer was created at or before this instant."
        schema:
          type: "string"
          format: "date-time"
      - name: "sort"
        in: "query"
        required: false
        description: "Comma-separated sortable fields, each optionally prefixed with\
          \ `-` for descending: created_at, id. At most 4 fields; `id` is appended\
          \ to make the order total."
        schema:
          type: "string"
          default: "-created_at,id"
      - name: "limit"
        in: "query"
        required: false
        description: "Page size, 1 to 200."
        schema:
          type: "integer"
          format: "int32"
          default: 50
          minimum: 1
          maximum: 200
      - name: "cursor"
        in: "query"
        required: false
        description: "The `next_cursor` of the previous page. Valid only with the\
          \ same filter and sort."
        schema:
          type: "string"
      responses:
        "200":
          description: "A page of customers, each with its field values, tags and\
            \ current consent state."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerPage"
        "400":
          description: "A filter, sort or paging parameter is unknown (`INVALID_REQUEST`);\
            \ a value is not valid for its type, a custom-field key is unknown, a\
            \ consent topic is unknown, or the `cursor` is malformed or belongs to\
            \ a different filter or sort (`VALIDATION_FAILED`)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permission: "customer:customer:read"
      x-allowed-callers:
      - "tenant-user"
  /api/v1/customers/{externalRef}/profile:
    get:
      tags:
      - "Customer profile"
      summary: "Read a customer's 360 profile"
      description: "One customer read back as one document: the customer, its field\
        \ values, its tags, the current status of every consent topic, its latest\
        \ orders with their lines and returns, and its latest activities. Every slice\
        \ is bounded and indexed; no aggregate, segment or score is computed here.\n\
        \nCallers: tenant-user. Requires `customer:customer:read`."
      operationId: "getCustomerProfile"
      parameters:
      - name: "externalRef"
        in: "path"
        required: true
        description: "The Tenant's reference for the customer."
        schema:
          type: "string"
          minLength: 1
          maxLength: 128
      - name: "orders"
        in: "query"
        required: false
        description: "How many of the customer's latest orders to include, 0 to 50."
        schema:
          type: "integer"
          format: "int32"
          default: 10
          minimum: 0
          maximum: 50
      - name: "activities"
        in: "query"
        required: false
        description: "How many of the customer's latest activities to include, 0 to\
          \ 100."
        schema:
          type: "integer"
          format: "int32"
          default: 20
          minimum: 0
          maximum: 100
      responses:
        "200":
          description: "The profile, newest first within each slice."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No customer with that `externalRef` in this tenant. Code `CUSTOMER_NOT_FOUND`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: "customer:customer:read"
      x-allowed-callers:
      - "tenant-user"
  /api/v1/customers/export:
    get:
      tags:
      - "Exports"
      summary: "Stream the customer list as CSV"
      description: "Takes the same filters as the customer list and streams the matching\
        \ customers as CSV. The header row is `externalRef,displayName,phone,email,tags,<one\
        \ column per active custom-field key>,createdAt`; `tags` holds the customer's\
        \ tags pipe-separated. The stream is read with a server-side cursor and a\
        \ bounded buffer, so a large export uses a fixed amount of memory. One export\
        \ runs per tenant at a time, held by a short lease; a second is refused until\
        \ the first finishes.\n\nCallers: tenant-user. Requires `customer:customer:export`."
      operationId: "exportCustomers"
      parameters:
      - name: "q"
        in: "query"
        required: false
        description: "A search term: the `externalRef` exactly, a phone-digit prefix,\
          \ an email prefix or part of a name."
        schema:
          type: "string"
          maxLength: 255
      - name: "tag"
        in: "query"
        required: false
        description: "A tag the customer must carry. Repeat the parameter to require\
          \ every named tag."
        schema:
          type: "array"
          items:
            type: "string"
      - name: "field.<key>"
        in: "query"
        required: false
        description: "Equality on the value of the custom field `<key>`, one parameter\
          \ per key."
        schema:
          type: "string"
      - name: "createdFrom"
        in: "query"
        required: false
        description: "The customer was created at or after this instant."
        schema:
          type: "string"
          format: "date-time"
      - name: "createdTo"
        in: "query"
        required: false
        description: "The customer was created at or before this instant."
        schema:
          type: "string"
          format: "date-time"
      - name: "consent.<topic>"
        in: "query"
        required: false
        description: "The current state of the consent topic `<topic>`: `granted`,\
          \ `revoked` or `none`."
        schema:
          type: "string"
          enum:
          - "granted"
          - "revoked"
          - "none"
      - name: "page_size"
        in: "query"
        required: false
        description: "How many rows the server-side cursor reads at a time, 1 to 10000.\
          \ Its default is a setting; the export is a stream, so this is not a page\
          \ of the response."
        schema:
          type: "integer"
          format: "int32"
          default: 1000
          minimum: 1
          maximum: 10000
      responses:
        "200":
          description: "The matching customers as CSV, streamed. A cell that starts\
            \ with `=`, `+`, `-` or `@` is prefixed with a quote, so a spreadsheet\
            \ cannot run it."
          content:
            text/csv:
              schema:
                type: "string"
        "400":
          description: "A filter is unknown (`INVALID_REQUEST`), or a value is not\
            \ valid for its type or a custom-field key is unknown (`VALIDATION_FAILED`)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: "Another export of this tenant is still running. Code `EXPORT_IN_PROGRESS`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: "customer:customer:export"
      x-allowed-callers:
      - "tenant-user"
  /api/v1/customers/{externalRef}/erasure:
    post:
      tags:
      - "Erasure"
      summary: "Erase a customer's personal data"
      description: "Clears every personal field of the customer, its field values,\
        \ its tags, its consent contact data and its activity payloads in one transaction,\
        \ keeps the customer row and its orders and consent rows as anonymous markers,\
        \ sets the reference to `erased:<id>` and queues a `customer.erased` webhook.\
        \ Idempotent: a retry with the reference the caller used finds the stored\
        \ erasure and answers `200` with the same body. The erasure record stores\
        \ a hash of the reference, never the reference itself. Erasing a customer\
        \ here does not erase it anywhere else; a tenant that keeps the same person\
        \ in another system must erase it there too.\n\nCallers: tenant-user. Requires\
        \ `customer:customer:erase`."
      operationId: "eraseCustomer"
      parameters:
      - name: "externalRef"
        in: "path"
        required: true
        description: "The Tenant's reference for the customer."
        schema:
          type: "string"
          minLength: 1
          maxLength: 128
      responses:
        "200":
          description: "The customer's personal data is erased. A retry of the same\
            \ erasure replays this body."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErasureResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No customer with that `externalRef` in this tenant, and no\
            \ erasure of it. Code `CUSTOMER_NOT_FOUND`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: "customer:customer:erase"
      x-allowed-callers:
      - "tenant-user"
  /api/v1/custom-fields:
    get:
      tags:
      - "Custom fields"
      summary: "List custom-field definitions"
      description: "Lists the tenant's custom-field definitions, archived ones included.\
        \ A definition's `key` and `type` are immutable; a type change is a new field,\
        \ never an edit.\n\nCallers: tenant-user. Requires `customer:field:manage`."
      operationId: "listCustomFields"
      parameters:
      - name: "limit"
        in: "query"
        required: false
        description: "Page size, 1 to 200."
        schema:
          type: "integer"
          format: "int32"
          default: 50
          minimum: 1
          maximum: 200
      - name: "cursor"
        in: "query"
        required: false
        description: "The `next_cursor` of the previous page. Valid only with the\
          \ same filter."
        schema:
          type: "string"
      responses:
        "200":
          description: "A page of custom-field definitions."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomFieldPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permission: "customer:field:manage"
      x-allowed-callers:
      - "tenant-user"
    post:
      tags:
      - "Custom fields"
      summary: "Define a custom field"
      operationId: "createCustomField"
      parameters:
      - name: "X-Request-Id"
        in: "header"
        required: false
        description: "The caller's own id for this call, recorded with it."
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomFieldRequest"
        required: true
      responses:
        "201":
          description: "The definition, ready to take values."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomField"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "A definition with that `key` already exists in this tenant.\
            \ Code `FIELD_KEY_EXISTS`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "The `key` does not match `^[a-z][a-z0-9_]{0,39}$`, the `label`\
            \ is empty, the `type` is unknown, a `CHOICE` has no value or more than\
            \ 50, a non-`CHOICE` carries choices, or the tenant already holds 50 active\
            \ definitions. Code `VALIDATION_FAILED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: "customer:field:manage"
      description: "Callers: tenant-user. Requires `customer:field:manage`."
      x-allowed-callers:
      - "tenant-user"
  /api/v1/custom-fields/{key}:
    patch:
      tags:
      - "Custom fields"
      summary: "Change a custom-field definition"
