# Versions the core build needs: the JDK toolchain, the BOMs that manage Spring libraries and the test libraries.
[versions]
spring-boot = "4.1.2"
spring-cloud = "2025.1.4"
spring-retry = "2.0.13"
feign = "13.6.1"
archunit = "1.5.1"
jdk = "25"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-cloud-starter-openfeign = { module = "org.springframework.cloud:spring-cloud-starter-openfeign" }
feign-core = { module = "io.github.openfeign:feign-core", version.ref = "feign" }
feign-java11 = { module = "io.github.openfeign:feign-java11", version.ref = "feign" }
spring-retry = { module = "org.springframework.retry:spring-retry", version.ref = "spring-retry" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
