---
openapi: "3.1.0"
info:
  title: "Workflow API"
  description: "The API a Tenant System uses to publish and run workflows, take part\
    \ in human tasks and manage the connections and triggers that drive them."
  version: "v1"
servers:
- url: "/workflow"
  description: "Any tenant hostname: <tenant-code>.<base-domain>/workflow"
tags:
- name: "Workflow instances"
  description: "What a tenant's flows did and are doing: the instances started and\
    \ their state."
- name: "Webhook deliveries"
  description: "The history of attempts to deliver an event to an endpoint, and resending\
    \ one that finished. A delivery that exhausted its attempts is DEAD and stays\
    \ visible so it can be resent."
- name: "Platform credential"
  description: "The tenant's write-only credential for calling Platform, and its status."
- name: "Workflow definitions"
  description: "Create a definition, edit its draft, publish immutable versions, retire\
    \ it and simulate the draft."
- name: "Connections"
  description: "The connections a workflow step may call. A secret goes in and never\
    \ comes out."
- name: "Manual start"
  description: "Starts a workflow instance from a manual call."
- name: "Task groups"
  description: "The named lists a human task may be assigned to."
- name: "Event hooks"
  description: "The public hook a tenant registers in a source app. The trigger's\
    \ secret proves the delivery."
- name: "Webhook endpoints"
  description: "Where a tenant wants its events delivered and which event types. The\
    \ signing secret is returned only when an endpoint is created or its secret rotated,\
    \ never again."
- name: "Triggers"
  description: "The ways a tenant starts a workflow: signed events from apps or external\
    \ systems, and schedules."
- name: "Human tasks"
  description: "The human-task inbox: read, claim, complete and reassign tasks."
- name: "Instance operations"
  description: "What an operator does with an instance that stopped: retry, replay,\
    \ cancel and read its timeline."
paths:
  /api/v1/webhook-endpoints/{id}:
    get:
      tags:
      - "Webhook endpoints"
      summary: "Get a webhook endpoint"
      description: "Returns one endpoint; its version is also the response's `ETag`.\
        \ The secret is not returned. An unknown id answers `404`.\n\nCallers: tenant-user.\
        \ Requires `workflow:webhook:manage`."
      operationId: "getEndpoint"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the webhook endpoint."
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "A webhook endpoint. The signing secret is not part of it."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EndpointResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-required-permission: "workflow:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
    put:
      tags:
      - "Webhook endpoints"
      summary: "Update a webhook endpoint"
      description: "Changes only the fields that are present: url, description, subscribed\
        \ event types or `status`. Setting `status` to `DISABLED` pauses delivery\
        \ without losing queued events. Pass the current `ETag` in `If-Match`; a stale\
        \ version is refused with `412`.\n\nCallers: tenant-user. Requires `workflow:webhook:manage`."
      operationId: "updateEndpoint"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the webhook endpoint."
        required: true
        schema:
          type: "string"
      - name: "If-Match"
        in: "header"
        description: "The `ETag` of the version the caller last read. The change is\
          \ refused with `412` when the resource has moved on since."
        required: false
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The fields to change. A field that is left out keeps its value."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEndpointRequest"
        required: true
      responses:
        "200":
          description: "A webhook endpoint. The signing secret is not part of it."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EndpointResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
      x-required-permission: "workflow:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
    delete:
      tags:
      - "Webhook endpoints"
      summary: "Delete a webhook endpoint"
      description: "Deletes the endpoint: it stops receiving and leaves every list,\
        \ while its delivery history stays readable. Pass the current `ETag` in `If-Match`;\
        \ a stale version is refused with `412`. Requires `workflow:webhook:manage`.\n\
        \nCallers: tenant-user. Requires `workflow:webhook:manage`."
      operationId: "deleteEndpoint"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the webhook endpoint."
        required: true
        schema:
          type: "string"
      - name: "If-Match"
        in: "header"
        description: "The `ETag` of the version the caller last read. The change is\
          \ refused with `412` when the resource has moved on since."
        required: false
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      responses:
        "204":
          description: "The endpoint was deleted. Its delivery history stays readable."
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
      x-required-permission: "workflow:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
  /api/v1/triggers/{id}:
    get:
      tags:
      - "Triggers"
      summary: "Get a trigger"
      description: "Returns one trigger without its secret; its version is also the\
        \ response's `ETag`. An unknown id answers `404`.\n\nCallers: tenant-user.\
        \ Requires `workflow:trigger:manage`."
      operationId: "getTrigger"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the trigger."
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "A way a definition starts. The signing secret is not part\
            \ of it."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TriggerResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-required-permission: "workflow:trigger:manage"
      x-allowed-callers:
      - "tenant-user"
    put:
      tags:
      - "Triggers"
      summary: "Update or disable a trigger"
      description: "Changes the trigger's name, event type, filter, correlation or\
        \ input, or disables it with `enabled=false`. Pass the current `ETag` in `If-Match`;\
        \ a stale version is refused with `412`.\n\nCallers: tenant-user. Requires\
        \ `workflow:trigger:manage`."
      operationId: "updateTrigger"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the trigger."
        required: true
        schema:
          type: "string"
      - name: "If-Match"
        in: "header"
        description: "The `ETag` of the version the caller last read. The change is\
          \ refused with `412` when the resource has moved on since."
        required: false
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The fields to change. A field that is left out keeps its value."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTriggerRequest"
        required: true
      responses:
        "200":
          description: "A way a definition starts. The signing secret is not part\
            \ of it."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TriggerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
      x-required-permission: "workflow:trigger:manage"
      x-allowed-callers:
      - "tenant-user"
  /api/v1/task-groups/{code}:
    put:
      tags:
      - "Task groups"
      summary: "Update a task group"
      description: "Replaces the group's name and members. A member disabled later\
        \ keeps the group membership but loses access to the tasks, because every\
        \ action re-reads the user's state. Pass the current `ETag` in `If-Match`;\
        \ a stale version is refused with `412`.\n\nCallers: tenant-user. Requires\
        \ `workflow:task:manage`."
      operationId: "update"
      parameters:
      - name: "code"
        in: "path"
        description: "The code of the task group."
        required: true
        schema:
          type: "string"
      - name: "If-Match"
        in: "header"
        description: "The `ETag` of the version the caller last read. The change is\
          \ refused with `412` when the resource has moved on since."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The task group to store."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupRequest"
        required: true
      responses:
        "200":
          description: "A named list a task may be assigned to."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
      x-required-permission: "workflow:task:manage"
      x-allowed-callers:
      - "tenant-user"
    delete:
      tags:
      - "Task groups"
      summary: "Delete a task group"
      description: "Deletes the group. A workflow node that is assigned to it fails\
        \ with a readable reason rather than creating a task nobody can see. Answers\
        \ `204`.\n\nCallers: tenant-user. Requires `workflow:task:manage`."
      operationId: "delete"
      parameters:
      - name: "code"
        in: "path"
        description: "The code of the task group."
        required: true
        schema:
          type: "string"
      responses:
        "204":
          description: "No Content"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-required-permission: "workflow:task:manage"
      x-allowed-callers:
      - "tenant-user"
  /api/v1/platform-credential:
    get:
      tags:
      - "Platform credential"
      summary: "Get the Platform credential's status"
      description: "Returns the credential's `clientId`, the key id that wrote its\
        \ envelope, when it was last updated and whether Platform still accepts it.\
        \ The secret is never returned. Requires `workflow:connection:manage`.\n\n\
        Callers: tenant-user. Requires `workflow:connection:manage`."
      operationId: "status"
      responses:
        "200":
          description: "The Platform credential's status. The secret is never part\
            \ of it."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CredentialResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permission: "workflow:connection:manage"
      x-allowed-callers:
      - "tenant-user"
    put:
      tags:
      - "Platform credential"
      summary: "Register the tenant's Platform credential"
      description: "Stores the API credential (`clientId` and `secret`) workflow uses\
        \ to call Platform for the tenant. The secret is write-only: it is encrypted\
        \ on the way in and never read back. Answers the credential's status and the\
        \ key id that wrote it.\n\nCallers: tenant-user. Requires `workflow:connection:manage`."
      operationId: "register"
      requestBody:
        description: "The credential to store."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          description: "The Platform credential's status. The secret is never part\
            \ of it."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CredentialResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permission: "workflow:connection:manage"
      x-allowed-callers:
      - "tenant-user"
  /api/v1/definitions/{id}/draft:
    put:
      tags:
      - "Workflow definitions"
      summary: "Replace a definition's draft"
      description: "Replaces the whole draft `graph`. A structurally wrong draft is\
        \ stored as sent and its problems are returned, because a draft is what an\
        \ author is still writing; only publish refuses one. Pass the current `ETag`\
        \ in `If-Match`; a stale version is refused with `412`. Requires `workflow:definition:manage`.\n\
        \nCallers: tenant-user. Requires `workflow:definition:manage`."
      operationId: "putDraft"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the definition."
        required: true
        schema:
          type: "string"
      - name: "If-Match"
        in: "header"
        description: "The `ETag` of the version the caller last read. The change is\
          \ refused with `412` when the resource has moved on since."
        required: false
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The draft graph, replacing the stored one."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftRequest"
        required: true
      responses:
        "200":
          description: "The definition with the problems found in its draft."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DraftResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
      x-required-permission: "workflow:definition:manage"
      x-allowed-callers:
      - "tenant-user"
  /api/v1/connections/{id}:
    get:
      tags:
      - "Connections"
      summary: "Get a connection"
      description: "Returns one connection without its secret; its version is also\
        \ the response's `ETag`. An unknown id answers `404`.\n\nCallers: tenant-user.\
        \ Requires `workflow:connection:manage`."
      operationId: "get"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the connection."
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "A connection. The secret is never part of it."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-required-permission: "workflow:connection:manage"
      x-allowed-callers:
      - "tenant-user"
    put:
      tags:
      - "Connections"
      summary: "Update a connection"
      description: "Replaces the connection's name, kind, allowed host and headers,\
        \ and its secret when one is sent. Pass the current `ETag` in `If-Match`;\
        \ a stale version is refused with `412`. Requires `workflow:connection:manage`.\n\
        \nCallers: tenant-user. Requires `workflow:connection:manage`."
      operationId: "update_1"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the connection."
        required: true
        schema:
          type: "string"
      - name: "If-Match"
        in: "header"
        description: "The `ETag` of the version the caller last read. The change is\
          \ refused with `412` when the resource has moved on since."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The connection to store."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionRequest"
        required: true
      responses:
        "200":
          description: "A connection. The secret is never part of it."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
      x-required-permission: "workflow:connection:manage"
      x-allowed-callers:
      - "tenant-user"
  /api/v1/webhook-endpoints:
    get:
      tags:
      - "Webhook endpoints"
      summary: "List webhook endpoints"
      description: "Pages through the tenant's webhook endpoints, with the list-query\
        \ contract's filtering, sorting and paging.\n\n**Filtering, sorting and paging**\
        \ follow the list-query contract. Conditions in `filter[field][op]` are combined\
        \ with AND. For OR, use `filter[or][i][field][op]`: predicates sharing the\
        \ index `i` are AND-ed and the branches are OR-ed (at most 10 branches, 20\
        \ predicates in all, 100 values in an `in` list). `neq` and `nin` do not match\
        \ rows where the field is null. Send `limit` with either `offset` (at most\
        \ 10000) or the `cursor` taken from a previous page, never both. The body\
        \ is `{\"data\": [...], \"page\": null}`. `page_info=full` fills `page` with\
        \ `limit`, `offset`, `total` and `next_cursor`; `page_info=cursor` fills it\
        \ with `limit` and `next_cursor` alone, without counting the matching rows;\
        \ omit it for the rows alone.\n\nCallers: tenant-user. Requires `workflow:webhook:manage`."
      operationId: "listEndpoints"
      parameters:
      - name: "filter[created_at][eq]"
        in: "query"
        description: "`created_at` eq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][gt]"
        in: "query"
        description: "`created_at` gt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][gte]"
        in: "query"
        description: "`created_at` gte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `created_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[created_at][lt]"
        in: "query"
        description: "`created_at` lt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][lte]"
        in: "query"
        description: "`created_at` lte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][neq]"
        in: "query"
        description: "`created_at` neq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `created_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[description][eq]"
        in: "query"
        description: "`description` eq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[description][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `description`."
        required: false
        schema:
          type: "string"
      - name: "filter[description][is_null]"
        in: "query"
        description: "`true` for rows where `description` is null, `false` for rows\
          \ where it is set."
        required: false
        schema:
          type: "boolean"
      - name: "filter[description][neq]"
        in: "query"
        description: "`description` neq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[description][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `description`."
        required: false
        schema:
          type: "string"
      - name: "filter[description][starts_with]"
        in: "query"
        description: "Case-insensitive prefix match on `description`."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[id][eq]"
        in: "query"
        description: "`id` eq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[id][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `id`."
        required: false
        schema:
          type: "string"
      - name: "filter[id][neq]"
        in: "query"
        description: "`id` neq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[id][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `id`."
        required: false
        schema:
          type: "string"
      - name: "filter[key_id][eq]"
        in: "query"
        description: "`key_id` eq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[key_id][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `key_id`."
        required: false
        schema:
          type: "string"
      - name: "filter[key_id][neq]"
        in: "query"
        description: "`key_id` neq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[key_id][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `key_id`."
        required: false
        schema:
          type: "string"
      - name: "filter[key_id][starts_with]"
        in: "query"
        description: "Case-insensitive prefix match on `key_id`."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[secret_rotated_at][eq]"
        in: "query"
        description: "`secret_rotated_at` eq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[secret_rotated_at][gt]"
        in: "query"
        description: "`secret_rotated_at` gt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[secret_rotated_at][gte]"
        in: "query"
        description: "`secret_rotated_at` gte the value."
        required: false
        schema:
          type: "string"
