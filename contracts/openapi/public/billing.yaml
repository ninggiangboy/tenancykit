        minCharge:
          type: "integer"
          format: "int64"
          description: "The least a charge is rounded up to, in minor units, or null."
        maxCharge:
          type: "integer"
          format: "int64"
          description: "The most a charge is capped at, in minor units, or null."
        rounding:
          type: "string"
          description: "How a fractional amount is rounded: `HALF_UP`, `HALF_EVEN`,\
            \ `UP` or `DOWN`."
        validFrom:
          type: "string"
          format: "date-time"
          description: "When the version takes effect."
        validUntil:
          type: "string"
          format: "date-time"
          description: "When the version stops applying, or null."
