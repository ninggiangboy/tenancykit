      tags:
      - "delivery-controller"
      description: "Callers: tenant-user, tenant-system. Requires `customer:webhook:manage`."
      operationId: "retry"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        required: false
        schema:
          type: "string"
      responses:
        "202":
          description: "Accepted"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DeliveryResponse"
      x-required-permission: "customer:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
  /api/v1/orders/batch:
    post:
      tags:
      - "order-controller"
      description: "Callers: tenant-user, tenant-system. Requires `customer:order:record`."
      operationId: "recordOrders"
      parameters:
      - name: "X-Request-Id"
        in: "header"
        required: false
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderBatchRequest"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderBatchResponse"
      x-required-permission: "customer:order:record"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
  /api/v1/customers/{externalRef}/erasure:
    post:
      tags:
      - "erasure-controller"
      description: "Callers: tenant-user, tenant-system. Requires `customer:customer:erase`."
      operationId: "eraseCustomer"
      parameters:
      - name: "externalRef"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErasureResponse"
      x-required-permission: "customer:customer:erase"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
  /api/v1/customers/{externalRef}/consents:
    get:
      tags:
      - "consent-controller"
      description: "Callers: tenant-user, tenant-system. Requires `customer:customer:read`."
      operationId: "listConsents"
      parameters:
