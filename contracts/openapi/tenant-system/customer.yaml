---
openapi: "3.1.0"
info:
  title: "Customer API"
  description: "The API a Tenant System uses to keep a Tenant's own customer data:\
    \ customers, orders with lines and returns, activities, custom fields, tags, consent,\
    \ the 360 profile, the CSV export and erasure, plus the signed webhook endpoints\
    \ customer delivers to. There is no public surface."
  version: "v1"
servers:
- url: "/customer"
  description: "Any tenant hostname: <tenant-code>.<base-domain>/customer"
paths:
  /api/v1/webhook-endpoints/{id}:
    get:
      tags:
      - "endpoint-controller"
      description: "Callers: tenant-user, tenant-system. Requires `customer:webhook:manage`."
      operationId: "getEndpoint"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EndpointResponse"
      x-required-permission: "customer:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
    put:
      tags:
      - "endpoint-controller"
      description: "Callers: tenant-user, tenant-system. Requires `customer:webhook:manage`."
      operationId: "updateEndpoint"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "If-Match"
        in: "header"
        required: false
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        required: false
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEndpointRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EndpointResponse"
      x-required-permission: "customer:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
    delete:
      tags:
      - "endpoint-controller"
      description: "Callers: tenant-user, tenant-system. Requires `customer:webhook:manage`."
      operationId: "deleteEndpoint"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "If-Match"
        in: "header"
        required: false
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        required: false
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
      x-required-permission: "customer:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
  /api/v1/orders/{orderRef}:
    get:
      tags:
      - "order-controller"
      description: "Callers: tenant-user, tenant-system. Requires `customer:order:read`."
      operationId: "getOrder"
      parameters:
      - name: "orderRef"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderResponse"
      x-required-permission: "customer:order:read"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
    put:
      tags:
      - "order-controller"
      description: "Callers: tenant-user, tenant-system. Requires `customer:order:record`."
      operationId: "putOrder"
      parameters:
      - name: "orderRef"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        required: false
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpsertRequest"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderResponse"
      x-required-permission: "customer:order:record"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
  /api/v1/orders/{orderRef}/returns/{returnRef}:
    put:
      tags:
      - "order-controller"
      description: "Callers: tenant-user, tenant-system. Requires `customer:order:record`."
      operationId: "putReturn"
      parameters:
      - name: "orderRef"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "returnRef"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        required: false
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnRequest"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderResponse"
      x-required-permission: "customer:order:record"
      x-allowed-callers:
      - "tenant-user"
