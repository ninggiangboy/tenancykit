openapi: 3.1.0
info:
  title: Notification API
  version: v1
servers:
- url: /
  description: "Any notification hostname: <tenant-code>.<base-domain>/notification"
paths:
  /api/v1/templates/{key}/{locale}:
    put:
      tags:
      - template-controller
      operationId: save
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: locale
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateRequest"
        required: true
      responses:
        "200":
          description: OK
      x-required-permission: notification:template:manage
      x-allowed-callers:
      - platform-user
    delete:
      tags:
      - template-controller
      operationId: delete
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: locale
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
      x-required-permission: notification:template:manage
      x-allowed-callers:
      - platform-user
  /api/v1/settings:
