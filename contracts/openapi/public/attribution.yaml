    SpendView:
      type: "object"
      description: "One cost row of a campaign."
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "The id."
        campaignId:
          type: "string"
          format: "uuid"
          description: "The id of the campaign."
        day:
          type: "string"
          format: "date"
          description: "The day."
        source:
          type: "string"
          description: "Where the row came from: `MANUAL`, `GOOGLE_ADS` or `META_ADS`."
        connectionId:
          type: "string"
          format: "uuid"
          description: "The ad connection an imported row came from, or null for a\
            \ manual one."
        amount:
          type: "number"
          description: "The amount, in major units of the currency."
        currency:
          type: "string"
          description: "The ISO 4217 currency code of the amounts."
        impressions:
