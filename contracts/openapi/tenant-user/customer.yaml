      responses:
        "201":
          description: "The order was recorded and a `order.recorded` webhook is queued\
            \ in the same transaction."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Order"
        "200":
          description: "The same `orderRef` and body were seen before; the stored\
            \ order is replayed. Nothing is written and no webhook is queued."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "The same `orderRef` was sent before with a different body\
            \ (`IDEMPOTENCY_CONFLICT`), or the customer named by the order is erased\
            \ (`CUSTOMER_ERASED`)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "The customer is unknown and `createCustomer` is not set (`CUSTOMER_UNKNOWN`);\
            \ the order carries more than 500 lines (`LINE_LIMIT_EXCEEDED`); or a\
            \ line has no `sku`, has no `category`, has a quantity that is not positive,\
            \ an amount that is negative, a line number outside the order, a `currency`\
            \ that is not an ISO 4217 code, `total` that is negative, or an `occurredAt`\
