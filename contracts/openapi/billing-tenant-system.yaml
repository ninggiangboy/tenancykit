          type: "integer"
          format: "int32"
          description: "How many were corrected from Stripe."
        mismatches:
          type: "integer"
          format: "int32"
          description: "How many disagreements were recorded as incidents."
    EventAttemptResponse:
      type: "object"
      description: "One attempt to process a Stripe event."
