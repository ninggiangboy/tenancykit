  /api/v1/payments/{id}:
    get:
      tags:
      - "Payments"
      summary: "Get a payment"
      description: "Returns one payment with its status and the amount refunded so\
        \ far. An unknown id answers `404`."
      operationId: "payment_1"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the payment."
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "A payment with its refunds and failed attempts."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-required-permission: "billing:payment:read"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
      security:
      - apiKey: []
  /api/v1/invoices/{id}:
    get:
      tags:
      - "Invoices"
      summary: "Get an invoice"
      description: "Returns one invoice with its lines. An invoice becomes paid only\
        \ from a verified payment, or because the wallet already paid the charge it\
        \ documents; no request marks one paid. An unknown id answers `404`."
      operationId: "invoice_1"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the invoice."
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "An invoice with its items and payments."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InvoiceDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-required-permission: "billing:invoice:read"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
      security:
      - apiKey: []
  /api/v1/customers/by-external-user/{externalUserId}:
    get:
      tags:
      - "Customers"
      summary: "Find a customer by external user id"
      description: "Returns the customer mapped to `externalUserId`, which is how\
        \ a Tenant System finds a customer by its own user reference. A Tenant User\
        \ also passes `tenantSystemId`. An unmapped user answers `404`."
      operationId: "byExternalUser"
      parameters:
      - name: "externalUserId"
        in: "path"
        description: "The Tenant System's own id of the user the customer is mapped\
          \ to."
        required: true
        schema:
          type: "string"
      - name: "tenantSystemId"
        in: "query"
        description: "The id of the tenant system the user belongs to. A Tenant System\
          \ caller omits it."
        required: false
        schema:
          type: "string"
      responses:
        "200":
          description: "A billing customer."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-required-permission: "billing:customer:read"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
      security:
      - apiKey: []
