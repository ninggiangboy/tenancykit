    post:
      tags:
      - "Webhook endpoints"
      summary: "Create a webhook endpoint"
      description: "Registers an endpoint that subscribes to a subset of customer's\
        \ four event types. The signing secret is returned once, in this response.\
        \ Deliveries are signed with the `Customer-*` headers and retried on the shared\
        \ schedule until they succeed or go `DEAD`.\n\nCallers: tenant-user. Requires\
        \ `customer:webhook:manage`."
      operationId: "createWebhookEndpoint"
      parameters:
      - name: "X-Request-Id"
        in: "header"
        required: false
        description: "The caller's own id for this call, recorded with it."
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointRequest"
        required: true
      responses:
        "201":
          description: "The endpoint with its signing secret."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WebhookEndpointWithSecret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: "The `url` is not an https URL that resolves to a public address,\
            \ `eventTypes` is empty, or it contains a type that is not one of customer's\
            \ four. Code `VALIDATION_FAILED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: "customer:webhook:manage"
      x-allowed-callers:
