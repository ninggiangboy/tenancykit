  /api/v1/webhook-endpoints/{id}:
    get:
      tags:
      - "Webhook endpoints"
      summary: "Read a webhook endpoint"
      description: "The response carries the endpoint's `ETag`.\n\nCallers: tenant-user.\
        \ Requires `customer:webhook:manage`."
      operationId: "getWebhookEndpoint"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "The endpoint."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No endpoint with that id in this tenant. Code `WEBHOOK_ENDPOINT_NOT_FOUND`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: "customer:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
    put:
      tags:
      - "Webhook endpoints"
      summary: "Update a webhook endpoint"
      description: "Changes the endpoint's url, description, subscribed event types\
        \ or status. Setting `status` to `DISABLED` pauses delivery without losing\
        \ queued events. The response carries the endpoint's `ETag`.\n\nCallers: tenant-user.\
        \ Requires `customer:webhook:manage`."
      operationId: "updateWebhookEndpoint"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "If-Match"
        in: "header"
        required: false
        description: "Required by this update; the endpoint answers `428` without\
          \ it and `412` when it does not match the current `ETag`."
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointRequest"
        required: true
      responses:
        "200":
          description: "The endpoint as stored."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No endpoint with that id in this tenant. Code `WEBHOOK_ENDPOINT_NOT_FOUND`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          description: "The `url` is not an https URL that resolves to a public address,\
            \ `eventTypes` is empty, or it contains a type that is not one of customer's\
            \ four. Code `VALIDATION_FAILED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
      x-required-permission: "customer:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
    delete:
      tags:
      - "Webhook endpoints"
      summary: "Delete a webhook endpoint"
      description: "Removes the endpoint and stops future deliveries to it. Its delivery\
        \ history stays readable.\n\nCallers: tenant-user. Requires `customer:webhook:manage`."
      operationId: "deleteWebhookEndpoint"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "If-Match"
        in: "header"
        required: false
        description: "Required by this delete; the endpoint answers `428` without\
          \ it and `412` when it does not match the current `ETag`."
        schema:
          type: "string"
      responses:
        "204":
          description: "The endpoint was deleted."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No endpoint with that id in this tenant. Code `WEBHOOK_ENDPOINT_NOT_FOUND`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
      x-required-permission: "customer:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
  /api/v1/webhook-endpoints/{id}/rotate-secret:
    post:
      tags:
      - "Webhook endpoints"
      summary: "Rotate a webhook endpoint's signing secret"
      description: "Replaces the endpoint's signing secret and returns the new one\
        \ once. A receiver may keep the previous secret during a rotation and select\
        \ by the key id a delivery carries.\n\nCallers: tenant-user. Requires `customer:webhook:manage`."
      operationId: "rotateWebhookEndpointSecret"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "The endpoint with its new signing secret."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WebhookEndpointWithSecret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No endpoint with that id in this tenant. Code `WEBHOOK_ENDPOINT_NOT_FOUND`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: "customer:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
  /api/v1/webhook-deliveries:
    get:
      tags:
      - "Webhook deliveries"
      summary: "List webhook deliveries"
      description: "Lists the attempts customer made to report an event to an endpoint,\
        \ newest first. A delivery that exhausted its attempts is `DEAD` and stays\
        \ visible here so it can be retried.\n\nCallers: tenant-user. Requires `customer:webhook:manage`."
      operationId: "listWebhookDeliveries"
      parameters:
      - name: "endpointId"
        in: "query"
        required: false
        description: "Return only deliveries of this endpoint."
        schema:
          type: "string"
          format: "uuid"
      - name: "event_type"
        in: "query"
        required: false
        description: "Return only deliveries of this event type."
        schema:
          $ref: "#/components/schemas/EventType"
      - name: "status"
        in: "query"
        required: false
        description: "Return only deliveries in this state."
        schema:
          type: "string"
          enum:
          - "PENDING"
          - "IN_PROGRESS"
          - "SUCCEEDED"
          - "DEAD"
      - name: "limit"
        in: "query"
        required: false
        description: "Page size, 1 to 200."
        schema:
          type: "integer"
          format: "int32"
          default: 50
          minimum: 1
          maximum: 200
      - name: "cursor"
        in: "query"
        required: false
        description: "The `next_cursor` of the previous page. Valid only with the\
          \ same filter."
        schema:
          type: "string"
      responses:
        "200":
          description: "A page of webhook deliveries."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WebhookDeliveryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permission: "customer:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
  /api/v1/webhook-deliveries/{id}/retry:
    post:
      tags:
      - "Webhook deliveries"
      summary: "Retry a webhook delivery"
      description: "Queues a fresh delivery of the same stored event body to the same\
        \ endpoint, with a new attempt budget, and answers `202`: sending happens\
        \ asynchronously. The original keeps its history, so a receiver sees exactly\
        \ what the first attempt carried. Only a finished delivery can be retried;\
        \ one still being attempted is already on its way.\n\nCallers: tenant-user.\
        \ Requires `customer:webhook:manage`."
      operationId: "retryWebhookDelivery"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "202":
          description: "The new delivery, queued for its first attempt."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No delivery with that id in this tenant. Code `WEBHOOK_DELIVERY_NOT_FOUND`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "The delivery is still being attempted, so it cannot be retried.\
            \ Code `DELIVERY_IN_PROGRESS`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: "customer:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
components:
  responses:
    BadRequest:
      description: "The request is malformed: a body or query parameter is missing,\
        \ unknown or not valid for its type, or a header is empty. Code `INVALID_REQUEST`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: "The caller presented no valid suite token for this tenant. Code\
        \ `UNAUTHENTICATED`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "The token does not carry this operation's `x-required-permission`\
        \ code, or the tenant is not entitled to customer. Code `FORBIDDEN`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionFailed:
      description: "The `If-Match` tag does not match the resource's current version.\
        \ The response carries the current `ETag`; fetch the resource again and retry.\
        \ Code `PRECONDITION_FAILED`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionRequired:
      description: "This update requires an `If-Match` header. Send the `ETag` last\
        \ read. Code `IF_MATCH_REQUIRED`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Customer:
      type: "object"
      description: "One of the Tenant's customers: the `externalRef` the Tenant chose\
        \ plus the attributes the Tenant sent. customer generates its own id and never\
        \ matches a customer by phone or email."
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "customer's own opaque id for the customer."
        externalRef:
          type: "string"
          minLength: 1
          maxLength: 128
          description: "The Tenant's reference for the customer, unique per tenant\
            \ and immutable. An erased customer keeps the reference `erased:<id>`."
        displayName:
          type: "string"
          maxLength: 200
        phone:
          type: "string"
          maxLength: 32
          description: "Stored as sent; the digits are derived from it for search."
        email:
          type: "string"
          maxLength: 254
          description: "Stored lower-cased and loosely validated."
        customFields:
          type: "object"
          additionalProperties: {}
          description: "The customer's field values, keyed by custom-field key."
        tags:
          type: "array"
          items:
            type: "string"
        consents:
          type: "array"
          description: "The customer's current consent state, one entry per topic\
            \ it has a record for."
          items:
            $ref: "#/components/schemas/ConsentRecord"
        status:
          type: "string"
          description: "`ERASED` once the customer's personal data was erased: the\
            \ row stays as an anonymous marker, its orders and consent rows stay with\
            \ it, and its reference is `erased:<id>`."
          enum:
          - "ACTIVE"
          - "ERASED"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    CustomerUpsert:
      type: "object"
      description: "The representation `PUT /customers/{externalRef}` stores. The\
        \ path names the customer; `customFields` and `tags` replace the whole set."
      properties:
        externalRef:
          type: "string"
          description: "Optional. When sent it must equal the path's `externalRef`;\
            \ a different value is `409 IDEMPOTENCY_CONFLICT`, because the reference\
            \ is immutable."
        displayName:
          type: "string"
          minLength: 1
          maxLength: 200
        phone:
          type: "string"
          maxLength: 32
        email:
          type: "string"
          maxLength: 254
        customFields:
          type: "object"
          additionalProperties: {}
          description: "Field values keyed by custom-field key. A key must be an active\
            \ definition and its value must match the definition's type; a null clears\
            \ the value."
        tags:
          type: "array"
          maxItems: 50
          items:
            type: "string"
    CustomerPatch:
      type: "object"
      description: "The properties to change. An omitted property is left as it is."
      properties:
        displayName:
          type: "string"
          minLength: 1
          maxLength: 200
        phone:
          type: "string"
          maxLength: 32
        email:
          type: "string"
          maxLength: 254
        customFields:
          type: "object"
          additionalProperties: {}
          description: "Field values to merge into the stored set, keyed by custom-field\
            \ key; a null clears that key."
        addTags:
          type: "array"
          description: "Tags to add to the customer's set. Adding a tag it already\
            \ carries changes nothing."
          items:
            type: "string"
        removeTags:
          type: "array"
          description: "Tags to remove from the customer's set. Removing a tag it\
            \ does not carry changes nothing."
          items:
            type: "string"
    BatchCustomersRequest:
      type: "object"
      required:
      - "items"
      properties:
        items:
          type: "array"
          minItems: 1
          maxItems: 1000
          description: "Up to 1,000 customers, each applied in its own transaction\
            \ and in the order sent. Two items with the same `externalRef` apply in\
            \ order."
          items:
            $ref: "#/components/schemas/CustomerUpsert"
    BatchCustomersResponse:
      type: "object"
      properties:
        results:
          type: "array"
          description: "One result per item, in the order the items were sent. The\
            \ response is `200` even when some items failed."
          items:
            $ref: "#/components/schemas/BatchItemResult"
    BatchItemResult:
      type: "object"
      properties:
        index:
          type: "integer"
          format: "int32"
          description: "The item's position in the request, starting at 0."
        ref:
          type: "string"
          description: "The item's natural key: `externalRef`, `orderRef` or `activityRef`.\
            \ Null when the item carried no reference."
        outcome:
          type: "string"
          description: "`CREATED`, `UPDATED` or `UNCHANGED` for a customer; `CREATED`\
            \ or `REPLAYED` for an order or an activity; `FAILED` with a `code` in\
            \ every case."
          enum:
          - "CREATED"
          - "UPDATED"
          - "UNCHANGED"
          - "REPLAYED"
          - "FAILED"
        code:
          type: "string"
          description: "The concrete failure code when `outcome` is `FAILED`, for\
            \ example `VALIDATION_FAILED`, `CUSTOMER_ERASED`, `CUSTOMER_UNKNOWN` or\
            \ `IDEMPOTENCY_CONFLICT`. Absent otherwise."
    CustomerPage:
      type: "object"
      properties:
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/Customer"
        page:
          $ref: "#/components/schemas/PageInfo"
    CustomField:
      type: "object"
      description: "A Tenant-defined customer attribute. Its `key` and `type` are\
        \ immutable: a type change is a new field, never an edit."
      properties:
        key:
          type: "string"
          description: "The definition's key, `^[a-z][a-z0-9_]{0,39}$`, immutable\
            \ and unique per tenant."
        label:
          type: "string"
          description: "What the tenant calls the field."
        type:
          type: "string"
          enum:
          - "TEXT"
          - "NUMBER"
          - "DATE"
          - "BOOLEAN"
          - "CHOICE"
        choices:
          type: "array"
          description: "The values a `CHOICE` accepts, 1 to 50 of them. Empty for\
            \ every other type."
          items:
            type: "string"
        archived:
          type: "boolean"
          description: "An archived definition is still readable and still appears\
            \ in a profile, but no value may be written for it."
        createdAt:
          type: "string"
          format: "date-time"
    CustomFieldRequest:
      type: "object"
      required:
      - "key"
      - "label"
      - "type"
      properties:
        key:
          type: "string"
          description: "`^[a-z][a-z0-9_]{0,39}$`; the key is immutable once the definition\
            \ exists."
        label:
          type: "string"
        type:
          type: "string"
          enum:
          - "TEXT"
          - "NUMBER"
          - "DATE"
          - "BOOLEAN"
          - "CHOICE"
        choices:
          type: "array"
          description: "The values of a `CHOICE`, 1 to 50 of them, at least one. Omitted\
            \ or empty for every other type."
          items:
            type: "string"
    CustomFieldPatch:
      type: "object"
      description: "The properties to change on a definition. The `key` and the `type`\
        \ cannot be changed here."
      properties:
        label:
          type: "string"
        choices:
          type: "array"
          description: "Choices to add to a `CHOICE` definition. An existing choice\
            \ cannot be removed and a `CHOICE` cannot grow past 50 values."
          items:
            type: "string"
        archived:
          type: "boolean"
          description: "Archive the definition, or unarchive it. Archiving keeps the\
            \ values already stored."
    CustomFieldPage:
      type: "object"
      properties:
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/CustomField"
        page:
          $ref: "#/components/schemas/PageInfo"
    Tag:
      type: "object"
      description: "A tag the tenant's customers carry."
      properties:
        tag:
          type: "string"
          description: "Lower-case, `^[a-z0-9][a-z0-9 _:-]{0,49}$`."
        customerCount:
          type: "integer"
          format: "int64"
          description: "How many of the tenant's customers carry the tag."
    TagPage:
      type: "object"
      properties:
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/Tag"
        page:
          $ref: "#/components/schemas/PageInfo"
    ConsentTopic:
      type: "object"
      description: "A purpose the tenant's customers consent to. Topics are defined\
        \ per tenant, like custom fields."
      properties:
        key:
          type: "string"
          description: "The topic's key, `^[a-z][a-z0-9_]{0,39}$`, immutable and unique\
            \ per tenant."
        label:
          type: "string"
        archived:
          type: "boolean"
          description: "An archived topic keeps its recorded history and accepts no\
            \ new consent record."
    ConsentTopicRequest:
      type: "object"
      required:
      - "key"
      - "label"
      properties:
        key:
          type: "string"
          description: "`^[a-z][a-z0-9_]{0,39}$`; the key is immutable once the topic\
            \ exists."
        label:
          type: "string"
    ConsentTopicPatch:
      type: "object"
      properties:
        label:
          type: "string"
        archived:
          type: "boolean"
    ConsentTopicPage:
      type: "object"
      properties:
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/ConsentTopic"
        page:
          $ref: "#/components/schemas/PageInfo"
    ConsentRecord:
      type: "object"
      description: "One consent record. Consent is append-only: a revocation adds\
        \ a record and leaves the grant it revokes in the history."
      properties:
        topicKey:
          type: "string"
        status:
          type: "string"
          enum:
          - "GRANTED"
          - "REVOKED"
        occurredAt:
          type: "string"
          format: "date-time"
          description: "When the consent changed, at most five minutes in the future."
        recordedAt:
          type: "string"
          format: "date-time"
          description: "When customer recorded the change."
        source:
          type: "string"
          description: "Where the consent was collected; free text the tenant sends.\
            \ Cleared when the customer is erased."
        evidenceRef:
          type: "string"
          description: "The tenant's reference to the evidence of the consent; free\
            \ text. Cleared when the customer is erased."
        consentRef:
          type: "string"
          description: "The caller's own reference for this record, when it sent one:\
            \ the idempotency key of the call."
    ConsentRequest:
      type: "object"
      required:
      - "topicKey"
      - "status"
      - "occurredAt"
      properties:
        topicKey:
          type: "string"
        status:
          type: "string"
          enum:
          - "GRANTED"
          - "REVOKED"
        occurredAt:
          type: "string"
          format: "date-time"
          description: "When the consent changed. It may not be more than five minutes\
            \ in the future."
        source:
          type: "string"
        evidenceRef:
          type: "string"
        consentRef:
          type: "string"
          description: "Optional. The same reference and body replays the stored record\
            \ with `200`; a different body is `409`."
    ConsentsResponse:
      type: "object"
      properties:
        current:
          type: "array"
          description: "The current status of every topic the customer has a record\
            \ for: the latest record by `occurredAt`, then by id."
          items:
            $ref: "#/components/schemas/ConsentRecord"
        history:
          type: "array"
          description: "Every consent record of the customer, newest first."
          items:
            $ref: "#/components/schemas/ConsentRecord"
    OrderLine:
      type: "object"
      description: "One sold item with the cumulative returned figures every order\
        \ webhook carries."
      properties:
        lineNo:
          type: "integer"
          format: "int32"
          description: "The line's number in the order, starting at 1."
        sku:
          type: "string"
          maxLength: 100
        name:
          type: "string"
          description: "The item's name as the Tenant's system sent it."
        category:
          type: "string"
          maxLength: 100
          description: "The Tenant's category for the line."
        quantity:
          type: "number"
          description: "The quantity sold, with up to three fraction digits."
        amount:
          type: "integer"
          format: "int64"
          description: "The line's net amount in minor units of the order's `currency`,\
            \ net of discount."
        earnEligible:
          type: "boolean"
          description: "Whether the line counts towards a promotion; false for a line\
            \ the Tenant or a rule excludes."
        returnedQuantity:
          type: "number"
          description: "The cumulative quantity returned across every return of this\
            \ order, with up to three fraction digits. Never exceeds `quantity`."
        returnedAmount:
          type: "integer"
          format: "int64"
          description: "The cumulative amount returned across every return of this\
            \ order, in minor units of the order's `currency`. Never exceeds `amount`."
    OrderUpsert:
      type: "object"
      description: "One order as the Tenant's system records it. An order is immutable\
        \ once recorded: a change of what was bought is a return."
      required:
      - "externalRef"
      - "currency"
      - "occurredAt"
      - "storeCode"
      - "channel"
      - "total"
      - "lines"
      properties:
        externalRef:
          type: "string"
          minLength: 1
          maxLength: 128
          description: "The Tenant's reference for the customer the order belongs\
            \ to."
        currency:
          type: "string"
          pattern: "^[A-Z]{3}$"
          description: "The ISO 4217 code every amount in the order is denominated\
            \ in."
        occurredAt:
          type: "string"
          format: "date-time"
          description: "When the order was placed, at most five minutes in the future.\
            \ A historic order has no lower bound."
        storeCode:
          type: "string"
          maxLength: 100
        channel:
          type: "string"
          maxLength: 100
          description: "The Tenant's name for the channel the order came through,\
            \ for example `pos` or `web`."
        total:
          type: "integer"
          format: "int64"
          description: "The order total in minor units of `currency`. Informational:\
            \ tax, delivery and order-level discounts make it differ from the sum\
            \ of the lines, and it is never an earn base."
        createCustomer:
          type: "boolean"
          default: false
          description: "Upsert a customer with the order's `externalRef` and no other\
            \ data, in the same transaction, instead of refusing an unknown customer."
        lines:
          type: "array"
          minItems: 1
          maxItems: 500
          description: "The order's lines, numbered by their position starting at\
            \ 1."
          items:
            $ref: "#/components/schemas/OrderLineUpsert"
    OrderLineUpsert:
      type: "object"
      required:
      - "sku"
      - "category"
      - "quantity"
      - "amount"
      properties:
        sku:
          type: "string"
          maxLength: 100
        name:
          type: "string"
        category:
          type: "string"
          maxLength: 100
        quantity:
          type: "number"
          exclusiveMinimum: 0
          description: "The quantity sold, positive, with up to three fraction digits."
        amount:
          type: "integer"
          format: "int64"
          description: "The line's net amount in minor units of the order's `currency`,\
            \ net of discount, never negative."
        earnEligible:
          type: "boolean"
          default: true
          description: "Whether the line counts towards a promotion. Defaults to true."
    OrderBatchRequest:
      type: "object"
      required:
      - "orders"
      properties:
        orders:
          type: "array"
          minItems: 1
          maxItems: 100
          description: "Up to 100 orders carrying at most 5,000 lines together, each\
            \ applied in its own transaction and in the order sent."
          items:
            $ref: "#/components/schemas/OrderUpsert"
    OrderBatchResponse:
      type: "object"
      properties:
        results:
          type: "array"
          description: "One result per order, in the order the orders were sent. The\
            \ response is `200` even when some orders failed."
          items:
            $ref: "#/components/schemas/BatchItemResult"
    ReturnLine:
      type: "object"
      required:
      - "lineNo"
      - "quantity"
      - "amount"
      properties:
        lineNo:
          type: "integer"
          format: "int32"
          description: "The number of the order line this return names."
        quantity:
          type: "number"
          exclusiveMinimum: 0
          description: "The quantity returned in this return, positive, with up to\
            \ three fraction digits."
        amount:
          type: "integer"
          format: "int64"
          description: "The amount returned in this return, in minor units of the\
            \ order's `currency`, never negative."
    ReturnRequest:
      type: "object"
      required:
      - "occurredAt"
      - "lines"
      properties:
        occurredAt:
          type: "string"
          format: "date-time"
          description: "When the return was made, at most five minutes in the future."
        lines:
          type: "array"
          minItems: 1
          maxItems: 500
          description: "The returned lines of this return, not the cumulative state."
          items:
            $ref: "#/components/schemas/ReturnLine"
    Return:
      type: "object"
      description: "One return recorded against an order."
      properties:
        returnRef:
          type: "string"
          description: "The Tenant's reference for the return, unique per tenant and\
            \ the idempotency key of the return."
        occurredAt:
          type: "string"
          format: "date-time"
        lines:
          type: "array"
          description: "The returned lines of this return, not the cumulative state."
          items:
            $ref: "#/components/schemas/ReturnLine"
    Order:
      type: "object"
      description: "One recorded order: its lines with their cumulative returned figures,\
        \ its `orderVersion` and every return recorded against it."
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "customer's own opaque id for the order."
        orderRef:
          type: "string"
          description: "The Tenant's reference for the order, unique per tenant."
        customerId:
          type: "string"
          format: "uuid"
          description: "customer's own id for the customer the order belongs to."
        externalRef:
          type: "string"
          description: "The Tenant's reference for the customer, so a caller can match\
            \ the order without a second read."
        currency:
          type: "string"
          pattern: "^[A-Z]{3}$"
        total:
          type: "integer"
          format: "int64"
          description: "The order total in minor units of `currency`."
        occurredAt:
          type: "string"
          format: "date-time"
        storeCode:
          type: "string"
        channel:
          type: "string"
        status:
          type: "string"
          enum:
          - "RECORDED"
          - "PARTIALLY_RETURNED"
          - "RETURNED"
        orderVersion:
          type: "integer"
          format: "int64"
          description: "The order's version: 1 when it was recorded, one more for\
            \ every return. Monotonic per order, so a receiver that keeps the order's\
            \ state can drop a delivery whose `orderVersion` is not newer. It is also\
            \ the `ETag`."
        createdAt:
          type: "string"
          format: "date-time"
        lines:
          type: "array"
          items:
            $ref: "#/components/schemas/OrderLine"
        returns:
          type: "array"
          items:
            $ref: "#/components/schemas/Return"
    OrderPage:
      type: "object"
      properties:
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/Order"
        page:
          $ref: "#/components/schemas/PageInfo"
    Activity:
      type: "object"
      description: "One thing the customer did, as the writer reported it."
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "customer's own opaque id for the activity."
        customerId:
          type: "string"
          format: "uuid"
        externalRef:
          type: "string"
        type:
          type: "string"
          description: "A free string the writer chooses, `^[a-z][a-z0-9._-]{0,63}$`,\
            \ so a new source posts a new type with no customer change."
        occurredAt:
          type: "string"
          format: "date-time"
        source:
          type: "string"
          maxLength: 64
        payload:
          type: "object"
          additionalProperties: {}
          description: "The writer's own payload, up to 8 KiB. Cleared when the customer\
            \ is erased."
        activityRef:
          type: "string"
          description: "The caller's own reference for the activity, when it sent\
            \ one: the idempotency key of the call. Cleared when the customer is erased."
        createdAt:
          type: "string"
          format: "date-time"
    ActivityRequest:
      type: "object"
      required:
      - "externalRef"
      - "type"
      - "occurredAt"
      properties:
        externalRef:
          type: "string"
          minLength: 1
          maxLength: 128
          description: "The Tenant's reference for the customer the activity belongs\
            \ to. The customer must exist."
        type:
          type: "string"
          description: "`^[a-z][a-z0-9._-]{0,63}$`."
        occurredAt:
          type: "string"
          format: "date-time"
          description: "When it happened, at most five minutes in the future."
        source:
          type: "string"
          maxLength: 64
        payload:
          type: "object"
          additionalProperties: {}
          description: "A JSON object of at most 8 KiB. A larger one is `422 PAYLOAD_TOO_LARGE`."
        activityRef:
          type: "string"
          description: "Optional. The same reference and body replays the stored activity\
            \ with `200`; a different body is `409`."
    ActivityBatchRequest:
      type: "object"
      required:
      - "items"
      properties:
        items:
          type: "array"
          minItems: 1
          maxItems: 1000
          description: "Up to 1,000 activities, each applied in its own transaction\
            \ and in the order sent."
          items:
            $ref: "#/components/schemas/ActivityRequest"
    ActivityBatchResponse:
      type: "object"
      properties:
        results:
          type: "array"
          description: "One result per item, in the order the items were sent. The\
            \ response is `200` even when some items failed."
          items:
            $ref: "#/components/schemas/BatchItemResult"
    ActivityPage:
      type: "object"
      properties:
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/Activity"
        page:
          $ref: "#/components/schemas/PageInfo"
    Profile:
      type: "object"
      description: "One customer read back as one document. Every slice is bounded\
        \ by its request parameter and no aggregate is computed."
      properties:
        customer:
          $ref: "#/components/schemas/Customer"
        customFields:
          type: "object"
          additionalProperties: {}
          description: "The customer's field values, keyed by custom-field key."
        tags:
          type: "array"
          items:
            type: "string"
        consents:
          type: "array"
          description: "The current status of every topic the customer has a record\
            \ for."
          items:
            $ref: "#/components/schemas/ConsentRecord"
        orders:
          type: "array"
          description: "The customer's latest orders, newest first, each with its\
            \ lines and returns."
          items:
            $ref: "#/components/schemas/Order"
        activities:
          type: "array"
          description: "The customer's latest activities, newest first."
          items:
            $ref: "#/components/schemas/Activity"
    ErasureResponse:
      type: "object"
      description: "The result of an erasure request. The erasure record keeps a hash\
        \ of the reference, never the reference itself."
      properties:
        customerId:
          type: "string"
          format: "uuid"
          description: "customer's own opaque id for the customer that was erased.\
            \ The `customer.erased` webhook carries the same id and no personal data."
        erasedAt:
          type: "string"
          format: "date-time"
          description: "When the customer's personal data was erased."
        outcome:
          type: "string"
          description: "`ERASED` for the call that erased the data, `REPLAYED` for\
            \ a retry of the same reference."
          enum:
          - "ERASED"
          - "REPLAYED"
    WebhookEndpoint:
      type: "object"
      description: "A destination customer sends signed HTTP webhooks to. It subscribes\
        \ to a subset of customer's four event types."
      properties:
        id:
          type: "string"
          format: "uuid"
        url:
          type: "string"
          description: "An https URL that resolves to a public address."
        description:
          type: "string"
          maxLength: 255
        eventTypes:
          type: "array"
          items:
            $ref: "#/components/schemas/EventType"
        status:
          type: "string"
          enum:
          - "ACTIVE"
          - "DISABLED"
        keyId:
          type: "string"
          description: "Identifies which signing secret signed a delivery."
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        secretRotatedAt:
          type: "string"
          format: "date-time"
    WebhookEndpointRequest:
      type: "object"
      required:
      - "url"
      - "eventTypes"
      properties:
        url:
          type: "string"
          description: "An https URL that resolves to a public address."
        description:
          type: "string"
          maxLength: 255
        eventTypes:
          type: "array"
          minItems: 1
          description: "The customer event types this endpoint subscribes to, a subset\
            \ of the four."
          items:
            $ref: "#/components/schemas/EventType"
        status:
          type: "string"
          enum:
          - "ACTIVE"
          - "DISABLED"
    WebhookEndpointWithSecret:
      type: "object"
      properties:
        endpoint:
          $ref: "#/components/schemas/WebhookEndpoint"
        signingSecret:
          type: "string"
          description: "Returned only when the endpoint is created or its secret is\
            \ rotated. The HMAC key is the whole secret string."
    WebhookDelivery:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        endpointId:
          type: "string"
          format: "uuid"
        eventId:
          type: "string"
          format: "uuid"
          description: "The event's deduplication key, carried as `Customer-Event-Id`\
            \ on the delivery."
        eventType:
          $ref: "#/components/schemas/EventType"
        status:
          type: "string"
          description: "`PENDING` waits for its next attempt, `IN_PROGRESS` is being\
            \ sent, `SUCCEEDED` is a 2xx answer and `DEAD` exhausted its attempts."
          enum:
          - "PENDING"
          - "IN_PROGRESS"
          - "SUCCEEDED"
          - "DEAD"
        attempts:
          type: "integer"
          format: "int32"
          description: "How many attempts were made, carried as `Customer-Attempt`\
            \ on each one."
        nextAttemptAt:
          type: "string"
          format: "date-time"
        lastStatusCode:
          type: "integer"
          format: "int32"
        lastError:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        completedAt:
          type: "string"
          format: "date-time"
    WebhookEndpointPage:
      type: "object"
      properties:
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/WebhookEndpoint"
        page:
          $ref: "#/components/schemas/PageInfo"
    WebhookDeliveryPage:
      type: "object"
      properties:
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/WebhookDelivery"
        page:
          $ref: "#/components/schemas/PageInfo"
    EventType:
      type: "string"
      description: "One customer event type an endpoint may subscribe to. Every event\
        \ is a fact customer reports as a signed HTTP webhook to the Tenant's subscribed\
        \ endpoints; no broker exchange carries it."
      enum:
      - "customer.created"
      - "order.recorded"
      - "order.refunded"
      - "customer.erased"
    PageInfo:
      type: "object"
      description: "The page's facts, present only when the request asked for them."
      properties:
        limit:
          type: "integer"
          format: "int32"
          description: "The page size that was applied."
        offset:
          type: "integer"
          format: "int32"
          description: "Rows skipped; null when a cursor positioned the page."
        total:
          type: "integer"
          format: "int64"
          description: "Every row matching the filters, wherever the page starts."
        next_cursor:
          type: "string"
          description: "Pass this as `cursor`, with the same filter and sort, to read\
            \ the next page. It is opaque and null on the last page."
    Error:
      type: "object"
      description: "The RFC 9457 problem detail every operation returns on failure.\
        \ `title` repeats the status reason, `status` repeats the HTTP status and\
        \ `detail` is a human-readable message. `code` names the concrete customer\
        \ failure where the operation documents one."
      properties:
        type:
          type: "string"
          format: "uri-reference"
        title:
          type: "string"
        status:
          type: "integer"
          format: "int32"
        detail:
          type: "string"
        code:
          type: "string"
          description: "The concrete failure code named in the operation's error description,\
            \ for example `CUSTOMER_NOT_FOUND`, `IDEMPOTENCY_CONFLICT` or `CUSTOMER_ERASED`."
  securitySchemes:
    oidc:
      type: "http"
      description: "A suite token issued by Platform for this tenant"
      scheme: "bearer"
      bearerFormat: "JWT"
