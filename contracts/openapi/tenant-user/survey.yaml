  /api/v1/surveys/{id}/publish:
    post:
      tags:
      - "Survey versions"
      summary: "Publish the draft as a new version"
      description: "Freezes the draft as the next immutable version and makes it the\
        \ survey's current one. Requires `If-Match` with the draft's tag; an edit\
        \ that landed in between is refused with `412` rather than published under\
        \ an older read. A document that does not validate answers `422` with every\
        \ problem. A question whose type changed is given a new id. Answers `201`.\n\
        \nCallers: tenant-user. Requires `survey:survey:manage`."
      operationId: "publish"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the survey."
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "If-Match"
        in: "header"
        description: "The `ETag` of the version the caller last read. The change is\
          \ refused with `412` when the resource has moved on since."
        required: false
        schema:
          type: "string"
      responses:
        "201":
          description: "One published version with its document. A published version\
            \ never changes."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          description: "The document does not validate. The body lists every offending\
            \ pointer."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "428":
          description: "The request has no `If-Match` header. This endpoint requires\
            \ the tag the draft was read at."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      x-required-permission: "survey:survey:manage"
      x-allowed-callers:
      - "tenant-user"
