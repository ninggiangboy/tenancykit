# Descriptions of the request and response fields, parameters and bodies of Platform's API.
# Read by DescriptionsOpenApiCustomizer; see dev.ngb.core.openapi for the format.

# ---- parameters
param stream = The replica stream to read: `tenants`, `tenant-domains`, `tenant-systems`, `entitlements` or `user-access`.
param after = The `next` of the previous page; omit it to start from the beginning.
param limit = The page size, clamped to 1 to 500. Defaults to 100.
param grant = `true` to grant the permission to the user, `false` to revoke it.
param code = The permission code, such as `platform:tenant:read`.
param appCode = The code of the app, such as `billing`.
param name = The name of the UI remote.
param /api/v1/ui-remotes/{name}/versions name = The name of the UI remote the version belongs to.
param /api/v1/tenants/{tenantId}/apps tenantId = The id of the tenant.
param /api/v1/tenants/{tenantId}/apps/{appCode} tenantId = The id of the tenant.
param /api/v1/tenant-systems/{systemId}/credentials/{credentialId} systemId = The id of the tenant system the credential belongs to.
param /api/v1/tenant-systems/{systemId}/credentials/{credentialId} credentialId = The id of the credential to revoke.
param /api/v1/roles/{id}/users/{userId} userId = The id of the user to give the role to or take it from.
param Authorization = The credential of the Tenant System: `Basic` followed by the base64 of `clientId:secret`.

# ---- shared fields
field id = The id.
field tenantId = The id of the tenant it belongs to, or null for a Platform-scope record.
field scope = The scope: `PLATFORM` for the suite's own staff, `TENANT` for one tenant's people.
field email = The email address.
field displayName = The name shown for the user.
field name = The display name.
field status = The current status.
field version = The version of the record. It is also the `ETag`, which a conditional change sends as `If-Match`.
field createdAt = When the record was created.
field permissions = The permission codes.
field enabled = Whether it is enabled.
field appCode = The code of the app.
field action = The change to make.
field title = The title shown in the console.
field navOrder = The position in the console's navigation; lower comes first.
field entryPath = The path of the remote's entry module. It is same-origin and inside the published directory of this remote's name and version.
field integrity = The subresource-integrity hash of the entry module, which the shell verifies before it mounts it.
field sdkMajor = The major version of the console SDK the remote was built against.

# ---- users and roles
schema UserResponse = A user of the suite.
schema UserResponse.status = `ACTIVE` or `DISABLED`.
schema CreateRequest = The user to create.
schema CreateRequest.tenantCode = The code of the tenant the user belongs to.
schema CreateRequest.temporaryPassword = The user's initial password.
schema UpdateRequest = The change to apply to a user.
schema UpdateRequest.action = `ENABLE`, `DISABLE` or `RENAME`.
schema UpdateRequest.name = The new display name, for `RENAME`.
schema RoleResponse = A role and the permissions it grants.
schema RoleResponse.system = Whether the role is a built-in one that cannot be edited.
schema RoleResponse.permissions = The permission codes the role grants.
schema CreateRoleRequest = The role to create.
schema CreateRoleRequest.name = The role's name.
schema CreateRoleRequest.permissions = The permission codes the role grants. Each must be in the catalog and valid in the role's scope.
schema PermissionsRequest = The role's new permission set, replacing the stored one.
schema PermissionsRequest.permissions = The permission codes the role grants.
schema RenameRequest = The new name.
schema RenameRequest.name = The new name.
schema MeResponse = The signed-in user.
schema MeResponse.permissions = The permission codes the user holds across the suite, through roles and directly.

# ---- tenants
schema TenantResponse = A tenant of the suite.
schema TenantResponse.code = The tenant's unique code, which also names its hostname.
schema TenantResponse.status = `ACTIVE` or `DEACTIVATED`.
schema ProvisionRequest = The tenant to provision.
schema ProvisionRequest.code = The tenant's unique code. It cannot change afterwards.
schema ProvisionRequest.name = The tenant's display name.
schema ProvisionRequest.adminEmail = The email of the first administrator. When omitted, no administrator is created.
schema ProvisionRequest.adminTemporaryPassword = The first administrator's initial password.
schema ProvisionedResponse = The tenant that was provisioned.
schema ProvisionedResponse.tenantId = The id of the new tenant.
schema ProvisionedResponse.adminEmail = The email of the administrator that was created, or null.
schema DomainRequest = The hostname to map to the tenant.
schema DomainRequest.hostname = The hostname, such as `acme.example.com`.
schema AppResponse = One app of the suite and this tenant's state of it.
schema AppResponse.enabled = Whether the tenant may use the app. An app the tenant never changed is disabled.
schema EntitlementRequest = The state to set.
schema EntitlementRequest.enabled = Whether the tenant may use the app. Required.
schema EntitlementResponse = A tenant's entitlement to one app.
schema EntitlementResponse.tenantId = The id of the tenant.

# ---- tenant systems and credentials
schema SystemResponse = A tenant system: a machine caller of one tenant.
schema SystemResponse.purpose = What the system is for: `GENERIC` or `WORKFLOW`.
schema SystemResponse.status = `ACTIVE` or `DISABLED`.
schema CreateSystemRequest = The tenant system to register.
schema CreateSystemRequest.name = The system's name.
schema CreateSystemRequest.purpose = What the system is for: `GENERIC` or `WORKFLOW`. Defaults to `GENERIC`.
schema UpdateSystemRequest = The change to apply to a tenant system.
schema UpdateSystemRequest.action = `RENAME` or `DISABLE`.
schema UpdateSystemRequest.name = The new name, for `RENAME`.
schema CreateCredentialRequest = The credential to issue.
schema CreateCredentialRequest.label = A label that tells the credentials of a system apart.
schema CreateCredentialRequest.scopes = The permission codes the credential may use.
schema CredentialResponse = An API credential. The secret is never part of it.
schema CredentialResponse.id = The credential's id.
schema CredentialResponse.keyId = The public part of the API key. It identifies the credential without revealing the secret.
schema CredentialResponse.label = The credential's label.
schema CredentialResponse.scopes = The permission codes the credential may use.
schema CredentialResponse.status = `ACTIVE` or `REVOKED`.
schema CredentialResponse.expiresAt = When the credential stops working, or null. A rotated credential expires at the end of its overlap.
schema CredentialResponse.revokedAt = When the credential was revoked, or null.
schema IssuedCredentialResponse = A newly issued credential with its secret.
schema IssuedCredentialResponse.credential = The credential.
schema IssuedCredentialResponse.key = The API key. It is shown only in this response and is never available again.
schema RotateRequest = How the old credential is retired.
schema RotateRequest.overlapMinutes = How long the previous credential keeps working, in minutes. Defaults to 1440 (24 hours).

# ---- UI remotes
schema RemoteResponse = A UI remote of the console and its registered versions.
schema RemoteResponse.name = The remote's unique name.
schema RemoteResponse.appCode = The app the remote belongs to.
schema RemoteResponse.audiences = The shells the remote may be mounted in: the platform shell, the tenant shell, or both.
schema RemoteResponse.activeVersion = The version the console mounts, or null while none is activated.
schema RemoteResponse.versions = The versions CI has registered.
schema VersionResponse = One registered version of a UI remote.
schema VersionResponse.version = The version string CI registered.
schema VersionResponse.registeredAt = When CI registered the version.
schema VersionResponse.registeredBy = Who registered the version.
schema RegisterRequest = The version CI registers.
schema RegisterRequest.version = The version string. A registered version is immutable.
schema RegisterRequest.appCode = The app the remote belongs to. Used when this call creates the remote.
schema RegisterRequest.title = The title to show. Used when this call creates the remote.
schema RegisterRequest.audiences = The shells the remote may be mounted in: the platform shell, the tenant shell, or both. Used when this call creates the remote.
schema RegisterRequest.navOrder = The navigation position. Used when this call creates the remote.
schema StateRequest = The change an operator makes to a remote.
schema StateRequest.enabled = Whether the remote is offered to the console. Required.
schema StateRequest.activeVersion = The registered version to activate; an older one is a rollback.
schema StateRequest.title = The new title, or null to keep it.
schema StateRequest.navOrder = The new navigation position, or null to keep it.
schema ConsoleRemoteResponse = A remote the caller may mount, with the one version an operator activated.
schema ConsoleRemoteResponse.version = The active version.

# ---- token request
body /oauth/token = The token request, sent as an `application/x-www-form-urlencoded` form.
body /oauth/token grant_type = The grant type. It must be `client_credentials`.
body /oauth/token audience = The app the token is for. An audience the suite does not offer answers `400`.

# ---- errors specific to an operation
error POST /oauth/token 400 = The `grant_type` is not `client_credentials`, or the `audience` is not one the suite offers.
error POST /oauth/token 401 = The credential is missing or wrong. The answer never says which half was wrong.
error POST /oauth/token 429 = Too many attempts. Repeat after the number of seconds in `Retry-After`.
error POST /api/v1/tenants 409 = The tenant code is already used.
error POST /api/v1/tenants/{id}/domains 409 = The hostname is already mapped to a tenant.
error PUT /api/v1/tenants/{tenantId}/apps/{appCode} 422 = The app code is not one of the suite's apps.
error POST /api/v1/roles 422 = A permission code is not in the catalog.
error PUT /api/v1/roles/{id}/permissions 422 = A permission code is not in the catalog.
error PUT /api/v1/users/{id}/permissions/{code} 422 = The permission code is not in the catalog.
error POST /api/v1/ui-remotes/{name}/versions 409 = The version is already registered with different content. A registered version is immutable.
error GET /internal/replica/{stream} 404 = The stream is not one of the replica streams.

# ---- success statuses a handler answers by what it did
status POST /api/v1/ui-remotes/{name}/versions 201 = The version was registered. A first call also created the remote, disabled and with no active version.
status POST /api/v1/ui-remotes/{name}/versions 200 = The same version with the same content was already registered, so nothing changed.
