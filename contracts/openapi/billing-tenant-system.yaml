        id:
          type: "string"
          description: "The id."
        planId:
          type: "string"
          description: "The id of the pricing plan."
        planVersion:
          type: "integer"
          format: "int32"
          description: "The plan version that was priced."
        amount:
          $ref: "#/components/schemas/MoneyDto"
          description: "The amount charged."
        chargeId:
          type: "string"
          description: "The id of the charge."
        failureReason:
          type: "string"
