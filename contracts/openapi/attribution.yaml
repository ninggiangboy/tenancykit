        required: false
        schema:
          type: string
      - name: "filter[slug][contains]"
        in: query
        description: Case-insensitive substring match on `slug`.
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[slug][eq]"
        in: query
        description: '`slug` eq the value.'
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[slug][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `slug`.
        required: false
        schema:
          type: string
      - name: "filter[slug][neq]"
        in: query
        description: '`slug` neq the value.'
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[slug][nin]"
        in: query
