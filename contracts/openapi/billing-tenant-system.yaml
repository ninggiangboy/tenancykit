        subscriptionId:
          type: "string"
          description: "The subscription the line is for, or null."
        periodStart:
          type: "string"
          format: "date-time"
          description: "The start of the period."
        periodEnd:
          type: "string"
          format: "date-time"
          description: "The end of the period."
        description:
          type: "string"
          description: "What the line is for."
        amount:
          $ref: "#/components/schemas/MoneyDto"
          description: "The line's amount."
        incurredAt:
