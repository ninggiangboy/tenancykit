        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EntitlementResponse"
      x-required-permission: platform:entitlement:manage
  /api/v1/tenants/{id}:
    put:
      tags:
      - tenant-controller
