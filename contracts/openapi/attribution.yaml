        schema:
          type: string
      - name: "filter[id][neq]"
        in: query
        description: '`id` neq the value.'
        required: false
        schema:
          type: string
          format: uuid
      - name: "filter[id][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `id`.
        required: false
