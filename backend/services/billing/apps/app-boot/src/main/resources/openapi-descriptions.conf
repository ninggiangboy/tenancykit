# ---- pricing
schema CreatePlanRequest = The plan to create, with its first version.
schema CreatePlanRequest.code = The plan's code, unique per tenant.
schema CreatePlanRequest.model = The pricing model: `TIME_BASED`, `USAGE_BASED`, `WORKLOAD_BASED`, `EVENT_BASED`, `SUBSCRIPTION` or `HYBRID`.
schema CreatePlanRequest.version = The plan's first version.
schema VersionRequest = A version of a plan.
schema VersionRequest.rule = The price rule.
schema VersionRequest.billingCycle = For a subscription: `DAILY`, `WEEKLY`, `MONTHLY`, `QUARTERLY` or `YEARLY`.
schema VersionRequest.minCharge = The least a charge is rounded up to, in minor units, or null.
schema VersionRequest.maxCharge = The most a charge is capped at, in minor units, or null.
schema VersionRequest.rounding = How a fractional amount is rounded: `HALF_UP`, `HALF_EVEN`, `UP` or `DOWN`.
schema VersionRequest.validFrom = When the version takes effect.
schema VersionRequest.validUntil = When the version stops applying, or null.
schema VersionResponse = One version of a pricing plan. Earlier versions, and every charge that used them, are unchanged.
schema VersionResponse.rule = The price rule.
schema VersionResponse.billingCycle = For a subscription: `DAILY`, `WEEKLY`, `MONTHLY`, `QUARTERLY` or `YEARLY`.
schema VersionResponse.minCharge = The least a charge is rounded up to, in minor units, or null.
schema VersionResponse.maxCharge = The most a charge is capped at, in minor units, or null.
schema VersionResponse.rounding = How a fractional amount is rounded.
schema VersionResponse.validFrom = When the version takes effect.
schema VersionResponse.validUntil = When the version stops applying, or null.
schema VersionResponse.createdBy = Who published the version.
schema PlanResponse = A pricing plan and its versions.
schema PlanResponse.model = The pricing model.
schema PlanResponse.status = `ACTIVE` or `RETIRED`.
schema PlanResponse.retiredAt = When the plan was retired, or null.
schema PlanResponse.versions = Every version, earlier ones unchanged.
schema RuleDto = A pricing strategy: how a quantity of usage becomes an amount. Prices are decimals in minor units, and rounding to whole minor units happens once, on the total.
schema RuleDto.model = The pricing model: `TIME_BASED` (price per unit of time), `USAGE_BASED` (by quantity consumed, with tiers), `WORKLOAD_BASED` (a start fee per execution plus a rate for the work), `EVENT_BASED` (per discrete event), `SUBSCRIPTION` (a fixed amount per cycle) or `HYBRID` (a base amount plus usage components).
schema RuleDto.metric = The metric the rule prices. Not used by a fixed price.
schema RuleDto.unit = The unit the metric is measured in. Not used by a fixed price.
schema RuleDto.unitPrice = The price of one unit, as a decimal string. Used by time-based, workload-based and event-based rules.
schema RuleDto.increment = For a time-based rule, the duration is first rounded up to a whole number of increments, such as per started minute. Zero or null means no rounding.
schema RuleDto.mode = For a usage-based rule: `GRADUATED` prices each band of the quantity at its own tier's rate, `VOLUME` prices the whole quantity at the rate of the tier it falls in.
schema RuleDto.tiers = For a usage-based rule, the price bands. One tier is a flat rate; a first tier priced at zero is an included allowance.
schema RuleDto.executionFee = For a workload-based rule, the start fee of every execution, as a decimal string.
schema RuleDto.fixedPrice = The amount for one billing cycle whatever is used, as a decimal string. Used by a subscription rule and as the base of a hybrid.
schema RuleDto.components = For a hybrid rule, the usage rules added to the base amount. Each metric appears once.
schema TierDto = One price tier.
schema TierDto.upTo = The quantity the band runs up to, as a decimal string, or null when it is unbounded.
schema TierDto.unitPrice = The price of one unit in the band, as a decimal string.
schema EstimateRequest = The expected usage to price.
schema EstimateRequest.version = The plan version to price against.
schema EstimateRequest.at = The moment to price at.
schema EstimateRequest.usage = The expected usage per metric.
schema EstimateRequest.walletId = A wallet whose coupons the estimate also applies, or null.
schema EstimateResponse = The estimated cost.
schema EstimateResponse.planCode = The plan's code.
schema EstimateResponse.planVersion = The plan version that was priced.
schema EstimateResponse.amount = What the wallet would pay after discounts.
schema EstimateResponse.grossAmount = The amount before discounts.
schema EstimateResponse.discounts = The coupon discounts that would apply.
schema EstimateResponse.exactAmount = The exact price before rounding, as a decimal string.
schema EstimateResponse.adjustment = The rounding and min/max adjustment applied, as a decimal string.
schema EstimateResponse.lines = How the price is made up.
schema LineResponse = One line of a price.
schema LineResponse.description = What the line is for.
schema LineResponse.metric = The metric, or null.
schema LineResponse.quantity = The quantity priced, as a decimal string.
schema LineResponse.amount = The line's amount, as a decimal string.
schema ReserveResponse = The estimate and the reservation that holds it.
schema ReserveResponse.estimate = The estimated cost.
schema ReserveResponse.reservation = The hold on the wallet.
schema ReservationDto = A hold on a wallet.
schema ReservationDto.status = `ACTIVE`, `CAPTURED`, `RELEASED` or `EXPIRED`.
schema ReservationDto.amount = The amount held.
schema ChargeUsageRequest = The usage period to price and charge.
schema ChargeUsageRequest.customerId = The customer whose usage is charged.
schema ChargeUsageRequest.walletId = The wallet to charge.
schema ChargeUsageRequest.version = The plan version to price against.
schema ChargeUsageRequest.from = The start of the period, inclusive.
schema ChargeUsageRequest.to = The end of the period, exclusive.
schema RatingResponse = The result of rating a period's usage.
schema RatingResponse.outcome = `CHARGED`, `FAILED` or `NO_CHARGE`.
schema RatingResponse.planVersion = The plan version that was priced.
schema RatingResponse.amount = The amount charged.
schema RatingResponse.usageCount = How many usage events were rated.
schema RatingResponse.lines = How the price is made up.

