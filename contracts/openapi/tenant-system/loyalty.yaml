      description: "Callers: tenant-user, tenant-system. Requires `loyalty:member:read`."
      operationId: "getOrder"
      parameters:
      - name: "orderRef"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderResponse"
      x-required-permission: "loyalty:member:read"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
    put:
      tags:
      - "order-controller"
      description: "Callers: tenant-user, tenant-system. Requires `loyalty:order:record`."
      operationId: "putOrder"
      parameters:
      - name: "orderRef"
        in: "path"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderResponse"
      x-required-permission: "loyalty:order:record"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
  /api/v1/orders/{orderRef}/returns/{returnRef}:
    put:
      tags:
      - "order-controller"
      description: "Callers: tenant-user, tenant-system. Requires `loyalty:order:record`."
      operationId: "putOrderReturn"
      parameters:
      - name: "orderRef"
