          type: "string"
          description: "`ACTIVE`, `PAUSED` or `ARCHIVED`."
        maxClicks:
          type: "integer"
          format: "int64"
          description: "The link's click cap, or null."
        clicks:
          type: "integer"
          format: "int64"
          description: "The total clicks recorded."
        last30Days:
          type: "array"
          description: "The clicks per day over the last thirty days."
          items:
            $ref: "#/components/schemas/DailyCount"
        botClicksExcluded:
          type: "integer"
          format: "int64"
          description: "How many bot clicks the default left out."
        dataThrough:
          type: "string"
          format: "date-time"
          description: "The time the rollups are current to."
    PageGoalResponse:
      type: "object"
      description: "A page of goal response rows, with the paging facts when the request\
        \ asked for them."
      properties:
        data:
          type: "array"
          description: "The rows of this page."
