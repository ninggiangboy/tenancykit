          - ACCESS_DISABLED
          - ACCESS_GRANTED
          - ENTITLEMENT_CHANGED
          - TENANT_DEACTIVATED
      - name: "filter[type][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `type`.
        required: false
        schema:
          type: string
      - name: "filter[type][neq]"
        in: query
        description: '`type` neq the value.'
        required: false
        schema:
          type: string
          enum:
          - ACCESS_CHANGED
          - ACCESS_DISABLED
          - ACCESS_GRANTED
          - ENTITLEMENT_CHANGED
          - TENANT_DEACTIVATED
      - name: "filter[type][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `type`.
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: "Comma-separated sortable fields, each optionally prefixed with\
          \ `-` for descending: created_at, id. At most 4 fields; `id` is appended\
          \ to make the order total. Default: `-id`."
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: "Page size, 1 to 200."
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - name: offset
        in: query
        description: "Rows to skip, at most 10000. Not combinable with `cursor`."
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 10000
          minimum: 0
      - name: cursor
        in: query
        description: The `next_cursor` of the previous page. Valid only with the same
          filter and sort.
        required: false
        schema:
          type: string
      - name: page_info
        in: query
        description: "`true` fills `page` with the limit, offset, total and next cursor;\
          \ `cursor` fills it with the limit and the next cursor alone, so a walk\
          \ over a large listing is not counted."
        required: false
        schema:
          type: string
          default: "false"
          enum:
          - "true"
          - "false"
          - cursor
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageNotificationResponse"
        "400":
          description: "A filter, sort, cursor or paging parameter is unknown, not\
            \ allowed for the field, or not valid for its type."
      x-allowed-callers:
      - tenant-user
      - platform-user
