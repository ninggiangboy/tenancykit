          description: "Stripe's id of the event."
        type:
          type: "string"
          description: "The Stripe event type."
        status:
          type: "string"
          description: "`RECEIVED`, `PROCESSED` or `IGNORED`."
        attempts:
          type: "integer"
          format: "int32"
          description: "How many times processing was tried."
        nextAttemptAt:
          type: "string"
          format: "date-time"
          description: "When the next try is due, or null."
        lastError:
          type: "string"
          description: "The last error, or null."
        receivedAt:
          type: "string"
          format: "date-time"
          description: "When the event was received."
        processedAt:
          type: "string"
          format: "date-time"
          description: "When it was processed, or null."
