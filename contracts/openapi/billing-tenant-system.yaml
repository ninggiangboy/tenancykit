          $ref: "#/components/schemas/MoneyDto"
          description: "The amount held."
        expiresAt:
          type: "string"
          format: "date-time"
          description: "When it expires."
        replayed:
          type: "boolean"
          description: "Whether the answer is the earlier result of the same request,\
            \ not a new one."
    ReserveResponse:
      type: "object"
      description: "The estimate and the reservation that holds it."
