        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: "Comma-separated sortable fields, each optionally prefixed with\
          \ `-` for descending: created_at, id. At most 4 fields; `id` is appended\
          \ to make the order total. Default: `-id`."
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: "Page size, 1 to 200."
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - name: offset
        in: query
        description: "Rows to skip, at most 10000. Not combinable with `cursor`."
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 10000
          minimum: 0
      - name: cursor
        in: query
        description: The `next_cursor` of the previous page. Valid only with the same
          filter and sort.
        required: false
        schema:
          type: string
      - name: page_info
        in: query
        description: "Fills `page` with the limit, offset, total and next cursor."
        required: false
        schema:
          type: boolean
          default: false
      responses:
