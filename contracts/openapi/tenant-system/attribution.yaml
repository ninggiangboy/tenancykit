  /system/v1/ping:
    get:
      tags:
      - "Health check"
      summary: "Check the caller's tenant"
      description: "Answers the caller's own tenant identity and nothing else. It\
        \ proves that the suite token, the tenant scope and the permission check are\
        \ wired; a platform-scope caller is refused even when it holds the code.\n\
        \nCallers: tenant-system. Requires `attribution:link:read`."
      operationId: "pingAsTenantSystem"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "object"
                additionalProperties: {}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permission: "attribution:link:read"
      x-allowed-callers:
