          type: "string"
          description: "The coupon."
        couponName:
          type: "string"
          description: "The coupon's name."
        benefitType:
          type: "string"
          description: "The kind of benefit: `PERCENT_OFF`, `AMOUNT_OFF` or `WALLET_CREDIT`."
        amount:
          $ref: "#/components/schemas/MoneyDto"
          description: "The amount taken off."
    EstimateResponse:
      type: "object"
      description: "The estimated cost."
      properties:
        planId:
          type: "string"
          description: "The id of the pricing plan."
        planCode:
          type: "string"
          description: "The plan's code."
        planVersion:
          type: "integer"
          format: "int32"
          description: "The plan version that was priced."
        amount:
          $ref: "#/components/schemas/MoneyDto"
          description: "What the wallet would pay after discounts."
        grossAmount:
          $ref: "#/components/schemas/MoneyDto"
          description: "The amount before discounts."
        discounts:
          type: "array"
          description: "The coupon discounts that would apply."
          items:
            $ref: "#/components/schemas/DiscountLineDto"
        exactAmount:
          type: "string"
          description: "The exact price before rounding, as a decimal string."
        adjustment:
          type: "string"
          description: "The rounding and min/max adjustment applied, as a decimal\
            \ string."
        lines:
          type: "array"
          description: "How the price is made up."
          items:
            $ref: "#/components/schemas/LineResponse"
    ReservationDto:
      type: "object"
      description: "A hold on a wallet."
