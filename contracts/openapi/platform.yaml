openapi: 3.1.0
info:
  title: Platform API
  version: v1
servers:
- url: /
  description: "The Platform hostname, e.g. platform.<base-domain>"
paths:
  /api/v1/users/{id}/permissions/{code}:
    put:
      tags:
      - user-controller
      operationId: setPermission
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: code
        in: path
        required: true
        schema:
          type: string
      - name: grant
        in: query
        required: true
        schema:
          type: boolean
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
      - name: X-Request-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
      x-required-permission: platform:user:manage
  /api/v1/tenants/{tenantId}/apps/{appCode}:
