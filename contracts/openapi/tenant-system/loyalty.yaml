          type: "string"
      responses:
        "202":
          description: "Accepted"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DeliveryResponse"
      x-required-permission: "loyalty:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
  /api/v1/vouchers/{code}/use:
    post:
      tags:
      - "voucher-controller"
      description: "Callers: tenant-user, tenant-system. Requires `loyalty:voucher:use`."
      operationId: "useVoucher"
      parameters:
      - name: "code"
        in: "path"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoucherUseRequest"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VoucherResponse"
      x-required-permission: "loyalty:voucher:use"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
  /api/v1/rewards:
    get:
      tags:
      - "reward-controller"
      description: "**Filtering, sorting and paging** follow the list-query contract.\
        \ Conditions in `filter[field][op]` are combined with AND. For OR, use `filter[or][i][field][op]`:\
        \ predicates sharing the index `i` are AND-ed and the branches are OR-ed (at\
        \ most 10 branches, 20 predicates in all, 100 values in an `in` list). `neq`\
        \ and `nin` do not match rows where the field is null. Send `limit` with either\
        \ `offset` (at most 10000) or the `cursor` taken from a previous page, never\
        \ both. The body is `{\"data\": [...], \"page\": null}`. `page_info=full`\
        \ fills `page` with `limit`, `offset`, `total` and `next_cursor`; `page_info=cursor`\
