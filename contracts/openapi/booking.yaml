      operationId: deleteWebhookEndpoint
      responses:
        "204": { description: "Deleted; its delivery history stays readable." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-required-permission: booking:webhook:manage
  /api/v1/webhook-endpoints/{endpointId}/rotate-secret:
    parameters:
    - name: endpointId
      in: path
      required: true
      schema: { type: string, format: uuid }
    post:
      tags: ["Webhooks"]
      summary: "Rotate an endpoint's secret"
      description: "The previous secret verifies for one rotation window; the new one is shown once."
      operationId: rotateWebhookSecret
      responses:
        "200":
          description: "The endpoint and its new secret."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointSecret"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-required-permission: booking:webhook:manage
  /api/v1/webhook-deliveries:
    get:
      tags: ["Webhooks"]
      summary: "Read the delivery log"
      operationId: listDeliveries
      responses:
        "200":
          description: "The deliveries."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-required-permission: booking:webhook:read
  /api/v1/webhook-deliveries/{deliveryId}/resend:
    parameters:
    - name: deliveryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    post:
      tags: ["Webhooks"]
      summary: "Resend a delivery"
      operationId: resendDelivery
      responses:
        "202": { description: "Queued for another attempt." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "The delivery already succeeded. Code `DELIVERY_SUCCEEDED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: booking:webhook:manage
  /api/v1/customer-tokens:
    post:
      tags: ["Customer tokens"]
      summary: "Mint a customer token for the public gate"
      description: "The token binds tenant, customerRef, the scopes and optionally one offering, carries a signing key id and expires within the tenant's cap. Booking mints it; the Tenant decides which of its customers may have one."
      operationId: createCustomerToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerTokenRequest"
      responses:
        "201":
          description: "The token and its expiry."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerToken"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "The TTL exceeds the cap, or a scope or offering is unknown. Code `VALIDATION_FAILED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: booking:token:issue
  /api/v1/settings:
    get:
      tags: ["Settings"]
      summary: "Read the tenant's booking settings"
      operationId: getSettings
      responses:
        "200":
          description: "The settings and their current values."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-required-permission: booking:settings:read
  /api/v1/settings/gate:
    put:
      tags: ["Settings"]
      summary: "Change the public gate settings"
      description: "Only the origins the Tenant registers are echoed by CORS; no wildcard, no credentials."
      operationId: putGateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GateSettings"
      responses:
        "200":
          description: "The stored settings."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateSettings"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
      x-required-permission: booking:settings:manage
  /p/offerings/{offeringId}:
    parameters:
    - $ref: "#/components/parameters/OfferingId"
    get:
      tags: ["Public gate"]
      summary: "Public: read an offering"
      description: "Requires a customer token with the `browse` scope. `remaining` is included only when the offering sets `publicShowsRemaining`."
      operationId: publicGetOffering
      security:
      - CustomerToken: []
      responses:
        "200":
          description: "The offering as the gate may see it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOffering"
        "401": { $ref: "#/components/responses/CustomerUnauthenticated" }
        "403": { $ref: "#/components/responses/CustomerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /p/offerings/{offeringId}/availability:
    parameters:
    - $ref: "#/components/parameters/OfferingId"
    get:
      tags: ["Public gate"]
      summary: "Public: free start instants"
      operationId: publicGetAvailability
      security:
      - CustomerToken: []
      parameters:
      - name: from
        in: query
        required: true
        schema: { type: string, format: date-time }
      - name: to
        in: query
        required: true
        schema: { type: string, format: date-time }
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: "The free starts."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityPage"
        "401": { $ref: "#/components/responses/CustomerUnauthenticated" }
        "403": { $ref: "#/components/responses/CustomerForbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /p/bookings:
    post:
      tags: ["Public gate"]
      summary: "Public: hold a place"
      description: "Requires the `hold` scope. The booking always has source `GATE` and the token's own `customerRef`. When the offering sets `queueMode = REQUIRED` the request must carry an admitted ticket token. Emits `booking.held` with source `GATE`."
      operationId: publicHold
      security:
      - CustomerToken: []
      parameters:
      - name: X-Queue-Ticket
        in: header
        required: false
        schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCreate"
      responses:
        "201":
          description: "The held booking."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401": { $ref: "#/components/responses/CustomerUnauthenticated" }
        "403": { $ref: "#/components/responses/CustomerForbidden" }
        "409":
          description: "`slot-taken` or `sold-out`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /p/bookings/{bookingId}:
    parameters:
    - $ref: "#/components/parameters/BookingId"
    delete:
      tags: ["Public gate"]
      summary: "Public: release its own hold"
      description: "Only a booking with source `GATE`, the token's own `customerRef`, and status `HELD`."
      operationId: publicReleaseHold
      security:
      - CustomerToken: []
      responses:
        "204": { description: "Released." }
        "401": { $ref: "#/components/responses/CustomerUnauthenticated" }
        "403": { $ref: "#/components/responses/CustomerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /p/waitlist:
    post:
      tags: ["Public gate"]
      summary: "Public: join the waitlist"
      operationId: publicJoinWaitlist
      security:
      - CustomerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistJoin"
      responses:
        "201":
          description: "The waiting entry."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"
        "401": { $ref: "#/components/responses/CustomerUnauthenticated" }
        "403": { $ref: "#/components/responses/CustomerForbidden" }
        "409":
          description: "`waitlist-full` or `ALREADY_WAITING`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /p/waitlist/{entryId}:
    parameters:
    - name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    get:
      tags: ["Public gate"]
      summary: "Public: read its position"
      operationId: publicGetWaitlistEntry
      security:
      - CustomerToken: []
      responses:
        "200":
          description: "The entry and its position."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"
        "401": { $ref: "#/components/responses/CustomerUnauthenticated" }
        "403": { $ref: "#/components/responses/CustomerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: ["Public gate"]
      summary: "Public: leave the waitlist"
      operationId: publicLeaveWaitlist
      security:
      - CustomerToken: []
      responses:
        "204": { description: "Left." }
        "401": { $ref: "#/components/responses/CustomerUnauthenticated" }
        "403": { $ref: "#/components/responses/CustomerForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /p/queue:
    post:
      tags: ["Public gate"]
      summary: "Public: enter the waiting room"
      description: "Returns a signed ticket token and a first `retryAfterSeconds`. One active ticket per `(customerRef, target)`; a ticket is insert-only and numbered from a sequence."
      operationId: publicEnterQueue
      security:
      - CustomerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueEntryRequest"
      responses:
        "201":
          description: "The ticket."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueTicket"
        "401": { $ref: "#/components/responses/CustomerUnauthenticated" }
        "403": { $ref: "#/components/responses/CustomerForbidden" }
        "409":
          description: "The customer already holds an active ticket for this target. Code `ALREADY_QUEUED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: ["Public gate"]
      summary: "Public: leave the waiting room"
      operationId: publicLeaveQueue
      security:
      - CustomerToken: []
      parameters:
      - name: X-Queue-Ticket
        in: header
        required: true
        schema: { type: string }
      responses:
        "204": { description: "Left." }
        "401": { $ref: "#/components/responses/CustomerUnauthenticated" }
        "403": { $ref: "#/components/responses/CustomerForbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /p/queue/status:
    get:
      tags: ["Public gate"]
      summary: "Public: poll its admission"
      description: "Reads the instance's cached watermark, never the ticket row. `position` is an upper bound and the watermark may be up to one second stale."
      operationId: publicQueueStatus
      security:
      - CustomerToken: []
      parameters:
      - name: X-Queue-Ticket
        in: header
        required: true
        schema: { type: string }
      responses:
        "200":
          description: "The status."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatus"
        "401": { $ref: "#/components/responses/CustomerUnauthenticated" }
        "403": { $ref: "#/components/responses/CustomerForbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
components:
  securitySchemes:
    SuiteToken:
      type: http
      scheme: bearer
      description: "The Platform-issued suite token of a Tenant System; booking mints no JWT."
    CustomerToken:
      type: http
      scheme: bearer
      description: "The short-lived HMAC customer token the Tenant System minted through `POST /customer-tokens`."
  parameters:
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OfferingId:
      name: offeringId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: "Required by every update; the endpoint answers `428` without it and `412` when it does not match."
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: "A retry with the same key and body returns the first result; a different body is `409`."
      schema: { type: string, minLength: 1, maxLength: 200 }
    Filter:
      name: filter
      in: query
      required: false
      description: "The shared list query contract: `filter[<field>][<op>]=<value>`. The generated document lists this resource's fields and operators."
      style: deepObject
      schema: { type: object }
    Sort:
      name: sort
      in: query
      required: false
      description: "Sortable fields, `-` for descending, at most four."
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, maximum: 10000 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    PageInfo:
      name: page_info
      in: query
      required: false
      schema: { type: string, enum: [full, cursor] }
  headers:
    ETag:
      description: "The resource's current version; send it as `If-Match` on the next update."
      schema: { type: string }
  security:
  - SuiteToken: []
  responses:
    BadRequest:
      description: "The request is malformed, for example both `offset` and `cursor`, or a filter beyond the contract's limits. Code `VALIDATION_FAILED`."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: "No suite token, or an expired or invalid one. Code `UNAUTHENTICATED`."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "The token lacks the operation's permission, or the tenant has no `booking` entitlement. Code `FORBIDDEN`."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "No such object in this tenant. Code `<RESOURCE>_NOT_FOUND`."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Error" }
    PreconditionRequired:
      description: "The update needs `If-Match`. Code `PRECONDITION_REQUIRED`."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Error" }
    PreconditionFailed:
      description: "`If-Match` does not match the current version. Code `STALE_VERSION`."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: "The body is well formed but invalid. Code `VALIDATION_FAILED` with the offending field."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: "The gate's per-fingerprint rate limit or the admission cap refused the request. `Retry-After` carries the wait."
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Error" }
    CustomerUnauthenticated:
      description: "A missing, expired, tampered or wrong-tenant customer token. The same code as a missing one, so nothing leaks."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Error" }
    CustomerForbidden:
      description: "The token lacks the scope, names another customer, or the destination is not served by the gate (for example `confirm`). Code `FORBIDDEN`."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      description: "A typed problem."
      additionalProperties: true
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: "A stable code, such as `slot-taken`, `sold-out`, `hold-lapsed`, `outside-open-hours`, `invalid-recurrence`, `booking-state`."
      example:
        type: "about:blank"
        title: "Slot taken"
        status: 409
        detail: "The requested range overlaps another booking."
        code: "slot-taken"
    ResourceCreate:
      type: object
      additionalProperties: false
      required: [code, name, zone]
      properties:
        code: { type: string, minLength: 1, maxLength: 60 }
        name: { type: string, minLength: 1, maxLength: 200 }
        zone: { type: string, description: "An IANA zone id." }
        seats: { type: [integer, "null"], minimum: 1 }
    ResourcePatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        seats: { type: [integer, "null"], minimum: 1 }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
    Resource:
      type: object
      additionalProperties: false
      required: [id, code, name, zone, status, version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        zone: { type: string }
        seats: { type: [integer, "null"], minimum: 1 }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        version: { type: integer, minimum: 1 }
    ResourcePage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Resource" }
        page:
          $ref: "#/components/schemas/Page"
    Page:
      type: [object, "null"]
      additionalProperties: false
      properties:
        limit: { type: integer }
        offset: { type: [integer, "null"] }
        total: { type: integer }
        next_cursor: { type: [string, "null"] }
    WorkingHoursReplace:
      type: object
      additionalProperties: false
      required: [hours]
      properties:
        hours:
          type: array
          items: { $ref: "#/components/schemas/WorkingHour" }
    WorkingHour:
      type: object
      additionalProperties: false
      required: [weekday, opens, closes]
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7, description: "ISO weekday, 1 = Monday." }
        opens: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        closes:
          type: string
          pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$"
          description: "Local wall-clock in the resource's zone; `24:00` is allowed."
    WorkingHours:
      type: object
      additionalProperties: false
      required: [hours]
      properties:
        hours:
          type: array
          items: { $ref: "#/components/schemas/WorkingHour" }
    CalendarExceptionCreate:
      type: object
      additionalProperties: false
      required: [fromDate, toDate, kind]
      properties:
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        kind: { type: string, enum: [CLOSED, OPEN] }
        hours:
          type: array
          description: "Required and meaningful when `kind` is `OPEN`; replaces that day's hours."
          items: { $ref: "#/components/schemas/WorkingHour" }
    CalendarException:
      allOf:
      - $ref: "#/components/schemas/CalendarExceptionCreate"
      - type: object
        required: [id]
        properties:
          id: { type: string, format: uuid }
    ExceptionPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/CalendarException" }
    GroupCreate:
      type: object
      additionalProperties: false
      required: [code, name, strategy]
      properties:
        code: { type: string, minLength: 1, maxLength: 60 }
        name: { type: string, minLength: 1, maxLength: 200 }
        strategy: { type: string, enum: [PRIORITY, ROUND_ROBIN, LEAST_BUSY, FIT_SEATS] }
        maxCombine: { type: integer, minimum: 1, maximum: 20, default: 1 }
        members:
          type: array
          items: { $ref: "#/components/schemas/GroupMember" }
    GroupMember:
      type: object
      additionalProperties: false
      required: [resourceId, priority]
      properties:
        resourceId: { type: string, format: uuid }
        priority: { type: integer, minimum: 0 }
    GroupPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        strategy: { type: string, enum: [PRIORITY, ROUND_ROBIN, LEAST_BUSY, FIT_SEATS] }
        maxCombine: { type: integer, minimum: 1, maximum: 20 }
        members:
          type: array
          items: { $ref: "#/components/schemas/GroupMember" }
    ResourceGroup:
      type: object
      additionalProperties: false
      required: [id, code, name, strategy, maxCombine, members, version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        strategy: { type: string, enum: [PRIORITY, ROUND_ROBIN, LEAST_BUSY, FIT_SEATS] }
        maxCombine: { type: integer, minimum: 1 }
        members:
          type: array
          items: { $ref: "#/components/schemas/GroupMember" }
        version: { type: integer, minimum: 1 }
    GroupPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ResourceGroup" }
    OfferingCreate:
      type: object
      additionalProperties: false
      required: [code, name, kind, durationMin, slotStep]
      properties:
        code: { type: string, minLength: 1, maxLength: 60 }
        name: { type: string, minLength: 1, maxLength: 200 }
        kind: { type: string, enum: [INTERVAL, CAPACITY] }
        durationMin: { type: integer, minimum: 1, description: "Minutes." }
        durationMax: { type: integer, minimum: 1 }
        durationStep: { type: integer, minimum: 1, default: 1 }
        slotStep: { type: integer, minimum: 1 }
        bufferBefore: { type: integer, minimum: 0, default: 0 }
        bufferAfter: { type: integer, minimum: 0, default: 0 }
        leadTimeSeconds: { type: integer, minimum: 0, default: 0 }
        horizonDays: { type: integer, minimum: 1 }
        holdTtlSeconds: { type: [integer, "null"], minimum: 1 }
        maxQty: { type: integer, minimum: 1, default: 1 }
        publicShowsRemaining: { type: boolean, default: false }
        queueMode: { type: string, enum: [NONE, REQUIRED], default: NONE }
        admitPerSecond: { type: integer, minimum: 1, default: 50 }
        admitWindowSeconds: { type: integer, minimum: 1, default: 120 }
    OfferingPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
        durationMin: { type: integer, minimum: 1 }
        durationMax: { type: integer, minimum: 1 }
        durationStep: { type: integer, minimum: 1 }
        slotStep: { type: integer, minimum: 1 }
        bufferBefore: { type: integer, minimum: 0 }
        bufferAfter: { type: integer, minimum: 0 }
        leadTimeSeconds: { type: integer, minimum: 0 }
        horizonDays: { type: integer, minimum: 1 }
        holdTtlSeconds: { type: [integer, "null"], minimum: 1 }
        maxQty: { type: integer, minimum: 1 }
