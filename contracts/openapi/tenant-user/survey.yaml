---
openapi: "3.1.0"
info:
  title: "Survey API"
  description: "The API a Tenant System uses to build versioned surveys, issue links\
    \ and read what came back, plus the public endpoints a respondent's browser calls\
    \ without credentials."
  version: "v1"
servers:
- url: "/survey"
  description: "Any tenant hostname: <tenant-code>.<base-domain>/survey"
tags:
- name: "Surveys"
  description: "A tenant's surveys and their lifecycle: create, read, close and reopen."
- name: "Public fill surface"
  description: "The unauthenticated endpoints a respondent's browser uses to open\
    \ a link and read the survey."
- name: "Survey settings"
  description: "The tenant's survey defaults: abandonment window, upload limit, public\
    \ rate limit and time zone."
- name: "Survey respondents"
  description: "The respondents of a survey, for importing into a mailroom group for\
    \ a reminder."
- name: "Webhook endpoints"
  description: "Where a tenant wants its events delivered and which event types. The\
    \ signing secret is returned only when an endpoint is created or its secret rotated,\
    \ never again."
- name: "Survey exports"
  description: "Queued CSV exports of responses and reading their state."
- name: "Survey links"
  description: "Public and personal links that open a survey, and revoking them."
- name: "Survey drafts"
  description: "A survey's one editable document: read, save under If-Match, and validate."
- name: "Survey versions"
  description: "Publishing the draft as an immutable version and reading the version\
    \ history."
- name: "Webhook deliveries"
  description: "The history of attempts to deliver an event to an endpoint, and resending\
    \ one that finished. A delivery that exhausted its attempts is DEAD and stays\
    \ visible so it can be resent."
- name: "Survey analytics"
  description: "Per-question aggregates, cross-tabs, trends and the drop-off funnel."
- name: "Respondent answers"
  description: "The respondent's own surface, authorised by the visit token: save\
    \ and resume a draft, sign an upload and submit."
- name: "Survey preview and simulation"
  description: "Try a draft's logic without publishing: preview a locale, or simulate\
    \ answers through the draft or a version."
- name: "Survey responses"
  description: "Reading and deleting completed responses."
paths:
  /api/v1/surveys/{id}/draft:
    get:
      tags:
      - "Survey drafts"
      summary: "Get a survey's draft"
      description: "Returns the survey's one editable document with its `ETag`, the\
        \ tag the next save has to carry. An unknown survey answers `404`.\n\nCallers:\
        \ tenant-user. Requires `survey:survey:read`."
      operationId: "get"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the survey."
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "A survey's draft, with the tag its next save has to carry."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DraftResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-required-permission: "survey:survey:read"
      x-allowed-callers:
      - "tenant-user"
    put:
      tags:
      - "Survey drafts"
      summary: "Save a survey's draft"
      description: "Replaces the draft with `document`. Requires `If-Match` with the\
        \ draft's tag, so two builders cannot overwrite each other silently. The server\
        \ gives an id to every structural node that arrived without one and answers\
        \ the stored document, so a builder that never invents ids keeps them across\
        \ saves. Only the shape is enforced: a draft in progress may be incomplete,\
        \ and translations and jumps are checked on validate and publish.\n\nCallers:\
        \ tenant-user. Requires `survey:survey:manage`."
      operationId: "save"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the survey."
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "If-Match"
        in: "header"
        description: "The `ETag` of the version the caller last read. The change is\
          \ refused with `412` when the resource has moved on since."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The draft document to store."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftRequest"
        required: true
      responses:
        "200":
          description: "A survey's draft, with the tag its next save has to carry."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DraftResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          description: "The request has no `If-Match` header. This endpoint requires\
            \ the tag the draft was read at, so a save is never last-write-wins."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      x-required-permission: "survey:survey:manage"
      x-allowed-callers:
      - "tenant-user"
  /api/v1/webhook-endpoints:
    get:
      tags:
      - "Webhook endpoints"
      summary: "List webhook endpoints"
      description: "Pages through the tenant's webhook endpoints, with the list-query\
        \ contract's filtering, sorting and paging.\n\n**Filtering, sorting and paging**\
        \ follow the list-query contract. Conditions in `filter[field][op]` are combined\
        \ with AND. For OR, use `filter[or][i][field][op]`: predicates sharing the\
        \ index `i` are AND-ed and the branches are OR-ed (at most 10 branches, 20\
        \ predicates in all, 100 values in an `in` list). `neq` and `nin` do not match\
        \ rows where the field is null. Send `limit` with either `offset` (at most\
        \ 10000) or the `cursor` taken from a previous page, never both. The body\
        \ is `{\"data\": [...], \"page\": null}`. `page_info=full` fills `page` with\
        \ `limit`, `offset`, `total` and `next_cursor`; `page_info=cursor` fills it\
        \ with `limit` and `next_cursor` alone, without counting the matching rows;\
        \ omit it for the rows alone.\n\nCallers: tenant-user. Requires `survey:webhook:manage`."
      operationId: "listEndpoints"
      parameters:
      - name: "filter[created_at][eq]"
        in: "query"
        description: "`created_at` eq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][gt]"
        in: "query"
        description: "`created_at` gt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][gte]"
        in: "query"
        description: "`created_at` gte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `created_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[created_at][lt]"
        in: "query"
        description: "`created_at` lt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][lte]"
        in: "query"
        description: "`created_at` lte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][neq]"
        in: "query"
        description: "`created_at` neq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `created_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[description][eq]"
        in: "query"
        description: "`description` eq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[description][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `description`."
        required: false
        schema:
          type: "string"
      - name: "filter[description][is_null]"
        in: "query"
        description: "`true` for rows where `description` is null, `false` for rows\
          \ where it is set."
        required: false
        schema:
          type: "boolean"
      - name: "filter[description][neq]"
        in: "query"
        description: "`description` neq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[description][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `description`."
        required: false
        schema:
          type: "string"
      - name: "filter[description][starts_with]"
        in: "query"
        description: "Case-insensitive prefix match on `description`."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[id][eq]"
        in: "query"
        description: "`id` eq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[id][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `id`."
        required: false
        schema:
          type: "string"
      - name: "filter[id][neq]"
        in: "query"
        description: "`id` neq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[id][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `id`."
        required: false
        schema:
          type: "string"
      - name: "filter[key_id][eq]"
        in: "query"
        description: "`key_id` eq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[key_id][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `key_id`."
        required: false
        schema:
          type: "string"
      - name: "filter[key_id][neq]"
        in: "query"
        description: "`key_id` neq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[key_id][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `key_id`."
        required: false
        schema:
          type: "string"
      - name: "filter[key_id][starts_with]"
        in: "query"
        description: "Case-insensitive prefix match on `key_id`."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[secret_rotated_at][eq]"
        in: "query"
        description: "`secret_rotated_at` eq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[secret_rotated_at][gt]"
        in: "query"
        description: "`secret_rotated_at` gt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[secret_rotated_at][gte]"
        in: "query"
        description: "`secret_rotated_at` gte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[secret_rotated_at][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `secret_rotated_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[secret_rotated_at][is_null]"
        in: "query"
        description: "`true` for rows where `secret_rotated_at` is null, `false` for\
          \ rows where it is set."
        required: false
        schema:
          type: "boolean"
      - name: "filter[secret_rotated_at][lt]"
        in: "query"
        description: "`secret_rotated_at` lt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[secret_rotated_at][lte]"
        in: "query"
        description: "`secret_rotated_at` lte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[secret_rotated_at][neq]"
        in: "query"
        description: "`secret_rotated_at` neq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[secret_rotated_at][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `secret_rotated_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[status][eq]"
        in: "query"
        description: "`status` eq the value."
        required: false
        schema:
          type: "string"
          enum:
          - "ACTIVE"
          - "DISABLED"
      - name: "filter[status][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `status`."
        required: false
        schema:
          type: "string"
      - name: "filter[status][neq]"
        in: "query"
        description: "`status` neq the value."
        required: false
        schema:
          type: "string"
          enum:
          - "ACTIVE"
          - "DISABLED"
      - name: "filter[status][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `status`."
        required: false
        schema:
          type: "string"
      - name: "filter[updated_at][eq]"
        in: "query"
        description: "`updated_at` eq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][gt]"
        in: "query"
        description: "`updated_at` gt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][gte]"
        in: "query"
        description: "`updated_at` gte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `updated_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[updated_at][lt]"
        in: "query"
        description: "`updated_at` lt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][lte]"
        in: "query"
        description: "`updated_at` lte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][neq]"
        in: "query"
        description: "`updated_at` neq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `updated_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[url][eq]"
        in: "query"
        description: "`url` eq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[url][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `url`."
        required: false
        schema:
          type: "string"
      - name: "filter[url][neq]"
        in: "query"
        description: "`url` neq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[url][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `url`."
        required: false
        schema:
          type: "string"
      - name: "filter[url][starts_with]"
        in: "query"
        description: "Case-insensitive prefix match on `url`."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "sort"
        in: "query"
        description: "Comma-separated sortable fields, each optionally prefixed with\
          \ `-` for descending: created_at, id. At most 4 fields; `id` is appended\
          \ to make the order total. Default: `created_at,id`."
        required: false
        schema:
          type: "string"
      - name: "limit"
        in: "query"
        description: "Page size, 1 to 200."
        required: false
        schema:
          type: "integer"
          format: "int32"
          default: 50
          maximum: 200
          minimum: 1
      - name: "offset"
        in: "query"
        description: "Rows to skip, at most 10000. Not combinable with `cursor`."
        required: false
        schema:
          type: "integer"
          format: "int32"
          default: 0
          maximum: 10000
          minimum: 0
      - name: "cursor"
        in: "query"
        description: "The `next_cursor` of the previous page. Valid only with the\
          \ same filter and sort."
        required: false
        schema:
          type: "string"
      - name: "page_info"
        in: "query"
        description: "`full` fills `page` with the limit, offset, total and next cursor;\
          \ `cursor` fills it with the limit and the next cursor alone, so a walk\
          \ over a large listing is not counted; omit it for the rows alone."
        required: false
        schema:
          type: "string"
          enum:
          - "full"
          - "cursor"
      responses:
        "200":
          description: "A page of endpoint response rows, with the paging facts when\
            \ the request asked for them."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageEndpointResponse"
        "400":
          description: "A filter, sort, cursor or paging parameter is unknown, not\
            \ allowed for the field, or not valid for its type."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permission: "survey:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
    post:
      tags:
      - "Webhook endpoints"
      summary: "Create a webhook endpoint"
      description: "Registers an HTTPS endpoint that subscribes to a subset of survey's\
        \ event types. The signing secret is returned once, in this response, and\
        \ never again. A url that is not https or does not resolve to a public address,\
        \ or an unknown event type, answers `422`. Answers `201`. Requires `survey:webhook:manage`.\n\
        \nCallers: tenant-user. Requires `survey:webhook:manage`."
      operationId: "createEndpoint"
      parameters:
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The endpoint to register."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEndpointRequest"
        required: true
      responses:
        "201":
          description: "An endpoint with its signing secret, shown once."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EndpointWithSecretResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: "The url is not https or does not resolve to a public address,\
            \ or an event type is not known."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      x-required-permission: "survey:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
  /api/v1/webhook-endpoints/{id}/rotate-secret:
    post:
      tags:
      - "Webhook endpoints"
      summary: "Rotate a webhook endpoint's secret"
      description: "Replaces the endpoint's signing secret and returns the new one\
        \ once, never again. Requires `survey:webhook:manage`.\n\nCallers: tenant-user.\
        \ Requires `survey:webhook:manage`."
      operationId: "rotateSecret"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the webhook endpoint."
        required: true
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      responses:
        "200":
          description: "An endpoint with its signing secret, shown once."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EndpointWithSecretResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-required-permission: "survey:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
  /api/v1/webhook-deliveries/{id}/resend:
    post:
      tags:
      - "Webhook deliveries"
      summary: "Resend a webhook delivery"
      description: "Queues a fresh delivery of the same stored event to the same endpoint\
        \ and answers `202`: sending happens asynchronously. The original keeps its\
        \ history.\n\nCallers: tenant-user. Requires `survey:webhook:manage`."
      operationId: "resend"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the webhook delivery."
        required: true
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      responses:
        "202":
          description: "One delivery of an event to an endpoint."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DeliveryResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-required-permission: "survey:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
  /api/v1/surveys:
    get:
      tags:
      - "Surveys"
      summary: "List surveys"
      description: "Pages through the tenant's surveys, newest first by default, with\
        \ the list-query contract's filtering, sorting and paging.\n\n**Filtering,\
        \ sorting and paging** follow the list-query contract. Conditions in `filter[field][op]`\
        \ are combined with AND. For OR, use `filter[or][i][field][op]`: predicates\
        \ sharing the index `i` are AND-ed and the branches are OR-ed (at most 10\
        \ branches, 20 predicates in all, 100 values in an `in` list). `neq` and `nin`\
        \ do not match rows where the field is null. Send `limit` with either `offset`\
        \ (at most 10000) or the `cursor` taken from a previous page, never both.\
        \ The body is `{\"data\": [...], \"page\": null}`. `page_info=full` fills\
        \ `page` with `limit`, `offset`, `total` and `next_cursor`; `page_info=cursor`\
        \ fills it with `limit` and `next_cursor` alone, without counting the matching\
        \ rows; omit it for the rows alone.\n\nCallers: tenant-user. Requires `survey:survey:read`."
      operationId: "list"
      parameters:
      - name: "filter[created_at][eq]"
        in: "query"
        description: "`created_at` eq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][gt]"
        in: "query"
        description: "`created_at` gt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][gte]"
        in: "query"
        description: "`created_at` gte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `created_at`."
