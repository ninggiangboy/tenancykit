          format: uuid
      - name: "filter[user_id][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `user_id`.
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: "Comma-separated sortable fields, each optionally prefixed with\
