  /api/v1/webhook-deliveries/{id}/retry:
    post:
      tags:
      - "delivery-controller"
      description: "Callers: tenant-user, tenant-system. Requires `loyalty:webhook:manage`."
      operationId: "retry"
      parameters:
      - name: "id"
        in: "path"
        required: true
