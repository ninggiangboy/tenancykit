# A service's own file: it adds to the built-in entries and wins on a clash.
schema Role = A role and the permissions it grants.
schema Role.name = The role's display name.
schema Role.version =
    The version of the role,
    also its ETag.
schema CreateRole = The body that creates a role.
field id = The id.
param /api/v1/roles/{id} id = The id of the role to act on.
param locale = The locale the text is rendered in.
param If-Match = Overridden by the service.
body /oauth/token = The token request, as a form.
body /oauth/token grant_type = Must be client_credentials.
error PUT /api/v1/roles/{id} 409 = The role is a built-in one and cannot be changed.
error PUT /api/v1/roles/{id} 422 Report = The permissions are not in the catalog.
