        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[expires_at][lte]"
        in: query
        description: '`expires_at` lte the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[expires_at][neq]"
        in: query
