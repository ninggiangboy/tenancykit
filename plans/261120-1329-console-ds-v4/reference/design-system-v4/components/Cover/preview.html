<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Suite Console</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--background); color: var(--foreground); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; inset: 0; display: block; }
  .brand { fill: var(--app-billing); }
  .tint { fill: var(--app-billing-soft); }
  .a1 { fill: var(--app-platform); } .a2 { fill: var(--app-customer); } .a3 { fill: var(--app-loyalty); } .a4 { fill: var(--app-notification); } .a5 { fill: var(--app-booking); } .a6 { fill: var(--app-workflow); }
  .deep { fill: var(--primary); }
  .scope { fill: var(--scope-platform); }
  .cut { fill: var(--background); }
  .blk { rx: var(--radius-xl); }
  .tile { rx: var(--radius-sm); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 92px; line-height: .92; font-weight: 700; letter-spacing: -.045em; color: var(--foreground); }
  .tag { margin: var(--space-3) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--muted-foreground); }
</style>
</head>
<body>
<div class="cover">
<svg class="art" viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
<!--
  blocks      app-billing 128x256 bled off the top (the accent of the first app) · its soft fill 104x160 (the selected row) · primary 232x232 bled off the right edge (the neutral shell, zinc-900 / zinc-50) · scope-platform 104x8 once, the platform pill's dot as a band
  arrangement one tall slab with satellites, bottoms on one line at y 240, space-4 gutters, the band a space-4 step below the tint
  pattern     the launcher grid cut from the neutral block: 32px tiles at a space-10 pitch; six of them filled with other apps' accents (one colour per app), two missing like apps a tenant has not enabled
  scales      sides in space-2 multiples; gutters space-4; pitch 40; corners radius-xl on blocks, radius-md on tiles, radius-sm on the band
-->
<rect class="brand blk" x="496" y="-16" width="128" height="256" rx="14"/>
<rect class="tint blk" x="640" y="80" width="104" height="160" rx="14"/>
<rect class="scope tile" x="640" y="256" width="104" height="8" rx="4"/>
<rect class="deep blk" x="760" y="24" width="232" height="232" rx="14"/>
<rect class="cut tile" x="776" y="40" width="72" height="32" rx="8"/>
<rect class="a1 tile" x="856" y="40" width="32" height="32" rx="8"/>
<rect class="cut tile" x="896" y="40" width="32" height="32" rx="8"/>
<rect class="cut tile" x="936" y="40" width="32" height="32" rx="8"/>
<rect class="cut tile" x="776" y="80" width="32" height="32" rx="8"/>
<rect class="a2 tile" x="816" y="80" width="32" height="32" rx="8"/>
<rect class="cut tile" x="856" y="80" width="72" height="32" rx="8"/>
<rect class="a3 tile" x="936" y="80" width="32" height="32" rx="8"/>
<rect class="cut tile" x="776" y="120" width="32" height="32" rx="8"/>
<rect class="cut tile" x="816" y="120" width="32" height="32" rx="8"/>
<rect class="a4 tile" x="856" y="120" width="32" height="32" rx="8"/>
<rect class="cut tile" x="896" y="120" width="32" height="32" rx="8"/>
<rect class="a5 tile" x="776" y="160" width="32" height="32" rx="8"/>
<rect class="cut tile" x="816" y="160" width="72" height="32" rx="8"/>
<rect class="cut tile" x="896" y="160" width="32" height="32" rx="8"/>
<rect class="cut tile" x="936" y="160" width="32" height="32" rx="8"/>
<rect class="cut tile" x="816" y="200" width="32" height="32" rx="8"/>
<rect class="a6 tile" x="856" y="200" width="32" height="32" rx="8"/>
<rect class="cut tile" x="896" y="200" width="72" height="32" rx="8"/>
</svg>
<div class="words">
<h1 class="name">Suite<br>Console</h1>
<p class="tag">One console for every tenant and every app in the suite. Each app in its own colour.</p>
</div>
</div>
</body>
</html>
