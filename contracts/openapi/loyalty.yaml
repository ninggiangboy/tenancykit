            '*/*':
              schema:
                $ref: "#/components/schemas/WebhookEndpointWithSecret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No endpoint with that id in this tenant. Code `WEBHOOK_ENDPOINT_NOT_FOUND`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: loyalty:webhook:manage
      x-allowed-callers:
      - "tenant-system"
  /system/v1/webhook-deliveries:
    get:
      tags:
      - "Webhook deliveries"
      summary: "List webhook deliveries"
      operationId: "listWebhookDeliveriesAsTenantSystem"
      parameters:
      - name: endpointId
        in: query
        required: false
        description: "Return only deliveries of this endpoint."
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        description: "Return only deliveries in this state, such as `PENDING`, `DELIVERED` or `DEAD`."
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: "Page size, 1 to 200."
        schema:
          type: integer
          format: int32
          default: 50
          minimum: 1
          maximum: 200
      - name: cursor
        in: query
        required: false
        description: "The `next_cursor` of the previous page. Valid only with the same filter."
        schema:
          type: string
      responses:
        "200":
          description: "A page of webhook deliveries."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WebhookDeliveryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permission: loyalty:webhook:manage
      description: "Callers: tenant-system. Requires `loyalty:webhook:manage`."
      x-allowed-callers:
      - "tenant-system"
  /system/v1/webhook-deliveries/{id}/retry:
    post:
      tags:
      - "Webhook deliveries"
      summary: "Retry a webhook delivery"
      description: "Schedules another attempt of a finished or dead delivery and answers `202`.\n\nCallers: tenant-system. Requires `loyalty:webhook:manage`."
      operationId: "retryWebhookDeliveryAsTenantSystem"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          description: "The delivery was queued for another attempt."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No delivery with that id in this tenant. Code `WEBHOOK_DELIVERY_NOT_FOUND`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: loyalty:webhook:manage
      x-allowed-callers:
      - "tenant-system"
components:
  responses:
    BadRequest:
      description: "The request is malformed: a body or query parameter is missing, unknown or not valid for its type, or a required `Idempotency-Key` header is absent. Code `INVALID_REQUEST`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: "The caller presented no valid suite token for this tenant. Code `UNAUTHENTICATED`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "The token does not carry this operation's `x-required-permission` code, or the tenant is not entitled to loyalty. Code `FORBIDDEN`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionFailed:
      description: "The `If-Match` tag does not match the resource's current version. The response carries the current `ETag`; fetch the resource again and retry. Code `PRECONDITION_FAILED`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionRequired:
      description: "This update requires an `If-Match` header. Send the `ETag` last read. Code `IF_MATCH_REQUIRED`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Program:
      type: object
      description: "The tenant's single points program: one currency and its point rate, the point expiry rules, the tier window and the IANA time zone promotion windows and day-of-week rules are evaluated in. Nothing earns until a program exists."
      required:
      - currency
      - currencyUnit
      - expiryMonths
      - expiryNoticeDays
      - tierWindowMonths
      - timeZone
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: "ISO 4217 code, for example `USD`. Immutable once any ledger entry exists."
        currencyUnit:
          type: integer
          format: int64
          minimum: 1
          description: "Minor units of `currency` that earn one point, for example 1000."
        expiryMonths:
          type: integer
          format: int32
          minimum: 1
          maximum: 120
          default: 12
          description: "Months after it is earned that a lot expires."
        expiryNoticeDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 365
          default: 30
          description: "Days before expiry the notice job announces a lot; 0 disables the notice."
        tierWindowMonths:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
          default: 12
          description: "Months of qualifying spend the tier evaluation looks back over."
        timeZone:
          type: string
          default: UTC
          description: "IANA id the promotion windows and day-of-week rules are evaluated in."
        version:
          type: integer
          format: int64
          description: "Optimistic-lock version, also the resource's `ETag`."
    Tier:
      type: object
      required:
      - code
      - name
      - minSpend
      - earnMultiplier
      properties:
        code:
          type: string
          maxLength: 100
          description: "Stable tier code."
        name:
          type: string
          maxLength: 255
          description: "Display name."
        minSpend:
          type: integer
          format: int64
          minimum: 0
          description: "Qualifying spend in minor units of the program currency at which the tier starts."
        earnMultiplier:
          type: number
          minimum: 1.00
          maximum: 10.00
          multipleOf: 0.01
          description: "Multiplier applied to a line's points when the member is in this tier."
    TierList:
      type: object
      required:
      - tiers
      properties:
        tiers:
          type: array
          minItems: 1
          description: "The whole ordered list, lowest first. The first tier has `minSpend` 0 and thresholds strictly increase."
          items:
            $ref: "#/components/schemas/Tier"
        version:
          type: integer
          format: int64
          description: "Optimistic-lock version, also the resource's `ETag`."
    Promotion:
      type: object
      description: "A rule that multiplies the points a line earns. Every condition kind that is set must match, and within one kind any listed value matches; an empty list is no restriction. Best-matching-wins resolution: among the active promotions whose window contains the order's `occurredAt` and whose conditions all match a line, the highest multiplier applies, and `priority` orders the catalog and breaks a tie between equal multipliers (higher first)."
      required:
      - promotionId
      - name
      - active
      - multiplier
      properties:
        promotionId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        priority:
          type: integer
          format: int32
          description: "Catalog order and the tie-break between equal multipliers; higher wins."
        active:
          type: boolean
          description: "Only active promotions are considered by the earn engine."
        startsAt:
          type: string
          format: date-time
          description: "Start of the window, evaluated in the program's `timeZone`."
        endsAt:
          type: string
          format: date-time
          description: "End of the window, evaluated in the program's `timeZone`."
        daysOfWeek:
          type: array
          description: "ISO weekdays the promotion applies on: 1 Monday to 7 Sunday."
          items:
            type: integer
            minimum: 1
            maximum: 7
        storeCodes:
          type: array
          description: "Store codes the promotion applies in."
          items:
            type: string
        categories:
          type: array
          description: "Product categories the promotion applies to."
          items:
            type: string
        skus:
          type: array
          description: "SKUs the promotion applies to."
          items:
            type: string
        multiplier:
          type: number
          minimum: 1.01
          maximum: 10.00
          multipleOf: 0.01
        version:
          type: integer
          format: int64
    PromotionRequest:
      type: object
      required:
      - name
      - multiplier
      properties:
        name:
          type: string
          maxLength: 255
        priority:
          type: integer
          format: int32
        active:
          type: boolean
          default: true
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        daysOfWeek:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        storeCodes:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
        skus:
          type: array
          items:
            type: string
        multiplier:
          type: number
          minimum: 1.01
          maximum: 10.00
          multipleOf: 0.01
    PromotionPatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        priority:
          type: integer
          format: int32
        active:
          type: boolean
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        daysOfWeek:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        storeCodes:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
        skus:
          type: array
          items:
            type: string
        multiplier:
          type: number
          minimum: 1.01
          maximum: 10.00
          multipleOf: 0.01
    PromotionPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Promotion"
        page:
          $ref: "#/components/schemas/PageInfo"
    MemberUpsert:
      type: object
      properties:
        displayName:
          type: [string, "null"]
          maxLength: 255
          description: "Optional display name."
    Member:
      type: object
      description: "A member of the tenant's program, keyed by the tenant's own `externalRef`. `available` is computed on read as the sum of the remaining points of unexpired lots minus `debt`; it is negative while a debt exceeds the unexpired lots."
      properties:
        memberId:
          type: string
          format: uuid
          description: "loyalty's own opaque id for the member."
        externalRef:
          type: string
          maxLength: 200
          description: "The Tenant's reference for the member, unique per tenant and immutable."
        displayName:
          type: [string, "null"]
          maxLength: 255
        available:
          type: integer
          format: int64
          description: "The balance: the sum of unexpired lots' remaining points minus `debt`. Computed on read, never stored."
        debt:
          type: integer
          format: int64
          minimum: 0
          description: "Points owed from a clawback whose shortfall became debt; the next earn repays it first."
        tier:
          $ref: "#/components/schemas/Tier"
        nextTier:
          description: "The next tier up and its `minSpend` threshold; null when the member is in the top tier."
          allOf:
          - $ref: "#/components/schemas/Tier"
        pointsExpiring:
          type: array
          description: "The lots that expire within the requested window, grouped by expiry date."
          items:
            type: object
            properties:
              expiresAt:
                type: string
                format: date-time
              points:
                type: integer
                format: int64
        enrolledAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ACTIVE
          - ERASED
    LedgerEntry:
      type: object
      description: "One append-only ledger entry. Entries are never changed; a correction is a new entry."
      required:
      - entryId
      - kind
      - points
      - createdAt
      properties:
        entryId:
          type: string
          format: uuid
        kind:
          type: string
          description: "EARN grants a lot; DEBT_REPAY repays debt before a new lot; REDEEM spends; REVERSE restores a reversed redemption; CLAWBACK takes points back on a return; EXPIRE writes off a lot."
          enum:
          - EARN
          - REDEEM
          - REVERSE
          - EXPIRE
          - CLAWBACK
          - DEBT_REPAY
        points:
          type: integer
          format: int64
          description: "The points this entry moved, with `kind` giving the direction."
        orderRef:
          type: [string, "null"]
          maxLength: 200
        returnRef:
          type: [string, "null"]
          maxLength: 200
        redemptionId:
          type: [string, "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time
    LedgerPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntry"
        page:
          $ref: "#/components/schemas/PageInfo"
    ErasureResponse:
      type: object
      properties:
        memberId:
          type: string
          format: uuid
        erasedAt:
          type: string
          format: date-time
        vouchersVoided:
          type: integer
          format: int64
          description: "The member's unused vouchers that were voided."
    OrderLine:
      type: object
      description: "One order line in the shared order shape. `amount` is net of discount."
      required:
      - lineNo
      - quantity
      - amount
      properties:
        lineNo:
          type: integer
          format: int32
          minimum: 1
        sku:
          type: string
          maxLength: 100
        category:
          type: string
          maxLength: 100
        quantity:
          type: number
          multipleOf: 0.001
          exclusiveMinimum: 0
          description: "Quantity, up to 3 fraction digits."
        amount:
          type: integer
          format: int64
          description: "Net line amount in minor units of the order currency."
        earnEligible:
          type: boolean
          default: true
          description: "Whether the line's amount counts toward points and qualifying spend."
    OrderUpsert:
      type: object
      description: "The order shape shared with the order contract, carrying only the fields loyalty reads. The first order for an unknown `externalRef` enrols the member."
      required:
      - externalRef
      - occurredAt
      - lines
      properties:
        externalRef:
          type: string
          minLength: 1
          maxLength: 200
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: "ISO 4217 code; must match the program's currency."
        occurredAt:
          type: string
          format: date-time
          description: "At most 5 minutes in the future."
        storeCode:
          type: string
          maxLength: 100
        channel:
          type: string
          maxLength: 50
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/OrderLine"
    ReturnLine:
      type: object
      required:
      - lineNo
      - quantity
      - amount
      properties:
        lineNo:
          type: integer
          format: int32
        quantity:
          type: number
          multipleOf: 0.001
          exclusiveMinimum: 0
          description: "Quantity returned, up to 3 fraction digits."
        amount:
          type: integer
          format: int64
          description: "Returned amount in minor units of the order currency."
    OrderReturn:
      type: object
      required:
      - lines
      properties:
        occurredAt:
          type: string
          format: date-time
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReturnLine"
    EarnSnapshot:
      type: object
      description: "The rules an order's earn used, stored when the order was recorded. A return recomputes with this snapshot, never with today's rules."
      properties:
        unitAmount:
          type: integer
          format: int64
        currency:
          type: string
        tierCode:
          type: string
        tierMultiplier:
          type: number
        lines:
          type: array
          items:
            type: object
            properties:
              lineNo:
                type: integer
                format: int32
              multiplier:
                type: number
              promotionIds:
                type: array
                items:
                  type: string
                  format: uuid
    OrderLineView:
      type: object
      properties:
        lineNo:
          type: integer
          format: int32
        sku:
          type: string
        category:
          type: string
        quantity:
          type: number
        amount:
          type: integer
          format: int64
        earnEligible:
          type: boolean
        returnedQuantity:
          type: number
        returnedAmount:
          type: integer
          format: int64
    OrderView:
      type: object
      description: "What an order earned, the snapshot its earn used, and what its returns took back. `pointsGranted` is the order's points net of returns."
      properties:
        orderRef:
          type: string
          maxLength: 200
        externalRef:
          type: string
          maxLength: 200
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        occurredAt:
          type: string
          format: date-time
        storeCode:
          type: string
        channel:
          type: string
        pointsGranted:
          type: integer
          format: int64
        spendAmount:
          type: integer
          format: int64
          description: "Eligible net amount in minor units the points were computed from."
        available:
          type: integer
          format: int64
        debt:
          type: integer
          format: int64
        earnSnapshot:
          $ref: "#/components/schemas/EarnSnapshot"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineView"
        returns:
          type: array
          items:
            type: object
            properties:
              returnRef:
                type: string
                maxLength: 200
              occurredAt:
                type: string
                format: date-time
              pointsClawedBack:
                type: integer
                format: int64
              debtAdded:
                type: integer
                format: int64
    RedemptionRequest:
      type: object
      required:
      - points
      properties:
        points:
          type: integer
          format: int64
          minimum: 1
        reference:
          type: string
          maxLength: 200
          description: "The Tenant's own reference for the redemption, for example a POS receipt."
    RedemptionResponse:
      type: object
      properties:
        redemptionId:
          type: string
          format: uuid
        externalRef:
          type: string
          maxLength: 200
        points:
          type: integer
          format: int64
        reference:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - REVERSED
        available:
          type: integer
          format: int64
        debt:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        reversedAt:
          type: string
          format: date-time
    Reward:
      type: object
      description: "A catalog entry a member exchanges points for. Redeeming it issues one single-use voucher; loyalty never fulfils the reward itself."
      required:
      - rewardId
      - name
      - pointsCost
      - active
      properties:
        rewardId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        pointsCost:
          type: integer
          format: int64
          minimum: 0
        stock:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: "Remaining units; null means unlimited."
        active:
          type: boolean
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        voucherValidDays:
          type: integer
          format: int32
          minimum: 1
          description: "Days a voucher issued for this reward stays usable."
        version:
          type: integer
          format: int64
    RewardRequest:
      type: object
      required:
      - name
      - pointsCost
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        pointsCost:
          type: integer
          format: int64
          minimum: 0
        stock:
          type: [integer, "null"]
          format: int64
          minimum: 0
        active:
          type: boolean
          default: true
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        voucherValidDays:
          type: integer
          format: int32
          minimum: 1
    RewardPatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        pointsCost:
          type: integer
          format: int64
          minimum: 0
        stock:
          type: [integer, "null"]
          format: int64
          minimum: 0
        active:
          type: boolean
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        voucherValidDays:
          type: integer
          format: int32
          minimum: 1
    RewardPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Reward"
        page:
          $ref: "#/components/schemas/PageInfo"
    RewardRedemptionRequest:
      type: object
      required:
      - rewardId
      properties:
        rewardId:
          type: string
          format: uuid
    RewardRedemptionResponse:
      type: object
      properties:
        redemptionId:
          type: string
          format: uuid
        rewardId:
          type: string
          format: uuid
        voucher:
          $ref: "#/components/schemas/Voucher"
        available:
          type: integer
          format: int64
        debt:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    Voucher:
      type: object
      description: "A single-use voucher. loyalty issues and consumes it; the Tenant maps its `rewardId` to what it grants."
      required:
      - voucherId
      - code
      - rewardId
      - state
      - expiresAt
      properties:
        voucherId:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 100
        rewardId:
          type: string
          format: uuid
        memberId:
          type: string
          format: uuid
        externalRef:
          type: [string, "null"]
          maxLength: 200
          description: "Null after the member is erased."
        state:
          type: string
          enum:
          - ISSUED
          - USED
          - VOIDED
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        usedAt:
          type: string
          format: date-time
        useRef:
          type: [string, "null"]
          maxLength: 200
        voidReason:
          type: [string, "null"]
          enum:
          - REVERSAL
          - ERASURE
    VoucherUseRequest:
      type: object
      required:
      - useRef
      properties:
        useRef:
          type: string
          minLength: 1
          maxLength: 200
          description: "The caller's idempotency reference for the use; the same reference replays the same result."
    VoucherPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Voucher"
        page:
          $ref: "#/components/schemas/PageInfo"
    WebhookEndpoint:
      type: object
      description: "A destination loyalty sends signed HTTP webhooks to. It subscribes to a subset of loyalty's event types."
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: "An https URL that resolves to a public address."
        description:
          type: string
          maxLength: 255
        eventTypes:
          type: array
          items:
            $ref: "#/components/schemas/EventType"
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
        keyId:
          type: string
          description: "Identifies which signing secret signed a delivery."
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        secretRotatedAt:
          type: string
          format: date-time
    WebhookEndpointRequest:
      type: object
      required:
      - url
      - eventTypes
      properties:
        url:
          type: string
          description: "An https URL that resolves to a public address."
        description:
          type: string
          maxLength: 255
        eventTypes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EventType"
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
    WebhookEndpointWithSecret:
      type: object
      properties:
        endpoint:
          $ref: "#/components/schemas/WebhookEndpoint"
        signingSecret:
          type: string
          description: "Returned only when the endpoint is created or its secret is rotated."
    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        endpointId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
          description: "The event's deduplication key."
        eventType:
          $ref: "#/components/schemas/EventType"
        status:
          type: string
          description: "For example `PENDING`, `DELIVERED` or `DEAD`."
        attempts:
          type: integer
          format: int32
        nextAttemptAt:
          type: string
          format: date-time
        lastStatusCode:
          type: integer
          format: int32
        lastError:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    WebhookEndpointPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEndpoint"
        page:
          $ref: "#/components/schemas/PageInfo"
    WebhookDeliveryPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
        page:
          $ref: "#/components/schemas/PageInfo"
    EventType:
      type: string
      description: "One loyalty event type an endpoint may subscribe to. Every event is a fact loyalty reports as a signed HTTP webhook to the Tenant's subscribed endpoints."
      enum:
      - member.enrolled
      - points.earned
      - points.clawed-back
      - points.redeemed
      - points.redemption-reversed
      - points.expiring
      - points.expired
      - tier.changed
      - voucher.issued
      - voucher.used
      - voucher.voided
      - member.erased
    PageInfo:
      type: object
      properties:
        limit:
          type: integer
          format: int32
        offset:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        next_cursor:
          type: string
    Error:
      type: object
      description: "The RFC 9457 problem detail every operation returns on failure. `title` repeats the status reason, `status` repeats the HTTP status and `detail` is a human-readable message. `code` names the concrete loyalty failure where the operation documents one."
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        code:
          type: string
          description: "The concrete failure code named in the operation's error description, for example `PROGRAM_NOT_CONFIGURED` or `INSUFFICIENT_POINTS`."
  securitySchemes:
    oidc:
      type: http
      description: "A suite token issued by Platform for this tenant"
      scheme: bearer
      bearerFormat: JWT
