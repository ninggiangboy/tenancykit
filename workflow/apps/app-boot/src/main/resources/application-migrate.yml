# The schema step: Flyway applies the migrations and the process exits. No HTTP edge, no job, no broker listener, and
# the replica is not rebuilt here. `workflow.migrate.exit-on-finish=false` keeps the context alive, for a test that
# only wants to prove the profile wires.
spring:
  config:
    activate:
      on-profile: "migrate"
  main:
    web-application-type: none
  flyway:
    enabled: true
workflow:
  jobs:
    enabled: false
  housekeeping:
    enabled: false
  migrate:
    exit-on-finish: ${WORKFLOW_MIGRATE_EXIT_ON_FINISH:true}
suite:
  replica:
    rebuild-on-start: false
