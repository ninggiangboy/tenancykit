        walletId:
          type: "string"
          description: "The id of the wallet."
        status:
          type: "string"
          description: "`DRAFT`, `OPEN`, `PAID`, `VOID` or `UNCOLLECTIBLE`."
        origin:
          type: "string"
          description: "`POSTPAID_CYCLE` for a closed billing cycle, or `CHARGE` for\
            \ one charge."
        total:
          $ref: "#/components/schemas/MoneyDto"
          description: "The total amount."
        periodStart:
          type: "string"
          format: "date-time"
          description: "The start of the period."
        periodEnd:
          type: "string"
          format: "date-time"
          description: "The end of the period."
        settlement:
          type: "string"
          description: "How it is settled: `WALLET` (already paid from the wallet)\
            \ or `PAYMENT` (paid through Stripe)."
        voidReason:
          type: "string"
          description: "Why it was voided, or null."
        createdAt:
          type: "string"
          format: "date-time"
          description: "When the record was created."
        issuedAt:
          type: "string"
          format: "date-time"
          description: "When it was issued, or null."
        paidAt:
          type: "string"
          format: "date-time"
          description: "When it was paid, or null."
        voidedAt:
          type: "string"
          format: "date-time"
          description: "When it was voided, or null."
    ItemResponse:
      type: "object"
