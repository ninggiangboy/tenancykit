<!doctype html>
<html>
<head><meta charset="utf-8"><title>BulkBar preview</title></head>
<body>
<div id="root" class=""></div>
<script>
  var S = window.Suite, h = React.createElement;
  function Demo() {
    var n = React.useState(3);
    return h('div', { style: { display: 'flex', justifyContent: 'center', padding: 24 } },
      n[0] ? h(S.BulkBar, { count: n[0], onClear: function () { n[1](0); } },
        h(S.Button, { variant: 'ghost', size: 'sm', icon: 'download' }, 'Export'),
        h(S.Button, { variant: 'ghost', size: 'sm', icon: 'mail' }, 'Send reminder'),
        h(S.Button, { variant: 'ghost', size: 'sm', icon: 'ban' }, 'Write off'))
        : h(S.Button, { variant: 'outline', onClick: function () { n[1](3); } }, 'Select 3 rows again'));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
