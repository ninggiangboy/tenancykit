# Versions resolved from Maven Central and mutually compatible: Spring Boot 4.1 manages Flyway, the
# PostgreSQL driver and Testcontainers.
[versions]
spring-boot = "4.1.2"
spring-modulith = "2.1.2"
archunit = "1.5.1"
json-schema-validator = "3.0.7"
jmustache = "1.16"
springdoc = "3.2.0"
# Scalar API reference UI bundled by scalar-core; newer than the version springdoc manages.
scalar = "0.9.1"
swagger-annotations = "2.2.55"
jdk = "25"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
spring-modulith-api = { module = "org.springframework.modulith:spring-modulith-api" }
spring-modulith-core = { module = "org.springframework.modulith:spring-modulith-core" }
spring-modulith-docs = { module = "org.springframework.modulith:spring-modulith-docs" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
jmustache = { module = "com.samskivert:jmustache", version.ref = "jmustache" }
springdoc-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
swagger-annotations = { module = "io.swagger.core.v3:swagger-annotations-jakarta", version.ref = "swagger-annotations" }
springdoc-scalar = { module = "org.springdoc:springdoc-openapi-starter-webmvc-scalar", version.ref = "springdoc" }
scalar-core = { module = "com.scalar.maven:scalar-core", version.ref = "scalar" }
scalar-webmvc = { module = "com.scalar.maven:scalar-webmvc", version.ref = "scalar" }

[plugins]
