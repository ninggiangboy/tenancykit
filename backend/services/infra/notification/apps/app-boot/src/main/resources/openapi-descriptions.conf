# Descriptions of the request and response fields, parameters and bodies of Notification's API.
# Read by DescriptionsOpenApiCustomizer; see dev.ngb.core.openapi for the format.

param locale = The locale of the template variant: `en` or `vi`. When omitted, the fallback locale `en` is used.
param /api/v1/templates/{key}/{locale} locale = The locale of the template variant: `en` or `vi`.
param /api/v1/templates/{key} key = The template key, one of the keys `GET /api/v1/templates` lists.
param /api/v1/templates/{key}/{locale} key = The template key, one of the keys `GET /api/v1/templates` lists.

field locale = A locale the suite supports: `en` or `vi`.
field type = A notification type, such as `ACCESS_GRANTED`.
field key = The template key that renders the notification type.
field subject = The email subject line, as a template.
field html = The HTML body of the email, as a template.
field text = The plain-text body of the email, as a template.
field title = The title of the in-app notification, as a template.
field body = The body of the in-app notification, as a template.
field version = The version of the stored override; 0 for the packaged default.
field createdAt = When the row was created.

schema TemplateRequest = The parts of a template override. A part left out keeps the packaged default.
schema TemplateVariant = One template in one locale: the email subject, HTML and text, and the in-app title and body.
schema TemplateSummary = A notification type and the template key that renders it.
schema TemplateSummary.type = The notification type.
schema Resolved = The template as the suite renders it for a key and locale.
schema Resolved.key = The template key that was asked for.
schema Resolved.locale = The locale the variant was resolved for.
schema Resolved.variant = The parts the suite renders: each part the override defines, and the packaged default for the rest.
schema Resolved.overridden = Whether a suite-wide override exists for this key and locale.

schema SettingsRequest = The tenant's notification settings to store, replacing the stored ones.
schema SettingsResponse = The tenant's notification settings.
field defaultLocale = The locale used for a user who has not chosen one: `en` or `vi`.
field enabledTypes = The notification types the tenant has enabled. A type missing here is not sent.

schema PreferenceRequest = The caller's preferences to store, replacing the stored ones.
schema PreferenceResponse = The caller's notification preferences.
schema PreferenceRequest.locale = The caller's locale: `en` or `vi`. Blank clears the preference.
schema PreferenceResponse.locale = The caller's locale, or null when the caller has none.
field mutedTypes = The notification types the caller does not want to receive.

schema NotificationResponse = One notification in the caller's in-app inbox.
schema NotificationResponse.id = The notification's id.
schema NotificationResponse.type = The notification type.
schema NotificationResponse.templateKey = The key of the template that rendered it.
schema NotificationResponse.templateVersion = The version of the template that rendered it.
schema NotificationResponse.locale = The locale it was rendered in.
schema NotificationResponse.title = The rendered title.
schema NotificationResponse.body = The rendered body.
schema NotificationResponse.link = Where the notification leads, or null.
schema NotificationResponse.readAt = When the caller read it, or null while it is unread.
schema NotificationResponse.createdAt = When the notification was created.

schema DispatchResponse = One row of the dispatch ledger: an email the suite decided to send or not to send.
schema DispatchResponse.id = The ledger row's id.
schema DispatchResponse.sourceEventId = The id of the event that caused the notification.
schema DispatchResponse.notificationType = The notification type.
schema DispatchResponse.userId = The id of the user the email was for.
schema DispatchResponse.recipient = The email address it was addressed to.
schema DispatchResponse.fromKey = The sender identity the email was sent from.
schema DispatchResponse.templateKey = The key of the template that rendered it.
schema DispatchResponse.templateVersion = The version of the template that rendered it.
schema DispatchResponse.locale = The locale it was rendered in.
schema DispatchResponse.subject = The rendered subject line.
schema DispatchResponse.status = Where the dispatch stands: `PENDING`, `PUBLISHED`, `SUPPRESSED_MUTED` or `SKIPPED_INACTIVE`.
schema DispatchResponse.reason = Why the email was not sent, or null when it was.
schema DispatchResponse.createdAt = When the dispatch was decided.
schema DispatchResponse.publishedAt = When the email was handed to the mailer, or null.

# ---- success statuses a handler answers by what it did
status PUT /api/v1/templates/{key}/{locale} 204 = The override was saved.
status DELETE /api/v1/templates/{key}/{locale} 204 = The override was removed, so the packaged default is used again.
status POST /api/v1/notifications/{id}/read 204 = The notification was marked as read.
status POST /api/v1/notifications/read-all 204 = The caller's notifications were marked as read.
