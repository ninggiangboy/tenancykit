spring:
  application:
    name: crm
  profiles:
    # With no active profile (dev, bootRun and every default-mode test) both runtime profiles are active, which
    # keeps the all-in-one behaviour. The two profile files stay out of that run: each guards itself with an
    # on-profile expression so only a runtime that runs alone applies its settings.
    default: api,worker
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CRM_OIDC_ISSUER_URI:http://localhost:8081/realms/billing}
          jwk-set-uri: ${CRM_OIDC_JWK_SET_URI:${CRM_OIDC_ISSUER_URI:http://localhost:8081/realms/billing}/protocol/openid-connect/certs}
          audiences: crm
  datasource:
    url: ${CRM_DB_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${CRM_DB_USER:crm_app}
    password: ${CRM_DB_PASSWORD:crm_app}
  rabbitmq:
    host: ${CRM_RABBITMQ_HOST:localhost}
    port: ${CRM_RABBITMQ_PORT:5672}
    username: ${CRM_RABBITMQ_USER:crm}
    password: ${CRM_RABBITMQ_PASSWORD:crm}
  flyway:
    locations: classpath:db/migration
    # Migrations run as the table owner; the application connects as crm_app, which owns nothing.
    url: ${CRM_MIGRATION_DB_URL:${CRM_DB_URL:jdbc:postgresql://localhost:5432/crm}}
    user: ${CRM_MIGRATION_DB_USER:crm_owner}
    password: ${CRM_MIGRATION_DB_PASSWORD:crm_owner}
    placeholders:
      # The baseline creates crm_app with this password. Without the placeholder Flyway aborts the whole set.
      appDbPassword: ${CRM_DB_PASSWORD:crm_app}
  task:
    scheduling:
      pool:
        size: ${CRM_SCHEDULER_POOL_SIZE:4}
      shutdown:
        await-termination: true
        await-termination-period: 30s

server:
  port: ${CRM_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          # The replica is part of readiness: the api runtime serves nothing useful until one rebuild has finished.
          include: readinessState,db,replicaState

suite:
  app-code: crm
  replica:
    platform-base-url: ${CRM_PLATFORM_BASE_URL:http://localhost:8082}
    client-id: ${PLATFORM_CRM_SERVICE_CLIENT_ID:crm}
    client-secret: ${PLATFORM_CRM_SERVICE_CLIENT_SECRET:crm}
    rebuild-on-start: ${CRM_REPLICA_REBUILD_ON_START:true}
    page-limit: 200
    request-timeout: PT10S
    platform-issuer: ${CRM_PLATFORM_ISSUER:http://localhost:8082}
    platform-jwk-set-uri: ${CRM_PLATFORM_JWK_SET_URI:http://localhost:8082/.well-known/jwks.json}
    # The worker's queue; the api runtime serves HTTP and consumes nothing.
    queue: crm.platform-events
    exchange: platform.events
    max-attempts: 3
    retry-backoff: PT0.5S
    refresh-skew: PT30S

crm:
  messaging:
    # Platform's exchange: crm binds a queue to it and declares no exchange of its own.
    exchange: ${CRM_MESSAGING_EXCHANGE:platform.events}
    queue: ${CRM_MESSAGING_QUEUE:crm.platform-events}
  relay:
    # The in-process relay that turns outbox rows into webhook deliveries. No broker, no export route.
    poll-delay: PT2S
    batch-size: 50
    max-attempts: 10
    backoff-base: PT10S
    backoff-cap: PT1H
    jitter: 0.2
    claim-deadline: PT30S
  jobs:
    enabled: ${CRM_JOBS_ENABLED:true}
    # At most this many tenants run at once across all jobs; keep it below the connection pool.
    tenant-parallelism: ${CRM_WORKER_TENANT_PARALLELISM:4}
  batches:
    # Deployment limits, not per-Tenant settings: a Tenant cannot raise them. A batch reports each item's outcome and
    # never fails as a whole because one item is bad, so these bound one request's work rather than its correctness.
    max-customers: ${CRM_MAX_CUSTOMERS_PER_BATCH:1000}
    max-activities: ${CRM_MAX_ACTIVITIES_PER_BATCH:1000}
    max-orders: ${CRM_MAX_ORDERS_PER_BATCH:100}
    max-order-lines: ${CRM_MAX_ORDER_LINES_PER_BATCH:5000}
  orders:
    # The largest order one call may record. It also bounds one outbox row and one webhook body, so a deployment with
    # a slow endpoint can lower it.
    max-lines-per-order: ${CRM_MAX_LINES_PER_ORDER:500}
    # An order or a return may not be dated further in the future than this. There is no lower bound: a Tenant that
    # imports historic orders sends dates no window can accept.
    max-future-skew: ${CRM_ORDER_MAX_FUTURE_SKEW:PT5M}
  fields:
    # The Tenant's own customer attributes: how many definitions may accept values, and how large one customer's
    # values may be serialized. These bound one Tenant's vocabulary and one row, so a deployment sets them.
    max-active-definitions: ${CRM_MAX_FIELD_DEFINITIONS:50}
    max-bytes: ${CRM_MAX_FIELD_BYTES:16384}
  tags:
    max-per-customer: ${CRM_MAX_TAGS_PER_CUSTOMER:50}
  consents:
    # A consent's occurredAt may not be further in the future than this, so a bad clock cannot sort above every
    # honest record of the history.
    max-future-skew: ${CRM_CONSENT_MAX_FUTURE_SKEW:PT5M}
  activity:
    max-payload-bytes: ${CRM_MAX_ACTIVITY_PAYLOAD_BYTES:8192}
  exports:
    page-size: ${CRM_EXPORT_PAGE_SIZE:500}
    # One export per tenant at a time: the claim is a lease, so an instance that dies mid-export stops blocking its
    # tenant once it runs out.
    lease: ${CRM_EXPORT_LEASE:PT5M}
  housekeeping:
    enabled: ${CRM_HOUSEKEEPING_ENABLED:true}
    inbox-retention: P30D
    # A relayed outbox row keeps its payload after the relay has turned it into deliveries, so it is only evidence; seven
    # days is long enough to explain a delivery and short enough that an erased customer's reference does not linger.
    relayed-outbox-retention: P7D
    dead-outbox-retention: P7D
    # A delivery body carries the customer's and the order's data, so a finished delivery is not kept forever.
    webhook-delivery-retention: P30D
    batch-size: 500
    interval: PT1H
  webhooks:
    # Endpoint signing secrets are envelope-encrypted with this key. A deployment must supply it; there is no default,
    # so a forgotten key fails startup rather than storing a secret in the clear.
    master-key: ${CRM_SECRETS_MASTER_KEY:}
    master-key-id: ${CRM_SECRETS_MASTER_KEY_ID:k1}
    # False everywhere but the compose profile, where the smoke forwarder receives a delivery on a container network.
    # With false, a Tenant's endpoint must be a public https address and every send is re-checked by the DNS guard.
    allow-non-public-targets: ${CRM_WEBHOOKS_ALLOW_NON_PUBLIC_TARGETS:false}
    batch-size: 25
    max-attempts: 10
    backoff-base: PT30S
    backoff-cap: PT6H
    lease: PT2M
    max-connections: 100
    max-connections-per-route: 25
    connection-request-timeout: PT2S
    connect-timeout: PT3S
    read-timeout: PT10S
    deadline: PT15S
