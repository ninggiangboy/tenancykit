openapi: 3.1.0
info:
  title: Survey API
  description: "The API a Tenant System uses to build versioned surveys, issue links\
    \ and read what came back, plus the public endpoints a respondent's browser calls\
    \ without credentials."
  version: v1
servers:
- url: /survey
  description: "Any tenant hostname: <tenant-code>.<base-domain>/survey"
paths:
  /p/v/{visitToken}/draft:
    get:
      tags:
      - answer-controller
      operationId: readDraft
      parameters:
      - name: visitToken
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DraftResponse"
      x-public: true
    put:
      tags:
      - answer-controller
      operationId: saveDraft
      parameters:
      - name: visitToken
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswersRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DraftResponse"
      x-public: true
  /api/v1/surveys/{id}/draft:
    get:
      tags:
      - draft-controller
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DraftResponse"
      x-required-permission: survey:survey:read
    put:
      tags:
      - draft-controller
      operationId: save
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DraftResponse"
      x-required-permission: survey:survey:manage
  /p/v/{visitToken}/uploads:
    post:
      tags:
      - answer-controller
      operationId: upload
      parameters:
      - name: visitToken
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Signed"
      x-public: true
  /p/v/{visitToken}/submit:
    post:
      tags:
      - answer-controller
      operationId: submit
      parameters:
      - name: visitToken
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswersRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubmitResult"
      x-public: true
  /p/v/{visitToken}/pages/{pageId}/view:
    post:
      tags:
      - public-controller
      operationId: pageViewed
      parameters:
      - name: visitToken
        in: path
        required: true
        schema:
          type: string
      - name: pageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      x-public: true
  /p/l/{token}/open:
    post:
      tags:
      - public-controller
      operationId: open
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      - name: Referer
        in: header
        required: false
        schema:
          type: string
      - name: User-Agent
        in: header
        required: false
        schema:
          type: string
      - name: query
        in: query
        required: true
        schema:
          type: object
          additionalProperties:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpenedResponse"
      x-public: true
  /api/v1/webhook-endpoints:
    get:
      tags:
      - endpoint-controller
      description: "**Filtering, sorting and paging** follow the list-query contract.\
        \ Conditions in `filter[field][op]` are combined with AND. For OR, use `filter[or][i][field][op]`:\
        \ predicates sharing the index `i` are AND-ed and the branches are OR-ed (at\
        \ most 10 branches, 20 predicates in all, 100 values in an `in` list). `neq`\
        \ and `nin` do not match rows where the field is null. Send `limit` with either\
        \ `offset` (at most 10000) or the `cursor` taken from a previous page, never\
        \ both. The body is `{\"data\": [...], \"page\": null}`. `page_info=full`\
        \ fills `page` with `limit`, `offset`, `total` and `next_cursor`; `page_info=cursor`\
        \ fills it with `limit` and `next_cursor` alone, without counting the matching\
        \ rows; omit it for the rows alone."
      operationId: listEndpoints
      parameters:
      - name: "filter[created_at][eq]"
        in: query
        description: '`created_at` eq the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][gt]"
        in: query
        description: '`created_at` gt the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][gte]"
        in: query
        description: '`created_at` gte the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `created_at`.
        required: false
        schema:
          type: string
      - name: "filter[created_at][lt]"
        in: query
        description: '`created_at` lt the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][lte]"
        in: query
        description: '`created_at` lte the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][neq]"
        in: query
        description: '`created_at` neq the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `created_at`.
        required: false
        schema:
          type: string
      - name: "filter[description][eq]"
        in: query
        description: '`description` eq the value.'
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[description][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `description`.
        required: false
        schema:
          type: string
      - name: "filter[description][is_null]"
        in: query
        description: "`true` for rows where `description` is null, `false` for rows\
          \ where it is set."
        required: false
        schema:
          type: boolean
      - name: "filter[description][neq]"
        in: query
        description: '`description` neq the value.'
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[description][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `description`.
        required: false
        schema:
          type: string
      - name: "filter[description][starts_with]"
        in: query
        description: Case-insensitive prefix match on `description`.
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[id][eq]"
        in: query
        description: '`id` eq the value.'
        required: false
        schema:
          type: string
          format: uuid
      - name: "filter[id][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `id`.
        required: false
        schema:
          type: string
      - name: "filter[id][neq]"
        in: query
        description: '`id` neq the value.'
        required: false
        schema:
          type: string
          format: uuid
      - name: "filter[id][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `id`.
        required: false
        schema:
          type: string
      - name: "filter[key_id][eq]"
        in: query
        description: '`key_id` eq the value.'
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[key_id][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `key_id`.
        required: false
        schema:
          type: string
      - name: "filter[key_id][neq]"
        in: query
        description: '`key_id` neq the value.'
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[key_id][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `key_id`.
        required: false
        schema:
          type: string
      - name: "filter[key_id][starts_with]"
        in: query
        description: Case-insensitive prefix match on `key_id`.
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[secret_rotated_at][eq]"
        in: query
        description: '`secret_rotated_at` eq the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[secret_rotated_at][gt]"
        in: query
        description: '`secret_rotated_at` gt the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[secret_rotated_at][gte]"
        in: query
        description: '`secret_rotated_at` gte the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[secret_rotated_at][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `secret_rotated_at`.
        required: false
        schema:
          type: string
      - name: "filter[secret_rotated_at][is_null]"
        in: query
        description: "`true` for rows where `secret_rotated_at` is null, `false` for\
          \ rows where it is set."
        required: false
        schema:
          type: boolean
      - name: "filter[secret_rotated_at][lt]"
        in: query
        description: '`secret_rotated_at` lt the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[secret_rotated_at][lte]"
        in: query
        description: '`secret_rotated_at` lte the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[secret_rotated_at][neq]"
        in: query
        description: '`secret_rotated_at` neq the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[secret_rotated_at][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `secret_rotated_at`.
        required: false
        schema:
          type: string
      - name: "filter[status][eq]"
        in: query
        description: '`status` eq the value.'
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - DISABLED
      - name: "filter[status][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `status`.
        required: false
        schema:
          type: string
      - name: "filter[status][neq]"
        in: query
        description: '`status` neq the value.'
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - DISABLED
      - name: "filter[status][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `status`.
        required: false
        schema:
          type: string
      - name: "filter[updated_at][eq]"
        in: query
        description: '`updated_at` eq the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[updated_at][gt]"
        in: query
        description: '`updated_at` gt the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[updated_at][gte]"
        in: query
        description: '`updated_at` gte the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[updated_at][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `updated_at`.
        required: false
        schema:
          type: string
      - name: "filter[updated_at][lt]"
        in: query
        description: '`updated_at` lt the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[updated_at][lte]"
        in: query
        description: '`updated_at` lte the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[updated_at][neq]"
        in: query
        description: '`updated_at` neq the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[updated_at][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `updated_at`.
        required: false
        schema:
          type: string
      - name: "filter[url][eq]"
        in: query
        description: '`url` eq the value.'
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[url][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `url`.
        required: false
        schema:
          type: string
      - name: "filter[url][neq]"
        in: query
        description: '`url` neq the value.'
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[url][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `url`.
        required: false
        schema:
          type: string
      - name: "filter[url][starts_with]"
        in: query
        description: Case-insensitive prefix match on `url`.
        required: false
        schema:
          type: string
          maxLength: 255
      - name: sort
        in: query
        description: "Comma-separated sortable fields, each optionally prefixed with\
          \ `-` for descending: created_at, id. At most 4 fields; `id` is appended\
          \ to make the order total. Default: `created_at,id`."
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: "Page size, 1 to 200."
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - name: offset
        in: query
        description: "Rows to skip, at most 10000. Not combinable with `cursor`."
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 10000
          minimum: 0
      - name: cursor
        in: query
        description: The `next_cursor` of the previous page. Valid only with the same
          filter and sort.
        required: false
        schema:
          type: string
      - name: page_info
        in: query
        description: "`full` fills `page` with the limit, offset, total and next cursor;\
          \ `cursor` fills it with the limit and the next cursor alone, so a walk\
          \ over a large listing is not counted; omit it for the rows alone."
        required: false
        schema:
          type: string
          enum:
          - full
          - cursor
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageEndpointResponse"
        "400":
          description: "A filter, sort, cursor or paging parameter is unknown, not\
            \ allowed for the field, or not valid for its type."
      x-required-permission: survey:webhook:manage
    post:
      tags:
      - endpoint-controller
      operationId: createEndpoint
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEndpointRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EndpointWithSecretResponse"
      x-required-permission: survey:webhook:manage
  /api/v1/webhook-endpoints/{id}/rotate-secret:
    post:
      tags:
      - endpoint-controller
      operationId: rotateSecret
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: X-Request-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EndpointWithSecretResponse"
      x-required-permission: survey:webhook:manage
  /api/v1/webhook-deliveries/{id}/resend:
    post:
      tags:
      - delivery-controller
      operationId: resend
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: X-Request-Id
        in: header
        required: false
        schema:
          type: string
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DeliveryResponse"
      x-required-permission: survey:webhook:manage
  /api/v1/surveys:
    get:
      tags:
      - survey-controller
      description: "**Filtering, sorting and paging** follow the list-query contract.\
        \ Conditions in `filter[field][op]` are combined with AND. For OR, use `filter[or][i][field][op]`:\
        \ predicates sharing the index `i` are AND-ed and the branches are OR-ed (at\
        \ most 10 branches, 20 predicates in all, 100 values in an `in` list). `neq`\
        \ and `nin` do not match rows where the field is null. Send `limit` with either\
        \ `offset` (at most 10000) or the `cursor` taken from a previous page, never\
        \ both. The body is `{\"data\": [...], \"page\": null}`. `page_info=full`\
        \ fills `page` with `limit`, `offset`, `total` and `next_cursor`; `page_info=cursor`\
        \ fills it with `limit` and `next_cursor` alone, without counting the matching\
        \ rows; omit it for the rows alone."
      operationId: list
      parameters:
      - name: "filter[created_at][eq]"
        in: query
        description: '`created_at` eq the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][gt]"
        in: query
        description: '`created_at` gt the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][gte]"
        in: query
        description: '`created_at` gte the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `created_at`.
        required: false
        schema:
          type: string
      - name: "filter[created_at][lt]"
        in: query
        description: '`created_at` lt the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][lte]"
        in: query
        description: '`created_at` lte the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][neq]"
        in: query
        description: '`created_at` neq the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `created_at`.
        required: false
        schema:
          type: string
      - name: "filter[current_version_id][eq]"
        in: query
        description: '`current_version_id` eq the value.'
        required: false
        schema:
          type: string
          format: uuid
      - name: "filter[current_version_id][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `current_version_id`.
        required: false
        schema:
          type: string
      - name: "filter[current_version_id][is_null]"
        in: query
        description: "`true` for rows where `current_version_id` is null, `false`\
          \ for rows where it is set."
        required: false
        schema:
          type: boolean
      - name: "filter[current_version_id][neq]"
