server:
  tomcat:
    # The list-query contract sends filter[field][op] with its brackets unencoded; without this Tomcat answers 400.
    relaxed-query-chars: "[,]"

spring:
  application:
    name: platform
  datasource:
    url: ${PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${PLATFORM_DB_USER:platform_app}
    password: ${PLATFORM_DB_PASSWORD:platform}
    hikari:
      # Admin writes take row locks on purpose, so a stuck holder must not block every request behind it. A wait that
      # outlasts the timeout is a 503 with Retry-After, not a hung connection.
      connection-init-sql: "SET lock_timeout = '10s'; SET idle_in_transaction_session_timeout = '60s'"
  flyway:
    locations: classpath:db/migration
    # Migrations run as the table owner; the application runs as platform_app.
    url: ${PLATFORM_MIGRATION_DB_URL:${PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/platform}}
    user: ${PLATFORM_MIGRATION_DB_USER:platform}
    password: ${PLATFORM_MIGRATION_DB_PASSWORD:platform}
    placeholders:
      appDbPassword: ${PLATFORM_DB_PASSWORD:platform}
  rabbitmq:
    host: ${PLATFORM_RABBITMQ_HOST:localhost}
    port: ${PLATFORM_RABBITMQ_PORT:5672}
    username: ${PLATFORM_RABBITMQ_USER:billing}
    password: ${PLATFORM_RABBITMQ_PASSWORD:billing}
    # The relay marks an outbox row only after waitForConfirmsOrDie: simple publisher confirms, not correlated.
    publisher-confirm-type: simple

platform:
  tenancy:
    # Platform Administration is <platform-hostname>; a Tenant is <tenant-code>.<base-domain>.
    base-domain: ${PLATFORM_BASE_DOMAIN:localhost}
    platform-hostname: ${PLATFORM_HOSTNAME:platform.localhost}
  keycloak:
    base-url: ${PLATFORM_KEYCLOAK_URL:http://localhost:8081}
    realm: ${PLATFORM_KEYCLOAK_REALM:billing}
    admin-client-id: ${PLATFORM_KEYCLOAK_ADMIN_CLIENT_ID:platform-admin}
    admin-client-secret: ${PLATFORM_KEYCLOAK_ADMIN_CLIENT_SECRET:}
  bootstrap:
    # Optional: creates the first Platform administrator on start, through Keycloak.
    platform-admin-email: ${PLATFORM_BOOTSTRAP_ADMIN_EMAIL:}
    platform-admin-temporary-password: ${PLATFORM_BOOTSTRAP_ADMIN_TEMPORARY_PASSWORD:}
  users:
    # Keycloak's JWKS. Blank means only suite tokens are accepted, which is the state before users exist.
    jwk-set-uri: ${PLATFORM_OIDC_JWK_SET_URI:}
    # The realm's issuer; when set, a user token's iss must equal it.
    issuer-uri: ${PLATFORM_OIDC_ISSUER_URI:}
  tokens:
    issuer: ${PLATFORM_TOKEN_ISSUER:http://localhost:8082}
    # ES256 private key in PEM form. Required unless allow-ephemeral-key is true.
    signing-key: ${PLATFORM_TOKEN_SIGNING_KEY:}
    previous-signing-key: ${PLATFORM_TOKEN_PREVIOUS_SIGNING_KEY:}
    # Local development only: a blank signing key then generates a per-process key, which breaks with several instances.
    allow-ephemeral-key: ${PLATFORM_TOKEN_ALLOW_EPHEMERAL_KEY:false}
  security:
    token-rate-limit:
      # A token bucket per client id and per caller address, in PostgreSQL, shared by every instance. A request that
      # does not authenticate pays its claimed client id before the secret is compared, and then the caller's address
      # and the one anonymous bucket, so an invented client id cannot buy a budget of its own.
      burst: ${PLATFORM_TOKEN_RATE_LIMIT_BURST:100}
      per-second: ${PLATFORM_TOKEN_RATE_LIMIT_PER_SECOND:20}
      # The one anonymous bucket is the whole endpoint's backstop, so its allowance is deliberately wider than one
      # client's: one source exhausting it must not lock out every other caller that has not authenticated either.
      anonymous-burst: ${PLATFORM_TOKEN_RATE_LIMIT_ANONYMOUS_BURST:1000}
      cleanup-batch: ${PLATFORM_TOKEN_RATE_LIMIT_CLEANUP_BATCH:500}
      cleanup-delay: ${PLATFORM_TOKEN_RATE_LIMIT_CLEANUP_DELAY:PT5M}
  # Service clients of the suite: the secret is stored as its hex SHA-256, never in clear.
  service-clients:
    - id: ${PLATFORM_SERVICE_CLIENT_ID:billing}
      secret-hash: ${PLATFORM_SERVICE_CLIENT_SECRET_HASH:}
      scopes: [platform:replica:read]
    # The second replica consumer. A list entry is the whole Platform-side change: its own id, its own SHA-256 hash and
    # the same narrow scope, so Billing's credential is never shared and no Java code moves.
    - id: ${PLATFORM_NOTIFICATION_SERVICE_CLIENT_ID:notification}
      secret-hash: ${PLATFORM_NOTIFICATION_SERVICE_CLIENT_SECRET_HASH:}
      scopes: [platform:replica:read]
    # The two later replica consumers, each with its own secret and the same narrow scope. These are the whole
    # Platform-side change survey or mailroom needs: one list entry and a secret hash, no Java code moves.
    - id: ${PLATFORM_MAILROOM_SERVICE_CLIENT_ID:mailroom}
      secret-hash: ${PLATFORM_MAILROOM_SERVICE_CLIENT_SECRET_HASH:}
      scopes: [platform:replica:read]
    - id: ${PLATFORM_SURVEY_SERVICE_CLIENT_ID:survey}
      secret-hash: ${PLATFORM_SURVEY_SERVICE_CLIENT_SECRET_HASH:}
      scopes: [platform:replica:read]
    # The two apps that keep a Tenant's customers and its points program. Each consumes Platform's state-transfer
    # events on its own queue and nothing else, so its own secret and the same narrow scope are the whole change;
    # their permission catalogs under contracts/permissions are packaged at build time and name the apps.
    - id: ${PLATFORM_CRM_SERVICE_CLIENT_ID:crm}
      secret-hash: ${PLATFORM_CRM_SERVICE_CLIENT_SECRET_HASH:}
      scopes: [platform:replica:read]
    - id: ${PLATFORM_LOYALTY_SERVICE_CLIENT_ID:loyalty}
      secret-hash: ${PLATFORM_LOYALTY_SERVICE_CLIENT_SECRET_HASH:}
      scopes: [platform:replica:read]
    # Booking is the same seam a third time: one list entry and a secret hash, no Java code moves. Its permission
    # catalog under contracts/permissions is packaged at build time and names the app.
    - id: ${PLATFORM_BOOKING_SERVICE_CLIENT_ID:booking}
      secret-hash: ${PLATFORM_BOOKING_SERVICE_CLIENT_SECRET_HASH:}
      scopes: [platform:replica:read]
  outbox:
    poll-delay: PT1S

suite:
  messaging:
    # One topic exchange per producer. Platform exports the state-transfer events consumers replicate.
    exchange: ${PLATFORM_EVENTS_EXCHANGE:platform.events}
    relay:
      batch-size: ${PLATFORM_OUTBOX_BROKER_BATCH_SIZE:50}
      max-attempts: ${PLATFORM_OUTBOX_BROKER_MAX_ATTEMPTS:10}
      backoff-base: PT10S
      backoff-cap: PT1H

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
