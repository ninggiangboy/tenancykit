  /api/v1/users:
    get:
      tags:
      - user-controller
      description: "**Filtering, sorting and paging** follow the list-query contract.\
        \ Conditions in `filter[field][op]` are combined with AND. For OR, use `filter[or][i][field][op]`:\
        \ predicates sharing the index `i` are AND-ed and the branches are OR-ed (at\
        \ most 10 branches, 20 predicates in all, 100 values in an `in` list). `neq`\
        \ and `nin` do not match rows where the field is null. Send `limit` with either\
        \ `offset` (at most 10000) or the `cursor` taken from a previous page, never\
        \ both. The body is `{\"data\": [...], \"page\": null}`; `page_info=true`\
        \ fills `page` with `limit`, `offset`, `total` and `next_cursor`, and `page_info=cursor`\
        \ fills it with `limit` and `next_cursor` alone, without counting the matching\
        \ rows."
      operationId: list
      parameters:
      - name: "filter[created_at][eq]"
        in: query
        description: '`created_at` eq the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][gt]"
        in: query
        description: '`created_at` gt the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][gte]"
        in: query
        description: '`created_at` gte the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `created_at`.
        required: false
        schema:
          type: string
      - name: "filter[created_at][lt]"
        in: query
        description: '`created_at` lt the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][lte]"
        in: query
        description: '`created_at` lte the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][neq]"
        in: query
        description: '`created_at` neq the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `created_at`.
        required: false
        schema:
          type: string
      - name: "filter[display_name][eq]"
        in: query
        description: '`display_name` eq the value.'
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[display_name][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `display_name`.
        required: false
        schema:
          type: string
      - name: "filter[display_name][neq]"
        in: query
        description: '`display_name` neq the value.'
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[display_name][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `display_name`.
        required: false
        schema:
          type: string
      - name: "filter[display_name][starts_with]"
        in: query
        description: Case-insensitive prefix match on `display_name`.
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[email][contains]"
        in: query
        description: Case-insensitive substring match on `email`.
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[email][eq]"
        in: query
        description: '`email` eq the value.'
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[email][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `email`.
        required: false
        schema:
          type: string
      - name: "filter[email][neq]"
        in: query
        description: '`email` neq the value.'
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[email][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `email`.
        required: false
        schema:
          type: string
      - name: "filter[email][starts_with]"
        in: query
        description: Case-insensitive prefix match on `email`.
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[id][eq]"
        in: query
        description: '`id` eq the value.'
        required: false
        schema:
          type: string
          format: uuid
      - name: "filter[id][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `id`.
        required: false
        schema:
          type: string
      - name: "filter[id][neq]"
        in: query
        description: '`id` neq the value.'
        required: false
        schema:
          type: string
          format: uuid
      - name: "filter[id][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `id`.
        required: false
        schema:
          type: string
      - name: "filter[scope][eq]"
        in: query
        description: '`scope` eq the value.'
        required: false
        schema:
          type: string
          enum:
          - PLATFORM
          - TENANT
      - name: "filter[scope][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `scope`.
        required: false
        schema:
          type: string
      - name: "filter[scope][neq]"
        in: query
        description: '`scope` neq the value.'
        required: false
        schema:
          type: string
          enum:
          - PLATFORM
          - TENANT
      - name: "filter[scope][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `scope`.
        required: false
        schema:
          type: string
      - name: "filter[status][eq]"
        in: query
        description: '`status` eq the value.'
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - DISABLED
      - name: "filter[status][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `status`.
        required: false
        schema:
          type: string
      - name: "filter[status][neq]"
        in: query
        description: '`status` neq the value.'
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - DISABLED
      - name: "filter[status][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `status`.
        required: false
        schema:
          type: string
      - name: "filter[tenant_id][eq]"
        in: query
        description: '`tenant_id` eq the value.'
        required: false
        schema:
          type: string
          format: uuid
      - name: "filter[tenant_id][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `tenant_id`.
        required: false
        schema:
          type: string
      - name: "filter[tenant_id][neq]"
        in: query
        description: '`tenant_id` neq the value.'
        required: false
        schema:
          type: string
          format: uuid
      - name: "filter[tenant_id][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `tenant_id`.
        required: false
        schema:
          type: string
      - name: "filter[version][eq]"
        in: query
        description: '`version` eq the value.'
        required: false
        schema:
          type: integer
          format: int64
      - name: "filter[version][gt]"
        in: query
        description: '`version` gt the value.'
        required: false
        schema:
          type: integer
          format: int64
      - name: "filter[version][gte]"
        in: query
        description: '`version` gte the value.'
        required: false
        schema:
          type: integer
          format: int64
      - name: "filter[version][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `version`.
        required: false
        schema:
          type: string
      - name: "filter[version][lt]"
        in: query
        description: '`version` lt the value.'
        required: false
        schema:
          type: integer
          format: int64
      - name: "filter[version][lte]"
        in: query
        description: '`version` lte the value.'
        required: false
        schema:
          type: integer
          format: int64
      - name: "filter[version][neq]"
        in: query
        description: '`version` neq the value.'
        required: false
        schema:
          type: integer
          format: int64
      - name: "filter[version][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `version`.
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: "Comma-separated sortable fields, each optionally prefixed with\
          \ `-` for descending: created_at, email, id. At most 4 fields; `id` is appended\
          \ to make the order total. Default: `email,id`."
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: "Page size, 1 to 200."
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      - name: offset
        in: query
        description: "Rows to skip, at most 10000. Not combinable with `cursor`."
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 10000
          minimum: 0
      - name: cursor
        in: query
        description: The `next_cursor` of the previous page. Valid only with the same
          filter and sort.
        required: false
        schema:
          type: string
      - name: page_info
        in: query
        description: "`true` fills `page` with the limit, offset, total and next cursor;\
          \ `cursor` fills it with the limit and the next cursor alone, so a walk\
          \ over a large listing is not counted."
        required: false
        schema:
          type: string
          default: "false"
          enum:
          - "true"
          - "false"
          - cursor
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageUserResponse"
        "400":
          description: "A filter, sort, cursor or paging parameter is unknown, not\
            \ allowed for the field, or not valid for its type."
      x-required-permission: platform:user:read
    post:
      tags:
      - user-controller
      operationId: create
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
      x-required-permission: platform:user:manage
