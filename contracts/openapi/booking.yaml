openapi: 3.1.0
info:
  title: Booking API
  description: "The API a Tenant System uses to describe what may be booked and when it is open, search availability, hold, confirm, extend, reschedule and cancel bookings, run repeating series, keep a waitlist, issue customer tokens, manage the signed webhooks booking sends, and read the tenant's settings. The public gate under `/p/**` is the surface a Tenant's customer's browser calls with a short-lived customer token; it can browse, hold, release its own hold and join the waitlist, and it can never confirm. Booking never touches money: the Tenant holds, charges through Billing, then confirms. The tenant is taken from the request's host and suite token, never from a body; no request body carries a tenant. This document is a skeleton written in phase 1 and filled by each phase; the committed generated document replaces it once controllers exist."
  version: v1
servers:
- url: /booking
  description: "Any tenant hostname: <tenant-code>.<base-domain>/booking"
tags:
- name: "Resources"
  description: "The people, rooms and equipment that can be booked."
- name: "Resource groups"
  description: "Groups of resources with a strategy for choosing among their members."
- name: "Calendar"
  description: "Weekly working hours, dated exceptions and blocks, and a preview of a recurrence."
- name: "Offerings"
  description: "What a tenant sells: its duration, requirements and cancellation windows."
- name: "Availability"
  description: "Free start instants for an interval offering."
- name: "Queue"
  description: "The waiting-room counts of an offering."
- name: "Sessions"
  description: "Capacity sessions and the repeating series that create them."
- name: "Bookings"
  description: "Hold, confirm, extend, move, cancel and read bookings."
- name: "Booking series"
  description: "Book a repeating series and confirm or cancel its occurrences."
- name: "Waitlist"
  description: "Join, read and leave the waitlist for an offering."
- name: "Settings"
  description: "The tenant's booking settings and the public gate."
- name: "Customer tokens"
  description: "Mint the short-lived token a customer uses at the public gate."
- name: "Public gate"
  description: "Endpoints a customer's browser calls under /p with a customer token: read an offering, hold, queue and waitlist."
- name: "Webhooks"
  description: "Register webhook endpoints, rotate their secrets and read or resend deliveries."
paths:
  /api/v1/resources:
    get:
      tags: ["Resources"]
      summary: "List resources"
      description: "One tenant's resources, with the shared list query contract (`docs/list-query-contract.md`): filters on `status`, `zone` and `code`, sorts on `code`, `name` and `created_at`."
      operationId: listResources
      parameters:
      - $ref: "#/components/parameters/Filter"
      - $ref: "#/components/parameters/Sort"
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Offset"
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/PageInfo"
      responses:
        "200":
          description: "The page of resources."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcePage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-required-permission: booking:resource:read
    post:
      tags: ["Resources"]
      summary: "Create a resource"
      description: "Codes are chosen by the Tenant, unique per tenant and immutable. `zone` must be an IANA id known to the JDK's tz database."
      operationId: createResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceCreate"
      responses:
        "201":
          description: "The resource was created."
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "A resource with this code already exists in the tenant. Code `DUPLICATE_CODE`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
      x-required-permission: booking:resource:manage
  /api/v1/resources/{resourceId}:
    parameters:
    - $ref: "#/components/parameters/ResourceId"
    get:
      tags: ["Resources"]
      summary: "Read one resource"
      operationId: getResource
      responses:
        "200":
          description: "The resource."
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-required-permission: booking:resource:read
    patch:
      tags: ["Resources"]
      summary: "Change a resource"
      description: "Requires `If-Match`. `zone` is immutable once a booking references the resource."
      operationId: patchResource
      parameters:
      - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourcePatch"
      responses:
        "200":
          description: "The resource after the change."
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "The zone cannot change once a booking references the resource. Code `RESOURCE_IN_USE`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
      x-required-permission: booking:resource:manage
    delete:
      tags: ["Resources"]
      summary: "Archive a resource"
      description: "A referenced resource is archived, never deleted; an unreferenced one is deleted."
      operationId: archiveResource
      parameters:
      - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: "Archived or deleted." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
      x-required-permission: booking:resource:manage
  /api/v1/resources/{resourceId}/working-hours:
    parameters:
    - $ref: "#/components/parameters/ResourceId"
    put:
      tags: ["Calendar"]
      summary: "Replace a resource's weekly hours"
      description: "Local wall-clock times in the resource's zone; several rows per weekday are allowed but must not overlap; `closes` may be `24:00`."
      operationId: replaceWorkingHours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkingHoursReplace"
      responses:
        "200":
          description: "The stored hours."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkingHours"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
      x-required-permission: booking:resource:manage
    get:
      tags: ["Calendar"]
      summary: "Read a resource's weekly hours"
      operationId: getWorkingHours
      responses:
        "200":
          description: "The stored hours."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkingHours"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-required-permission: booking:resource:read
  /api/v1/resources/{resourceId}/exceptions:
    parameters:
    - $ref: "#/components/parameters/ResourceId"
    get:
      tags: ["Calendar"]
      summary: "List a resource's dated exceptions"
      operationId: listExceptions
      responses:
        "200":
          description: "The exceptions."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExceptionPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-required-permission: booking:resource:read
    post:
      tags: ["Calendar"]
      summary: "Add a dated exception"
      description: "`CLOSED` closes the day; `OPEN` replaces that day's hours with the given hours."
      operationId: addException
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarExceptionCreate"
      responses:
        "201":
          description: "The exception."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarException"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
      x-required-permission: booking:resource:manage
  /api/v1/resources/{resourceId}/exceptions/{exceptionId}:
    parameters:
    - $ref: "#/components/parameters/ResourceId"
    - name: exceptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    delete:
      tags: ["Calendar"]
      summary: "Remove an exception"
      operationId: deleteException
      responses:
        "204": { description: "Removed." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-required-permission: booking:resource:manage
  /api/v1/resource-groups:
    get:
      tags: ["Resource groups"]
      summary: "List resource groups"
      operationId: listGroups
      responses:
        "200":
          description: "The groups."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-required-permission: booking:resource:read
    post:
      tags: ["Resource groups"]
      summary: "Create a resource group"
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreate"
      responses:
        "201":
          description: "The group."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceGroup"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "A group with this code already exists. Code `DUPLICATE_CODE`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
      x-required-permission: booking:resource:manage
  /api/v1/resource-groups/{groupId}:
    parameters:
    - name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    get:
      tags: ["Resource groups"]
      summary: "Read one group with its members"
      operationId: getGroup
      responses:
        "200":
          description: "The group."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceGroup"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-required-permission: booking:resource:read
    patch:
      tags: ["Resource groups"]
      summary: "Change a group's strategy or members"
      operationId: patchGroup
      parameters:
      - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupPatch"
      responses:
        "200":
          description: "The group after the change."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceGroup"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
      x-required-permission: booking:resource:manage
  /api/v1/offerings:
    get:
      tags: ["Offerings"]
      summary: "List offerings"
      operationId: listOfferings
      parameters:
      - $ref: "#/components/parameters/Filter"
      - $ref: "#/components/parameters/Sort"
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Offset"
      - $ref: "#/components/parameters/Cursor"
      - $ref: "#/components/parameters/PageInfo"
      responses:
        "200":
          description: "The page of offerings."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferingPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-required-permission: booking:offering:read
    post:
      tags: ["Offerings"]
      summary: "Create an offering"
      description: "`INTERVAL` needs at least one requirement; `CAPACITY` needs none, because its pools come with sessions."
      operationId: createOffering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferingCreate"
      responses:
        "201":
          description: "The offering."
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offering"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "A code collision. Code `DUPLICATE_CODE`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
      x-required-permission: booking:offering:manage
  /api/v1/offerings/{offeringId}:
    parameters:
    - $ref: "#/components/parameters/OfferingId"
    get:
      tags: ["Offerings"]
      summary: "Read one offering"
      operationId: getOffering
      responses:
        "200":
          description: "The offering."
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offering"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-required-permission: booking:offering:read
    patch:
      tags: ["Offerings"]
      summary: "Change an offering"
      operationId: patchOffering
      parameters:
      - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferingPatch"
      responses:
        "200":
          description: "The offering after the change."
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offering"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
      x-required-permission: booking:offering:manage
    delete:
      tags: ["Offerings"]
      summary: "Archive an offering"
      operationId: archiveOffering
      parameters:
      - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: "Archived." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
      x-required-permission: booking:offering:manage
  /api/v1/offerings/{offeringId}/requirements:
    parameters:
    - $ref: "#/components/parameters/OfferingId"
    put:
      tags: ["Offerings"]
      summary: "Replace an interval offering's requirements"
      description: "Each requirement names one resource or one group; one booking claims one resource per requirement, all distinct."
      operationId: replaceRequirements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementsReplace"
      responses:
        "200":
          description: "The stored requirements."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirements"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "A requirement names one resource twice, names an archived resource, or a `CAPACITY` offering carries requirements. Code `VALIDATION_FAILED` or `INVALID_REQUIREMENTS`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: booking:offering:manage
  /api/v1/offerings/{offeringId}/cancellation-windows:
    parameters:
    - $ref: "#/components/parameters/OfferingId"
    put:
      tags: ["Offerings"]
      summary: "Replace an offering's cancellation windows"
      description: "A Tenant-chosen `code` per threshold; booking records no amount and charges nothing."
      operationId: replaceCancellationWindows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancellationWindowsReplace"
      responses:
        "200":
          description: "The stored windows."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationWindows"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
      x-required-permission: booking:offering:manage
  /api/v1/offerings/{offeringId}/availability:
    parameters:
    - $ref: "#/components/parameters/OfferingId"
    get:
      tags: ["Availability"]
      summary: "Free start instants for an interval offering"
      description: "Computed at query time from weekly hours, exceptions, blocks and claims in the resource's zone; never materialized. Keyset-paged by start instant. A start is free only if every requirement has a free, distinct resource."
      operationId: getAvailability
      parameters:
      - name: from
        in: query
        required: true
        schema: { type: string, format: date-time }
      - name: to
        in: query
        required: true
        schema: { type: string, format: date-time }
      - name: durationMinutes
        in: query
        required: false
        schema: { type: integer, minimum: 1 }
      - name: resource
        in: query
        required: false
        schema: { type: string, format: uuid }
      - name: partySize
        in: query
        required: false
        description: "Used by a `FIT_SEATS` group."
        schema: { type: integer, minimum: 1 }
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: "The free starts."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "The duration is outside `[durationMin, durationMax]` or not on `durationStep`. Code `INVALID_DURATION`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: booking:offering:read
  /api/v1/offerings/{offeringId}/queue:
    parameters:
    - $ref: "#/components/parameters/OfferingId"
    get:
      tags: ["Queue"]
      summary: "Read an offering's queue counts"
      operationId: getQueueCounts
      responses:
        "200":
          description: "Waiting, admitted, used and expired ticket counts."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueCounts"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-required-permission: booking:offering:read
  /api/v1/blocks:
    get:
      tags: ["Calendar"]
      summary: "List blocks"
      operationId: listBlocks
      responses:
        "200":
          description: "The blocks."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-required-permission: booking:calendar:read
    post:
      tags: ["Calendar"]
      summary: "Create a block"
      description: "A closed period on a resource. Blocks never delete existing bookings; the response reports the bookings they overlap."
      operationId: createBlock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockCreate"
      responses:
        "201":
          description: "The block and the bookings it overlaps."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockCreated"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
      x-required-permission: booking:calendar:manage
  /api/v1/blocks/{blockId}:
    parameters:
    - name: blockId
      in: path
      required: true
      schema: { type: string, format: uuid }
    delete:
      tags: ["Calendar"]
      summary: "Remove a block"
      operationId: deleteBlock
      responses:
        "204": { description: "Removed." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-required-permission: booking:calendar:manage
  /api/v1/recurrence/preview:
    post:
      tags: ["Calendar"]
      summary: "Expand a recurrence without storing it"
      description: "The same port the materialization job uses, so a Tenant can check a rule before creating a series. Every vector under `contracts/booking/recurrence-vectors/` passes through this endpoint."
      operationId: previewRecurrence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurrencePreviewRequest"
      responses:
        "200":
          description: "The expanded start instants in UTC."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurrencePreview"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "The rule is unparsable, unbounded, finer than daily for a session, or expands beyond the per-call cap. Code `invalid-recurrence` with the offending part."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: booking:calendar:read
  /api/v1/session-series:
    get:
      tags: ["Sessions"]
      summary: "List session series"
      operationId: listSeries
      responses:
        "200":
          description: "The series."
          content:
            application/json:
              schema:
