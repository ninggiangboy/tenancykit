<!doctype html>
<html>
<head><meta charset="utf-8"><title>CommandPalette preview</title><style>html, body, #root { height: 100%; }</style></head>
<body>
<div id="root" class=""></div>
<script>
  var S = window.Suite, h = React.createElement;
  var groups = [
    { label: 'Records', items: [{ label: 'INV-2026-00412', hint: 'Invoice \u00b7 Lumen Coffee \u00b7 12,500.00 USD', icon: 'receipt' }, { label: 'Lumen Coffee', hint: 'Customer \u00b7 cus_0193a7f2', icon: 'users' }] },
    { label: 'Go to', items: [{ label: 'Billing \u203a Invoices', app: 'billing', shortcut: ['g', 'i'] }, { label: 'Mailroom \u203a Campaigns', app: 'mailroom' }, { label: 'Workflow \u203a Instances', app: 'workflow' }] },
    { label: 'Actions', items: [{ label: 'Invoice a charge', icon: 'plus' }, { label: 'Switch tenant', icon: 'chevrons-up-down', shortcut: ['mod', 'shift', 'o'] }, { label: 'Toggle dark mode', icon: 'settings' }] }
  ];
  function Demo() {
    var open = React.useState(true);
    S.useHotkey('mod+k', function () { open[1](true); });
    return h('div', { className: 'sc-stage' },
      h('div', { className: 'sc-demo' }, h(S.Button, { variant: 'outline', icon: 'search', shortcut: ['mod', 'k'], onClick: function () { open[1](true); } }, 'Search')),
      h(S.CommandPalette, { contained: true, open: open[0], onClose: function () { open[1](false); }, groups: groups, scope: 'acme' }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
