# The descriptions every service of the suite shares. A service's own file adds to these and wins on a clash.

schema PageInfo = The paging facts of a list answer, present when the request asked for them with `page_info`.
schema PageInfo.limit = The page size that was applied.
schema PageInfo.offset = The number of rows that were skipped, or null when a cursor positioned the page.
schema PageInfo.total = The number of rows that match the filter, or null when the request asked only for the cursor.
schema PageInfo.next_cursor = The cursor of the following page, or null on the last page. Pass it as `cursor` with the same filter and sort.

param If-Match = The `ETag` of the version the caller last read. The change is refused with `412` when the resource has moved on since.
param Idempotency-Key = A key the caller chooses so a retry is safe: the same key with the same body answers the first result instead of acting twice, and the same key with a different body is a conflict.
param X-Request-Id = An id the caller chooses for this call. It is recorded with the call and its audit entry, so the call can be found again.
param Authorization = The credential of the caller.

# The errors every service answers, as RFC 9457 `application/problem+json` bodies (see ErrorResponsesOpenApiCustomizer).
schema ProblemDetail = The body of every error: an RFC 9457 problem.
schema ProblemDetail.type = A URI reference that identifies the kind of problem. It is `about:blank` when the status says it all.
schema ProblemDetail.title = A short, human-readable summary of the kind of problem. It is the status's reason phrase unless a more specific one applies.
schema ProblemDetail.status = The HTTP status of the response.
schema ProblemDetail.detail = A sentence that explains this occurrence.
schema ProblemDetail.instance = A URI reference that identifies this occurrence, when there is one.

response 400 = The request is malformed: a body, query parameter or header is missing, unknown, or not valid for its type.
response 401 = The request carries no valid token.
response 403 = The token does not carry the permission this operation requires, or the tenant has not enabled the app.
response 403 entitlement = The tenant has not enabled this app, or the caller may not act here.
response 404 = Nothing with that id exists for this tenant. A resource of another tenant answers the same.
response 409 idempotency = The `Idempotency-Key` was already used with a different body, or the request clashes with the current state of the data.
response 412 = The `If-Match` tag does not match the resource's current version. The response carries the current `ETag`; read the resource again and retry.
