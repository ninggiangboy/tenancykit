    post:
      tags:
      - "Coupon redemptions"
      summary: "Redeem a promotion code"
      description: "Redeems the promotion `code` onto a wallet. Send an `Idempotency-Key`;\
        \ a repeat of the same key and body answers the first result with `200`. Every\
        \ refusal answers `404`, so a caller cannot learn whether a code exists, is\
        \ inactive, expired or exhausted. Answers `201` for a new redemption."
      operationId: "redeemByCode"
      parameters:
      - name: "walletId"
        in: "path"
        description: "The id of the wallet."
        required: true
        schema:
          type: "string"
      - name: "Idempotency-Key"
        in: "header"
        description: "A key the caller chooses so a retry is safe: the same key with\
          \ the same body answers the first result instead of acting twice, and the\
          \ same key with a different body is a conflict."
        required: true
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The coupon to redeem. Give a `code`, or a `couponId` to attach\
          \ it directly."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemRequest"
        required: true
      responses:
        "200":
          description: "An earlier identical request already created it; that resource\
            \ is returned"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RedemptionResponse"
        "201":
          description: "A coupon redeemed onto a wallet."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RedemptionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "The wallet does not exist, or the code is unknown, inactive,\
            \ expired or exhausted. Every refusal answers the same, so a caller cannot\
            \ learn which."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
      x-required-permission: "billing:coupon:redeem"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
      security:
      - apiKey: []
