  /system/v1/links/{id}/stats:
    get:
      tags:
      - "Link statistics"
      summary: "Get a link's statistics"
      description: "Returns the link's click total, its clicks per day for the last\
        \ thirty days, the bot clicks the default leaves out, and its status and click\
        \ cap. The numbers come from rollups, so `dataThrough` says how fresh they\
        \ are.\n\nCallers: tenant-system. Requires `attribution:link:read`."
      operationId: "statsAsTenantSystem"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the link."
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "A link's click statistics."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LinkStatsView"
        "400":
