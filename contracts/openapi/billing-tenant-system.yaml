      - name: "filter[url][neq]"
        in: "query"
        description: "`url` neq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[url][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `url`."
        required: false
        schema:
          type: "string"
      - name: "filter[url][starts_with]"
