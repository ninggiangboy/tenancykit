        required: false
        schema:
          type: string
      - name: "filter[name][starts_with]"
        in: query
        description: Case-insensitive prefix match on `name`.
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[status][eq]"
        in: query
        description: '`status` eq the value.'
        required: false
        schema:
          type: string
          enum:
          - CLOSED
          - DRAFT
          - OPEN
      - name: "filter[status][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `status`.
        required: false
        schema:
          type: string
      - name: "filter[status][neq]"
        in: query
        description: '`status` neq the value.'
        required: false
        schema:
          type: string
          enum:
          - CLOSED
