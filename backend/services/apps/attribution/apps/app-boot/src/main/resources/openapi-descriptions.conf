# Descriptions of the request and response fields, parameters and bodies of Attribution's API.
# Read by DescriptionsOpenApiCustomizer; see dev.ngb.core.openapi for the format.

# ---- parameters
param slug = The slug of the tracked link, the last part of its public URL.
param e = The entry point that sent the visitor, recorded with the click.
param campaignId = The id of the campaign.
param day = The day, as `YYYY-MM-DD`.
param from = The start of the range, inclusive.
param to = The end of the range, exclusive.
param /api/v1/campaigns/{campaignId}/spend from = The first day to return, as `YYYY-MM-DD`.
param /api/v1/campaigns/{campaignId}/spend to = The last day to return, as `YYYY-MM-DD`.
param granularity = The size of each point of a time series: `hour` or `day`.
param metrics = A comma-separated list of metrics: `clicks`, `page_views`, `sessions`, `visitor_days`, `conversions` or `credited_value`.
param include = A comma-separated list of the traffic classes to add to the default: `bot` or `suspect`.
param link_id = Only traffic of this link.
param campaign_id = Only traffic of this campaign.
param destination_id = Only traffic that went to this destination.
param goal_id = Only conversions of this goal.
param entry = Only traffic that came in through this entry point.
param device = Only traffic from this device class.
param country = Only traffic from this country.
param referrer = Only traffic from this referrer.
param dimension = What to split the report by: `link`, `campaign`, `entry`, `device`, `country`, `referrer`, `destination` or `goal`.
param cohort = The cohort size. Only `week` is supported.
param periods = How many periods after the first click to report. Defaults to 12.
param group_by = What to group the costs by.
param format = The image format: `png` (the default) or `svg`.
param size = The width and height of the image in pixels. Defaults to 256.

# ---- shared fields
field id = The id.
field name = The display name.
field slug = The short, URL-safe name.
field version = The version of the record. It is also the `ETag`, which a conditional change sends as `If-Match`.
field status = The current status.
field campaignId = The id of the campaign.
field linkId = The id of the link.
field goalId = The id of the goal.
field currency = The ISO 4217 currency code of the amounts.
field clickId = The signed click token a redirect appended to the destination URL.
field visitorId = The pseudonymous id of the visitor, created by the page snippet.
field occurredAt = When it happened.
field createdAt = When the record was created.
field updatedAt = When the record was last changed.
field expiresAt = When the link stops redirecting, or null.
field url = The URL.
field utm = The UTM parameters appended to the destination, by name, such as `utm_source`.
field externalRef = The tenant's own reference for the recipient.
field source = Where the row came from.
field day = The day.
field amount = The amount, in major units of the currency.
field impressions = The number of impressions, when known.
field clicks = The number of clicks.
field password = The password that protects the link. It is stored as a hash and never returned.

# ---- collection, redirect, data subjects
schema EventBatch = A batch of page views from a tenant's page.
schema EventBatch.events = The page views.
schema EventBatch.consent = Whether the visitor consented to identifiers. With `false` the server drops the visitor and session ids.
schema RawEvent = One collected page view.
schema RawEvent.eventId = An id for the event, unique to this page view.
schema RawEvent.sessionId = The id of the visitor's session.
schema RawEvent.path = The path of the page that was viewed.
schema RawEvent.occurredAt = When the page was viewed, as an ISO-8601 instant.
schema UnlockRequest = The password of a protected link.
schema UnlockRequest.password = The password the link's owner chose.
schema ErasureRequest = The visitor to erase.
schema ErasureRequest.visitor_id = The id of the visitor whose collected data is removed.
schema ErasureView = How many rows of each kind were removed.
schema ErasureView.page_events = The number of page events removed.
schema ErasureView.sessions = The number of sessions removed.
schema ErasureView.bindings = The number of visitor-to-click bindings removed.
schema ErasureView.clicks = The number of clicks removed that only this visitor was bound to.
schema ErasureView.conversions = The number of conversions detached from the visitor.

# ---- settings
schema SettingsRequest = The settings to store.
schema SettingsRequest.click_param = The name of the query parameter that carries the click id.
schema SettingsRequest.allowed_origins = The origins allowed to post to the collection endpoint. Each is an absolute `https` origin, or `http://localhost`; wildcards are refused.
schema SettingsRequest.default_window_days = The attribution window applied when a campaign does not set its own, in days.
schema SettingsView = The tenant's attribution settings.
schema SettingsView.clickParam = The name of the query parameter that carries the click id.
schema SettingsView.allowedOrigins = The origins allowed to post to the collection endpoint.
schema SettingsView.defaultWindowDays = The default attribution window in days.

# ---- campaigns and links
schema CampaignRequest = The campaign to create, or its new properties.
schema CampaignRequest.channel = The marketing channel the campaign runs on.
schema CampaignRequest.attributionModel = How a conversion's credit is shared among the touches of its chain: `FIRST`, `LAST` or `LINEAR`.
schema CampaignRequest.windowDays = How many days before a conversion a click can still earn credit.
schema CampaignRequest.currency = The currency of the campaign's spend and conversions. It is fixed once spend or a conversion exists.
schema CampaignRequest.startsOn = The first day of the campaign, or null.
schema CampaignRequest.endsOn = The last day of the campaign, or null.
schema CampaignResponse = A campaign.
schema CampaignResponse.channel = The marketing channel.
schema CampaignResponse.status = `ACTIVE` or `ARCHIVED`.
schema CampaignResponse.attributionModel = `FIRST`, `LAST` or `LINEAR`.
schema CampaignResponse.windowDays = How many days before a conversion a click can still earn credit.
schema CampaignResponse.startsOn = The first day of the campaign, or null.
schema CampaignResponse.endsOn = The last day of the campaign, or null.
schema DestinationRequest = One place a link can send a visitor.
schema DestinationRequest.url = The destination URL. One that points at the suite or a private address is refused.
schema DestinationRequest.weight = How often the destination is chosen among the ones that match, from 1 to 1000.
schema DestinationRequest.devices = The device classes the destination is for. Empty means any.
schema DestinationRequest.countries = The countries the destination is for. Empty means any.
schema DestinationRequest.fallback = Whether this is the one destination used when no rule matches.
schema DestinationView = One destination of a link.
schema DestinationView.position = The order the destination was given in.
schema DestinationView.weight = How often the destination is chosen among the ones that match.
schema DestinationView.fallback = Whether this is the destination used when no rule matches.
schema DestinationView.devices = The device classes the destination is for. Empty means any.
schema DestinationView.countries = The countries the destination is for. Empty means any.
schema LinkRequest = The link to create, or its new properties.
schema LinkRequest.campaignId = The campaign the link belongs to.
schema LinkRequest.slug = The slug of the public URL.
schema LinkRequest.maxClicks = The most clicks the link redirects, or null for no cap.
schema LinkRequest.password = A password visitors must give before they are redirected. On update, a blank value keeps the stored one.
schema LinkRequest.destinations = Where the link sends visitors, with the rules that choose among them.
schema LinkResponse = A tracked link.
schema LinkResponse.kind = `STANDARD` or `PERSONAL`.
schema LinkResponse.status = `ACTIVE`, `PAUSED` or `ARCHIVED`. Only an active link redirects.
schema LinkResponse.url = The public URL to share.
schema LinkResponse.maxClicks = The most clicks the link redirects, or null for no cap.
schema LinkResponse.hasPassword = Whether the link is protected by a password. The password itself is never returned.
schema LinkResponse.destinations = Where the link sends visitors.
schema BulkRequest = The personal links to mint, one per row.
schema BulkRequest.campaignId = The campaign the links belong to.
schema BulkRequest.destination = The destination URL every link shares.
schema BulkRequest.utm = The UTM parameters every link shares.
schema BulkRequest.expiresAt = When the links stop redirecting, or null.
schema BulkRequest.rows = One row per link.
schema BulkLinkRow = One personal link to mint.
schema BulkLinkRow.externalRef = The tenant's own reference for the recipient.
schema PersonalLink = A personal link that was minted.
schema PersonalLink.id = The link's id.
schema PersonalLink.slug = The link's slug.
schema PersonalLink.url = The public URL to give to the recipient.
schema PersonalLink.externalRef = The tenant's own reference for the recipient.
schema LinkStatsView = A link's click statistics.
schema LinkStatsView.status = `ACTIVE`, `PAUSED` or `ARCHIVED`.
schema LinkStatsView.maxClicks = The link's click cap, or null.
schema LinkStatsView.clicks = The total clicks recorded.
schema LinkStatsView.last30Days = The clicks per day over the last thirty days.
schema LinkStatsView.botClicksExcluded = How many bot clicks the default left out.
schema LinkStatsView.dataThrough = The time the rollups are current to.
schema DailyCount = The clicks of one day.
schema DailyCount.clicks = The clicks on that day.

# ---- goals and conversions
schema GoalRequest = The goal to create, or its new properties.
schema GoalRequest.key = The conversion key the tenant's site and backend both report. It cannot change.
schema GoalRequest.defaultValue = The value a conversion has when it reports none, as a decimal string.
schema GoalResponse = A goal.
schema GoalResponse.key = The conversion key the tenant's site and backend both report.
schema GoalResponse.defaultValue = The value a conversion has when it reports none, as a decimal string, or null.
schema GoalResponse.status = `ACTIVE` or `ARCHIVED`.
schema ConversionRequest = The conversion to record.
schema ConversionRequest.goalKey = The key of the goal that was reached.
schema ConversionRequest.clickId = The click token of the visit that led to the conversion. Give this or `visitorId`.
schema ConversionRequest.visitorId = The visitor who converted. Give this or `clickId`.
schema ConversionRequest.value = The value of the conversion as a decimal string.
schema ConversionResponse = A conversion with its chain and credits.
schema ConversionResponse.value = The value of the conversion as a decimal string.
schema ConversionResponse.source = The source of the conversion.
schema ConversionResponse.creditStatus = `PENDING`, `COMPUTED` or `UNATTRIBUTED`.
schema ConversionResponse.owningCampaignId = The campaign that received the main credit, or null.
schema ConversionResponse.touchChain = The clicks that led to the conversion, in order.
schema ConversionResponse.credits = The credit each click received.
schema ChainTouchResponse = One click in a conversion's chain.
schema ChainTouchResponse.at = When the click happened.
schema CreditResponse = The credit one click received.
schema CreditResponse.clickId = The click that received credit.
schema CreditResponse.credit = The share of the conversion's value, as a decimal string.

# ---- spend
schema SpendRequest = The cost of one day.
schema SpendRequest.amount = The cost as a decimal string, in major units of the campaign's currency.
schema SpendRequest.currency = The currency, which must be the campaign's.
schema SpendRequest.impressions = The number of impressions, or null.
schema SpendRequest.clicks = The number of paid clicks, or null.
schema SpendRequest.day = The day.
schema SpendResponse = The cost of one day.
schema SpendView = One cost row of a campaign.
schema SpendView.source = Where the row came from: `MANUAL`, `GOOGLE_ADS` or `META_ADS`.
schema SpendView.connectionId = The ad connection an imported row came from, or null for a manual one.
schema SpendResponse.source = Where the row came from: `MANUAL`, `GOOGLE_ADS` or `META_ADS`.

# ---- errors specific to an operation
error GET /go/{slug} 401 = The link is protected by a password, which is given by `POST` to the same URL.
error GET /go/{slug} 404 = The link does not exist, is archived or paused, or the tenant is not entitled to the app. All of them answer the same.
error GET /go/{slug} 410 = The link has expired or reached its click cap.
error POST /go/{slug} 403 = The password is wrong.
error POST /go/{slug} 404 = The link does not exist, is archived or paused, or the tenant is not entitled to the app. All of them answer the same.
error POST /go/{slug} 410 = The link has expired or reached its click cap.
error HEAD /go/{slug} 404 = The link does not exist, is archived or paused, or the tenant is not entitled to the app. All of them answer the same.
error HEAD /go/{slug} 410 = The link has expired or reached its click cap.
error GET /api/v1/reports/timeseries 400 = A parameter is not valid, or a CSV export would exceed 100,000 rows. Narrow the range.
error GET /api/v1/reports/timeseries.csv 400 = A parameter is not valid, or the export would exceed 100,000 rows. Narrow the range.
error GET /api/v1/reports/breakdown 400 = A parameter is not valid, or a CSV export would exceed 100,000 rows. Narrow the range.
error GET /api/v1/reports/breakdown.csv 400 = A parameter is not valid, or the export would exceed 100,000 rows. Narrow the range.
error GET /api/v1/reports/funnel 400 = A parameter is not valid, or a CSV export would exceed 100,000 rows. Narrow the range.
error GET /api/v1/reports/funnel.csv 400 = A parameter is not valid, or the export would exceed 100,000 rows. Narrow the range.
error GET /api/v1/reports/cohorts 400 = A parameter is not valid (`cohort` can only be `week`), or a CSV export would exceed 100,000 rows. Narrow the range.
error GET /api/v1/reports/cohorts.csv 400 = A parameter is not valid (`cohort` can only be `week`), or the export would exceed 100,000 rows. Narrow the range.
error GET /api/v1/reports/costs 400 = A parameter is not valid, or a CSV export would exceed 100,000 rows. Narrow the range.
error GET /api/v1/reports/costs.csv 400 = A parameter is not valid, or the export would exceed 100,000 rows. Narrow the range.

# ---- success statuses a handler answers by what it did
status POST /api/v1/conversions 201 = The conversion was recorded.
status POST /api/v1/conversions 200 = The same `Idempotency-Key` and body were seen before, so the first conversion is returned.
status POST /t/v1/events 204 = Always, whether or not the batch was stored, so a probe learns nothing.
status GET /go/{slug} 302 = Redirects to the destination with the signed click id appended, and records one click.
status HEAD /go/{slug} 302 = Redirects like `GET` without recording a click.
status POST /go/{slug} 302 = The password is right: redirects to the destination and records the click.
