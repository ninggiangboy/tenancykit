# The HTTP edge. It consumes nothing and schedules nothing: a request reads or writes through a use case whose
# transaction is short, and the platform-events listener belongs to the worker alone.
spring:
  config:
    activate:
      on-profile: "api & !worker"
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: false
  datasource:
    hikari:
      maximum-pool-size: ${CUSTOMER_API_DB_POOL_SIZE:20}
      minimum-idle: ${CUSTOMER_API_DB_MIN_IDLE:5}
      connection-timeout: 3000
      connection-init-sql: "SET lock_timeout = '30s'; SET idle_in_transaction_session_timeout = '60s'"
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  shutdown: graceful
  tomcat:
    # The list-query contract writes filter[field][op]=value; clients send the brackets as they are.
    relaxed-query-chars: "[,]"
management:
  endpoint:
    health:
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,replicaState
customer:
  jobs:
    enabled: false
  housekeeping:
    enabled: false
