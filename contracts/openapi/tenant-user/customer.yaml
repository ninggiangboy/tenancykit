          type: "string"
      responses:
        "200":
          description: "A page of the customer's activities, newest first."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "400":
          description: "A filter is unknown or a value is not valid for its type (`INVALID_REQUEST`),\
