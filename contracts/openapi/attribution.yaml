openapi: 3.1.0
info:
  title: Attribution API
  description: "The API a Tenant System uses to run tracked marketing links, report\
    \ conversions, read measurement and keep advertising cost, plus the public redirect\
    \ and collection endpoints a visitor's browser calls without credentials."
  version: v1
servers:
- url: /attribution
  description: "Any tenant hostname: <tenant-code>.<base-domain>/attribution"
paths:
  /api/v1/settings:
    get:
      tags:
      - settings-controller
      operationId: get
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SettingsView"
      x-required-permission: attribution:settings:manage
    put:
      tags:
      - settings-controller
      operationId: put
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SettingsView"
      x-required-permission: attribution:settings:manage
  /t/v1/events:
    post:
      tags:
      - collect-controller
      operationId: collect
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventBatch"
      responses:
        "200":
          description: OK
      x-public: true
  /go/{slug}:
    get:
      tags:
      - redirect-controller
      operationId: redirect
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: e
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
      x-public: true
    post:
      tags:
      - redirect-controller
      operationId: unlock
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: e
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockRequest"
      responses:
        "200":
          description: OK
      x-public: true
    head:
      tags:
      - redirect-controller
      operationId: head
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - name: e
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
      x-public: true
  /api/v1/links:
    get:
      tags:
      - link-controller
      description: "**Filtering, sorting and paging** follow the list-query contract.\
        \ Conditions in `filter[field][op]` are combined with AND. For OR, use `filter[or][i][field][op]`:\
        \ predicates sharing the index `i` are AND-ed and the branches are OR-ed (at\
        \ most 10 branches, 20 predicates in all, 100 values in an `in` list). `neq`\
        \ and `nin` do not match rows where the field is null. Send `limit` with either\
        \ `offset` (at most 10000) or the `cursor` taken from a previous page, never\
        \ both. The body is `{\"data\": [...], \"page\": null}`; `page_info=true`\
        \ fills `page` with `limit`, `offset`, `total` and `next_cursor`."
      operationId: list
      parameters:
      - name: "filter[campaign_id][eq]"
        in: query
        description: '`campaign_id` eq the value.'
        required: false
        schema:
          type: string
          format: uuid
      - name: "filter[campaign_id][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `campaign_id`.
        required: false
        schema:
          type: string
      - name: "filter[campaign_id][is_null]"
        in: query
        description: "`true` for rows where `campaign_id` is null, `false` for rows\
          \ where it is set."
        required: false
        schema:
          type: boolean
      - name: "filter[campaign_id][neq]"
        in: query
        description: '`campaign_id` neq the value.'
        required: false
        schema:
          type: string
          format: uuid
      - name: "filter[campaign_id][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `campaign_id`.
        required: false
        schema:
          type: string
      - name: "filter[created_at][eq]"
        in: query
        description: '`created_at` eq the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][gt]"
        in: query
        description: '`created_at` gt the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][gte]"
        in: query
        description: '`created_at` gte the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `created_at`.
        required: false
        schema:
          type: string
      - name: "filter[created_at][lt]"
        in: query
        description: '`created_at` lt the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][lte]"
        in: query
        description: '`created_at` lte the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][neq]"
        in: query
        description: '`created_at` neq the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[created_at][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `created_at`.
        required: false
        schema:
          type: string
      - name: "filter[expires_at][eq]"
        in: query
        description: '`expires_at` eq the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[expires_at][gt]"
        in: query
        description: '`expires_at` gt the value.'
        required: false
        schema:
          type: string
          format: date-time
      - name: "filter[expires_at][gte]"
