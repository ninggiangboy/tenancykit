services:
  postgres:
    image: postgres:18
    # Twelve apps each hold a pool for their api, worker and migrate runtimes; the default of 100 connections is
    # exhausted once the whole suite runs, and a service then fails to start with "remaining connection slots".
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set it in .env}
      # The init script creates one owner role and one app role per service, so it reads their passwords here.
      PLATFORM_MIGRATION_DB_PASSWORD: ${PLATFORM_MIGRATION_DB_PASSWORD:?set it in .env}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?set it in .env}
      BILLING_MIGRATION_DB_PASSWORD: ${BILLING_MIGRATION_DB_PASSWORD:?set it in .env}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?set it in .env}
      TENANT_MIGRATION_DB_PASSWORD: ${TENANT_MIGRATION_DB_PASSWORD:?set it in .env}
      TENANT_DB_PASSWORD: ${TENANT_DB_PASSWORD:?set it in .env}
      MAILER_MIGRATION_DB_PASSWORD: ${MAILER_MIGRATION_DB_PASSWORD:?set it in .env}
      MAILER_DB_PASSWORD: ${MAILER_DB_PASSWORD:?set it in .env}
      NOTIFICATION_MIGRATION_DB_PASSWORD: ${NOTIFICATION_MIGRATION_DB_PASSWORD:?set it in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set it in .env}
      MAILROOM_MIGRATION_DB_PASSWORD: ${MAILROOM_MIGRATION_DB_PASSWORD:?set it in .env}
      MAILROOM_DB_PASSWORD: ${MAILROOM_DB_PASSWORD:?set it in .env}
      SURVEY_MIGRATION_DB_PASSWORD: ${SURVEY_MIGRATION_DB_PASSWORD:?set it in .env}
      SURVEY_DB_PASSWORD: ${SURVEY_DB_PASSWORD:?set it in .env}
      CUSTOMER_MIGRATION_DB_PASSWORD: ${CUSTOMER_MIGRATION_DB_PASSWORD:?set it in .env}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:?set it in .env}
      LOYALTY_MIGRATION_DB_PASSWORD: ${LOYALTY_MIGRATION_DB_PASSWORD:?set it in .env}
      LOYALTY_DB_PASSWORD: ${LOYALTY_DB_PASSWORD:?set it in .env}
      BOOKING_MIGRATION_DB_PASSWORD: ${BOOKING_MIGRATION_DB_PASSWORD:?set it in .env}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?set it in .env}
      WORKFLOW_MIGRATION_DB_PASSWORD: ${WORKFLOW_MIGRATION_DB_PASSWORD:?set it in .env}
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:?set it in .env}
      ATTRIBUTION_MIGRATION_DB_PASSWORD: ${ATTRIBUTION_MIGRATION_DB_PASSWORD:?set it in .env}
      ATTRIBUTION_DB_PASSWORD: ${ATTRIBUTION_DB_PASSWORD:?set it in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # One database, one owner role and one app role per service; only they can connect to it.
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billing"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER:-rabbitmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?set it in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  # One broker user per service, limited to its own exchanges and queues, declared once the broker is healthy.
  rabbitmq-users:
    image: curlimages/curl:8.11.1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      BROKER_URL: http://rabbitmq:15672
      ADMIN_USER: ${RABBITMQ_ADMIN_USER:-rabbitmq}
      ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD:?set it in .env}
      PLATFORM_BROKER_PASSWORD: ${PLATFORM_RABBITMQ_PASSWORD:?set it in .env}
      BILLING_BROKER_PASSWORD: ${BILLING_RABBITMQ_PASSWORD:?set it in .env}
      MAILER_BROKER_PASSWORD: ${MAILER_RABBITMQ_PASSWORD:?set it in .env}
      NOTIFICATION_BROKER_PASSWORD: ${NOTIFICATION_RABBITMQ_PASSWORD:?set it in .env}
      MAILROOM_BROKER_PASSWORD: ${MAILROOM_RABBITMQ_PASSWORD:?set it in .env}
      SURVEY_BROKER_PASSWORD: ${SURVEY_RABBITMQ_PASSWORD:?set it in .env}
      CUSTOMER_BROKER_PASSWORD: ${CUSTOMER_RABBITMQ_PASSWORD:?set it in .env}
      LOYALTY_BROKER_PASSWORD: ${LOYALTY_RABBITMQ_PASSWORD:?set it in .env}
      BOOKING_BROKER_PASSWORD: ${BOOKING_RABBITMQ_PASSWORD:?set it in .env}
      WORKFLOW_BROKER_PASSWORD: ${WORKFLOW_RABBITMQ_PASSWORD:?set it in .env}
      ATTRIBUTION_BROKER_PASSWORD: ${ATTRIBUTION_RABBITMQ_PASSWORD:?set it in .env}
    entrypoint: ["/bin/sh", "-c"]
    command: ["sh /ops/rabbitmq/declare-users.sh"]
    volumes:
      - ./ops/rabbitmq:/ops/rabbitmq:ro
    restart: "no"

  # The local inbox. `axllent/mailpit` speaks SMTP on 1025 and serves its UI and HTTP API on 8025. It has no
  # authentication and no STARTTLS, which is why the application never sets `mail.smtp.auth` or `starttls.required`
  # against it, and why it must never be part of an AWS deployment.
  #
  # No compose healthcheck on purpose: the published image is a static binary with no shell and no curl, so a
  # container-side probe can never pass. Poll `/api/v1/info` from the host instead.
  mailpit:
    <<: *app
    image: axllent/mailpit:v1.33.1
    ports:
      - "1025:1025"
      - "8025:8025"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?set it in .env}
      # Substituted into ops/keycloak/realm-export.json when the realm is imported.
      PLATFORM_KEYCLOAK_ADMIN_CLIENT_SECRET: ${PLATFORM_KEYCLOAK_ADMIN_CLIENT_SECRET:?set it in .env}
      SMOKE_CLIENT_SECRET: ${SMOKE_CLIENT_SECRET:?set it in .env}
    ports:
      - "8081:8080"
    volumes:
      - ./ops/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/master HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 5s
      timeout: 5s
      retries: 40

  platform:
    <<: *app
    build:
      context: .
      dockerfile: backend/services/platform/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      <<: *app-environment
      PLATFORM_DB_URL: jdbc:postgresql://postgres:5432/platform
      PLATFORM_DB_USER: platform_app
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?set it in .env}
      PLATFORM_MIGRATION_DB_USER: platform_owner
      PLATFORM_MIGRATION_DB_PASSWORD: ${PLATFORM_MIGRATION_DB_PASSWORD:?set it in .env}
      PLATFORM_RABBITMQ_HOST: rabbitmq
      PLATFORM_RABBITMQ_USER: platform
      PLATFORM_RABBITMQ_PASSWORD: ${PLATFORM_RABBITMQ_PASSWORD:?set it in .env}
      PLATFORM_KEYCLOAK_URL: http://keycloak:8080
      PLATFORM_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-billing}
      PLATFORM_KEYCLOAK_ADMIN_CLIENT_ID: platform-admin
      PLATFORM_KEYCLOAK_ADMIN_CLIENT_SECRET: ${PLATFORM_KEYCLOAK_ADMIN_CLIENT_SECRET:?set it in .env}
      PLATFORM_KEYCLOAK_CONSOLE_CLIENT_ID: ${PLATFORM_KEYCLOAK_CONSOLE_CLIENT_ID:-suite-console}
      PLATFORM_KEYCLOAK_CONSOLE_SCHEME: ${PLATFORM_KEYCLOAK_CONSOLE_SCHEME:-http}
      # Caddy publishes the stack on 8090, so the console's own port is part of every redirect target.
      PLATFORM_KEYCLOAK_CONSOLE_PORT: ${PLATFORM_KEYCLOAK_CONSOLE_PORT:-8090}
      PLATFORM_KEYCLOAK_CONSOLE_FIXED_HOSTS: ${PLATFORM_KEYCLOAK_CONSOLE_FIXED_HOSTS:-localhost,platform.localhost,localhost:5173,platform.localhost:5173}
      PLATFORM_KEYCLOAK_CONSOLE_SYNC_DELAY: ${PLATFORM_KEYCLOAK_CONSOLE_SYNC_DELAY:-PT5M}
      PLATFORM_BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      PLATFORM_HOSTNAME: ${PLATFORM_HOSTNAME:-platform.localhost}
      PLATFORM_TOKEN_ISSUER: ${PLATFORM_TOKEN_ISSUER:-http://platform.localhost:8080}
      PLATFORM_TOKEN_SIGNING_KEY: ${PLATFORM_TOKEN_SIGNING_KEY:-}
      PLATFORM_TOKEN_ALLOW_EPHEMERAL_KEY: ${PLATFORM_TOKEN_ALLOW_EPHEMERAL_KEY:-true}
      PLATFORM_OIDC_ISSUER_URI: ${PLATFORM_OIDC_ISSUER_URI:-http://localhost:8081/realms/billing}
      PLATFORM_OIDC_JWK_SET_URI: ${PLATFORM_OIDC_JWK_SET_URI:-http://keycloak:8080/realms/billing/protocol/openid-connect/certs}
      PLATFORM_BOOTSTRAP_ADMIN_EMAIL: ${PLATFORM_BOOTSTRAP_ADMIN_EMAIL:-}
      PLATFORM_BOOTSTRAP_ADMIN_TEMPORARY_PASSWORD: ${PLATFORM_BOOTSTRAP_ADMIN_TEMPORARY_PASSWORD:-}
      PLATFORM_SERVICE_CLIENT_ID: ${PLATFORM_SERVICE_CLIENT_ID:-billing}
      PLATFORM_SERVICE_CLIENT_SECRET_HASH: ${PLATFORM_SERVICE_CLIENT_SECRET_HASH:?set it in .env}
      PLATFORM_NOTIFICATION_SERVICE_CLIENT_ID: notification
      PLATFORM_NOTIFICATION_SERVICE_CLIENT_SECRET_HASH: ${PLATFORM_NOTIFICATION_SERVICE_CLIENT_SECRET_HASH:?set it in .env}
      PLATFORM_MAILROOM_SERVICE_CLIENT_ID: mailroom
      PLATFORM_MAILROOM_SERVICE_CLIENT_SECRET_HASH: ${PLATFORM_MAILROOM_SERVICE_CLIENT_SECRET_HASH:?set it in .env}
      PLATFORM_SURVEY_SERVICE_CLIENT_ID: survey
      PLATFORM_SURVEY_SERVICE_CLIENT_SECRET_HASH: ${PLATFORM_SURVEY_SERVICE_CLIENT_SECRET_HASH:?set it in .env}
      PLATFORM_CUSTOMER_SERVICE_CLIENT_ID: customer
      PLATFORM_CUSTOMER_SERVICE_CLIENT_SECRET_HASH: ${PLATFORM_CUSTOMER_SERVICE_CLIENT_SECRET_HASH:?set it in .env}
      PLATFORM_LOYALTY_SERVICE_CLIENT_ID: loyalty
      PLATFORM_LOYALTY_SERVICE_CLIENT_SECRET_HASH: ${PLATFORM_LOYALTY_SERVICE_CLIENT_SECRET_HASH:?set it in .env}
      PLATFORM_BOOKING_SERVICE_CLIENT_ID: booking
      PLATFORM_BOOKING_SERVICE_CLIENT_SECRET_HASH: ${PLATFORM_BOOKING_SERVICE_CLIENT_SECRET_HASH:?set it in .env}
      PLATFORM_WORKFLOW_SERVICE_CLIENT_ID: workflow
      PLATFORM_WORKFLOW_SERVICE_CLIENT_SECRET_HASH: ${PLATFORM_WORKFLOW_SERVICE_CLIENT_SECRET_HASH:?set it in .env}
      PLATFORM_ATTRIBUTION_SERVICE_CLIENT_ID: attribution
      PLATFORM_ATTRIBUTION_SERVICE_CLIENT_SECRET_HASH: ${PLATFORM_ATTRIBUTION_SERVICE_CLIENT_SECRET_HASH:?set it in .env}
      PLATFORM_FRONTEND_CI_SERVICE_CLIENT_ID: ${PLATFORM_FRONTEND_CI_SERVICE_CLIENT_ID:-frontend-ci}
      PLATFORM_FRONTEND_CI_SERVICE_CLIENT_SECRET_HASH: ${PLATFORM_FRONTEND_CI_SERVICE_CLIENT_SECRET_HASH:?set it in .env}
    ports:
      - "8082:8080"
    networks:
      default:
        # Platform resolves the tenant from the Host, so internal callers must reach it by its own hostname and send
        # that same Host. The alias makes `platform.localhost` resolve to this container inside the network.
        aliases:
          - platform.localhost
    healthcheck:
      # The JRE image has neither curl nor wget, so a plain bash /dev/tcp probe does the readiness check.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Writes Billing's schema once, as the table owner, then exits.
  billing-migrate:
    <<: *app
    restart: "no"
    build:
      context: .
      dockerfile: backend/services/billing/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    # The migrate profile switches Flyway on and web and jobs off, but the context still reads every other
    # setting at startup, so the step shares the api runtime's environment.
    environment:
      <<: *billing-environment
      SPRING_PROFILES_ACTIVE: migrate

  # Billing's HTTP edge: it serves the API, the portal and Stripe webhooks.
  billing:
    <<: *app
    build:
      context: .
      dockerfile: backend/services/billing/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      platform:
        condition: service_healthy
      billing-migrate:
        condition: service_completed_successfully
    environment:
      <<: *billing-environment
      SPRING_PROFILES_ACTIVE: api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Billing's background edge: every job, no business controller.
  billing-worker:
    <<: *app
    build:
      context: .
      dockerfile: backend/services/billing/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      platform:
        condition: service_healthy
      billing-migrate:
        condition: service_completed_successfully
    environment:
      <<: *billing-environment
      SPRING_PROFILES_ACTIVE: worker
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Writes Mailer's schema once, as the table owner, then exits.
  mailer-migrate:
    <<: *app
    restart: "no"
    build:
      context: .
      dockerfile: backend/services/mailer/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
    environment:
      <<: *mailer-environment
      SPRING_PROFILES_ACTIVE: migrate

  # Mailer's only long-running runtime: the commands listener and every job.
  #
  # Mailpit is `service_started`, never `service_healthy`, and that is a design decision rather than a shortcut: the
  # ledger's backoff is what should handle a dead SMTP server, and a hard dependency would turn a transient outage into
  # "the worker never starts".
  mailer-worker:
    <<: *app
    build:
      context: .
      dockerfile: backend/services/mailer/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      mailer-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      <<: *mailer-environment
      SPRING_PROFILES_ACTIVE: worker
    ports:
      - "8084:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Writes Notification's schema once, as the table owner, then exits.
  notification-migrate:
    <<: *app
    restart: "no"
    build:
      context: .
      dockerfile: backend/services/notification/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
    environment:
      <<: *notification-environment
      SPRING_PROFILES_ACTIVE: migrate

  # Notification's HTTP edge: the user's inbox, preferences and the tenant's template, settings and ledger APIs.
  notification-api:
    <<: *app
    build:
      context: .
      dockerfile: backend/services/notification/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
      notification-migrate:
        condition: service_completed_successfully
    environment:
      <<: *notification-environment
      SPRING_PROFILES_ACTIVE: api
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Notification's background edge: the platform-events listener, the outbox relay and housekeeping.
  #
  # Mailpit is deliberately not a dependency: mailer owns SMTP, and a dead mail server must not stop notification from
  # storing in-app rows or queueing commands.
  notification-worker:
    <<: *app
    build:
      context: .
      dockerfile: backend/services/notification/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
      notification-migrate:
        condition: service_completed_successfully
    environment:
      <<: *notification-environment
      SPRING_PROFILES_ACTIVE: worker
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Mailroom's background edge: the platform-events and mailer-events listeners, the outbox relay, the campaign
  # scheduler and publisher, housekeeping and the replica rebuild.
  #
  # Mailpit is deliberately not a dependency: mailer owns SMTP, and a dead mail server must not stop mailroom from
  # accepting a request or queueing a command.
  mailroom-worker:
    <<: *app
    build:
      context: .
      dockerfile: backend/services/mailroom/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
      mailroom-migrate:
        condition: service_completed_successfully
    environment:
      <<: *mailroom-environment
      SPRING_PROFILES_ACTIVE: worker
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Writes Mailroom's schema once, as the table owner, then exits.
  mailroom-migrate:
    <<: *app
    restart: "no"
    build:
      context: .
      dockerfile: backend/services/mailroom/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
    environment:
      <<: *mailroom-environment
      SPRING_PROFILES_ACTIVE: migrate

  # Mailroom's HTTP edge: templates, receivers, groups, segments, suppressions, emails, campaigns, settings and the
  # public tracking endpoints.
  mailroom-api:
    <<: *app
    build:
      context: .
      dockerfile: backend/services/mailroom/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
      mailroom-migrate:
        condition: service_completed_successfully
    environment:
      <<: *mailroom-environment
      SPRING_PROFILES_ACTIVE: api
    ports:
      - "8086:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  # The sample tenant app: its own database, calling Billing with a Platform-issued suite token.
  tenant:
    <<: *app
    build:
      context: .
      dockerfile: backend/samples/tenant/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      platform:
        condition: service_healthy
      billing:
        condition: service_healthy
    environment:
      <<: *app-environment
      SAMPLE_TENANT_DB_URL: jdbc:postgresql://postgres:5432/tenant
      SAMPLE_TENANT_DB_USER: tenant_app
      SAMPLE_TENANT_DB_PASSWORD: ${TENANT_DB_PASSWORD:?set it in .env}
      # Flyway migrates as the owner; the app connects as tenant_app.
      SAMPLE_TENANT_MIGRATION_DB_USER: tenant_owner
      SAMPLE_TENANT_MIGRATION_DB_PASSWORD: ${TENANT_MIGRATION_DB_PASSWORD:?set it in .env}
      SAMPLE_TENANT_PORT: "8080"
      SAMPLE_TENANT_BILLING_URL: http://billing:8080
      SAMPLE_TENANT_PLATFORM_URL: http://platform.localhost:8080
      SAMPLE_TENANT_PLATFORM_CLIENT_ID: ${SAMPLE_TENANT_PLATFORM_CLIENT_ID:-}
      SAMPLE_TENANT_PLATFORM_CLIENT_SECRET: ${SAMPLE_TENANT_PLATFORM_CLIENT_SECRET:-}
      SAMPLE_TENANT_WEBHOOK_SECRET: ${SAMPLE_TENANT_WEBHOOK_SECRET:-}
      SAMPLE_TENANT_EXECUTION_ENABLED: "false"
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Routes on the Host header alone; see ops/caddy/Caddyfile.
  # The console's static server: one hostname's shell plus every published remote version, under /console/ on every
  # host. It only reads the volume, so a published build cannot be changed by the server that serves it.
  console-static:
    image: caddy:2.9
    restart: unless-stopped
    environment:
      KEYCLOAK_AUTHORITY: ${CONSOLE_KEYCLOAK_AUTHORITY:-http://localhost:8081/realms/billing}
      KEYCLOAK_CLIENT_ID: ${CONSOLE_KEYCLOAK_CLIENT_ID:-suite-console}
      KEYCLOAK_PUBLIC_ORIGIN: ${CONSOLE_KEYCLOAK_ORIGIN:-http://localhost:8081}
      PLATFORM_HOSTNAME: ${PLATFORM_HOSTNAME:-platform.localhost}
    volumes:
      - console-assets:/srv:ro
      - ./ops/console/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./ops/console/entrypoint.sh:/usr/local/bin/console-entrypoint:ro
      - ./ops/console/config.json.template:/etc/console/config.json.template:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/console-entrypoint"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/config.json"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The write side of the same volume, only ever started for one `docker compose run` by the deploy scripts. It shares
  # the image the server uses, so the stack pulls nothing extra.
  console-deploy:
    image: caddy:2.9
    profiles: ["tools"]
    volumes:
      - console-assets:/srv
    entrypoint: ["/bin/sh"]

  caddy:
    image: caddy:2.9
    depends_on:
      console-static:
        condition: service_healthy
      platform:
        condition: service_healthy
      billing:
        condition: service_healthy
      notification-api:
        condition: service_healthy
      mailroom-api:
        condition: service_healthy
      customer-api:
        condition: service_healthy
      loyalty-api:
        condition: service_healthy
      tenant:
        condition: service_healthy
    ports:
      - "8090:80"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SeaweedFS stands in for S3 (a single process with master, volume, filer and the S3 gateway on :9000): a file
  # question presigns a PUT against it. The one S3 identity comes from the standard AWS variables.
  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    command: ["server", "-dir=/data", "-s3", "-s3.port=9000", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${SURVEY_S3_ACCESS_KEY:-minio}
      AWS_SECRET_ACCESS_KEY: ${SURVEY_S3_SECRET_KEY:?set it in .env}
    ports:
      - "9000:9000"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      # The master answers once the cluster is up; the gateway must also accept connections before a PUT can succeed.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/healthz && nc -z localhost 9000"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the upload bucket once SeaweedFS is ready. The app role needs no bucket at startup, only at the first
  # presign. A bucket that already exists answers 409, which counts as done. It reuses the SeaweedFS image for curl.
  seaweedfs-setup:
    image: chrislusf/seaweedfs:4.54
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      S3_USER: ${SURVEY_S3_ACCESS_KEY:-minio}
      S3_PASSWORD: ${SURVEY_S3_SECRET_KEY:?set it in .env}
      S3_BUCKET: ${SURVEY_S3_BUCKET:-survey-uploads}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        code=$$(curl -s -o /dev/null -w '%{http_code}' --aws-sigv4 aws:amz:us-east-1:s3 \
          --user "$$S3_USER:$$S3_PASSWORD" -X PUT "http://seaweedfs:9000/$$S3_BUCKET")
        [ "$$code" = 200 ] || [ "$$code" = 409 ] || { echo "bucket create answered $$code" >&2; exit 1; }
    restart: "no"

  survey-migrate:
    <<: *app
    restart: "no"
    build:
      context: .
      dockerfile: backend/services/survey/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
    environment:
      <<: *survey-environment
      SPRING_PROFILES_ACTIVE: migrate

  survey-api:
    <<: *app
    build:
      context: .
      dockerfile: backend/services/survey/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
      survey-migrate:
        condition: service_completed_successfully
    environment:
      <<: *survey-environment
      SPRING_PROFILES_ACTIVE: api
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  survey-worker:
    <<: *app
    build:
      context: .
      dockerfile: backend/services/survey/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
      survey-migrate:
        condition: service_completed_successfully
      seaweedfs-setup:
        condition: service_completed_successfully
    environment:
      <<: *survey-environment
      SPRING_PROFILES_ACTIVE: worker
    volumes:
      # The offline GeoIP file is fetched by ops/geoip/fetch.sh and git-ignored; a missing directory is not an error.
      - ./ops/geoip:/ops/geoip:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  booking-migrate:
    <<: *app
    restart: "no"
    build:
      context: .
      dockerfile: backend/services/booking/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
    environment:
      <<: *booking-environment
      SPRING_PROFILES_ACTIVE: migrate

  booking-api:
    <<: *app
    build:
      context: .
      dockerfile: backend/services/booking/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
      booking-migrate:
        condition: service_completed_successfully
    environment:
      <<: *booking-environment
      SPRING_PROFILES_ACTIVE: api
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  booking-worker:
    <<: *app
    build:
      context: .
      dockerfile: backend/services/booking/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
      booking-migrate:
        condition: service_completed_successfully
    environment:
      <<: *booking-environment
      SPRING_PROFILES_ACTIVE: worker
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Writes customer's schema once, as the table owner, then exits. The `compose` profile rides along so the mount is the same
  # file for all three runtimes even though only api and worker act on the webhook destination setting.
  customer-migrate:
    <<: *app
    restart: "no"
    build:
      context: .
      dockerfile: backend/services/customer/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
    environment:
      <<: *customer-environment
      SPRING_PROFILES_ACTIVE: migrate

  # customer's HTTP edge: customers, orders, returns, activities, the 360 profile, export, tags, consent and the webhook
  # endpoints a Tenant registers.
  customer-api:
    <<: *app
    build:
      context: .
      dockerfile: backend/services/customer/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
      customer-migrate:
        condition: service_completed_successfully
    environment:
      <<: *customer-environment
      # `compose` is what relaxes the webhook destination policy, so the smoke run's forwarder on this network can be
      # registered; a deployment never loads that profile and never sets the setting.
      SPRING_PROFILES_ACTIVE: api,compose
    ports:
      - "8087:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  # customer's background edge: the platform-events listener, the outbox relay, the webhook delivery round and housekeeping.
  customer-worker:
    <<: *app
    build:
      context: .
      dockerfile: backend/services/customer/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
      customer-migrate:
        condition: service_completed_successfully
    environment:
      <<: *customer-environment
      SPRING_PROFILES_ACTIVE: worker,compose
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Writes loyalty's schema once, as the table owner, then exits.
  loyalty-migrate:
    <<: *app
    restart: "no"
    build:
      context: .
      dockerfile: backend/services/loyalty/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
    environment:
      <<: *loyalty-environment
      SPRING_PROFILES_ACTIVE: migrate

  # loyalty's HTTP edge: the program, members, orders, returns, the balance, redemptions, rewards, vouchers and the
  # webhook endpoints a Tenant registers.
  loyalty-api:
    <<: *app
    build:
      context: .
      dockerfile: backend/services/loyalty/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
      loyalty-migrate:
        condition: service_completed_successfully
    environment:
      <<: *loyalty-environment
      SPRING_PROFILES_ACTIVE: api,compose
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  # loyalty's background edge: the platform-events listener, the outbox relay, the webhook delivery round, the expiry
  # and notice runs, the daily tier evaluation and housekeeping.
  loyalty-worker:
    <<: *app
    build:
      context: .
      dockerfile: backend/services/loyalty/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
      loyalty-migrate:
        condition: service_completed_successfully
    environment:
      <<: *loyalty-environment
      SPRING_PROFILES_ACTIVE: worker,compose
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Workflow's schema: it applies Flyway as the table owner and exits.
  workflow-migrate:
    <<: *app
    restart: "no"
    build:
      context: .
      dockerfile: backend/services/workflow/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
    environment:
      <<: *workflow-environment
      SPRING_PROFILES_ACTIVE: migrate

  # Workflow's HTTP edge: definitions, instances, tasks, connections, triggers, endpoints and history. It schedules
  # nothing; the worker owns every job.
  workflow-api:
    <<: *app
    build:
      context: .
      dockerfile: backend/services/workflow/apps/app-boot/Dockerfile
    depends_on:
      workflow-migrate:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
    environment:
      <<: *workflow-environment
      SPRING_PROFILES_ACTIVE: api,compose
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Workflow's background edge: the claim loop, sweepers, the outbox relay, webhook delivery, task deadlines and
  # retention.
  workflow-worker:
    <<: *app
    build:
      context: .
      dockerfile: backend/services/workflow/apps/app-boot/Dockerfile
    depends_on:
      workflow-migrate:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
    environment:
      <<: *workflow-environment
      SPRING_PROFILES_ACTIVE: worker,compose
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Writes Attribution's schema once, as the table owner, then exits.
  attribution-migrate:
    <<: *app
    restart: "no"
    build:
      context: .
      dockerfile: backend/services/attribution/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
    environment:
      <<: *attribution-environment
      SPRING_PROFILES_ACTIVE: migrate

  # Attribution's HTTP edge: campaigns, links, goals, reports, spend, connections, the public redirect and collection.
  attribution-api:
    <<: *app
    build:
      context: .
      dockerfile: backend/services/attribution/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
      attribution-migrate:
        condition: service_completed_successfully
    environment:
      <<: *attribution-environment
      SPRING_PROFILES_ACTIVE: api
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Attribution's background edge: the platform-events listener, the replica rebuild, the ingest consumer, the
  # partition, retention, credit, rollup and ad-sync jobs, and the outbox relay.
  attribution-worker:
    <<: *app
    build:
      context: .
      dockerfile: backend/services/attribution/apps/app-boot/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-users:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
      attribution-migrate:
        condition: service_completed_successfully
    environment:
      <<: *attribution-environment
      SPRING_PROFILES_ACTIVE: worker
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && head -20 <&3 | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 60

  # A destination a Tenant's connection may call in the smoke run: any path, any method, a 200 with a small body.
  workflow-echo:
    image: nginx:1.27-alpine
    command: ["sh", "-c", "printf 'ok' > /usr/share/nginx/html/erasure; exec nginx -g 'daemon off;'"]

volumes:
  console-assets:
  postgres-data:
  rabbitmq-data:
  seaweedfs-data:
