    get:
      tags:
      - "Survey respondents"
      summary: "List a survey's respondents"
      description: "Pages through the people who responded to the survey, the list\
        \ a tenant imports into a mailroom group to send a reminder, with the list-query\
        \ contract's filtering, sorting and paging. Requires `survey:response:read`.\n\
        \n**Filtering, sorting and paging** follow the list-query contract. Conditions\
        \ in `filter[field][op]` are combined with AND. For OR, use `filter[or][i][field][op]`:\
        \ predicates sharing the index `i` are AND-ed and the branches are OR-ed (at\
        \ most 10 branches, 20 predicates in all, 100 values in an `in` list). `neq`\
        \ and `nin` do not match rows where the field is null. Send `limit` with either\
        \ `offset` (at most 10000) or the `cursor` taken from a previous page, never\
        \ both. The body is `{\"data\": [...], \"page\": null}`. `page_info=full`\
        \ fills `page` with `limit`, `offset`, `total` and `next_cursor`; `page_info=cursor`\
        \ fills it with `limit` and `next_cursor` alone, without counting the matching\
        \ rows; omit it for the rows alone.\n\nCallers: tenant-user. Requires `survey:response:read`."
