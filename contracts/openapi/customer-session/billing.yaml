      - name: "filter[usage_ref][starts_with]"
        in: "query"
        description: "Case-insensitive prefix match on `usage_ref`."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[wallet.customer_id][eq]"
        in: "query"
        description: "`wallet.customer_id` eq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[wallet.customer_id][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `wallet.customer_id`."
        required: false
        schema:
          type: "string"
      - name: "filter[wallet.customer_id][neq]"
        in: "query"
        description: "`wallet.customer_id` neq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[wallet.customer_id][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `wallet.customer_id`."
        required: false
        schema:
          type: "string"
      - name: "filter[wallet_id][eq]"
        in: "query"
        description: "`wallet_id` eq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[wallet_id][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `wallet_id`."
        required: false
        schema:
          type: "string"
      - name: "filter[wallet_id][neq]"
        in: "query"
        description: "`wallet_id` neq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[wallet_id][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `wallet_id`."
        required: false
        schema:
          type: "string"
      - name: "sort"
        in: "query"
        description: "Comma-separated sortable fields, each optionally prefixed with\
          \ `-` for descending: amount, created_at, id. At most 4 fields; `id` is\
          \ appended to make the order total. Default: `-created_at,id`."
        required: false
        schema:
          type: "string"
      - name: "limit"
        in: "query"
        description: "Page size, 1 to 200."
        required: false
        schema:
          type: "integer"
          format: "int32"
          default: 50
          maximum: 200
          minimum: 1
      - name: "offset"
        in: "query"
        description: "Rows to skip, at most 10000. Not combinable with `cursor`."
        required: false
        schema:
          type: "integer"
          format: "int32"
          default: 0
          maximum: 10000
          minimum: 0
      - name: "cursor"
        in: "query"
        description: "The `next_cursor` of the previous page. Valid only with the\
          \ same filter and sort."
        required: false
        schema:
          type: "string"
      - name: "page_info"
        in: "query"
        description: "`full` fills `page` with the limit, offset, total and next cursor;\
          \ `cursor` fills it with the limit and the next cursor alone, so a walk\
          \ over a large listing is not counted; omit it for the rows alone."
        required: false
        schema:
          type: "string"
          enum:
          - "full"
          - "cursor"
      responses:
        "200":
          description: "A page of charge response rows, with the paging facts when\
            \ the request asked for them."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageChargeResponse"
        "400":
          description: "A filter, sort, cursor or paging parameter is unknown, not\
            \ allowed for the field, or not valid for its type."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotEntitled"
      x-required-portal-permission: "charge:view"
      x-allowed-callers:
      - "customer-session"
components:
  schemas:
    UpdateCustomerRequest:
      type: "object"
      description: "The customer properties to store."
      properties:
        displayName:
          type: "string"
          description: "The name shown for the customer."
        email:
          type: "string"
          description: "The customer's email address."
    CustomerResponse:
      type: "object"
      description: "A billing customer."
      properties:
        id:
          type: "string"
          description: "The id."
        displayName:
          type: "string"
          description: "The name shown for the customer."
        email:
          type: "string"
          description: "The customer's email address."
        status:
          type: "string"
          description: "`ACTIVE` or `DEACTIVATED`."
        createdAt:
          type: "string"
          format: "date-time"
          description: "When the record was created."
        identities:
          type: "array"
          description: "The Tenant System users the customer is mapped to."
          items:
            $ref: "#/components/schemas/IdentityResponse"
    IdentityResponse:
      type: "object"
      description: "A Tenant System user a customer is mapped to."
      properties:
        tenantSystemId:
          type: "string"
          description: "The tenant system."
        externalUserId:
          type: "string"
          description: "The tenant system's own id of the user."
    WebhookSecretRequest:
      type: "object"
      description: "The webhook signing secret."
      properties:
        webhookSecret:
          type: "string"
          description: "The signing secret of the webhook endpoint created in the\
            \ tenant's own Stripe Dashboard. It is stored encrypted and never returned."
    ConfigurationResponse:
      type: "object"
      description: "The tenant's Stripe configuration. No secret is part of it."
      properties:
        id:
          type: "string"
          description: "The id."
        mode:
          type: "string"
          description: "How Stripe is connected: `DIRECT` with the tenant's own API\
            \ key, or `CONNECT` through the platform's Connect application."
        accountId:
          type: "string"
          description: "The Stripe account id."
        environment:
          type: "string"
          description: "`TEST` or `LIVE`."
        status:
          type: "string"
          description: "`PENDING`, `ACTIVE` or `RESTRICTED`."
        publishableKey:
          type: "string"
          description: "The Stripe publishable key."
        webhookSecretSet:
          type: "boolean"
          description: "Whether a webhook signing secret is stored."
        cardPaymentsActive:
          type: "boolean"
          description: "Whether the account can take card payments."
        webhookUrl:
          type: "string"
          description: "The URL Stripe delivers events to."
        createdAt:
          type: "string"
          format: "date-time"
          description: "When the record was created."
        updatedAt:
          type: "string"
          format: "date-time"
          description: "When the record was last changed."
        connectedAt:
          type: "string"
          format: "date-time"
          description: "When the account was connected, or null."
        lastVerifiedAt:
          type: "string"
          format: "date-time"
          description: "When Stripe last confirmed the account's state, or null."
    DirectRequest:
      type: "object"
      description: "The tenant's own Stripe keys."
      properties:
        secretKey:
          type: "string"
          description: "The Stripe secret key. It is stored encrypted and never returned."
        publishableKey:
          type: "string"
          description: "The Stripe publishable key."
        webhookSecret:
          type: "string"
          description: "The signing secret of the webhook endpoint created in the\
            \ tenant's own Stripe Dashboard. It is stored encrypted and never returned."
    ReplaceRequest:
      type: "object"
      description: "The allowlist to store."
      properties:
        urls:
          type: "array"
          description: "The URLs a billing session may return the customer to, replacing\
            \ the stored list."
          items:
            type: "string"
    CreateEndpointRequest:
      type: "object"
      description: "The endpoint to register."
      properties:
        url:
          type: "string"
          description: "The HTTPS URL events are posted to. It must resolve to a public\
            \ address."
        description:
          type: "string"
          description: "A note about the endpoint."
        eventTypes:
          type: "array"
          description: "The event types to subscribe to."
          items:
            type: "string"
    EndpointResponse:
      type: "object"
      description: "A webhook endpoint. The signing secret is not part of it."
      properties:
        id:
          type: "string"
          description: "The id."
        url:
          type: "string"
          description: "The URL."
        description:
          type: "string"
          description: "A note about the endpoint."
        eventTypes:
          type: "array"
          description: "The event types the endpoint subscribes to."
          items:
            type: "string"
        status:
          type: "string"
          description: "`ACTIVE` or `DISABLED`."
        keyId:
          type: "string"
          description: "The id of the key the secret was written under. The secret\
            \ itself is never returned."
        createdAt:
          type: "string"
          format: "date-time"
          description: "When the record was created."
        updatedAt:
          type: "string"
          format: "date-time"
          description: "When the record was last changed."
        secretRotatedAt:
          type: "string"
          format: "date-time"
          description: "When the signing secret was last rotated, or null."
    EndpointWithSecretResponse:
      type: "object"
      description: "An endpoint with its signing secret, shown once."
      properties:
        endpoint:
          $ref: "#/components/schemas/EndpointResponse"
          description: "The endpoint."
        signingSecret:
          type: "string"
          description: "The secret that signs deliveries. It is shown only in this\
            \ response and is never available again."
    DeliveryResponse:
      type: "object"
      description: "One delivery of an event to an endpoint."
      properties:
        id:
          type: "string"
          description: "The id."
        endpointId:
          type: "string"
          description: "The id of the endpoint."
        eventId:
          type: "string"
          description: "The id of the event. A receiver should treat a repeated event\
            \ id as a duplicate."
        eventType:
          type: "string"
          description: "The event's type."
        status:
          type: "string"
          description: "`PENDING`, `IN_PROGRESS`, `SUCCEEDED` or `DEAD`. `DEAD` means\
            \ it exhausted its attempts."
        attempts:
          type: "integer"
          format: "int32"
          description: "How many attempts have been made."
        nextAttemptAt:
          type: "string"
          format: "date-time"
          description: "When the next attempt is due, or null."
        resendOf:
          type: "string"
          description: "The id of the delivery this one resends, or null."
        lastStatusCode:
          type: "integer"
          format: "int32"
          description: "The HTTP status the receiver answered last, or null."
        lastError:
          type: "string"
          description: "The last error, or null."
        createdAt:
          type: "string"
          format: "date-time"
          description: "When the record was created."
        completedAt:
          type: "string"
          format: "date-time"
          description: "When it completed, or null."
    OpenWalletRequest:
      type: "object"
      description: "The wallet to open."
      properties:
        customerId:
          type: "string"
          description: "The id of the customer."
        currency:
          type: "string"
          description: "The ISO 4217 currency code of the amounts."
        mode:
          type: "string"
          description: "`PREPAID` (spends its balance) or `POSTPAID` (spends up to\
            \ its credit limit and is billed later)."
        creditLimit:
          type: "integer"
          format: "int64"
          description: "For a postpaid wallet, how much it may owe at most."
    MoneyDto:
      type: "object"
      description: "An amount of money."
      properties:
        amount:
          type: "integer"
          format: "int64"
          description: "The amount in minor units of the currency."
        currency:
          type: "string"
          description: "The ISO 4217 currency code."
    WalletResponse:
      type: "object"
      description: "A customer's wallet in one currency."
      properties:
        id:
          type: "string"
          description: "The id."
        customerId:
          type: "string"
          description: "The id of the customer."
        currency:
          type: "string"
          description: "The ISO 4217 currency code of the amounts."
        mode:
          type: "string"
          description: "`PREPAID` or `POSTPAID`."
        balance:
          $ref: "#/components/schemas/MoneyDto"
          description: "The money in the wallet."
        held:
          $ref: "#/components/schemas/MoneyDto"
          description: "The part of the balance held by active reservations."
        available:
          $ref: "#/components/schemas/MoneyDto"
          description: "The balance less the amount held by active reservations. A\
            \ postpaid wallet may spend this plus its credit limit."
        creditLimit:
          $ref: "#/components/schemas/MoneyDto"
          description: "How much a postpaid wallet may owe at most."
        outstanding:
          $ref: "#/components/schemas/MoneyDto"
          description: "How much a postpaid wallet owes."
        lastSequence:
          type: "integer"
          format: "int64"
          description: "The sequence number of the wallet's last ledger entry."
        createdAt:
          type: "string"
          format: "date-time"
          description: "When the record was created."
    RedeemRequest:
      type: "object"
      description: "The coupon to redeem. Give a `code`, or a `couponId` to attach\
        \ it directly."
      properties:
        code:
          type: "string"
          description: "The promotion code to redeem."
        couponId:
          type: "string"
          description: "The coupon to attach, which skips a code's own limits."
    RedemptionResponse:
      type: "object"
      description: "A coupon redeemed onto a wallet."
      properties:
        id:
          type: "string"
          description: "The id."
        couponId:
          type: "string"
          description: "The coupon."
        couponName:
          type: "string"
          description: "The coupon's name."
        codeId:
          type: "string"
          description: "The promotion code used, or null when it was attached directly."
        walletId:
          type: "string"
          description: "The id of the wallet."
        customerId:
          type: "string"
          description: "The id of the customer."
        status:
          type: "string"
          description: "`ACTIVE`, `ENDED` or `REVOKED`."
        maxApplications:
          type: "integer"
          format: "int32"
          description: "How many charges it may discount, or null."
        applicationsUsed:
          type: "integer"
          format: "int32"
          description: "How many charges it has discounted."
        maxTotalDiscount:
          type: "integer"
          format: "int64"
          description: "The most it may discount in all, or null."
        discountTotal:
          type: "integer"
          format: "int64"
          description: "How much it has discounted so far."
        currency:
          type: "string"
          description: "The ISO 4217 currency code of the amounts."
        redeemedAt:
          type: "string"
          format: "date-time"
          description: "When it was redeemed."
        endsAt:
          type: "string"
          format: "date-time"
          description: "When it stops applying, or null."
        endReason:
          type: "string"
          description: "Why it ended: `EXHAUSTED`, `REVOKED`, `COUPON_DEACTIVATED`\
            \ or `GRANTED`."
        endedAt:
          type: "string"
          format: "date-time"
          description: "When it ended, or null."
    UsageEventRequest:
      type: "object"
      description: "One usage event to record."
      properties:
        customerId:
          type: "string"
          description: "The id of the customer."
        metric:
          type: "string"
          description: "The metric the usage is for."
        quantity:
          type: "string"
          description: "The amount used, in the unit the metric's plan defines."
        unit:
          type: "string"
          description: "The unit the metric is measured in."
        occurredAt:
          type: "string"
          format: "date-time"
          description: "When the usage happened."
        idempotencyKey:
          type: "string"
          description: "The key of this event. Repeating it with the same content\
            \ records nothing twice; with different content it is a conflict."
        resourceRef:
          type: "string"
          description: "A reference to the resource that used it, or null."
        sourceEventId:
          type: "string"
          description: "The id of the event in the reporting system that caused this\
            \ one, or null."
    RecordedResponse:
      type: "object"
      description: "The result of recording one usage event."
      properties:
        event:
          $ref: "#/components/schemas/UsageEventResponse"
          description: "The recorded event."
        replayed:
          type: "boolean"
          description: "Whether the answer is the earlier result of the same request,\
            \ not a new one."
    UsageEventResponse:
      type: "object"
      description: "A recorded usage event."
      properties:
        id:
          type: "string"
          description: "The id."
        customerId:
          type: "string"
          description: "The id of the customer."
        metric:
          type: "string"
          description: "The name of the metric."
        quantity:
          type: "string"
          description: "The quantity as a decimal string with up to six decimal places."
        unit:
          type: "string"
          description: "The unit the metric is measured in."
        occurredAt:
          type: "string"
          format: "date-time"
          description: "When it happened."
        recordedAt:
          type: "string"
          format: "date-time"
          description: "When Billing recorded the event."
        idempotencyKey:
          type: "string"
          description: "A key that makes a retry return the same result."
        tenantSystemId:
          type: "string"
          description: "The tenant system that reported it, or null."
        resourceRef:
          type: "string"
          description: "The resource reference, or null."
        sourceEventId:
          type: "string"
          description: "The id of the event in the reporting system, or null."
    BatchRequest:
      type: "object"
      description: "The usage events to record, at most 500, all or none."
      properties:
        events:
          type: "array"
          description: "The events."
          items:
            $ref: "#/components/schemas/UsageEventRequest"
    BatchResponse:
      type: "object"
      description: "The result per event, in request order."
      properties:
        results:
          type: "array"
          description: "The results."
          items:
            $ref: "#/components/schemas/RecordedResponse"
    SubscribeRequest:
      type: "object"
      description: "The subscription to start."
      properties:
        walletId:
          type: "string"
          description: "The id of the wallet."
        planId:
          type: "string"
          description: "The plan to subscribe to."
    SubscriptionDetailResponse:
      type: "object"
      description: "A subscription with its history."
      properties:
        subscription:
          $ref: "#/components/schemas/SubscriptionResponse"
          description: "The subscription."
        history:
          type: "array"
          description: "What happened to it, oldest first."
          items:
            $ref: "#/components/schemas/SubscriptionEventResponse"
    SubscriptionEventResponse:
      type: "object"
      description: "One event of a subscription's history."
      properties:
        id:
          type: "string"
          description: "The id."
        type:
          type: "string"
          description: "The kind of event."
        periodNumber:
          type: "integer"
          format: "int32"
          description: "The number of the period it concerns."
        periodStart:
          type: "string"
          format: "date-time"
          description: "The start of the period."
        periodEnd:
          type: "string"
          format: "date-time"
          description: "The end of the period."
        amount:
          $ref: "#/components/schemas/MoneyDto"
          description: "The amount due for the period."
        paidAmount:
          $ref: "#/components/schemas/MoneyDto"
          description: "The amount that was paid."
        chargeId:
          type: "string"
          description: "The id of the charge."
        detail:
          type: "string"
          description: "Details of what happened."
        occurredAt:
          type: "string"
          format: "date-time"
          description: "When it happened."
    SubscriptionResponse:
      type: "object"
      description: "A subscription of a wallet to a plan."
      properties:
        id:
          type: "string"
          description: "The id."
        customerId:
          type: "string"
          description: "The id of the customer."
        walletId:
          type: "string"
          description: "The id of the wallet."
        planId:
          type: "string"
          description: "The id of the pricing plan."
        planCode:
          type: "string"
          description: "The plan's code."
        cycle:
          type: "string"
          description: "`DAILY`, `WEEKLY`, `MONTHLY`, `QUARTERLY` or `YEARLY`. Fixed\
            \ for the life of the subscription."
        status:
          type: "string"
          description: "`ACTIVE`, `PAST_DUE` or `CANCELED`."
        anchor:
          type: "string"
          format: "date-time"
          description: "When the subscription's schedule was anchored."
        periodsCharged:
          type: "integer"
          format: "int32"
          description: "How many periods have been charged."
        currentPeriodStart:
          type: "string"
          format: "date-time"
          description: "The start of the period now running."
        currentPeriodEnd:
          type: "string"
          format: "date-time"
          description: "The end of the period now running."
        cancelAtPeriodEnd:
          type: "boolean"
          description: "Whether the subscription ends when the paid period does."
        canceledAt:
          type: "string"
          format: "date-time"
          description: "When it was canceled, or null."
        nextRenewalAt:
          type: "string"
          format: "date-time"
          description: "When the next period is charged, or null."
        renewalAttempts:
          type: "integer"
          format: "int32"
          description: "How many times the current renewal was tried."
        createdAt:
          type: "string"
          format: "date-time"
          description: "When the record was created."
    ReserveRequest:
      type: "object"
      description: "The hold to place on a wallet."
      properties:
        walletId:
          type: "string"
          description: "The id of the wallet."
        amount:
          type: "integer"
          format: "int64"
          description: "The amount to hold, in minor units of the currency."
        currency:
          type: "string"
          description: "The ISO 4217 currency code of the amounts."
        ttlSeconds:
          type: "integer"
          format: "int64"
          description: "How long the hold lasts, in seconds. After that it is released."
        reference:
          type: "string"
          description: "A reference the caller chose, such as the id of the resource\
            \ that will run."
    ReservationResponse:
      type: "object"
      description: "A hold on part of a wallet's balance."
      properties:
        id:
          type: "string"
          description: "The id."
        walletId:
          type: "string"
          description: "The id of the wallet."
        status:
          type: "string"
          description: "`ACTIVE`, `CAPTURED`, `RELEASED` or `EXPIRED`."
        amount:
          $ref: "#/components/schemas/MoneyDto"
          description: "The amount held."
        captured:
          $ref: "#/components/schemas/MoneyDto"
          description: "The amount charged against the hold so far."
        expiresAt:
          type: "string"
          format: "date-time"
          description: "When it expires."
        reference:
          type: "string"
          description: "A reference the caller chose, recorded with the record."
        createdAt:
          type: "string"
          format: "date-time"
          description: "When the record was created."
        closedAt:
          type: "string"
          format: "date-time"
          description: "When the hold was captured, released or expired, or null."
    CaptureRequest:
      type: "object"
      description: "The actual cost to charge against a reservation."
      properties:
        amount:
          type: "integer"
          format: "int64"
          description: "The actual cost, in minor units. Whatever the hold was above\
            \ it is released."
        currency:
          type: "string"
          description: "The ISO 4217 currency code of the amounts."
        reference:
          type: "string"
          description: "A reference the caller chose, recorded with the record."
    ChargeResponse:
      type: "object"
      description: "A charge made against a wallet."
      properties:
        id:
          type: "string"
          description: "The id."
        status:
          type: "string"
          description: "`SUCCEEDED` or `FAILED`. A wallet that cannot pay yields a\
            \ recorded `insufficient_funds` failure."
        failureReason:
          type: "string"
          description: "Why it failed, or null."
        amount:
          $ref: "#/components/schemas/MoneyDto"
          description: "What the wallet paid after discounts."
        grossAmount:
          $ref: "#/components/schemas/MoneyDto"
          description: "The amount before discounts."
        discounts:
          type: "array"
          description: "The coupon discounts applied."
          items:
            $ref: "#/components/schemas/DiscountLineResponse"
        ledgerEntryId:
          type: "string"
          description: "The id of the ledger entry it posted, or null."
        reservationId:
          type: "string"
          description: "The reservation it was captured from, or null."
        usageRef:
          type: "string"
          description: "The usage reference, or null."
        reference:
          type: "string"
          description: "A reference the caller chose, recorded with the record."
    DiscountLineResponse:
      type: "object"
      description: "One coupon discount applied to a charge."
      properties:
        redemptionId:
          type: "string"
          description: "The redemption that gave the discount."
