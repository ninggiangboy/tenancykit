          type: "string"
          description: "The ISO 4217 currency code of the amounts."
        model:
          type: "string"
          description: "The pricing model: `TIME_BASED`, `USAGE_BASED`, `WORKLOAD_BASED`,\
            \ `EVENT_BASED`, `SUBSCRIPTION` or `HYBRID`."
        version:
          $ref: "#/components/schemas/VersionRequest"
          description: "The plan's first version."
    RuleDto:
      type: "object"
      description: "A pricing strategy: how a quantity of usage becomes an amount.\
        \ Prices are decimals in minor units, and rounding to whole minor units happens\
        \ once, on the total."
      properties:
        model:
          type: "string"
          description: "The pricing model: `TIME_BASED` (price per unit of time),\
            \ `USAGE_BASED` (by quantity consumed, with tiers), `WORKLOAD_BASED` (a\
            \ start fee per execution plus a rate for the work), `EVENT_BASED` (per\
            \ discrete event), `SUBSCRIPTION` (a fixed amount per cycle) or `HYBRID`\
            \ (a base amount plus usage components)."
        metric:
          type: "string"
          description: "The metric the rule prices. Not used by a fixed price."
        unit:
          type: "string"
          description: "The unit the metric is measured in. Not used by a fixed price."
        unitPrice:
          type: "string"
          description: "The price of one unit, as a decimal string. Used by time-based,\
            \ workload-based and event-based rules."
        increment:
          type: "string"
          description: "For a time-based rule, the duration is first rounded up to\
            \ a whole number of increments, such as per started minute. Zero or null\
            \ means no rounding."
        mode:
          type: "string"
          description: "For a usage-based rule: `GRADUATED` prices each band of the\
            \ quantity at its own tier's rate, `VOLUME` prices the whole quantity\
            \ at the rate of the tier it falls in."
        tiers:
          type: "array"
          description: "For a usage-based rule, the price bands. One tier is a flat\
            \ rate; a first tier priced at zero is an included allowance."
          items:
            $ref: "#/components/schemas/TierDto"
        executionFee:
          type: "string"
          description: "For a workload-based rule, the start fee of every execution,\
            \ as a decimal string."
        fixedPrice:
          type: "string"
          description: "The amount for one billing cycle whatever is used, as a decimal\
            \ string. Used by a subscription rule and as the base of a hybrid."
        components:
          type: "array"
          description: "For a hybrid rule, the usage rules added to the base amount.\
            \ Each metric appears once."
          items:
            $ref: "#/components/schemas/RuleDto"
    TierDto:
      type: "object"
      description: "One price tier."
      properties:
        upTo:
          type: "string"
          description: "The quantity the band runs up to, as a decimal string, or\
            \ null when it is unbounded."
        unitPrice:
          type: "string"
          description: "The price of one unit in the band, as a decimal string."
    VersionRequest:
      type: "object"
