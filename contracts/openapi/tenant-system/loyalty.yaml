---
openapi: "3.1.0"
info:
  title: "Loyalty API"
  description: "The API a Tenant System uses to run its points program: the program,\
    \ its tiers and promotions, members and their points, orders and returns, redemptions,\
    \ rewards and vouchers, and the signed webhooks loyalty sends to the Tenant's\
    \ own endpoints."
  version: "v1"
servers:
- url: "/loyalty"
  description: "Any tenant hostname: <tenant-code>.<base-domain>/loyalty"
paths:
  /api/v1/webhook-endpoints/{id}:
    get:
      tags:
      - "endpoint-controller"
      description: "Callers: tenant-user, tenant-system. Requires `loyalty:webhook:manage`."
      operationId: "getEndpoint"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EndpointResponse"
      x-required-permission: "loyalty:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
    put:
      tags:
      - "endpoint-controller"
      description: "Callers: tenant-user, tenant-system. Requires `loyalty:webhook:manage`."
      operationId: "updateEndpoint"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "If-Match"
        in: "header"
        required: false
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        required: false
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEndpointRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EndpointResponse"
      x-required-permission: "loyalty:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
    delete:
      tags:
      - "endpoint-controller"
      description: "Callers: tenant-user, tenant-system. Requires `loyalty:webhook:manage`."
      operationId: "deleteEndpoint"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "If-Match"
        in: "header"
        required: false
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        required: false
        schema:
          type: "string"
      responses:
        "204":
          description: "No Content"
      x-required-permission: "loyalty:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
  /api/v1/tiers:
    get:
      tags:
      - "tier-controller"
      description: "Callers: tenant-user, tenant-system. Requires `loyalty:program:read`."
      operationId: "getTiers"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TierListResponse"
      x-required-permission: "loyalty:program:read"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
  /api/v1/program:
    get:
      tags:
      - "program-controller"
      description: "Callers: tenant-user, tenant-system. Requires `loyalty:program:read`."
      operationId: "getProgram"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProgramResponse"
      x-required-permission: "loyalty:program:read"
