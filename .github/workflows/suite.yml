name: suite

# The end-to-end gate: every service built into an image, started together, and the Done-means checks run against
# the running suite. This is the only workflow that starts the whole stack; the per-service workflows build each
# service on its own.
on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The compose file reads .env; CI writes one from the example and replaces every placeholder with a test value.
      - name: Write the compose environment
        run: |
          sed -e 's/^POSTGRES_SUPERUSER_PASSWORD=.*/POSTGRES_SUPERUSER_PASSWORD=ci-postgres/' \
              -e 's/^PLATFORM_MIGRATION_DB_PASSWORD=.*/PLATFORM_MIGRATION_DB_PASSWORD=ci-platform-owner/' \
              -e 's/^PLATFORM_DB_PASSWORD=.*/PLATFORM_DB_PASSWORD=ci-platform-app/' \
              -e 's/^BILLING_MIGRATION_DB_PASSWORD=.*/BILLING_MIGRATION_DB_PASSWORD=ci-billing-owner/' \
              -e 's/^BILLING_DB_PASSWORD=.*/BILLING_DB_PASSWORD=ci-billing-app/' \
              -e 's/^TENANT_MIGRATION_DB_PASSWORD=.*/TENANT_MIGRATION_DB_PASSWORD=ci-tenant-owner/' \
              -e 's/^TENANT_DB_PASSWORD=.*/TENANT_DB_PASSWORD=ci-tenant-app/' \
              -e 's/^MAILER_MIGRATION_DB_PASSWORD=.*/MAILER_MIGRATION_DB_PASSWORD=ci-mailer-owner/' \
              -e 's/^MAILER_DB_PASSWORD=.*/MAILER_DB_PASSWORD=ci-mailer-app/' \
              -e 's/^NOTIFICATION_MIGRATION_DB_PASSWORD=.*/NOTIFICATION_MIGRATION_DB_PASSWORD=ci-notification-owner/' \
              -e 's/^NOTIFICATION_DB_PASSWORD=.*/NOTIFICATION_DB_PASSWORD=ci-notification-app/' \
              -e 's/^MAILROOM_MIGRATION_DB_PASSWORD=.*/MAILROOM_MIGRATION_DB_PASSWORD=ci-mailroom-owner/' \
              -e 's/^MAILROOM_DB_PASSWORD=.*/MAILROOM_DB_PASSWORD=ci-mailroom-app/' \
              -e 's/^SURVEY_MIGRATION_DB_PASSWORD=.*/SURVEY_MIGRATION_DB_PASSWORD=ci-survey-owner/' \
              -e 's/^SURVEY_DB_PASSWORD=.*/SURVEY_DB_PASSWORD=ci-survey-app/' \
              -e 's/^CUSTOMER_MIGRATION_DB_PASSWORD=.*/CUSTOMER_MIGRATION_DB_PASSWORD=ci-customer-owner/' \
              -e 's/^CUSTOMER_DB_PASSWORD=.*/CUSTOMER_DB_PASSWORD=ci-customer-app/' \
              -e 's/^LOYALTY_MIGRATION_DB_PASSWORD=.*/LOYALTY_MIGRATION_DB_PASSWORD=ci-loyalty-owner/' \
              -e 's/^LOYALTY_DB_PASSWORD=.*/LOYALTY_DB_PASSWORD=ci-loyalty-app/' \
              -e 's/^BOOKING_MIGRATION_DB_PASSWORD=.*/BOOKING_MIGRATION_DB_PASSWORD=ci-booking-owner/' \
              -e 's/^BOOKING_DB_PASSWORD=.*/BOOKING_DB_PASSWORD=ci-booking-app/' \
              -e 's/^ATTRIBUTION_MIGRATION_DB_PASSWORD=.*/ATTRIBUTION_MIGRATION_DB_PASSWORD=ci-attribution-owner/' \
              -e 's/^ATTRIBUTION_DB_PASSWORD=.*/ATTRIBUTION_DB_PASSWORD=ci-attribution-app/' \
              -e 's/^KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD=.*/KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD=ci-keycloak-admin/' \
              -e 's/^PLATFORM_KEYCLOAK_ADMIN_CLIENT_SECRET=.*/PLATFORM_KEYCLOAK_ADMIN_CLIENT_SECRET=ci-keycloak-client/' \
              -e 's/^SMOKE_CLIENT_SECRET=.*/SMOKE_CLIENT_SECRET=ci-smoke-client/' \
              -e 's/^RABBITMQ_ADMIN_PASSWORD=.*/RABBITMQ_ADMIN_PASSWORD=ci-rabbitmq-admin/' \
              -e 's/^PLATFORM_RABBITMQ_PASSWORD=.*/PLATFORM_RABBITMQ_PASSWORD=ci-platform-broker/' \
              -e 's/^BILLING_RABBITMQ_PASSWORD=.*/BILLING_RABBITMQ_PASSWORD=ci-billing-broker/' \
              -e 's/^MAILER_RABBITMQ_PASSWORD=.*/MAILER_RABBITMQ_PASSWORD=ci-mailer-broker/' \
              -e 's/^NOTIFICATION_RABBITMQ_PASSWORD=.*/NOTIFICATION_RABBITMQ_PASSWORD=ci-notification-broker/' \
              -e 's/^MAILROOM_RABBITMQ_PASSWORD=.*/MAILROOM_RABBITMQ_PASSWORD=ci-mailroom-broker/' \
              -e 's/^SURVEY_RABBITMQ_PASSWORD=.*/SURVEY_RABBITMQ_PASSWORD=ci-survey-broker/' \
              -e 's/^CUSTOMER_RABBITMQ_PASSWORD=.*/CUSTOMER_RABBITMQ_PASSWORD=ci-customer-broker/' \
              -e 's/^LOYALTY_RABBITMQ_PASSWORD=.*/LOYALTY_RABBITMQ_PASSWORD=ci-loyalty-broker/' \
              -e 's/^BOOKING_RABBITMQ_PASSWORD=.*/BOOKING_RABBITMQ_PASSWORD=ci-booking-broker/' \
              -e 's/^ATTRIBUTION_RABBITMQ_PASSWORD=.*/ATTRIBUTION_RABBITMQ_PASSWORD=ci-attribution-broker/' \
              -e 's/^BILLING_REPLICA_CLIENT_SECRET=.*/BILLING_REPLICA_CLIENT_SECRET=ci-replica-secret/' \
              -e 's/^PLATFORM_SERVICE_CLIENT_SECRET_HASH=.*/PLATFORM_SERVICE_CLIENT_SECRET_HASH=ci-replica-hash/' \
              .env.example > .env
          # The replica client's hash must match its secret, and the secrets master key must decode to 32 bytes;
          # compute both the way production does.
          HASH=$(printf %s 'ci-replica-secret' | sha256sum | cut -d' ' -f1)
          sed -i "s/^PLATFORM_SERVICE_CLIENT_SECRET_HASH=.*/PLATFORM_SERVICE_CLIENT_SECRET_HASH=${HASH}/" .env
          NOTIFICATION_HASH=$(printf %s 'ci-notification-replica-secret' | sha256sum | cut -d' ' -f1)
          sed -i "s/^NOTIFICATION_REPLICA_CLIENT_SECRET=.*/NOTIFICATION_REPLICA_CLIENT_SECRET=ci-notification-replica-secret/" .env
          sed -i "s/^PLATFORM_NOTIFICATION_SERVICE_CLIENT_SECRET_HASH=.*/PLATFORM_NOTIFICATION_SERVICE_CLIENT_SECRET_HASH=${NOTIFICATION_HASH}/" .env
          MAILROOM_HASH=$(printf %s 'ci-mailroom-replica-secret' | sha256sum | cut -d' ' -f1)
          sed -i "s/^MAILROOM_REPLICA_CLIENT_SECRET=.*/MAILROOM_REPLICA_CLIENT_SECRET=ci-mailroom-replica-secret/" .env
          sed -i "s/^PLATFORM_MAILROOM_SERVICE_CLIENT_SECRET_HASH=.*/PLATFORM_MAILROOM_SERVICE_CLIENT_SECRET_HASH=${MAILROOM_HASH}/" .env
          sed -i 's/^MAILROOM_TRACKING_SECRET=.*/MAILROOM_TRACKING_SECRET=ci-tracking-secret/' .env
          SURVEY_HASH=$(printf %s 'ci-survey-replica-secret' | sha256sum | cut -d' ' -f1)
          sed -i "s/^SURVEY_REPLICA_CLIENT_SECRET=.*/SURVEY_REPLICA_CLIENT_SECRET=ci-survey-replica-secret/" .env
          sed -i "s/^PLATFORM_SURVEY_SERVICE_CLIENT_SECRET_HASH=.*/PLATFORM_SURVEY_SERVICE_CLIENT_SECRET_HASH=${SURVEY_HASH}/" .env
          sed -i 's/^SURVEY_LINK_SECRET=.*/SURVEY_LINK_SECRET=ci-survey-link-secret/' .env
          sed -i 's/^SURVEY_S3_SECRET_KEY=.*/SURVEY_S3_SECRET_KEY=ci-survey-s3-secret/' .env
          BOOKING_HASH=$(printf %s 'ci-booking-replica-secret' | sha256sum | cut -d' ' -f1)
          sed -i "s/^BOOKING_REPLICA_CLIENT_SECRET=.*/BOOKING_REPLICA_CLIENT_SECRET=ci-booking-replica-secret/" .env
          sed -i "s/^PLATFORM_BOOKING_SERVICE_CLIENT_SECRET_HASH=.*/PLATFORM_BOOKING_SERVICE_CLIENT_SECRET_HASH=${BOOKING_HASH}/" .env
          sed -i 's/^BOOKING_TOKEN_SECRET=.*/BOOKING_TOKEN_SECRET=ci-booking-token-secret/' .env
          CUSTOMER_HASH=$(printf %s 'ci-customer-replica-secret' | sha256sum | cut -d' ' -f1)
          sed -i "s/^CUSTOMER_REPLICA_CLIENT_SECRET=.*/CUSTOMER_REPLICA_CLIENT_SECRET=ci-customer-replica-secret/" .env
          sed -i "s/^PLATFORM_CRM_SERVICE_CLIENT_SECRET_HASH=.*/PLATFORM_CRM_SERVICE_CLIENT_SECRET_HASH=${CUSTOMER_HASH}/" .env
          LOYALTY_HASH=$(printf %s 'ci-loyalty-replica-secret' | sha256sum | cut -d' ' -f1)
          sed -i "s/^LOYALTY_REPLICA_CLIENT_SECRET=.*/LOYALTY_REPLICA_CLIENT_SECRET=ci-loyalty-replica-secret/" .env
          sed -i "s/^PLATFORM_LOYALTY_SERVICE_CLIENT_SECRET_HASH=.*/PLATFORM_LOYALTY_SERVICE_CLIENT_SECRET_HASH=${LOYALTY_HASH}/" .env
          ATTRIBUTION_HASH=$(printf %s 'ci-attribution-replica-secret' | sha256sum | cut -d' ' -f1)
          sed -i "s/^ATTRIBUTION_REPLICA_CLIENT_SECRET=.*/ATTRIBUTION_REPLICA_CLIENT_SECRET=ci-attribution-replica-secret/" .env
          sed -i "s/^PLATFORM_ATTRIBUTION_SERVICE_CLIENT_SECRET_HASH=.*/PLATFORM_ATTRIBUTION_SERVICE_CLIENT_SECRET_HASH=${ATTRIBUTION_HASH}/" .env
          sed -i 's/^ATTRIBUTION_CLICK_SECRET=.*/ATTRIBUTION_CLICK_SECRET=ci-attribution-click-secret/' .env
          sed -i 's/^ATTRIBUTION_VISITOR_HASH_KEY=.*/ATTRIBUTION_VISITOR_HASH_KEY=ci-attribution-visitor-key/' .env
          FRONTEND_CI_HASH=$(printf %s 'ci-frontend-ci' | sha256sum | cut -d' ' -f1)
          sed -i "s/^PLATFORM_FRONTEND_CI_SERVICE_CLIENT_SECRET_HASH=.*/PLATFORM_FRONTEND_CI_SERVICE_CLIENT_SECRET_HASH=${FRONTEND_CI_HASH}/" .env
          sed -i "s/^FRONTEND_CI_SERVICE_CLIENT_SECRET=.*/FRONTEND_CI_SERVICE_CLIENT_SECRET=ci-frontend-ci/" .env
          MASTER_KEY=$(openssl rand -base64 32)
          sed -i "s|^BILLING_SECRETS_MASTER_KEY=.*|BILLING_SECRETS_MASTER_KEY=${MASTER_KEY}|" .env
          # Mailer's master key protects tenant credentials and must decode to exactly 32 bytes too; the cipher refuses
          # any other length, so a placeholder here would fail the worker at startup rather than at a send.
          sed -i "s|^MAILER_SECRETS_MASTER_KEY=.*|MAILER_SECRETS_MASTER_KEY=${MASTER_KEY}|" .env
          # Survey's master key protects webhook signing secrets and must decode to 32 bytes for the same reason.
          sed -i "s|^SURVEY_SECRETS_MASTER_KEY=.*|SURVEY_SECRETS_MASTER_KEY=${MASTER_KEY}|" .env
          # Booking's master key protects webhook signing secrets, and its customer-token key signs the public gate's
          # tokens; both need the same treatment.
          sed -i "s|^BOOKING_SECRETS_MASTER_KEY=.*|BOOKING_SECRETS_MASTER_KEY=${MASTER_KEY}|" .env
          # customer's and loyalty's master keys wrap their webhook signing secrets and must decode to exactly 32 bytes, so a
          # placeholder here would fail the worker at startup rather than at a delivery.
          sed -i "s|^CUSTOMER_SECRETS_MASTER_KEY=.*|CUSTOMER_SECRETS_MASTER_KEY=${MASTER_KEY}|" .env
          sed -i "s|^LOYALTY_SECRETS_MASTER_KEY=.*|LOYALTY_SECRETS_MASTER_KEY=${MASTER_KEY}|" .env
          sed -i 's/^PLATFORM_BOOTSTRAP_ADMIN_EMAIL=.*/PLATFORM_BOOTSTRAP_ADMIN_EMAIL=admin@platform.test/' .env
          sed -i 's/^PLATFORM_BOOTSTRAP_ADMIN_TEMPORARY_PASSWORD=.*/PLATFORM_BOOTSTRAP_ADMIN_TEMPORARY_PASSWORD=ci-admin-password/' .env
          sed -i 's/^PLATFORM_OIDC_ISSUER_URI=.*/PLATFORM_OIDC_ISSUER_URI=http:\/\/localhost:8081\/realms\/billing/' .env

      - name: Start the suite
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Isolation
        run: ops/smoke/isolation.sh

      - name: Smoke
        env:
          SMOKE_CLIENT_SECRET: ci-smoke-client
          PLATFORM_KEYCLOAK_ADMIN_CLIENT_SECRET: ci-keycloak-client
          PLATFORM_BOOTSTRAP_ADMIN_EMAIL: admin@platform.test
          PLATFORM_BOOTSTRAP_ADMIN_TEMPORARY_PASSWORD: ci-admin-password
        run: ops/smoke/suite-smoke.sh

      # The console gate runs on the same stack the smoke just proved: the shells are staged, both remotes are
      # published and registered, and Playwright drives the deployed console through Caddy.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install the console
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install the gate's browser
        working-directory: frontend
        run: pnpm --filter @suite/e2e exec playwright install --with-deps chromium

      - name: Build the console for this commit
        working-directory: frontend
        run: |
          VERSION="0.0.0+$(git rev-parse --short HEAD)"
          echo "CONSOLE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          REMOTE_VERSION="${VERSION}" pnpm --filter @suite/remote-platform --filter @suite/remote-billing build
          pnpm --filter @suite/platform-shell --filter @suite/tenant-shell build

      - name: Stage the shells on the console volume
        run: |
          ops/console/deploy-shell.sh platform frontend/apps/platform-shell/dist
          ops/console/deploy-shell.sh tenant frontend/apps/tenant-shell/dist

      - name: Publish and register both remotes
        env:
          FRONTEND_CI_SERVICE_CLIENT_SECRET: ci-frontend-ci
        run: |
          REMOTE_VERSION_OVERRIDE="${CONSOLE_VERSION}" ops/console/deploy-remote.sh platform frontend/remotes/platform/dist
          REMOTE_VERSION_OVERRIDE="${CONSOLE_VERSION}" ops/console/deploy-remote.sh billing frontend/remotes/billing/dist

      - name: Console end-to-end gate
        env:
          FRONTEND_CI_SERVICE_CLIENT_SECRET: ci-frontend-ci
        run: pnpm --dir frontend --filter @suite/e2e test

      # On failure the logs are the only forensic record; the stack is torn down after they are taken.
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 2000

      - name: Stop the suite
        if: always()
        run: docker compose down -v
