    post:
      tags:
      - "Usage"
      summary: "Record a usage event"
      description: "Reports one usage event for a customer: the `metric`, a `quantity`\
        \ with up to six decimal places in the unit the metric's plan defines, and\
        \ when it `occurredAt`. Each event carries its own `idempotencyKey`, so a\
        \ retry never records anything twice: `201` for a new event, `200` with the\
        \ recorded event when it was already recorded, and `409` when the key arrives\
        \ with different content."
      operationId: "recordOne"
      requestBody:
        description: "One usage event to record."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageEventRequest"
        required: true
      responses:
        "200":
          description: "The same event was already recorded; the recorded event is\
            \ returned"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecordedResponse"
        "201":
          description: "The result of recording one usage event."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RecordedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "The `idempotencyKey` was already used with different content."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      x-required-permission: "billing:usage:record"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
      security:
      - apiKey: []
