---
openapi: "3.1.0"
info:
  title: "Booking API"
  description: "The API a Tenant System uses to describe what may be booked and when\
    \ it is open, search availability, hold, confirm, extend, reschedule and cancel\
    \ bookings, run repeating series, keep a waitlist, issue customer tokens, manage\
    \ the signed webhooks booking sends, and read the tenant's settings. The public\
    \ gate under `/p/**` is the surface a Tenant's customer's browser calls with a\
    \ short-lived customer token; it can browse, hold, release its own hold and join\
    \ the waitlist, and it can never confirm. Booking never touches money: the Tenant\
    \ holds, charges through Billing, then confirms. The tenant is taken from the\
    \ request's host and suite token, never from a body; no request body carries a\
    \ tenant. This document is a skeleton written in phase 1 and filled by each phase;\
    \ the committed generated document replaces it once controllers exist."
  version: "v1"
servers:
- url: "/booking"
  description: "Any tenant hostname: <tenant-code>.<base-domain>/booking"
tags:
- name: "Resources"
  description: "The people, rooms and equipment that can be booked."
- name: "Resource groups"
  description: "Groups of resources with a strategy for choosing among their members."
- name: "Calendar"
  description: "Weekly working hours, dated exceptions and blocks, and a preview of\
    \ a recurrence."
- name: "Offerings"
  description: "What a tenant sells: its duration, requirements and cancellation windows."
- name: "Availability"
  description: "Free start instants for an interval offering."
- name: "Queue"
  description: "The waiting-room counts of an offering."
- name: "Sessions"
  description: "Capacity sessions and the repeating series that create them."
- name: "Bookings"
  description: "Hold, confirm, extend, move, cancel and read bookings."
- name: "Booking series"
  description: "Book a repeating series and confirm or cancel its occurrences."
- name: "Waitlist"
  description: "Join, read and leave the waitlist for an offering."
- name: "Settings"
  description: "The tenant's booking settings and the public gate."
- name: "Customer tokens"
  description: "Mint the short-lived token a customer uses at the public gate."
- name: "Public gate"
  description: "Endpoints a customer's browser calls under /p with a customer token:\
    \ read an offering, hold, queue and waitlist."
- name: "Webhooks"
  description: "Register webhook endpoints, rotate their secrets and read or resend\
    \ deliveries."
paths:
  /p/offerings/{offeringId}:
    parameters:
    - $ref: "#/components/parameters/OfferingId"
    get:
      tags:
      - "Public gate"
      summary: "Public: read an offering"
      description: "Requires a customer token with the `browse` scope. `remaining`\
        \ is included only when the offering sets `publicShowsRemaining`.\n\nCallers:\
        \ public."
      operationId: "publicGetOffering"
      security:
      - CustomerToken: []
      responses:
        "200":
          description: "The offering as the gate may see it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOffering"
        "401":
          $ref: "#/components/responses/CustomerUnauthenticated"
        "403":
          $ref: "#/components/responses/CustomerForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-allowed-callers:
      - "public"
  /p/offerings/{offeringId}/availability:
    parameters:
    - $ref: "#/components/parameters/OfferingId"
    get:
      tags:
      - "Public gate"
      summary: "Public: free start instants"
      operationId: "publicGetAvailability"
      security:
      - CustomerToken: []
      parameters:
      - name: "from"
        in: "query"
        required: true
        schema:
          type: "string"
          format: "date-time"
      - name: "to"
        in: "query"
        required: true
        schema:
          type: "string"
          format: "date-time"
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: "The free starts."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityPage"
        "401":
          $ref: "#/components/responses/CustomerUnauthenticated"
        "403":
          $ref: "#/components/responses/CustomerForbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      description: "Callers: public."
      x-allowed-callers:
      - "public"
  /p/bookings:
    post:
      tags:
      - "Public gate"
      summary: "Public: hold a place"
      description: "Requires the `hold` scope. The booking always has source `GATE`\
        \ and the token's own `customerRef`. When the offering sets `queueMode = REQUIRED`\
        \ the request must carry an admitted ticket token. Emits `booking.held` with\
        \ source `GATE`.\n\nCallers: public."
      operationId: "publicHold"
      security:
      - CustomerToken: []
      parameters:
      - name: "X-Queue-Ticket"
        in: "header"
        required: false
        schema:
          type: "string"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCreate"
      responses:
        "201":
          description: "The held booking."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/CustomerUnauthenticated"
        "403":
          $ref: "#/components/responses/CustomerForbidden"
        "409":
          description: "`slot-taken` or `sold-out`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-allowed-callers:
      - "public"
  /p/bookings/{bookingId}:
    parameters:
    - $ref: "#/components/parameters/BookingId"
    delete:
      tags:
      - "Public gate"
      summary: "Public: release its own hold"
      description: "Only a booking with source `GATE`, the token's own `customerRef`,\
        \ and status `HELD`.\n\nCallers: public."
      operationId: "publicReleaseHold"
      security:
      - CustomerToken: []
      responses:
        "204":
          description: "Released."
        "401":
          $ref: "#/components/responses/CustomerUnauthenticated"
        "403":
          $ref: "#/components/responses/CustomerForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-allowed-callers:
      - "public"
  /p/waitlist:
    post:
      tags:
      - "Public gate"
      summary: "Public: join the waitlist"
      operationId: "publicJoinWaitlist"
      security:
      - CustomerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistJoin"
      responses:
        "201":
          description: "The waiting entry."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"
        "401":
          $ref: "#/components/responses/CustomerUnauthenticated"
        "403":
          $ref: "#/components/responses/CustomerForbidden"
        "409":
          description: "`waitlist-full` or `ALREADY_WAITING`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      description: "Callers: public."
      x-allowed-callers:
      - "public"
  /p/waitlist/{entryId}:
    parameters:
    - name: "entryId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    get:
      tags:
      - "Public gate"
      summary: "Public: read its position"
      operationId: "publicGetWaitlistEntry"
      security:
      - CustomerToken: []
      responses:
        "200":
          description: "The entry and its position."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"
        "401":
          $ref: "#/components/responses/CustomerUnauthenticated"
        "403":
          $ref: "#/components/responses/CustomerForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      description: "Callers: public."
      x-allowed-callers:
      - "public"
    delete:
      tags:
      - "Public gate"
      summary: "Public: leave the waitlist"
      operationId: "publicLeaveWaitlist"
      security:
      - CustomerToken: []
      responses:
        "204":
          description: "Left."
        "401":
          $ref: "#/components/responses/CustomerUnauthenticated"
        "403":
          $ref: "#/components/responses/CustomerForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      description: "Callers: public."
      x-allowed-callers:
      - "public"
  /p/queue:
    post:
      tags:
      - "Public gate"
      summary: "Public: enter the waiting room"
      description: "Returns a signed ticket token and a first `retryAfterSeconds`.\
        \ One active ticket per `(customerRef, target)`; a ticket is insert-only and\
        \ numbered from a sequence.\n\nCallers: public."
      operationId: "publicEnterQueue"
      security:
      - CustomerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueEntryRequest"
      responses:
        "201":
          description: "The ticket."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueTicket"
        "401":
          $ref: "#/components/responses/CustomerUnauthenticated"
        "403":
          $ref: "#/components/responses/CustomerForbidden"
        "409":
          description: "The customer already holds an active ticket for this target.\
            \ Code `ALREADY_QUEUED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-allowed-callers:
      - "public"
    delete:
      tags:
      - "Public gate"
      summary: "Public: leave the waiting room"
      operationId: "publicLeaveQueue"
      security:
      - CustomerToken: []
      parameters:
      - name: "X-Queue-Ticket"
        in: "header"
        required: true
        schema:
          type: "string"
      responses:
        "204":
          description: "Left."
        "401":
          $ref: "#/components/responses/CustomerUnauthenticated"
        "403":
          $ref: "#/components/responses/CustomerForbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      description: "Callers: public."
      x-allowed-callers:
      - "public"
  /p/queue/status:
    get:
      tags:
      - "Public gate"
      summary: "Public: poll its admission"
      description: "Reads the instance's cached watermark, never the ticket row. `position`\
        \ is an upper bound and the watermark may be up to one second stale.\n\nCallers:\
        \ public."
      operationId: "publicQueueStatus"
      security:
      - CustomerToken: []
      parameters:
      - name: "X-Queue-Ticket"
        in: "header"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "The status."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatus"
        "401":
          $ref: "#/components/responses/CustomerUnauthenticated"
        "403":
          $ref: "#/components/responses/CustomerForbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-allowed-callers:
      - "public"
components:
  securitySchemes:
    SuiteToken:
      type: "http"
      scheme: "bearer"
      description: "The Platform-issued suite token of a Tenant System; booking mints\
        \ no JWT."
    CustomerToken:
      type: "http"
      scheme: "bearer"
      description: "The short-lived HMAC customer token the Tenant System minted through\
        \ `POST /customer-tokens`."
  parameters:
    ResourceId:
      name: "resourceId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    OfferingId:
      name: "offeringId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    SessionId:
      name: "sessionId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    BookingId:
      name: "bookingId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    IfMatch:
      name: "If-Match"
      in: "header"
      required: false
      description: "Required by every update; the endpoint answers `428` without it\
        \ and `412` when it does not match."
      schema:
        type: "string"
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: false
      description: "A retry with the same key and body returns the first result; a\
        \ different body is `409`."
      schema:
        type: "string"
        minLength: 1
        maxLength: 200
    Filter:
      name: "filter"
      in: "query"
      required: false
      description: "The shared list query contract: `filter[<field>][<op>]=<value>`.\
        \ The generated document lists this resource's fields and operators."
      style: "deepObject"
      schema:
        type: "object"
    Sort:
      name: "sort"
      in: "query"
      required: false
      description: "Sortable fields, `-` for descending, at most four."
      schema:
        type: "string"
    Limit:
      name: "limit"
      in: "query"
      required: false
      schema:
        type: "integer"
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: "offset"
      in: "query"
      required: false
      schema:
        type: "integer"
        minimum: 0
        maximum: 10000
    Cursor:
      name: "cursor"
      in: "query"
      required: false
      schema:
        type: "string"
    PageInfo:
      name: "page_info"
      in: "query"
      required: false
      schema:
        type: "string"
        enum:
        - "full"
        - "cursor"
  headers:
    ETag:
      description: "The resource's current version; send it as `If-Match` on the next\
        \ update."
      schema:
        type: "string"
  security:
  - SuiteToken: []
  responses:
    BadRequest:
      description: "The request is malformed, for example both `offset` and `cursor`,\
        \ or a filter beyond the contract's limits. Code `VALIDATION_FAILED`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: "No suite token, or an expired or invalid one. Code `UNAUTHENTICATED`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "The token lacks the operation's permission, or the tenant has\
        \ no `booking` entitlement. Code `FORBIDDEN`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "No such object in this tenant. Code `<RESOURCE>_NOT_FOUND`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionRequired:
      description: "The update needs `If-Match`. Code `PRECONDITION_REQUIRED`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionFailed:
      description: "`If-Match` does not match the current version. Code `STALE_VERSION`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: "The body is well formed but invalid. Code `VALIDATION_FAILED`\
        \ with the offending field."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: "The gate's per-fingerprint rate limit or the admission cap refused\
        \ the request. `Retry-After` carries the wait."
      headers:
        Retry-After:
          schema:
            type: "integer"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    CustomerUnauthenticated:
      description: "A missing, expired, tampered or wrong-tenant customer token. The\
        \ same code as a missing one, so nothing leaks."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    CustomerForbidden:
      description: "The token lacks the scope, names another customer, or the destination\
        \ is not served by the gate (for example `confirm`). Code `FORBIDDEN`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: "object"
      description: "A typed problem."
      additionalProperties: true
      required:
      - "type"
      - "title"
      - "status"
      - "code"
      properties:
        type:
          type: "string"
        title:
          type: "string"
        status:
          type: "integer"
        detail:
          type: "string"
        code:
          type: "string"
          description: "A stable code, such as `slot-taken`, `sold-out`, `hold-lapsed`,\
            \ `outside-open-hours`, `invalid-recurrence`, `booking-state`."
      example:
        type: "about:blank"
        title: "Slot taken"
        status: 409
        detail: "The requested range overlaps another booking."
        code: "slot-taken"
    ResourceCreate:
      type: "object"
      additionalProperties: false
      required:
      - "code"
      - "name"
      - "zone"
      properties:
        code:
          type: "string"
          minLength: 1
          maxLength: 60
        name:
          type: "string"
          minLength: 1
          maxLength: 200
        zone:
          type: "string"
          description: "An IANA zone id."
        seats:
          type:
          - "integer"
          - "null"
          minimum: 1
    ResourcePatch:
      type: "object"
      additionalProperties: false
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 200
        seats:
          type:
          - "integer"
          - "null"
          minimum: 1
        status:
          type: "string"
          enum:
          - "ACTIVE"
          - "ARCHIVED"
    Resource:
      type: "object"
      additionalProperties: false
      required:
      - "id"
      - "code"
      - "name"
      - "zone"
      - "status"
      - "version"
      properties:
        id:
          type: "string"
          format: "uuid"
        code:
          type: "string"
        name:
          type: "string"
        zone:
          type: "string"
        seats:
          type:
          - "integer"
          - "null"
          minimum: 1
        status:
          type: "string"
          enum:
          - "ACTIVE"
          - "ARCHIVED"
        version:
          type: "integer"
          minimum: 1
    ResourcePage:
      type: "object"
      required:
      - "data"
      properties:
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/Resource"
        page:
          $ref: "#/components/schemas/Page"
    Page:
      type:
      - "object"
      - "null"
      additionalProperties: false
      properties:
        limit:
          type: "integer"
        offset:
          type:
          - "integer"
          - "null"
        total:
          type: "integer"
        next_cursor:
          type:
          - "string"
          - "null"
    WorkingHoursReplace:
      type: "object"
      additionalProperties: false
      required:
      - "hours"
      properties:
        hours:
          type: "array"
          items:
            $ref: "#/components/schemas/WorkingHour"
    WorkingHour:
      type: "object"
      additionalProperties: false
      required:
      - "weekday"
      - "opens"
      - "closes"
      properties:
        weekday:
          type: "integer"
          minimum: 1
          maximum: 7
          description: "ISO weekday, 1 = Monday."
        opens:
          type: "string"
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        closes:
          type: "string"
          pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$"
          description: "Local wall-clock in the resource's zone; `24:00` is allowed."
    WorkingHours:
      type: "object"
      additionalProperties: false
      required:
      - "hours"
      properties:
        hours:
          type: "array"
          items:
            $ref: "#/components/schemas/WorkingHour"
    CalendarExceptionCreate:
      type: "object"
      additionalProperties: false
      required:
      - "fromDate"
      - "toDate"
      - "kind"
      properties:
        fromDate:
          type: "string"
          format: "date"
        toDate:
          type: "string"
          format: "date"
        kind:
          type: "string"
          enum:
          - "CLOSED"
          - "OPEN"
        hours:
          type: "array"
          description: "Required and meaningful when `kind` is `OPEN`; replaces that\
            \ day's hours."
          items:
            $ref: "#/components/schemas/WorkingHour"
    CalendarException:
      allOf:
      - $ref: "#/components/schemas/CalendarExceptionCreate"
      - type: "object"
        required:
        - "id"
        properties:
          id:
            type: "string"
            format: "uuid"
    ExceptionPage:
      type: "object"
      required:
      - "data"
      properties:
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/CalendarException"
    GroupCreate:
      type: "object"
      additionalProperties: false
      required:
      - "code"
      - "name"
      - "strategy"
      properties:
        code:
          type: "string"
          minLength: 1
          maxLength: 60
        name:
          type: "string"
          minLength: 1
          maxLength: 200
        strategy:
          type: "string"
          enum:
          - "PRIORITY"
          - "ROUND_ROBIN"
          - "LEAST_BUSY"
          - "FIT_SEATS"
        maxCombine:
          type: "integer"
          minimum: 1
          maximum: 20
          default: 1
        members:
          type: "array"
          items:
            $ref: "#/components/schemas/GroupMember"
    GroupMember:
      type: "object"
      additionalProperties: false
      required:
      - "resourceId"
      - "priority"
      properties:
        resourceId:
          type: "string"
          format: "uuid"
        priority:
          type: "integer"
          minimum: 0
    GroupPatch:
      type: "object"
      additionalProperties: false
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 200
        strategy:
          type: "string"
          enum:
          - "PRIORITY"
          - "ROUND_ROBIN"
          - "LEAST_BUSY"
          - "FIT_SEATS"
        maxCombine:
          type: "integer"
          minimum: 1
          maximum: 20
        members:
          type: "array"
          items:
            $ref: "#/components/schemas/GroupMember"
    ResourceGroup:
      type: "object"
      additionalProperties: false
      required:
      - "id"
      - "code"
      - "name"
      - "strategy"
      - "maxCombine"
      - "members"
      - "version"
      properties:
        id:
          type: "string"
          format: "uuid"
        code:
          type: "string"
        name:
          type: "string"
        strategy:
          type: "string"
          enum:
          - "PRIORITY"
          - "ROUND_ROBIN"
          - "LEAST_BUSY"
          - "FIT_SEATS"
        maxCombine:
          type: "integer"
          minimum: 1
        members:
          type: "array"
          items:
            $ref: "#/components/schemas/GroupMember"
        version:
          type: "integer"
          minimum: 1
    GroupPage:
      type: "object"
      required:
      - "data"
      properties:
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/ResourceGroup"
    OfferingCreate:
      type: "object"
      additionalProperties: false
      required:
      - "code"
      - "name"
      - "kind"
      - "durationMin"
      - "slotStep"
      properties:
        code:
          type: "string"
          minLength: 1
          maxLength: 60
        name:
          type: "string"
          minLength: 1
          maxLength: 200
        kind:
          type: "string"
          enum:
          - "INTERVAL"
          - "CAPACITY"
        durationMin:
