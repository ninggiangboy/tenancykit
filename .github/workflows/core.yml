name: core

# A change under backend/libs/core/ reaches every service build through includeBuild("../../libs/core"), but a composite build only
# builds the tasks it needs: billing and platform compile core and never run its tests. This workflow runs
# them, and it re-runs the rule-id comparison in all four builds so the shared rule set cannot drift apart unnoticed.
on:
  pull_request:
    paths: ["backend/libs/core/**", ".github/workflows/core.yml"]
  push:
    branches: [main, dev]
    paths: ["backend/libs/core/**", ".github/workflows/core.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/libs/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build

  rule-set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4

      # core-arch pins the generic rule ids and asserts the three services resolve the same list; a rule added,
      # removed or renamed there turns this red.
      - name: Common rule ids
        working-directory: backend/libs/core
        run: ./gradlew :core-arch:test --tests '*ArchitectureRulesTest'

      # Each service declares its own rule ids plus its documented extras, and proves every rule still fails on
      # its fixture. A rule that disappears from one service fails here.
      - name: Billing rule ids
        working-directory: backend/services/billing
        run: ./gradlew :apps:app-boot:test --tests '*ArchitectureTest' --tests '*ArchitectureMetaTest'
      - name: Platform rule ids
        working-directory: backend/services/platform
        run: ./gradlew :apps:app-boot:test --tests '*ArchitectureTest' --tests '*ArchitectureMetaTest'
      - name: Mailer rule ids
        working-directory: backend/services/mailer
        run: ./gradlew :apps:app-boot:test --tests '*ArchitectureTest' --tests '*ArchitectureMetaTest'
      - name: Notification rule ids
        working-directory: backend/services/notification
        run: ./gradlew :apps:app-boot:test --tests '*ArchitectureTest' --tests '*ArchitectureMetaTest'
      - name: Email rule ids
        working-directory: backend/services/mailroom
        run: ./gradlew :apps:app-boot:test --tests '*ArchitectureTest' --tests '*ArchitectureMetaTest'
      - name: Customer rule ids
        working-directory: backend/services/customer
        run: ./gradlew :apps:app-boot:test --tests '*ArchitectureTest' --tests '*ArchitectureMetaTest'
      - name: Loyalty rule ids
        working-directory: backend/services/loyalty
        run: ./gradlew :apps:app-boot:test --tests '*ArchitectureTest' --tests '*ArchitectureMetaTest'
      - name: Attribution rule ids
        working-directory: backend/services/attribution
        run: ./gradlew :apps:app-boot:test --tests '*ArchitectureTest' --tests '*ArchitectureMetaTest'
