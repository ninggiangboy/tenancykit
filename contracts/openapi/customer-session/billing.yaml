---
openapi: "3.1.0"
info:
  title: "Billing API"
  version: "v1"
servers:
- url: "/"
  description: "Any Billing hostname: platform.<base-domain> or <tenant-code>.<base-domain>"
tags:
- name: "Billing sessions"
  description: "The Tenant System side of the customer portal: create a billing session\
    \ and revoke one."
- name: "Portal: session"
  description: "The browser side of a billing session: exchange the single-use token\
    \ for a cookie and read the session."
- name: "Refunds"
  description: "Refunds of payments."
- name: "Payments"
  description: "Wallet top-ups and the payment history. A payment never changes a\
    \ balance; only a verified Stripe event does."
- name: "Portal settings"
  description: "The tenant's allowlist of URLs a billing session may return the customer\
    \ to."
- name: "Usage"
  description: "Usage reported by tenant systems, idempotent per event, and its aggregates."
- name: "Portal: customer"
  description: "The customer the portal session was issued for."
- name: "Charges"
  description: "Charge a wallet directly or by capturing a reservation."
- name: "Reservations"
  description: "Hold part of a wallet's balance for a later charge."
- name: "Wallets"
  description: "Open and read wallets. Amounts are integers in minor units with an\
    \ ISO 4217 currency."
- name: "Webhook deliveries"
  description: "The history of attempts to deliver an event to an endpoint, and resending\
    \ one that finished. A delivery that exhausted its attempts is DEAD and stays\
    \ visible so it can be resent."
- name: "Customers"
  description: "Billing customers of the tenant, optionally mapped to a Tenant System's\
    \ own users."
- name: "Coupons"
  description: "Coupons and promotion codes. Terms are never edited, so the only writes\
    \ after creation are a deactivation and a new code."
- name: "Webhook endpoints"
  description: "Where a tenant wants its events delivered and which event types. The\
    \ signing secret is returned only when an endpoint is created or its secret rotated,\
    \ never again."
- name: "Stripe configuration"
  description: "The tenant's Stripe connection and the history of Stripe webhook processing.\
    \ Nothing here returns a secret."
- name: "Stripe incidents"
  description: "Problems with Stripe that need a person to look, and resolving them."
- name: "Rating"
  description: "What is done with a plan: cost estimates, reserving the estimate and\
    \ charging usage."
- name: "Pricing plans"
  description: "Pricing plans and their versions."
- name: "Portal: wallets and charges"
  description: "The session's customer's wallets, ledger, charges and top-ups."
- name: "Coupon redemptions"
  description: "Redeem a coupon onto a wallet by code or by id, revoke one, and read\
    \ a wallet's redemptions."
- name: "Portal: usage"
  description: "Usage reported for the session's customer."
- name: "Stripe webhooks"
  description: "Where Stripe delivers events. No login: the signature of the raw body\
    \ is the proof."
- name: "Ledger"
  description: "A wallet's append-only ledger, corrected only with reversal entries."
- name: "Portal: payments"
  description: "The session's customer's payments, refunds and the Stripe-hosted payment-methods\
    \ page."
- name: "Subscriptions"
  description: "Subscribe a wallet to a plan, read and cancel subscriptions."
- name: "Portal: invoices and subscriptions"
  description: "The session's customer's invoices and subscriptions."
- name: "Invoices"
  description: "Invoices. An invoice becomes paid only from a verified payment; no\
    \ request marks one paid."
paths:
  /portal/api/top-ups:
    post:
      tags:
      - "Portal: wallets and charges"
      summary: "Start a wallet top-up"
      description: "Starts a top-up of one of the customer's wallets through the Tenant's\
        \ Stripe configuration and answers the Stripe-hosted page where the customer\
        \ pays. The wallet is credited only when a verified Stripe event confirms\
        \ the money arrived. Requires an `Idempotency-Key`; a repeat answers the first\
        \ top-up with `200`.\n\nCallers: customer-session."
      operationId: "topUp"
      parameters:
      - name: "Idempotency-Key"
        in: "header"
        description: "A key the caller chooses so a retry is safe: the same key with\
          \ the same body answers the first result instead of acting twice, and the\
          \ same key with a different body is a conflict."
        required: true
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The top-up to start."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopUpRequest"
        required: true
      responses:
        "200":
          description: "An earlier identical request already created it; that resource\
            \ is returned"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TopUpResponse"
        "201":
          description: "A top-up that was started."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TopUpResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotEntitled"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "422":
          description: "Stripe rejected the request."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: "Stripe could not be reached and the outcome is unknown. Repeat\
            \ the request with the same `Idempotency-Key`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      x-required-portal-permission: "top-up:create"
      x-allowed-callers:
      - "customer-session"
  /portal/api/payment-methods:
    post:
      tags:
      - "Portal: payments"
      summary: "Open the payment-methods page"
      description: "Opens Stripe's hosted page where the customer manages payment\
        \ methods, in the Tenant's own Stripe account. The Stripe customer is created\
        \ once per billing customer and Stripe configuration and reused afterwards.\n\
        \nCallers: customer-session."
      operationId: "paymentMethods"
      responses:
        "200":
          description: "A Stripe-hosted page."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HostedPageResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotEntitled"
        "422":
          description: "Stripe rejected the request."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: "Stripe could not be reached. Repeat the request."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      x-required-portal-permission: "payment-method:manage"
      x-allowed-callers:
      - "customer-session"
  /portal/api/wallets:
    get:
      tags:
      - "Portal: wallets and charges"
      summary: "List the customer's wallets"
      description: "Pages through the wallets of the portal session's customer, with\
        \ the list-query contract's filtering, sorting and paging. The customer is\
        \ fixed by the portal session, so no other customer's data is reachable.\n\
        \n**Filtering, sorting and paging** follow the list-query contract. Conditions\
        \ in `filter[field][op]` are combined with AND. For OR, use `filter[or][i][field][op]`:\
        \ predicates sharing the index `i` are AND-ed and the branches are OR-ed (at\
        \ most 10 branches, 20 predicates in all, 100 values in an `in` list). `neq`\
        \ and `nin` do not match rows where the field is null. Send `limit` with either\
        \ `offset` (at most 10000) or the `cursor` taken from a previous page, never\
        \ both. The body is `{\"data\": [...], \"page\": null}`. `page_info=full`\
        \ fills `page` with `limit`, `offset`, `total` and `next_cursor`; `page_info=cursor`\
        \ fills it with `limit` and `next_cursor` alone, without counting the matching\
        \ rows; omit it for the rows alone.\n\nCallers: customer-session."
      operationId: "wallets_1"
      parameters:
      - name: "filter[balance][eq]"
        in: "query"
        description: "`balance` eq the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[balance][gt]"
        in: "query"
        description: "`balance` gt the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[balance][gte]"
        in: "query"
        description: "`balance` gte the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[balance][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `balance`."
        required: false
        schema:
          type: "string"
      - name: "filter[balance][lt]"
        in: "query"
        description: "`balance` lt the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[balance][lte]"
        in: "query"
        description: "`balance` lte the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[balance][neq]"
        in: "query"
        description: "`balance` neq the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[balance][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `balance`."
        required: false
        schema:
          type: "string"
      - name: "filter[created_at][eq]"
        in: "query"
        description: "`created_at` eq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][gt]"
        in: "query"
        description: "`created_at` gt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][gte]"
        in: "query"
        description: "`created_at` gte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `created_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[created_at][lt]"
        in: "query"
        description: "`created_at` lt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][lte]"
        in: "query"
        description: "`created_at` lte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][neq]"
        in: "query"
        description: "`created_at` neq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `created_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[credit_limit][eq]"
        in: "query"
        description: "`credit_limit` eq the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[credit_limit][gt]"
        in: "query"
        description: "`credit_limit` gt the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[credit_limit][gte]"
        in: "query"
        description: "`credit_limit` gte the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[credit_limit][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `credit_limit`."
        required: false
        schema:
          type: "string"
      - name: "filter[credit_limit][lt]"
        in: "query"
        description: "`credit_limit` lt the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[credit_limit][lte]"
        in: "query"
        description: "`credit_limit` lte the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[credit_limit][neq]"
        in: "query"
        description: "`credit_limit` neq the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[credit_limit][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `credit_limit`."
        required: false
        schema:
          type: "string"
      - name: "filter[currency][eq]"
        in: "query"
        description: "`currency` eq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[currency][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `currency`."
        required: false
        schema:
          type: "string"
      - name: "filter[currency][neq]"
        in: "query"
        description: "`currency` neq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[currency][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `currency`."
        required: false
        schema:
          type: "string"
      - name: "filter[currency][starts_with]"
        in: "query"
        description: "Case-insensitive prefix match on `currency`."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[customer_id][eq]"
        in: "query"
        description: "`customer_id` eq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[customer_id][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `customer_id`."
        required: false
        schema:
          type: "string"
      - name: "filter[customer_id][neq]"
        in: "query"
        description: "`customer_id` neq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[customer_id][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `customer_id`."
        required: false
        schema:
          type: "string"
      - name: "filter[held][eq]"
        in: "query"
        description: "`held` eq the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[held][gt]"
        in: "query"
        description: "`held` gt the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[held][gte]"
        in: "query"
        description: "`held` gte the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[held][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `held`."
        required: false
        schema:
          type: "string"
      - name: "filter[held][lt]"
        in: "query"
        description: "`held` lt the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[held][lte]"
        in: "query"
        description: "`held` lte the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[held][neq]"
        in: "query"
        description: "`held` neq the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[held][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `held`."
        required: false
        schema:
          type: "string"
      - name: "filter[id][eq]"
        in: "query"
        description: "`id` eq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[id][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `id`."
        required: false
        schema:
          type: "string"
      - name: "filter[id][neq]"
        in: "query"
        description: "`id` neq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[id][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `id`."
        required: false
        schema:
          type: "string"
      - name: "filter[last_sequence][eq]"
        in: "query"
        description: "`last_sequence` eq the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[last_sequence][gt]"
        in: "query"
        description: "`last_sequence` gt the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[last_sequence][gte]"
        in: "query"
        description: "`last_sequence` gte the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[last_sequence][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `last_sequence`."
        required: false
        schema:
          type: "string"
      - name: "filter[last_sequence][lt]"
        in: "query"
        description: "`last_sequence` lt the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[last_sequence][lte]"
        in: "query"
        description: "`last_sequence` lte the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[last_sequence][neq]"
        in: "query"
        description: "`last_sequence` neq the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[last_sequence][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `last_sequence`."
        required: false
        schema:
          type: "string"
      - name: "filter[mode][eq]"
        in: "query"
        description: "`mode` eq the value."
        required: false
        schema:
          type: "string"
          enum:
          - "POSTPAID"
          - "PREPAID"
      - name: "filter[mode][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `mode`."
        required: false
        schema:
          type: "string"
      - name: "filter[mode][neq]"
        in: "query"
        description: "`mode` neq the value."
        required: false
        schema:
          type: "string"
          enum:
          - "POSTPAID"
          - "PREPAID"
      - name: "filter[mode][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `mode`."
        required: false
        schema:
          type: "string"
      - name: "sort"
        in: "query"
        description: "Comma-separated sortable fields, each optionally prefixed with\
          \ `-` for descending: created_at, id. At most 4 fields; `id` is appended\
          \ to make the order total. Default: `-created_at,id`."
        required: false
        schema:
          type: "string"
      - name: "limit"
        in: "query"
        description: "Page size, 1 to 200."
        required: false
        schema:
          type: "integer"
          format: "int32"
          default: 50
          maximum: 200
          minimum: 1
      - name: "offset"
        in: "query"
        description: "Rows to skip, at most 10000. Not combinable with `cursor`."
        required: false
        schema:
          type: "integer"
          format: "int32"
          default: 0
          maximum: 10000
          minimum: 0
      - name: "cursor"
        in: "query"
        description: "The `next_cursor` of the previous page. Valid only with the\
          \ same filter and sort."
        required: false
        schema:
          type: "string"
      - name: "page_info"
        in: "query"
        description: "`full` fills `page` with the limit, offset, total and next cursor;\
          \ `cursor` fills it with the limit and the next cursor alone, so a walk\
          \ over a large listing is not counted; omit it for the rows alone."
        required: false
        schema:
          type: "string"
          enum:
          - "full"
          - "cursor"
      responses:
        "200":
          description: "A page of wallet response rows, with the paging facts when\
            \ the request asked for them."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageWalletResponse"
        "400":
          description: "A filter, sort, cursor or paging parameter is unknown, not\
            \ allowed for the field, or not valid for its type."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotEntitled"
      x-required-portal-permission: "wallet:view"
      x-allowed-callers:
      - "customer-session"
  /portal/api/wallets/{id}:
    get:
      tags:
      - "Portal: wallets and charges"
      summary: "Get one of the customer's wallets"
      description: "Returns a wallet of the portal session's customer with its balance,\
        \ held amount and available amount. A wallet of another customer answers `404`.\n\
        \nCallers: customer-session."
      operationId: "wallet"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the wallet."
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "A customer's wallet in one currency."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WalletResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotEntitled"
        "404":
          $ref: "#/components/responses/NotFound"
      x-required-portal-permission: "wallet:view"
      x-allowed-callers:
      - "customer-session"
  /portal/api/wallets/{id}/ledger:
    get:
      tags:
      - "Portal: wallets and charges"
      summary: "List a wallet's ledger"
      description: "Pages through the append-only ledger of one of the customer's\
        \ wallets, with the list-query contract's filtering, sorting and paging.\n\
        \n**Filtering, sorting and paging** follow the list-query contract. Conditions\
        \ in `filter[field][op]` are combined with AND. For OR, use `filter[or][i][field][op]`:\
        \ predicates sharing the index `i` are AND-ed and the branches are OR-ed (at\
        \ most 10 branches, 20 predicates in all, 100 values in an `in` list). `neq`\
        \ and `nin` do not match rows where the field is null. Send `limit` with either\
        \ `offset` (at most 10000) or the `cursor` taken from a previous page, never\
        \ both. The body is `{\"data\": [...], \"page\": null}`. `page_info=full`\
        \ fills `page` with `limit`, `offset`, `total` and `next_cursor`; `page_info=cursor`\
        \ fills it with `limit` and `next_cursor` alone, without counting the matching\
        \ rows; omit it for the rows alone.\n\nCallers: customer-session."
      operationId: "ledger"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the wallet."
        required: true
        schema:
          type: "string"
      - name: "filter[actor][eq]"
        in: "query"
        description: "`actor` eq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[actor][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `actor`."
        required: false
        schema:
          type: "string"
      - name: "filter[actor][neq]"
        in: "query"
        description: "`actor` neq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[actor][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `actor`."
        required: false
        schema:
          type: "string"
      - name: "filter[actor][starts_with]"
        in: "query"
        description: "Case-insensitive prefix match on `actor`."
        required: false
        schema:
