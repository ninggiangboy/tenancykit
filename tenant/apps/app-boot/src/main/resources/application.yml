spring:
  application:
    name: tenant
  datasource:
    url: ${SAMPLE_TENANT_DB_URL:jdbc:postgresql://localhost:5433/tenant}
    username: ${SAMPLE_TENANT_DB_USER:tenant}
    password: ${SAMPLE_TENANT_DB_PASSWORD:tenant}
  flyway:
    locations: classpath:db/migration
    # Migrations run as the table owner; the application runs as the unprivileged role. The owner is the database
    # owner, which alone may create in `public` since PostgreSQL 15.
    url: ${SAMPLE_TENANT_MIGRATION_DB_URL:${SAMPLE_TENANT_DB_URL:jdbc:postgresql://localhost:5433/tenant}}
    user: ${SAMPLE_TENANT_MIGRATION_DB_USER:${SAMPLE_TENANT_DB_USER:tenant}}
    password: ${SAMPLE_TENANT_MIGRATION_DB_PASSWORD:${SAMPLE_TENANT_DB_PASSWORD:tenant}}

server:
  port: ${SAMPLE_TENANT_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health

tenant:
  # Platform issues the suite token Billing accepts. This Tenant System's client credentials are the
  # tenant-system credential created through Platform's credential management.
  platform:
    base-url: ${SAMPLE_TENANT_PLATFORM_URL:http://localhost:8082}
    client-id: ${SAMPLE_TENANT_PLATFORM_CLIENT_ID:}
    client-secret: ${SAMPLE_TENANT_PLATFORM_CLIENT_SECRET:}
    # The app this token is for: the aud claim Billing verifies.
    audience: ${SAMPLE_TENANT_PLATFORM_AUDIENCE:billing}
    connect-timeout: PT3S
    request-timeout: PT10S
    # A cached token is discarded this long before it expires, so a request never carries a nearly dead one.
    refresh-skew: PT60S
  billing:
    # The Billing deployment this tenant integrates with. Every financial call goes here.
    base-url: ${SAMPLE_TENANT_BILLING_URL:http://localhost:8080}
    connect-timeout: PT3S
    read-timeout: PT10S
    max-attempts: 3
    retry-backoff: PT0.2S
  webhooks:
    # The signing secret Billing returned once for this tenant's webhook endpoint.
    signing-secret: ${SAMPLE_TENANT_WEBHOOK_SECRET:}
    tolerance: PT5M
  execution:
    enabled: ${SAMPLE_TENANT_EXECUTION_ENABLED:true}
    poll-delay: PT2S
    batch-size: 10
    max-attempts: 3
  resource:
    reservation-ttl: PT15M
  portal:
    # Where Billing sends the customer back to when a session names no return URL.
    return-url: ${SAMPLE_TENANT_PORTAL_RETURN_URL:http://localhost:5174/portal/return}
  bootstrap:
    # One-shot, safe to repeat. Off by default because it needs an administrator token.
    enabled: ${SAMPLE_TENANT_BOOTSTRAP_ENABLED:false}
    admin-token: ${SAMPLE_TENANT_BOOTSTRAP_ADMIN_TOKEN:}
    webhook-url: ${SAMPLE_TENANT_WEBHOOK_URL:http://localhost:8082/webhooks/billing}
    webhook-event-types: "reservation.created,reservation.expired,reservation.released,charge.succeeded,charge.failed,payment.succeeded,payment.failed,refund.succeeded,invoice.created,invoice.paid,subscription.renewed,subscription.payment_failed"
  identity:
    session-ttl: PT12H
