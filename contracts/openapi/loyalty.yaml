openapi: 3.1.0
info:
  title: Loyalty API
  description: "The API a Tenant System uses to run its points program: configure the program, its ordered tiers and its promotions; enrol members and read their points, debt, tier, next tier and expiring lots; record orders and returns so points are earned and clawed back by the same rules; spend points and reverse a spend; redeem rewards for single-use vouchers and use a voucher once; and manage the signed webhooks loyalty sends to the Tenant's own endpoints. Every change to a member's points, tier or vouchers is reported to the Tenant as a signed HTTP webhook, never through a broker exchange. The tenant is taken from the request's host and suite token, never from a body: every call acts on one Tenant's data only, and no request body carries a tenant."
  version: v1
servers:
- url: /loyalty
  description: "Any tenant hostname: <tenant-code>.<base-domain>/loyalty"
tags:
- name: "Program"
  description: "The tenant's one points program: read it and create or replace it."
- name: "Tiers"
  description: "The program's ordered tier list, read and replaced as a whole."
- name: "Promotions"
  description: "Promotions that change how points are earned: list, create, read and update."
- name: "Members"
  description: "Enrol or update a member, read their points, tier and expiring points, list their ledger entries and erase them."
- name: "Orders"
  description: "Record orders and returns, and read what an order earned and what its returns took back."
- name: "Rewards"
  description: "The rewards members can redeem points for: list, create, read and update, and redeem one for a member, which issues a voucher."
- name: "Redemptions"
  description: "Spend a member's points, read a redemption and reverse it."
- name: "Vouchers"
  description: "Vouchers a reward redemption issued: list a member's vouchers, read one by code and use it once."
- name: "Webhook endpoints"
  description: "Where the tenant wants this service's events delivered, and which event types. The signing secret is returned only when an endpoint is created or its secret rotated, never again."
- name: "Webhook deliveries"
  description: "The history of attempts to deliver an event to an endpoint, and resending one that finished. A delivery that exhausted its attempts stays visible so it can be resent."
paths:
  /api/v1/program:
    get:
      tags:
      - "Program"
      summary: "Read the points program"
      operationId: getProgram
      responses:
        "200":
          description: "The tenant's one points program."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Program"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No program is configured yet for this tenant. Code `PROGRAM_NOT_CONFIGURED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: loyalty:program:read
      description: "Callers: tenant-user. Requires `loyalty:program:read`."
      x-allowed-callers:
      - "tenant-user"
    put:
      tags:
      - "Program"
      summary: "Create or replace the points program"
      description: "A full replace of the tenant's one program. The response carries the resource's `ETag`; pass it as `If-Match` on the next write. The `currency` is immutable once a ledger entry exists.\n\nCallers: tenant-user. Requires `loyalty:program:manage`."
      operationId: putProgram
      parameters:
      - name: If-Match
        in: header
        required: false
        description: "Required by this update; the endpoint answers `428` without it and `412` when it does not match the current `ETag`."
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Program"
        required: true
      responses:
        "200":
          description: "The program, created or replaced."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Program"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "The program's `currency` cannot change once a ledger entry exists. Code `CURRENCY_IMMUTABLE`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          description: "A field is out of range or malformed: `currency` is not an ISO 4217 code, `currencyUnit` is below 1, `expiryMonths` is outside 1-120, `expiryNoticeDays` is outside 0-365, `tierWindowMonths` is outside 1-60, or `timeZone` is not an IANA id. Code `VALIDATION_FAILED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
      x-required-permission: loyalty:program:manage
      x-allowed-callers:
      - "tenant-user"
  /api/v1/tiers:
    get:
      tags:
      - "Tiers"
      summary: "Read the ordered tier list"
      operationId: getTiers
      responses:
        "200":
          description: "The whole tier list in order."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TierList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No program is configured yet for this tenant. Code `PROGRAM_NOT_CONFIGURED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: loyalty:program:read
      description: "Callers: tenant-user. Requires `loyalty:program:read`."
      x-allowed-callers:
      - "tenant-user"
    put:
      tags:
      - "Tiers"
      summary: "Replace the ordered tier list"
      description: "Replaces the whole tier list by `code`: an existing code keeps its identity, a new code is added, and a removed code is allowed only while no member holds it. A change re-evaluates every member's tier in the daily job. The response carries the list's `ETag`.\n\nCallers: tenant-user. Requires `loyalty:program:manage`."
      operationId: putTiers
      parameters:
      - name: If-Match
        in: header
        required: false
        description: "Required by this update; the endpoint answers `428` without it and `412` when it does not match the current `ETag`."
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TierList"
        required: true
      responses:
        "200":
          description: "The tier list as stored."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TierList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "A tier was removed while a member still holds it. Code `TIER_IN_USE`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          description: "The list is empty, its first tier's `minSpend` is not 0, its `minSpend` thresholds do not strictly increase, it has duplicate `code`s, a negative `minSpend`, or an `earnMultiplier` below 1.00 or above 10.00. Code `TIER_LIST_INVALID`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
      x-required-permission: loyalty:program:manage
      x-allowed-callers:
      - "tenant-user"
  /api/v1/promotions:
    get:
      tags:
      - "Promotions"
      summary: "List promotions"
      operationId: listPromotions
      parameters:
      - name: active
        in: query
        required: false
        description: "When set, return only active (`true`) or only inactive (`false`) promotions."
        schema:
          type: boolean
      - name: limit
        in: query
        required: false
        description: "Page size, 1 to 200."
        schema:
          type: integer
          format: int32
          default: 50
          minimum: 1
          maximum: 200
      - name: cursor
        in: query
        required: false
        description: "The `next_cursor` of the previous page. Valid only with the same filter."
        schema:
          type: string
      responses:
        "200":
          description: "A page of promotions."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PromotionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permission: loyalty:program:read
      description: "Callers: tenant-user. Requires `loyalty:program:read`."
      x-allowed-callers:
      - "tenant-user"
    post:
      tags:
      - "Promotions"
      summary: "Create a promotion"
      operationId: createPromotion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionRequest"
        required: true
      responses:
        "201":
          description: "The promotion was created."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Promotion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: "The window ends before it starts, `multiplier` is below 1.01 or above 10.00, a `daysOfWeek` value is outside 1-7, or the tenant already holds 200 non-archived promotions. Code `VALIDATION_FAILED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: loyalty:program:manage
      description: "Callers: tenant-user. Requires `loyalty:program:manage`."
      x-allowed-callers:
      - "tenant-user"
  /api/v1/promotions/{id}:
    get:
      tags:
      - "Promotions"
      summary: "Read a promotion"
      operationId: getPromotion
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "The promotion."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Promotion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No promotion with that id in this tenant. Code `PROMOTION_NOT_FOUND`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: loyalty:program:read
      description: "Callers: tenant-user. Requires `loyalty:program:read`."
      x-allowed-callers:
      - "tenant-user"
    patch:
      tags:
      - "Promotions"
      summary: "Update a promotion"
      description: "Changes only the given fields. The response carries the promotion's `ETag`.\n\nCallers: tenant-user. Requires `loyalty:program:manage`."
      operationId: updatePromotion
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: If-Match
        in: header
        required: false
        description: "Required by this update; the endpoint answers `428` without it and `412` when it does not match the current `ETag`."
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionPatch"
        required: true
      responses:
        "200":
          description: "The promotion as stored."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Promotion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No promotion with that id in this tenant. Code `PROMOTION_NOT_FOUND`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          description: "A changed field is out of range: the window ends before it starts, `multiplier` is below 1.01 or above 10.00, or a `daysOfWeek` value is outside 1-7. Code `VALIDATION_FAILED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
      x-required-permission: loyalty:program:manage
      x-allowed-callers:
      - "tenant-user"
  /api/v1/members/{externalRef}:
    put:
      tags:
      - "Members"
      summary: "Enrol or update a member"
      description: "Enrols a member ahead of its first order. Idempotent by `externalRef`: `201` when the member is created and `200` when it already exists. An order for an unknown ref enrols the member the same way and emits the same webhook.\n\nCallers: tenant-user. Requires `loyalty:member:manage`."
      operationId: putMember
      parameters:
      - name: externalRef
        in: path
        required: true
        description: "The Tenant's reference for the member, unique per tenant and immutable."
        schema:
          type: string
          minLength: 1
          maxLength: 200
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpsert"
        required: true
      responses:
        "200":
          description: "The member already existed."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Member"
        "201":
          description: "The member was created."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: "`externalRef` is empty or over 200 characters, or `displayName` is over 255 characters. Code `VALIDATION_FAILED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: loyalty:member:manage
      x-allowed-callers:
      - "tenant-user"
    get:
      tags:
      - "Members"
      summary: "Read a member's points, tier and expiring points"
      operationId: getMember
      parameters:
      - name: externalRef
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: expiringWithinDays
        in: query
        required: false
        description: "Return the lots that expire within this many days. Defaults to 30 and is capped at 365."
        schema:
          type: integer
          format: int32
          default: 30
          minimum: 0
          maximum: 365
      responses:
        "200":
          description: "The member with its computed balance, debt, tier, next tier and the points expiring in the requested window."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No member with that `externalRef` in this tenant, or the member was erased. Code `MEMBER_NOT_FOUND`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: loyalty:member:read
      description: "Callers: tenant-user. Requires `loyalty:member:read`."
      x-allowed-callers:
      - "tenant-user"
  /api/v1/members/{externalRef}/ledger:
    get:
      tags:
      - "Members"
      summary: "List a member's ledger entries"
      description: "The member's append-only ledger, newest first, keyset-paginated by `cursor`.\n\nCallers: tenant-user. Requires `loyalty:member:read`."
      operationId: getMemberLedger
      parameters:
      - name: externalRef
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: kind
        in: query
        required: false
        description: "Return only entries of this kind."
        schema:
          type: string
          enum:
          - EARN
          - REDEEM
          - REVERSE
          - EXPIRE
          - CLAWBACK
          - DEBT_REPAY
      - name: limit
        in: query
        required: false
        description: "Page size, 1 to 200."
        schema:
          type: integer
          format: int32
          default: 50
          minimum: 1
          maximum: 200
      - name: cursor
        in: query
        required: false
        description: "The `next_cursor` of the previous page. Valid only with the same filter."
        schema:
          type: string
      responses:
        "200":
          description: "A page of the member's ledger entries."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LedgerPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No member with that `externalRef` in this tenant, or the member was erased. Code `MEMBER_NOT_FOUND`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: loyalty:member:read
      x-allowed-callers:
      - "tenant-user"
  /api/v1/members/{externalRef}/erasure:
    post:
      tags:
      - "Members"
      summary: "Erase a member"
      description: "Anonymizes the member, voids its unused vouchers and keeps its ledger as anonymous totals keyed by the opaque member id. Idempotent: erasing an already erased member replays `200`. Emits `member.erased`.\n\nCallers: tenant-user. Requires `loyalty:member:erase`."
      operationId: eraseMember
      parameters:
      - name: externalRef
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      responses:
        "200":
          description: "The member was erased (or had been erased already)."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErasureResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No member with that `externalRef` in this tenant. Code `MEMBER_NOT_FOUND`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: loyalty:member:erase
      x-allowed-callers:
      - "tenant-user"
  /api/v1/orders/{orderRef}:
    put:
      tags:
      - "Orders"
      summary: "Record an order"
      description: "Records an order once and grants the points it earns. Idempotent by `orderRef`: the same body replays the stored result with `200`, a different body is `409`. The first order for an unknown `externalRef` enrols the member. The order lines use the shared order shape.\n\nCallers: tenant-user. Requires `loyalty:order:record`."
      operationId: putOrder
      parameters:
      - name: orderRef
        in: path
        required: true
        description: "The Tenant's reference for the order, unique per tenant."
        schema:
          type: string
          minLength: 1
          maxLength: 200
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpsert"
        required: true
      responses:
        "200":
          description: "The order was recorded before with the same body; the stored result is replayed."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderView"
        "201":
          description: "The order was recorded and its points were granted."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "No program is configured yet (`PROGRAM_NOT_CONFIGURED`), or the same `orderRef` was sent before with a different body (`IDEMPOTENCY_CONFLICT`)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "The order's `currency` differs from the program's (`CURRENCY_MISMATCH`); the order has no lines or more than 500 (`LINE_LIMIT_EXCEEDED`); or an amount is negative, a quantity is not positive, or `occurredAt` is more than 5 minutes in the future (`VALIDATION_FAILED`)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: loyalty:order:record
      x-allowed-callers:
      - "tenant-user"
    get:
      tags:
      - "Orders"
      summary: "Read what an order earned and what its returns took back"
      operationId: getOrder
      parameters:
      - name: orderRef
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      responses:
        "200":
          description: "The order, its points, its stored earn snapshot and its returns."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "loyalty has not recorded that order. Code `ORDER_NOT_FOUND`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: loyalty:member:read
      description: "Callers: tenant-user. Requires `loyalty:member:read`."
      x-allowed-callers:
      - "tenant-user"
  /api/v1/orders/{orderRef}/returns/{returnRef}:
    put:
      tags:
      - "Orders"
      summary: "Record a return against an order"
      description: "Records one return once and recomputes the order's points with the snapshot stored when the order was recorded, never with today's rules. Idempotent by `returnRef`: the same body replays the stored result with `200`, a different body is `409`.\n\nCallers: tenant-user. Requires `loyalty:order:record`."
      operationId: putOrderReturn
      parameters:
      - name: orderRef
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: returnRef
        in: path
        required: true
        description: "The Tenant's reference for the return, unique per tenant."
        schema:
          type: string
          minLength: 1
          maxLength: 200
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderReturn"
        required: true
      responses:
        "200":
          description: "The return was recorded before with the same body; the stored result is replayed."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderView"
        "201":
          description: "The return was recorded and the points were clawed back."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "The same `returnRef` was sent before with a different body. Code `IDEMPOTENCY_CONFLICT`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "loyalty has not seen the order (`ORDER_UNKNOWN`, the caller retries); the cumulative returned quantity or amount would exceed what the order line holds (`RETURN_EXCEEDS_SALE`); or a line is not in the order or an amount is negative (`VALIDATION_FAILED`)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-permission: loyalty:order:record
      x-allowed-callers:
      - "tenant-user"
  /api/v1/members/{externalRef}/redemptions:
    post:
      tags:
      - "Redemptions"
      summary: "Spend a member's points"
      description: "Spends points at once and consumes lots by earliest expiry. Requires an `Idempotency-Key`: the same key and body replays the stored result with `200`, a different body is `409`.\n\nCallers: tenant-user. Requires `loyalty:points:redeem`."
      operationId: createRedemption
      parameters:
      - name: externalRef
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: Idempotency-Key
        in: header
        required: true
        description: "The caller's idempotency key for this spend."
