---
openapi: "3.1.0"
info:
  title: "Mailroom API"
  description: "The API a Tenant System uses to email a Tenant's own customers, plus\
    \ the public tracking endpoints a recipient's mail client calls without credentials."
  version: "v1"
servers:
- url: "/mailroom"
  description: "Any tenant hostname: <tenant-code>.<base-domain>/mailroom"
tags:
- name: "Segments"
  description: "Saved filters over receiver attributes, with a preview of the audience\
    \ they match."
- name: "Campaigns"
  description: "Bulk email campaigns and their state machine: draft, schedule, send,\
    \ pause, resume, cancel, test and statistics."
- name: "Suppressions"
  description: "Addresses the tenant must not mail. Removing one is the only action\
    \ that re-subscribes an address."
- name: "Email templates"
  description: "A tenant's email templates. Every edit appends an immutable revision,\
    \ so recorded emails and campaigns never change."
- name: "Public tracking"
  description: "Unauthenticated endpoints a recipient's mail client hits: open pixel,\
    \ tracked link and one-click unsubscribe."
- name: "Receiver groups"
  description: "Static groups of receivers and their membership."
- name: "Mail settings"
  description: "The tenant's default sender, reply-to, body retention and campaign\
    \ publish rate."
- name: "Emails"
  description: "Sending one email or a batch, and reading the email ledger."
- name: "Receivers"
  description: "A tenant's own customers by email address. Deleting a receiver is\
    \ an erasure, not a soft delete."
paths:
  /api/v1/templates/{id}:
    get:
      tags:
      - "Email templates"
      summary: "Get an email template"
      description: "Returns one template at its current revision; its version is also\
        \ the response's `ETag`. An unknown id answers `404`.\n\nCallers: tenant-user,\
        \ tenant-system. Requires `mailroom:template:read`."
      operationId: "get"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the template."
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "A template at its current revision."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-required-permission: "mailroom:template:read"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
    put:
      tags:
      - "Email templates"
      summary: "Edit an email template"
      description: "Appends a new immutable revision with the name, subject and bodies\
        \ given and moves the template's pointer to it. A revision an email or campaign\
        \ already recorded is never rewritten. Pass the current `ETag` in `If-Match`;\
        \ a stale version is refused.\n\nCallers: tenant-user, tenant-system. Requires\
        \ `mailroom:template:manage`."
      operationId: "update"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the template."
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "If-Match"
        in: "header"
        description: "The `ETag` of the version the caller last read. The change is\
          \ refused with `412` when the resource has moved on since."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The template to create, or the new content of an existing one."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateRequest"
        required: true
      responses:
        "200":
          description: "A template at its current revision."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
      x-required-permission: "mailroom:template:manage"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
    delete:
      tags:
      - "Email templates"
      summary: "Delete an email template"
      description: "Removes the template. Its revisions are kept, so a campaign that\
        \ pinned one still renders. Pass the current `ETag` in `If-Match`; a stale\
        \ version is refused. Answers `204`. Requires `mailroom:template:manage`.\n\
        \nCallers: tenant-user, tenant-system. Requires `mailroom:template:manage`."
      operationId: "delete"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the template."
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "If-Match"
        in: "header"
        description: "The `ETag` of the version the caller last read. The change is\
          \ refused with `412` when the resource has moved on since."
        required: false
        schema:
          type: "string"
      responses:
        "204":
          description: "No Content"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
      x-required-permission: "mailroom:template:manage"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
  /api/v1/settings:
    get:
      tags:
      - "Mail settings"
      summary: "Get the tenant's mail settings"
      description: "Returns the tenant's default sender, reply-to, body retention\
        \ in days and campaign publish rate per minute, with the settings' version.\n\
        \nCallers: tenant-user, tenant-system. Requires `mailroom:email:read`."
      operationId: "current"
      responses:
        "200":
          description: "The tenant's mail settings."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permission: "mailroom:email:read"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
    put:
      tags:
      - "Mail settings"
      summary: "Replace the tenant's mail settings"
      description: "Stores the default sender (`fromKey`, `fromName`), `replyTo`,\
        \ `bodyRetentionDays` and `campaignPublishPerMinute`, each bounded as the\
        \ schema states. The publish rate is the tenant's total across all its campaigns.\n\
        \nCallers: tenant-user. Requires `mailroom:settings:manage`."
      operationId: "save"
      requestBody:
        description: "The tenant's mail settings to store, each bounded as the schema\
          \ states."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsRequest"
        required: true
      responses:
        "200":
          description: "The tenant's mail settings."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permission: "mailroom:settings:manage"
      x-allowed-callers:
      - "tenant-user"
  /api/v1/segments/{id}:
    get:
      tags:
      - "Segments"
      summary: "Get a segment"
      description: "Returns one segment with its filter; its version is also the response's\
        \ `ETag`. An unknown id answers `404`.\n\nCallers: tenant-user, tenant-system.\
        \ Requires `mailroom:receiver:read`."
      operationId: "get_1"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the segment."
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "A saved segment."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SegmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-required-permission: "mailroom:receiver:read"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
    put:
      tags:
      - "Segments"
      summary: "Replace a segment"
      description: "Replaces the segment's name and filter; the new filter is validated\
        \ first. Pass the current `ETag` in `If-Match`; a stale version is refused.\n\
        \nCallers: tenant-user, tenant-system. Requires `mailroom:receiver:manage`."
      operationId: "update_1"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the segment."
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "If-Match"
        in: "header"
        description: "The `ETag` of the version the caller last read. The change is\
          \ refused with `412` when the resource has moved on since."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The segment to save."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentRequest"
        required: true
      responses:
        "200":
          description: "A saved segment."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SegmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
      x-required-permission: "mailroom:receiver:manage"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
    delete:
      tags:
      - "Segments"
      summary: "Delete a segment"
      description: "Deletes the saved segment. A campaign that already snapshotted\
        \ it keeps its recipients. Pass the current `ETag` in `If-Match`; a stale\
        \ version is refused. Answers `204`. Requires `mailroom:receiver:manage`.\n\
        \nCallers: tenant-user, tenant-system. Requires `mailroom:receiver:manage`."
      operationId: "delete_1"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the segment."
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "If-Match"
        in: "header"
        description: "The `ETag` of the version the caller last read. The change is\
          \ refused with `412` when the resource has moved on since."
        required: false
        schema:
          type: "string"
      responses:
        "204":
          description: "No Content"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
      x-required-permission: "mailroom:receiver:manage"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
  /api/v1/receivers:
    get:
      tags:
      - "Receivers"
      summary: "List receivers"
      description: "Pages through the tenant's receivers, with the list-query contract's\
        \ filtering, sorting and paging. \n\n**Filtering, sorting and paging** follow\
        \ the list-query contract. Conditions in `filter[field][op]` are combined\
        \ with AND. For OR, use `filter[or][i][field][op]`: predicates sharing the\
        \ index `i` are AND-ed and the branches are OR-ed (at most 10 branches, 20\
        \ predicates in all, 100 values in an `in` list). `neq` and `nin` do not match\
        \ rows where the field is null. Send `limit` with either `offset` (at most\
        \ 10000) or the `cursor` taken from a previous page, never both. The body\
        \ is `{\"data\": [...], \"page\": null}`. `page_info=full` fills `page` with\
        \ `limit`, `offset`, `total` and `next_cursor`; `page_info=cursor` fills it\
        \ with `limit` and `next_cursor` alone, without counting the matching rows;\
        \ omit it for the rows alone.\n\nCallers: tenant-user, tenant-system. Requires\
        \ `mailroom:receiver:read`."
      operationId: "list"
      parameters:
      - name: "filter[created_at][eq]"
        in: "query"
        description: "`created_at` eq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][gt]"
        in: "query"
        description: "`created_at` gt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][gte]"
        in: "query"
        description: "`created_at` gte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `created_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[created_at][lt]"
        in: "query"
        description: "`created_at` lt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][lte]"
        in: "query"
        description: "`created_at` lte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][neq]"
        in: "query"
        description: "`created_at` neq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `created_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[email][eq]"
        in: "query"
        description: "`email` eq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[email][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `email`."
        required: false
        schema:
          type: "string"
      - name: "filter[email][neq]"
        in: "query"
        description: "`email` neq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[email][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `email`."
        required: false
        schema:
          type: "string"
      - name: "filter[email][starts_with]"
        in: "query"
        description: "Case-insensitive prefix match on `email`."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[first_name][eq]"
        in: "query"
        description: "`first_name` eq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[first_name][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `first_name`."
        required: false
        schema:
          type: "string"
      - name: "filter[first_name][is_null]"
        in: "query"
        description: "`true` for rows where `first_name` is null, `false` for rows\
          \ where it is set."
        required: false
        schema:
          type: "boolean"
      - name: "filter[first_name][neq]"
        in: "query"
        description: "`first_name` neq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[first_name][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `first_name`."
        required: false
        schema:
          type: "string"
      - name: "filter[first_name][starts_with]"
        in: "query"
        description: "Case-insensitive prefix match on `first_name`."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[id][eq]"
        in: "query"
        description: "`id` eq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[id][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `id`."
        required: false
        schema:
          type: "string"
      - name: "filter[id][neq]"
        in: "query"
        description: "`id` neq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[id][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `id`."
        required: false
        schema:
          type: "string"
      - name: "filter[last_name][eq]"
        in: "query"
        description: "`last_name` eq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[last_name][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `last_name`."
        required: false
        schema:
          type: "string"
      - name: "filter[last_name][is_null]"
        in: "query"
        description: "`true` for rows where `last_name` is null, `false` for rows\
          \ where it is set."
        required: false
        schema:
          type: "boolean"
      - name: "filter[last_name][neq]"
        in: "query"
        description: "`last_name` neq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[last_name][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `last_name`."
        required: false
        schema:
          type: "string"
      - name: "filter[last_name][starts_with]"
        in: "query"
        description: "Case-insensitive prefix match on `last_name`."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[status][eq]"
        in: "query"
        description: "`status` eq the value."
        required: false
        schema:
          type: "string"
          enum:
          - "SUBSCRIBED"
          - "UNSUBSCRIBED"
      - name: "filter[status][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `status`."
        required: false
        schema:
          type: "string"
      - name: "filter[status][neq]"
        in: "query"
        description: "`status` neq the value."
        required: false
        schema:
          type: "string"
          enum:
          - "SUBSCRIBED"
          - "UNSUBSCRIBED"
      - name: "filter[status][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `status`."
        required: false
        schema:
          type: "string"
      - name: "filter[updated_at][eq]"
        in: "query"
        description: "`updated_at` eq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][gt]"
        in: "query"
        description: "`updated_at` gt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][gte]"
        in: "query"
        description: "`updated_at` gte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `updated_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[updated_at][lt]"
        in: "query"
        description: "`updated_at` lt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][lte]"
        in: "query"
        description: "`updated_at` lte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][neq]"
        in: "query"
        description: "`updated_at` neq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `updated_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[version][eq]"
        in: "query"
        description: "`version` eq the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[version][gt]"
        in: "query"
        description: "`version` gt the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[version][gte]"
        in: "query"
        description: "`version` gte the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[version][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `version`."
        required: false
        schema:
          type: "string"
      - name: "filter[version][lt]"
        in: "query"
        description: "`version` lt the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[version][lte]"
        in: "query"
        description: "`version` lte the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[version][neq]"
        in: "query"
        description: "`version` neq the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[version][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `version`."
        required: false
        schema:
          type: "string"
      - name: "sort"
        in: "query"
        description: "Comma-separated sortable fields, each optionally prefixed with\
          \ `-` for descending: created_at, email, id. At most 4 fields; `id` is appended\
          \ to make the order total. Default: `-id`."
        required: false
        schema:
          type: "string"
      - name: "limit"
        in: "query"
        description: "Page size, 1 to 200."
        required: false
        schema:
          type: "integer"
          format: "int32"
          default: 50
          maximum: 200
          minimum: 1
      - name: "offset"
        in: "query"
        description: "Rows to skip, at most 10000. Not combinable with `cursor`."
        required: false
        schema:
          type: "integer"
          format: "int32"
          default: 0
          maximum: 10000
          minimum: 0
      - name: "cursor"
        in: "query"
        description: "The `next_cursor` of the previous page. Valid only with the\
          \ same filter and sort."
        required: false
        schema:
          type: "string"
      - name: "page_info"
        in: "query"
        description: "`full` fills `page` with the limit, offset, total and next cursor;\
          \ `cursor` fills it with the limit and the next cursor alone, so a walk\
          \ over a large listing is not counted; omit it for the rows alone."
        required: false
        schema:
          type: "string"
          enum:
          - "full"
          - "cursor"
      responses:
        "200":
          description: "A page of receiver response rows, with the paging facts when\
            \ the request asked for them."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageReceiverResponse"
        "400":
          description: "A filter, sort, cursor or paging parameter is unknown, not\
            \ allowed for the field, or not valid for its type."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permission: "mailroom:receiver:read"
      x-allowed-callers:
