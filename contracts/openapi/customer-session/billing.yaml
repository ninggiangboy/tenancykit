      type: "object"
      description: "A page of charge response rows, with the paging facts when the\
        \ request asked for them."
      properties:
        data:
          type: "array"
          description: "The rows of this page."
          items:
            $ref: "#/components/schemas/ChargeResponse"
        page:
          description: "The paging facts, or null when the request did not ask for\
            \ them with `page_info`."
          oneOf:
          - $ref: "#/components/schemas/PageInfo"
          - type: "null"
    UsageTotalResponse:
      type: "object"
      description: "The usage of one metric over a period."
      properties:
        metric:
          type: "string"
          description: "The name of the metric."
        unit:
          type: "string"
          description: "The unit the metric is measured in."
        quantity:
          type: "string"
          description: "The quantity as a decimal string with up to six decimal places."
        events:
          type: "integer"
          format: "int64"
          description: "The number of events counted."
    IncidentResponse:
      type: "object"
      description: "A problem with Stripe that needs a person to look."
      properties:
        id:
          type: "string"
          description: "The id."
        kind:
          type: "string"
          description: "`SIGNATURE_REJECTED`, `UNKNOWN_ACCOUNT`, `EVENT_REJECTED`\
            \ or `RECONCILIATION_MISMATCH`."
        subject:
          type: "string"
          description: "What the incident is about."
        detail:
          type: "string"
          description: "Details of what happened."
        occurrences:
          type: "integer"
          format: "int32"
          description: "How many times it happened."
        createdAt:
          type: "string"
          format: "date-time"
          description: "When the record was created."
        lastSeenAt:
          type: "string"
          format: "date-time"
          description: "When it last happened."
        resolvedAt:
          type: "string"
          format: "date-time"
          description: "When it was resolved, or null."
    PageIncidentResponse:
      type: "object"
      description: "A page of incident response rows, with the paging facts when the\
        \ request asked for them."
      properties:
        data:
          type: "array"
          description: "The rows of this page."
          items:
            $ref: "#/components/schemas/IncidentResponse"
        page:
          description: "The paging facts, or null when the request did not ask for\
            \ them with `page_info`."
          oneOf:
          - $ref: "#/components/schemas/PageInfo"
          - type: "null"
    PageEventResponse:
      type: "object"
      description: "A page of event response rows, with the paging facts when the\
        \ request asked for them."
      properties:
        data:
          type: "array"
          description: "The rows of this page."
          items:
            $ref: "#/components/schemas/EventResponse"
        page:
          description: "The paging facts, or null when the request did not ask for\
            \ them with `page_info`."
          oneOf:
          - $ref: "#/components/schemas/PageInfo"
          - type: "null"
    ProblemDetail:
      type: "object"
      description: "The body of every error: an RFC 9457 problem."
      properties:
        type:
          type: "string"
          description: "A URI reference that identifies the kind of problem. It is\
            \ `about:blank` when the status says it all."
        title:
          type: "string"
          description: "A short, human-readable summary of the kind of problem. It\
            \ is the status's reason phrase unless a more specific one applies."
        status:
          type: "integer"
          format: "int32"
          description: "The HTTP status of the response."
        detail:
          type: "string"
          description: "A sentence that explains this occurrence."
        instance:
          type: "string"
          description: "A URI reference that identifies this occurrence, when there\
            \ is one."
  responses:
    BadRequest:
      description: "The request is malformed: a body, query parameter or header is\
        \ missing, unknown, or not valid for its type."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Unauthenticated:
      description: "The request carries no valid token."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Forbidden:
      description: "The token does not carry the permission this operation requires,\
        \ or the tenant has not enabled the app."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotEntitled:
      description: "The tenant has not enabled this app, or the caller may not act\
        \ here."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: "Nothing with that id exists for this tenant. A resource of another\
        \ tenant answers the same."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    IdempotencyConflict:
      description: "The `Idempotency-Key` was already used with a different body,\
        \ or the request clashes with the current state of the data."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    PreconditionFailed:
      description: "The `If-Match` tag does not match the resource's current version.\
        \ The response carries the current `ETag`; read the resource again and retry."
      headers:
        ETag:
          description: "The current version of the resource."
          schema:
            type: "string"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
  securitySchemes:
    oidc:
      type: "http"
      description: "Billing User signed in through Keycloak"
      scheme: "bearer"
      bearerFormat: "JWT"
    suiteToken:
      type: "http"
      description: "Platform suite token for a Tenant System; obtain it from POST\
        \ /oauth/token on Platform"
      scheme: "bearer"
      bearerFormat: "JWT"
    portalSession:
      type: "apiKey"
      description: "Billing Session cookie, obtained by exchanging the single-use\
        \ portal token"
      name: "billing_portal"
      in: "cookie"
