<!-- @dsCard group="Data" height=640 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>DataTable preview</title></head>
<body>
<div id="root" class="sc-demo sc-demo--col" data-app="billing"></div>
<script>
  var S = window.Suite, h = React.createElement;
  var rows = [
    { id: 'INV-2026-00412', customer: 'Lumen Coffee', email: 'ap@lumen.example', status: 'OPEN', total: 1250000, ccy: 'USD', created: '2026-11-16 09:12' },
    { id: 'INV-2026-00411', customer: 'Northwind Labs', email: 'billing@northwind.example', status: 'PAST_DUE', total: 864000, ccy: 'USD', created: '2026-11-01 00:00' },
    { id: 'INV-2026-00407', customer: 'Công ty Hoàng Phát', email: 'ketoan@hoangphat.example', status: 'PAID', total: 18500000, ccy: 'VND', created: '2026-11-01 00:00' },
    { id: 'INV-2026-00403', customer: 'Kestrel Freight', email: 'ar@kestrel.example', status: 'UNCOLLECTIBLE', total: 532500, ccy: 'USD', created: '2026-10-01 00:00' }
  ];
  function amount(r) { return h('span', { className: 'sc-amount' }, h(S.Money, { minor: r.total, currency: r.ccy })); }
  /* mobile: primary | badge | secondary | meta | hidden. The card list reads these; tablets drop meta and hidden columns. */
  var columns = [
    { key: 'total', header: 'Amount', align: 'end', sortable: true, sort: 'desc', width: 160, mobile: 'primary', render: amount },
    { key: 'status', header: 'Status', width: 140, mobile: 'badge', render: function (r) { return h(S.StatusBadge, { status: r.status }); } },
    { key: 'id', header: 'Invoice', mobile: 'secondary', cardText: function (r) { return r.id; } },
    { key: 'customer', header: 'Customer', mobile: 'secondary', cardText: function (r) { return r.customer; }, render: function (r) { return h('div', { className: 'sc-cell-2' }, h('span', null, r.customer), h('span', null, r.email)); } },
    { key: 'created', header: 'Issued (UTC)', sortable: true, mobile: 'meta', cardText: function (r) { return r.created.slice(0, 10); }, render: function (r) { return h('span', { className: 'sc-muted sc-num' }, r.created); } }
  ];
  function Demo() {
    var sel = React.useState([]);
    return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16 } },
      h('div', { className: 'sc-section-title', style: { margin: 0 } }, 'Table (tablet and desktop)'),
      h(S.DataTable, { caption: 'Invoices', layout: 'table', rows: rows, columns: columns, defaultActiveKey: 'INV-2026-00412', onRowOpen: function () {},
        rowActions: function () { return h(S.DropdownMenu, { items: [{ label: 'Open', icon: 'external' }, { separator: true }, { label: 'Void invoice', icon: 'trash', danger: true }] }); },
        footer: [h('span', { key: 'a' }, '1–4 of 37'), h('span', { key: 'b', className: 'sc-table__foot-end' }, h(S.Button, { size: 'sm', variant: 'outline', disabled: true }, 'Previous'), h(S.Button, { size: 'sm', variant: 'outline' }, 'Next'))] }),
      h('div', { className: 'sc-section-title', style: { margin: '8px 0 0' } }, 'Card list (phones), the same columns'),
      h('div', { style: { maxWidth: 390 } }, h(S.DataTable, { caption: 'Invoices', layout: 'cards', rows: rows, columns: columns, selectable: true, selected: sel[0], onSelect: sel[1], onRowOpen: function () {} })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
