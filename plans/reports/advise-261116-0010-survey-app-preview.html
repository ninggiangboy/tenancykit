.ak-diagram-root {
  --ak-bg: #ffffff;
  --ak-surface: #f8fafc;
  --ak-surface-border: #e2e8f0;
  --ak-text-primary: #0f172a;
  --ak-text-secondary: #475569;
  --ak-text-muted: #94a3b8;
  --ak-accent: #2563eb;
  --ak-accent-light: #dbeafe;
  --ak-node-bg: #ffffff;
  --ak-node-border: #cbd5e1;
  --ak-edge-stroke: #64748b;
  --ak-edge-active: #2563eb;
  --ak-badge-bg: #f1f5f9;
  --ak-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --ak-font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ak-font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  
  font-family: var(--ak-font-sans);
  background-color: var(--ak-bg);
  color: var(--ak-text-primary);
  display: flex;
  flex-direction: column;
  border: 1px solid var(--ak-surface-border);
  border-radius: 8px;
  overflow: hidden;
  position: relative;
  box-sizing: border-box;
}

/* Preset: Classic (Light / Dark) */
.ak-diagram-root[data-preset="classic"][data-theme="light"],
.ak-diagram-root[data-preset="classic"]:not([data-theme="dark"]) {
  --ak-bg: #ffffff;
  --ak-surface: #f8fafc;
  --ak-surface-border: #e2e8f0;
  --ak-text-primary: #0f172a;
  --ak-text-secondary: #475569;
  --ak-node-bg: #ffffff;
  --ak-node-border: #cbd5e1;
  --ak-edge-stroke: #64748b;
  --ak-edge-active: #2563eb;
}
.ak-diagram-root[data-preset="classic"][data-theme="dark"] {
  --ak-bg: #090d16;
  --ak-surface: #0f172a;
  --ak-surface-border: #1e293b;
  --ak-text-primary: #f8fafc;
  --ak-text-secondary: #94a3b8;
  --ak-node-bg: #0f172a;
  --ak-node-border: #334155;
  --ak-edge-stroke: #475569;
  --ak-edge-active: #38bdf8;
}

/* Preset: Signal Flow (Light / Dark) */
.ak-diagram-root[data-preset="signal-flow"][data-theme="light"],
.ak-diagram-root[data-preset="signal-flow"]:not([data-theme="dark"]) {
  --ak-bg: #f0fdf4;
  --ak-surface: #dcfce7;
  --ak-surface-border: #86efac;
  --ak-text-primary: #14532d;

  --ak-node-border: #10b981;

}
.ak-diagram-root[data-preset="signal-flow"][data-theme="dark"] {
  --ak-bg: #031c18;
  --ak-surface: #064e3b;
  --ak-surface-border: #047857;
  --ak-text-primary: #ecfdf5;
  --ak-text-secondary: #a7f3d0;
  --ak-accent: #34d399;
  --ak-node-bg: #064e3b;
  --ak-node-border: #10b981;
  --ak-edge-stroke: #34d399;
  --ak-edge-active: #6ee7b7;
}

/* Preset: Blueprint (Light / Dark) */
.ak-diagram-root[data-preset="blueprint"][data-theme="light"],
.ak-diagram-root[data-preset="blueprint"]:not([data-theme="dark"]) {

.ak-diagram-root[data-preset="blueprint"][data-theme="dark"] {

/* Preset: Editorial (Light / Dark) */
.ak-diagram-root[data-preset="editorial"][data-theme="light"],

}

/* Toolbar & Reader Controls */
.ak-diagram-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background-color: var(--ak-surface);
  border-bottom: 1px solid var(--ak-surface-border);
  gap: 8px;
  flex-wrap: wrap;
}

.ak-diagram-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--ak-text-primary);
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

.ak-diagram-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.ak-chapter-controls {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--ak-bg);
  border: 1px solid var(--ak-surface-border);
  border-radius: 4px;
  padding: 2px 6px;
}
.ak-chapter-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--ak-text-secondary);
}

.ak-diagram-btn {
  background: var(--ak-bg);
  border: 1px solid var(--ak-surface-border);
  color: var(--ak-text-primary);
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.15s ease;
}
.ak-diagram-btn:hover {
  background-color: var(--ak-surface);
  border-color: var(--ak-accent);
}
.ak-diagram-btn:focus-visible {
  outline: 2px solid var(--ak-accent);
  outline-offset: 1px;
}

.ak-diagram-search-input {
  background: var(--ak-bg);
  border: 1px solid var(--ak-surface-border);
  color: var(--ak-text-primary);
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 12px;
  width: 140px;
}
.ak-diagram-search-input:focus {
  outline: 2px solid var(--ak-accent);
  border-color: transparent;
}

/* Main Viewport */
.ak-diagram-viewport {
  position: relative;
  overflow: auto;
  min-height: 280px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: var(--ak-bg);
}

.ak-diagram-svg {
  max-width: 100%;
  height: auto;
  display: block;
}

/* Node, Boundary & Edge Styling */
.ak-node {
  cursor: pointer;
  transition: transform 0.15s ease, opacity 0.2s ease;
}
.ak-node:hover {
  transform: translateY(-2px);
}
.ak-node.is-dimmed {
  opacity: 0.25;
}
.ak-node.is-focused rect,
.ak-node.is-focused circle {
  stroke: var(--ak-accent) !important;
  stroke-width: 3px !important;
}

.ak-edge path,
.ak-edge line,
.ak-edge polyline {
  transition: stroke 0.2s ease, opacity 0.2s ease;
}
.ak-edge.is-dimmed {
  opacity: 0.15;
}
.ak-edge.is-highlighted path,
.ak-edge.is-highlighted line,
.ak-edge.is-highlighted polyline {
  stroke: var(--ak-edge-active) !important;
  stroke-width: 2.5px !important;
}
.ak-edge text {
  stroke: none !important;
  stroke-width: 0 !important;
  stroke-dasharray: none !important;
  animation: none !important;
  fill: var(--ak-text-secondary);
  pointer-events: none;
  user-select: none;
}

/* Trace Motion Animation (Finite, <= 8s) */
@keyframes ak-trace-stroke {
  from {
    stroke-dashoffset: 200;
  }
  to {
    stroke-dashoffset: 0;
  }
}
.ak-diagram-root[data-animation="trace"] .ak-edge.is-active-trace path,
.ak-diagram-root[data-animation="trace"] .ak-edge.is-active-trace line,
.ak-diagram-root[data-animation="trace"] .ak-edge.is-active-trace polyline {
  stroke-dasharray: 6 4;
  animation: ak-trace-stroke 2.5s ease-in-out forwards;
}

/* Presentation Stage (F) */
.ak-diagram-root.is-presentation {
  position: fixed;
  inset: 0;
  z-index: 9999;
  border-radius: 0;
  border: none;
  height: 100vh;
  width: 100vw;
}
.ak-diagram-root.is-presentation .ak-diagram-viewport {
  height: calc(100vh - 48px);
}

/* Reduced Motion Override */
@media (prefers-reduced-motion: reduce) {
  .ak-node, .ak-edge, .ak-diagram-btn {
    transition: none !important;
    animation: none !important;
  }
}

/* ak-diagram core SVG styles: shared by the reader fragment and standalone SVG.
   Colour comes from --ak-* palette variables and --ak-role-* family tokens. */

.ak-diagram-svg { font-family: var(--ak-font-sans); display: block; }
.ak-diagram-svg text { user-select: none; }

.ak-canvas { fill: var(--ak-bg); }
.ak-grid-dot { fill: var(--ak-text-muted); opacity: 0.28; }

.ak-title { font-size: 16px; font-weight: 700; fill: var(--ak-text-primary); letter-spacing: -0.01em; }
.ak-subtitle { font-size: 11px; font-weight: 500; fill: var(--ak-text-secondary); }

/* Frames: boundaries, lanes, stages */
.ak-frame { fill: var(--ak-surface); stroke: var(--ak-surface-border); stroke-width: 1; }
.ak-frame-boundary { fill: transparent; stroke-dasharray: 6 4; stroke-width: 1.5; }
.ak-frame-stage { stroke-dasharray: 4 3; }
.ak-frame-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--ak-text-secondary); }
.ak-frame-role { font-size: 10px; fill: var(--ak-text-muted); }

/* Nodes */
.ak-node { cursor: pointer; }
.ak-node-mask { fill: var(--ak-node-bg); }
.ak-node-card { fill: var(--ak-node-fill, var(--ak-node-bg)); stroke: var(--ak-node-stroke, var(--ak-node-border)); stroke-width: 1.5; transition: stroke-width 160ms ease; }
.ak-node[data-shape="notch"] .ak-node-card { stroke-width: 2; }
.ak-node-accent { fill: var(--ak-node-stroke, var(--ak-accent)); }
.ak-sigil path { fill: none; stroke: var(--ak-node-stroke, var(--ak-accent)); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ak-node-label { font-size: 13px; font-weight: 600; fill: var(--ak-text-primary); }
.ak-node-sub { font-size: 9.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--ak-text-muted); }
.ak-node:hover .ak-node-card, .ak-node:focus-visible .ak-node-card { stroke-width: 2.5; }
.ak-node:focus-visible { outline: none; }

/* Edges */
.ak-edge-path { fill: none; stroke: var(--ak-edge-stroke); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; transition: stroke 160ms ease, stroke-width 160ms ease; }
.ak-edge-dashed { stroke-dasharray: 5 4; }
.ak-edge[data-tone="failure"] .ak-edge-path { stroke: var(--ak-role-failure-stroke); }
.ak-edge[data-tone="decision"] .ak-edge-path { stroke: var(--ak-role-decision-stroke); }
.ak-edge-flow { fill: none; stroke: var(--ak-edge-active); stroke-width: 2.25; stroke-linecap: round; opacity: 0; pointer-events: none; }
.ak-edge-label-mask { fill: var(--ak-bg); stroke: var(--ak-surface-border); stroke-width: 1; }
.ak-edge-label text { font-size: 10.5px; font-weight: 500; fill: var(--ak-text-secondary); }
.ak-arrowhead { fill: var(--ak-edge-stroke); }
.ak-arrowhead-open { fill: none; stroke: var(--ak-edge-stroke); stroke-width: 1.25; }

/* Sequence extras */

    <script type="application/json" class="ak-diagram-data">{"schema_version":1,"diagram_type":"architecture","meta":{"title":"PREVIEW (proposed end state, not implemented): survey app v1, API only, link-based and channel-agnostic","visual_preset":"blueprint","theme":"dark","animation":"trace","views":[{"id":"ch1","title":"Build and publish","narrative":"The Tenant System (the builder UI later) replaces the whole draft with PUT and If-Match. The server validates the structure and every JSON-AST expression (logic, computed variables, quiz scores, piping), offers preview and simulate, and publishing freezes an immutable version that owns its translations.","focus_nodes":["tenant-system","proxy","survey-admin-api","survey-db"]},{"id":"ch2","title":"Create links","narrative":"The survey app only issues links: public links, one per source the Tenant names (email, qr-store-01, website), and personal links in bulk, each with an external_ref, a source, an expiry and single use. It never sends anything and knows no channel. The Tenant puts a link wherever it likes, for example as a variable in a mailroom campaign.","focus_nodes":["tenant-system","survey-admin-api","mailroom"]},{"id":"ch3","title":"A customer opens and responds","narrative":"Opening a link starts a visit that records the link's source, UTM parameters, the referrer domain, the device and the GeoIP country (no raw IP stored). The public API saves drafts, issues presigned uploads, and on submit re-evaluates the logic, validates the path taken, computes variables and the score and enforces the window, the cap, single use, idempotency, rate limits and the honeypot.","focus_nodes":["respondent","proxy","survey-public-api","geoip","object-store","survey-db"]},{"id":"ch4","title":"Analyse, export, notify","narrative":"Analytics answers aggregates, filters by answers, cross-tabs, trends and the funnel (opened, started, abandoned at page N, completed) broken down by source, merged across versions. The respondent list gives who completed (external_ref or the identity question). The Tenant reconciles it by hand with a mailroom group and segment to resend; mailroom does not change. The outbox feeds survey.events and the signed Survey-* webhooks built on the core webhook library Billing also moves onto.","focus_nodes":["analytics-api","export-worker","outbox","survey-events","webhook-worker","core-webhook","billing"]}]},"boundaries":[{"id":"b-survey","label":"survey/ (new deployable, own DB)","role":"cluster","components":["survey-admin-api","survey-public-api","analytics-api","survey-db","replica","outbox","export-worker","webhook-worker","geoip"]},{"id":"b-outside","label":"Outside the suite","role":"external-zone","components":["respondent","tenant-system"]}],"components":[{"id":"respondent","label":"Tenant's customer (fill UI later)","role":"frontend","layer":0},{"id":"tenant-system","label":"Tenant System (builder UI later)","role":"external","layer":0},{"id":"proxy","label":"Reverse proxy /survey","role":"gateway","layer":1},{"id":"platform","label":"Platform (unchanged)","role":"auth","layer":1},{"id":"mailroom","label":"mailroom (unchanged): groups, segments, campaigns carry the link","role":"backend","layer":1},{"id":"survey-admin-api","label":"Admin API: drafts, preview, simulate, publish, links, responses, respondents","role":"backend","layer":2},{"id":"survey-public-api","label":"Public API /survey/p/*: open visit, schema, page events, draft, upload URL, submit","role":"backend","layer":2},{"id":"analytics-api","label":"Analytics: aggregate, filter, cross-tab, trend, funnel by source","role":"backend","layer":2},{"id":"geoip","label":"Offline GeoIP database","role":"storage","layer":3},{"id":"object-store","label":"MinIO / S3 (new infra)","role":"storage","layer":3},{"id":"survey-db","label":"survey DB (RLS): versions JSONB + i18n, links, visits, responses, answers","role":"database","layer":3},{"id":"replica","label":"Platform replica","role":"database","layer":3},{"id":"outbox","label":"Outbox","role":"database","layer":4},{"id":"export-worker","label":"CSV export worker","role":"worker","layer":4},{"id":"survey-events","label":"survey.events","role":"queue","layer":5},{"id":"webhook-worker","label":"Webhook dispatcher (Survey-*)","role":"worker","layer":5},{"id":"core-webhook","label":"core/ webhook library","role":"backend","layer":6},{"id":"billing","label":"Billing (refactored onto core-webhook)","role":"backend","layer":6}],"connections":[{"from":"tenant-system","to":"proxy","label":"suite token","kind":"sync"},{"from":"tenant-system","to":"mailroom","label":"manual resend: group, segment, campaign","kind":"sync"},{"from":"respondent","to":"proxy","label":"public / personal link","kind":"sync"},{"from":"proxy","to":"survey-admin-api","kind":"sync"},{"from":"proxy","to":"survey-public-api","kind":"sync"},{"from":"proxy","to":"analytics-api","kind":"sync"},{"from":"platform","to":"replica","label":"platform.events + snapshot","kind":"async"},{"from":"survey-admin-api","to":"survey-db","kind":"sync"},{"from":"survey-public-api","to":"geoip","label":"country lookup","kind":"sync"},{"from":"survey-public-api","to":"survey-db","label":"visit, validate path","kind":"sync"},{"from":"survey-public-api","to":"object-store","label":"presigned PUT","kind":"sync"},{"from":"analytics-api","to":"survey-db","label":"read","kind":"sync"},{"from":"survey-public-api","to":"outbox","label":"same transaction","kind":"sync"},{"from":"survey-admin-api","to":"export-worker","label":"export job","kind":"async"},{"from":"outbox","to":"survey-events","label":"relay","kind":"async"},{"from":"outbox","to":"webhook-worker","kind":"async"},{"from":"webhook-worker","to":"core-webhook","label":"uses","kind":"sync"},{"from":"billing","to":"core-webhook","label":"uses","kind":"sync"},{"from":"webhook-worker","to":"tenant-system","label":"signed webhook","kind":"async"}]}</script>

      focusedNodeId: null,
      activeReach: null, // 'upstream' | 'downstream'
      activeRoute: null,
      activeLensIndex: -1,
      currentChapterIndex: 0,
      isPresentation: false
    };

    // DOM Elements
    const root = container;
    const searchInput = container.querySelector('.ak-diagram-search-input');
    const nodes = Array.from(container.querySelectorAll('.ak-node'));
    const edges = Array.from(container.querySelectorAll('.ak-edge'));
    const themeBtn = container.querySelector('.ak-btn-theme');
    const presentBtn = container.querySelector('.ak-btn-present');
    const shareBtn = container.querySelector('.ak-btn-share');
    const reachDownBtn = container.querySelector('.ak-btn-reach-down');
    const reachUpBtn = container.querySelector('.ak-btn-reach-up');
    const routeBtn = container.querySelector('.ak-btn-route');
    const lensBtn = container.querySelector('.ak-btn-lens');
    const chapterPrevBtn = container.querySelector('.ak-btn-prev-chapter');
    const chapterNextBtn = container.querySelector('.ak-btn-next-chapter');
    const chapterLabel = container.querySelector('.ak-chapter-label');
    const motionBtn = container.querySelector('.ak-btn-motion');
    const svgEl = container.querySelector('.ak-diagram-svg');

    // Replay the finite entrance/trace motion by re-arming data-motion on the svg.
    function replayMotion() {
      if (!svgEl) return;
      svgEl.removeAttribute('data-motion');
      void svgEl.getBoundingClientRect();
      svgEl.setAttribute('data-motion', 'play');
    }
    if (motionBtn) motionBtn.addEventListener('click', replayMotion);

    // Build Graph Adjacency & Distinct Roles
    const outgoing = new Map();
    const incoming = new Map();
    const allRoles = new Set();

    nodes.forEach(n => {
      const role = n.getAttribute('data-role');
      if (role) allRoles.add(role);
    });
    const rolesList = Array.from(allRoles).sort();

    edges.forEach(edgeEl => {
      const from = edgeEl.getAttribute('data-from');
      const to = edgeEl.getAttribute('data-to');
      const edgeId = edgeEl.getAttribute('data-edge-id') || `${from}->${to}`;
      if (from && to) {
        if (!outgoing.has(from)) outgoing.set(from, []);
        outgoing.get(from).push({ to, edgeEl, edgeId });

        if (!incoming.has(to)) incoming.set(to, []);
        incoming.get(to).push({ from, edgeEl, edgeId });
      }
    });

    function clearHighlights() {
      nodes.forEach(n => {
        n.classList.remove('is-focused', 'is-dimmed');
      });
      edges.forEach(e => {
        e.classList.remove('is-highlighted', 'is-dimmed', 'is-active-trace');
      });
      state.focusedNodeId = null;
      state.activeReach = null;
      state.activeRoute = null;
    }

    function focusNodes(nodeIds) {
      const ids = (nodeIds || []).filter(Boolean);
      clearHighlights();
      if (ids.length === 0) {
        state.focusedNodeId = null;
        return;
      }
      state.focusedNodeId = ids[0];

      const focusSet = new Set(ids);
      const connectedNodeIds = new Set(ids);
      ids.forEach(id => {
        (outgoing.get(id) || []).forEach(e => connectedNodeIds.add(e.to));
        (incoming.get(id) || []).forEach(e => connectedNodeIds.add(e.from));
      });

      nodes.forEach(n => {
        const id = n.getAttribute('data-node-id');
        if (focusSet.has(id)) {
          n.classList.add('is-focused');
        } else if (!connectedNodeIds.has(id)) {
          n.classList.add('is-dimmed');
        }
      });

      edges.forEach(e => {
        const from = e.getAttribute('data-from');
        const to = e.getAttribute('data-to');
        if (focusSet.has(from) || focusSet.has(to)) {
          e.classList.add('is-highlighted');
        } else {
          e.classList.add('is-dimmed');
        }
      });
    }

    function focusNode(nodeId) {
      focusNodes(nodeId ? [nodeId] : []);
    }

    function traceReach(nodeId, direction) {
      const targetId = nodeId || state.focusedNodeId || (nodes[0] ? nodes[0].getAttribute('data-node-id') : null);
      if (!targetId) return;
      clearHighlights();
      state.focusedNodeId = targetId;
      state.activeReach = direction;

      const reachedNodes = new Set([targetId]);
      const reachedEdges = new Set();
      const queue = [targetId];

      while (queue.length > 0) {
        const current = queue.shift();
        const neighbors = (direction === 'downstream') ? (outgoing.get(current) || []) : (incoming.get(current) || []);
        neighbors.forEach(item => {
          const nextNode = (direction === 'downstream') ? item.to : item.from;
          reachedEdges.add(item.edgeEl);
          if (!reachedNodes.has(nextNode)) {
            reachedNodes.add(nextNode);
            queue.push(nextNode);
          }
        });
      }

      nodes.forEach(n => {
        const id = n.getAttribute('data-node-id');
        if (id === targetId) {
          n.classList.add('is-focused');
        } else if (!reachedNodes.has(id)) {
          n.classList.add('is-dimmed');
        }
      });

      edges.forEach(e => {
        if (reachedEdges.has(e)) {
          e.classList.add('is-highlighted', 'is-active-trace');
        } else {
          e.classList.add('is-dimmed');
        }
      });
    }

    function traceShortestRoute(sourceId, targetId) {
      if (!sourceId || !targetId || sourceId === targetId) return;
      clearHighlights();

      const queue = [[sourceId]];
      const visited = new Set([sourceId]);
      let shortestPath = null;

      while (queue.length > 0) {
        const path = queue.shift();
        const current = path[path.length - 1];
        if (current === targetId) {
          shortestPath = path;
          break;
        }
        const neighbors = outgoing.get(current) || [];
        const sorted = [...neighbors].sort((a, b) => a.to.localeCompare(b.to));
        for (const item of sorted) {
          if (!visited.has(item.to)) {
            visited.add(item.to);
            queue.push([...path, item.to]);
          }
        }
      }

      if (!shortestPath) return;

      const pathNodes = new Set(shortestPath);
      const pathEdges = new Set();

      for (let i = 0; i < shortestPath.length - 1; i++) {
        const u = shortestPath[i];
        const v = shortestPath[i + 1];
        const edgeObj = (outgoing.get(u) || []).find(e => e.to === v);
        if (edgeObj) pathEdges.add(edgeObj.edgeEl);
      }

      nodes.forEach(n => {
        const id = n.getAttribute('data-node-id');
        if (!pathNodes.has(id)) n.classList.add('is-dimmed');
        else if (id === sourceId || id === targetId) n.classList.add('is-focused');
      });

      edges.forEach(e => {
        if (pathEdges.has(e)) e.classList.add('is-highlighted', 'is-active-trace');
        else e.classList.add('is-dimmed');
      });
    }

    function cycleRoleLens() {
      if (rolesList.length === 0) return;
      state.activeLensIndex = (state.activeLensIndex + 1) % (rolesList.length + 1);

      if (state.activeLensIndex === rolesList.length) {
        clearHighlights();
        state.activeLens = null;
        return;
      }

      const roleName = rolesList[state.activeLensIndex];
      clearHighlights();
      state.activeLens = roleName;

      nodes.forEach(n => {
        const role = n.getAttribute('data-role');
        if (role !== roleName) {
          n.classList.add('is-dimmed');
        } else {
          n.classList.add('is-focused');
        }
      });
    }

    function cycleRoute() {
      if (nodes.length < 2) return;
      const src = nodes[0].getAttribute('data-node-id');
      const dst = nodes[nodes.length - 1].getAttribute('data-node-id');
      traceShortestRoute(src, dst);
    }

    function togglePresentation() {
      state.isPresentation = !state.isPresentation;
      root.classList.toggle('is-presentation', state.isPresentation);
    }

    function setChapter(index) {
      const views = (irData.meta && irData.meta.views) || [];
      if (views.length === 0) return;
      if (index < 0) index = 0;
      if (index >= views.length) index = views.length - 1;
      state.currentChapterIndex = index;
      const chapter = views[index];

      if (chapterLabel) {
        chapterLabel.textContent = `${index + 1}/${views.length}: ${chapter.title || chapter.id}`;
      }

      clearHighlights();
      if (chapter.focus_nodes && chapter.focus_nodes.length > 0) {
        focusNodes(chapter.focus_nodes);
      } else if (chapter.highlight_route && chapter.highlight_route.length >= 2) {
        traceShortestRoute(chapter.highlight_route[0], chapter.highlight_route[chapter.highlight_route.length - 1]);
      }
    }
    const PRESET_THEME_PALETTES = {
      'classic:light': {
        '--ak-bg': '#ffffff', '--ak-surface': '#f8fafc', '--ak-surface-border': '#e2e8f0',
        '--ak-text-primary': '#0f172a', '--ak-text-secondary': '#475569', '--ak-text-muted': '#94a3b8',
        '--ak-accent': '#2563eb', '--ak-accent-light': '#dbeafe',
        '--ak-node-bg': '#ffffff', '--ak-node-border': '#cbd5e1',
        '--ak-edge-stroke': '#64748b', '--ak-edge-active': '#2563eb',
        '--ak-badge-bg': '#f1f5f9', '--ak-font-sans': 'system-ui, -apple-system, sans-serif',
        '--ak-font-mono': 'ui-monospace, monospace'
      },
      'classic:dark': {
        '--ak-bg': '#090d16', '--ak-surface': '#0f172a', '--ak-surface-border': '#1e293b',
        '--ak-text-primary': '#f8fafc', '--ak-text-secondary': '#94a3b8', '--ak-text-muted': '#64748b',
        '--ak-accent': '#38bdf8', '--ak-accent-light': '#0369a1',
        '--ak-node-bg': '#0f172a', '--ak-node-border': '#334155',
        '--ak-edge-stroke': '#475569', '--ak-edge-active': '#38bdf8',
        '--ak-badge-bg': '#1e293b', '--ak-font-sans': 'system-ui, -apple-system, sans-serif',
        '--ak-font-mono': 'ui-monospace, monospace'
      },
      'signal-flow:light': {
        '--ak-bg': '#f0fdf4', '--ak-surface': '#dcfce7', '--ak-surface-border': '#86efac',
        '--ak-text-primary': '#14532d', '--ak-text-secondary': '#166534', '--ak-text-muted': '#4ade80',
        '--ak-accent': '#059669', '--ak-accent-light': '#d1fae5',
        '--ak-node-bg': '#ffffff', '--ak-node-border': '#10b981',
        '--ak-edge-stroke': '#059669', '--ak-edge-active': '#047857',
        '--ak-badge-bg': '#dcfce7', '--ak-font-sans': 'system-ui, -apple-system, sans-serif',
        '--ak-font-mono': 'ui-monospace, monospace'
      },
      'signal-flow:dark': {
        '--ak-bg': '#031c18', '--ak-surface': '#064e3b', '--ak-surface-border': '#047857',
        '--ak-text-primary': '#ecfdf5', '--ak-text-secondary': '#a7f3d0', '--ak-text-muted': '#34d399',
        '--ak-accent': '#34d399', '--ak-accent-light': '#065f46',
        '--ak-node-bg': '#064e3b', '--ak-node-border': '#10b981',
        '--ak-edge-stroke': '#34d399', '--ak-edge-active': '#6ee7b7',
        '--ak-badge-bg': '#064e3b', '--ak-font-sans': 'system-ui, -apple-system, sans-serif',
        '--ak-font-mono': 'ui-monospace, monospace'
      },
      'blueprint:light': {
        '--ak-bg': '#f0f9ff', '--ak-surface': '#e0f2fe', '--ak-surface-border': '#7dd3fc',
        '--ak-text-primary': '#0369a1', '--ak-text-secondary': '#0284c7', '--ak-text-muted': '#38bdf8',
        '--ak-accent': '#0284c7', '--ak-accent-light': '#bae6fd',
        '--ak-node-bg': '#ffffff', '--ak-node-border': '#0ea5e9',
        '--ak-edge-stroke': '#0284c7', '--ak-edge-active': '#0369a1',
        '--ak-badge-bg': '#e0f2fe', '--ak-font-sans': 'ui-monospace, monospace',
        '--ak-font-mono': 'ui-monospace, monospace'
      },
      'blueprint:dark': {
        '--ak-bg': '#081d33', '--ak-surface': '#0c2a4a', '--ak-surface-border': '#1e4976',
        '--ak-text-primary': '#e0f2fe', '--ak-text-secondary': '#bae6fd', '--ak-text-muted': '#38bdf8',
        '--ak-accent': '#38bdf8', '--ak-accent-light': '#0369a1',
        '--ak-node-bg': '#0c213a', '--ak-node-border': '#38bdf8',
        '--ak-edge-stroke': '#7dd3fc', '--ak-edge-active': '#38bdf8',
        '--ak-badge-bg': '#0c213a', '--ak-font-sans': 'ui-monospace, monospace',
        '--ak-font-mono': 'ui-monospace, monospace'
      },
      'editorial:light': {
        '--ak-bg': '#faf8f5', '--ak-surface': '#f3efe6', '--ak-surface-border': '#e2dacb',
        '--ak-text-primary': '#1c1917', '--ak-text-secondary': '#57534e', '--ak-text-muted': '#a8a29e',
        '--ak-accent': '#991b1b', '--ak-accent-light': '#fecaca',
        '--ak-node-bg': '#ffffff', '--ak-node-border': '#d6cfc4',
        '--ak-edge-stroke': '#78716c', '--ak-edge-active': '#991b1b',
        '--ak-badge-bg': '#f3efe6', '--ak-font-sans': 'system-ui, serif',
        '--ak-font-mono': 'ui-monospace, monospace'
      },
      'editorial:dark': {
        '--ak-bg': '#1c1917', '--ak-surface': '#292524', '--ak-surface-border': '#44403c',
        '--ak-text-primary': '#fafaf9', '--ak-text-secondary': '#d6d3d1', '--ak-text-muted': '#78716c',
        '--ak-accent': '#ef4444', '--ak-accent-light': '#7f1d1d',
        '--ak-node-bg': '#292524', '--ak-node-border': '#78716c',
        '--ak-edge-stroke': '#a8a29e', '--ak-edge-active': '#f87171',
        '--ak-badge-bg': '#292524', '--ak-font-sans': 'system-ui, serif',
        '--ak-font-mono': 'ui-monospace, monospace'
      }
    };

    function exportShareCard() {
      const svg = root.querySelector('.ak-diagram-svg');
      if (!svg) return;

      const title = (irData.meta && irData.meta.title) || 'AgentKit System Map';
      const preset = root.getAttribute('data-preset') || 'classic';
      const theme = root.getAttribute('data-theme') || 'light';

      const VAR_WHITELIST = [
        '--ak-bg', '--ak-surface', '--ak-surface-border',
        '--ak-text-primary', '--ak-text-secondary', '--ak-text-muted',
        '--ak-accent', '--ak-accent-light',
        '--ak-node-bg', '--ak-node-border',
        '--ak-edge-stroke', '--ak-edge-active',
        '--ak-badge-bg', '--ak-font-sans', '--ak-font-mono'
      ];

      const paletteKey = `${preset}:${theme}`;
      const fallbackPalette = PRESET_THEME_PALETTES[paletteKey] || PRESET_THEME_PALETTES['classic:light'];

      let computed = null;
      if (typeof window !== 'undefined' && typeof window.getComputedStyle === 'function') {
        try { computed = window.getComputedStyle(root); } catch (e) { computed = null; }
      }

      const resolvedVars = {};
      VAR_WHITELIST.forEach(varName => {
        let val = '';
        if (computed && typeof computed.getPropertyValue === 'function') {
          val = computed.getPropertyValue(varName);
        }
        resolvedVars[varName] = (val && val.trim()) ? val.trim() : (fallbackPalette[varName] || '#000000');
      });

      const cardBg = resolvedVars['--ak-bg'];
      const cardSurface = resolvedVars['--ak-surface'];
      const cardBorder = resolvedVars['--ak-surface-border'];
      const textPrimary = resolvedVars['--ak-text-primary'];
      const textMuted = resolvedVars['--ak-text-muted'];
      const accent = resolvedVars['--ak-accent'];

      const cssDeclarations = Object.entries(resolvedVars)
        .map(([k, v]) => `${k}: ${v};`)
        .join(' ');

      const styleBlock = `<style>
        svg {
          ${cssDeclarations}
          font-family: var(--ak-font-sans);
        }
      </style>`;

      // Construct canonical 1200x630 Share Card SVG with self-contained resolved variables
      const shareCardSvg = `<svg viewBox="0 0 1200 630" width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
        <defs>
          ${styleBlock}
        </defs>
        <rect width="1200" height="630" fill="${cardBg}" rx="12" stroke="${cardBorder}" stroke-width="2"/>
        <g transform="translate(48, 56)">
          <text x="0" y="0" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="${textPrimary}">${escapeXml(title)}</text>
          <text x="0" y="28" font-family="system-ui, sans-serif" font-size="14" fill="${textMuted}">AgentKit System Map • Preset: ${escapeXml(preset)} • Theme: ${escapeXml(theme)}</text>
        </g>
        <g transform="translate(48, 120)">
          <rect width="1104" height="450" fill="${cardSurface}" rx="8" stroke="${cardBorder}" stroke-width="1.5"/>
          <svg x="20" y="20" width="1064" height="410" viewBox="${svg.getAttribute('viewBox') || '0 0 1000 600'}">
            ${svg.innerHTML}
          </svg>
        </g>
        <g transform="translate(1050, 595)">
          <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="${accent}">AgentKit • Archify v2.16</text>
        </g>
      </svg>`;

      const blob = new Blob([shareCardSvg], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${title.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-share-card-1200x630.svg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Attach Node Click Handlers
    nodes.forEach(nodeEl => {
      nodeEl.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = nodeEl.getAttribute('data-node-id');
        if (state.focusedNodeId === id) {
          clearHighlights();
        } else {
          focusNode(id);
        }
      });
    });

    const viewport = container.querySelector('.ak-diagram-viewport');
    if (viewport) {
      viewport.addEventListener('click', () => {
        clearHighlights();
      });
    }

    // Search Input (Searches Label, ID, Description, Role)
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        const q = e.target.value.trim().toLowerCase();
        if (!q) {
          clearHighlights();
          return;
        }
        clearHighlights();
        nodes.forEach(n => {
          const label = (n.getAttribute('data-label') || '').toLowerCase();
          const id = (n.getAttribute('data-node-id') || '').toLowerCase();
          const desc = (n.getAttribute('data-desc') || '').toLowerCase();
          const role = (n.getAttribute('data-role') || '').toLowerCase();
          if (label.includes(q) || id.includes(q) || desc.includes(q) || role.includes(q)) {
            n.classList.remove('is-dimmed');
            n.classList.add('is-focused');
          } else {
            n.classList.add('is-dimmed');
          }
        });
      });
    }

    // Control Buttons
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const currentTheme = root.getAttribute('data-theme') || 'light';
        const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', nextTheme);
        themeBtn.textContent = nextTheme === 'dark' ? '☀️' : '🌙';
      });
    }

    if (presentBtn) presentBtn.addEventListener('click', togglePresentation);
    if (shareBtn) shareBtn.addEventListener('click', exportShareCard);
    if (reachDownBtn) reachDownBtn.addEventListener('click', () => traceReach(null, 'downstream'));
    if (reachUpBtn) reachUpBtn.addEventListener('click', () => traceReach(null, 'upstream'));
    if (routeBtn) routeBtn.addEventListener('click', cycleRoute);
    if (lensBtn) lensBtn.addEventListener('click', cycleRoleLens);

    if (chapterPrevBtn) {
      chapterPrevBtn.addEventListener('click', () => setChapter(state.currentChapterIndex - 1));
    }
    if (chapterNextBtn) {
      chapterNextBtn.addEventListener('click', () => setChapter(state.currentChapterIndex + 1));
    }

    // Global Scoped Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      const activeEl = document.activeElement;
      if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) {
        if (e.key === 'Escape') activeEl.blur();
        return;
      }

      if (e.key === '/') {
        if (searchInput) {
          e.preventDefault();
          searchInput.focus();
        }
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        togglePresentation();
      } else if (e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        cycleRoute();
      } else if (e.key === 'l' || e.key === 'L') {
        e.preventDefault();
        cycleRoleLens();
      } else if (e.key === 'm' || e.key === 'M') {
        e.preventDefault();
        replayMotion();
      } else if (e.key === '[') {
        e.preventDefault();
        setChapter(state.currentChapterIndex - 1);
      } else if (e.key === ']') {
        e.preventDefault();
        setChapter(state.currentChapterIndex + 1);
      } else if (e.key === 'Escape') {
        if (state.isPresentation) {
          togglePresentation();
        } else {
          clearHighlights();
        }
      }
    });

    if (irData.meta && irData.meta.views && irData.meta.views.length > 0) {
      setChapter(0);
    }
  }

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.ak-diagram-root').forEach(initDiagram);
      });
    } else {
      document.querySelectorAll('.ak-diagram-root').forEach(initDiagram);
    }
  }

  if (typeof window !== 'undefined') {
    window.AgentKitDiagram = { init: initDiagram };
  }
})();
</script>
