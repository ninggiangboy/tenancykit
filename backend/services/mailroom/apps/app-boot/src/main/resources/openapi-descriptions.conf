# Descriptions of the request and response fields, parameters and bodies of Mailroom's API.
# Read by DescriptionsOpenApiCustomizer; see dev.ngb.core.openapi for the format.

# ---- parameters
param email = The email address to remove from the suppressions.
param token = The signed token that was written into the email, naming the email and its recipient.
param /t/o/{token} token = The signed tracking token of the email. A token that does not verify is treated like a valid one, so nothing can be probed.
param /t/c/{token} token = The signed tracking token of the link. It resolves to a URL recorded when the email was rendered.
param /t/u/{token} token = The signed unsubscribe token of the email.

# ---- shared fields
field id = The id.
field name = The display name.
field version = The version of the record. It is also the `ETag`, which a conditional change sends as `If-Match`.
field createdAt = When the record was created.
field updatedAt = When the record was last changed.
field email = The email address. It is the receiver's identity.
field firstName = The receiver's first name.
field lastName = The receiver's last name.
field attributes = Free-form attributes of the receiver, which segments filter on and templates read as variables.
field subject = The email subject line, as a template.
field html = The HTML body, as a template.
field text = The plain-text body, as a template.
field key = The template key, unique per tenant. It cannot change.
field status = The current status.
field reason = The reason.
field index = The position of the item in the request, starting at 0.
field variables = The values the template reads, by variable name.
field fromKey = The sender identity to send from. When omitted, the tenant's default sender is used.
field fromName = The sender's display name.
field replyTo = The reply-to address.
field templateKey = The key of the template to render.
field templateId = The id of the template.
field templateRevision = The revision of the template that was pinned.
field scope = Which mail the suppression blocks: `MARKETING` or `ALL`.

# ---- templates
schema TemplateRequest = The template to create, or the new content of an existing one.
schema TemplateRequest.key = The template key. It is immutable once created and ignored on update.
schema TemplateRequest.name = The template's name.
schema TemplateResponse = A template at its current revision.
schema TemplateResponse.revision = The number of the current immutable revision. Every edit appends one.
schema TemplateRevisionView = One immutable revision of a template.
schema TemplateRevisionView.id = The revision's id.
schema TemplateRevisionView.revision = The revision's number.
schema TemplateRevisionView.createdAt = When the revision was appended.
schema PreviewRequest = The values to render the template with.
schema PreviewRequest.variables = The values the template reads, by variable name.
schema RenderedResponse = A template rendered with the given variables.

# ---- receivers, groups, segments, suppressions
schema ReceiverRequest = The receiver to create or update, identified by its email.
schema ReceiverResponse = A receiver: one of the tenant's own customers.
schema ReceiverResponse.status = `SUBSCRIBED` or `UNSUBSCRIBED`. Only removing a suppression re-subscribes a receiver.
schema ReceiverPatch = The receiver properties to change. The email and the consent status cannot be edited here.
schema ReceiverSummary = A receiver as listed in a sample.
schema BulkRequest = The receivers to upsert, at most 1,000.
schema BulkRequest.receivers = The receivers to upsert.
schema BulkResult = The outcome for one receiver of a bulk upsert.
schema BulkResult.receiverId = The id of the receiver, or null when the item failed.
schema BulkResult.error = Why the item failed, or null when it succeeded. One bad address does not fail the others.
schema GroupRequest = The group's name.
schema GroupResponse = A static group of receivers.
schema MemberIds = The receivers to add to or remove from a group, at most 1,000.
schema MemberIds.receiverIds = The ids of the receivers.
schema MemberChange = How many memberships changed.
schema MemberChange.changed = The number of memberships that were added or removed.
schema MemberResponse = A receiver that belongs to a group.
schema SegmentRequest = The segment to save.
schema SegmentRequest.name = The segment's name.
schema SegmentRequest.filter = The filter over receiver attributes. Composite nodes `and`, `or` (lists of filters) and `not` (one filter), and predicates `{field, op, value}` with `op` one of `eq`, `neq`, `in`, `gt`, `gte`, `lt`, `lte`, `exists` or `in_group`. The built-in fields are `email_domain`, `created_at`, `status` and `group`.
schema SegmentResponse = A saved segment.
schema SegmentResponse.filter = The filter over receiver attributes, as it was stored.
schema Preview = How many receivers a segment matches now, with a sample.
schema Preview.count = The number of matching receivers.
schema Preview.capped = Whether `count` stopped at a cap, so the real number is at least that large.
schema Preview.sample = A few of the matching receivers.
schema SuppressionRequest = The address to block.
schema SuppressionRequest.email = The address to block.
schema SuppressionResponse = An address the tenant must not mail.
schema SuppressionResponse.reason = Why it is blocked: `UNSUBSCRIBED` or `MANUAL`.

# ---- campaigns
schema CampaignRequest = The campaign to create, or its new properties.
schema CampaignRequest.name = The campaign's name.
schema CampaignRequest.templateKey = The key of the template to send. The campaign pins that template's current revision.
schema CampaignRequest.targetType = What the campaign targets: `GROUP` or `SEGMENT`.
schema CampaignRequest.targetId = The id of the group or segment.
schema CampaignResponse = A campaign and where it stands.
schema CampaignResponse.status = `DRAFT`, `SCHEDULED`, `SENDING`, `PAUSED`, `COMPLETED` or `CANCELLED`.
schema CampaignResponse.targetType = `GROUP` or `SEGMENT`.
schema CampaignResponse.targetId = The id of the group or segment.
schema CampaignResponse.scheduledAt = When the campaign is to start, or null.
schema CampaignResponse.startedAt = When the campaign entered `SENDING`, or null.
schema CampaignResponse.completedAt = When the campaign finished, or null.
schema ScheduleRequest = When to start the campaign.
schema ScheduleRequest.scheduledAt = The time to start, which must be in the future.
schema TestRequest = Where to send the test.
schema TestRequest.addresses = Up to five addresses to send a sample to.
schema Result = The outcome of one test send.
schema Result.to = The address.
schema Result.status = The status of the test email.
schema Result.reason = Why it was not sent, or null.
schema CampaignStatsView = The counts of a campaign.
schema CampaignStatsView.recipients = How many receivers the campaign's audience snapshot holds.
schema CampaignStatsView.published = How many recipients' emails were handed on for delivery.
schema CampaignStatsView.sent = How many emails ended as `SENT`.
schema CampaignStatsView.failed = How many emails ended as `FAILED`.
schema CampaignStatsView.skipped = How many emails ended as `SKIPPED`, for example because the address was suppressed.
schema CampaignStatsView.opened = How many distinct emails had their tracking pixel loaded. A mail client that prefetches inflates it, so an open is a signal, not proof of intent.
schema CampaignStatsView.openEvents = How many pixel loads were recorded in all. A prefetching mail client inflates it.
schema CampaignStatsView.clicked = How many distinct emails had a link clicked.
schema CampaignStatsView.clickEvents = How many clicks were recorded in all.
schema CampaignStatsView.unsubscribed = How many recipients unsubscribed from this campaign's emails.

# ---- emails
schema SendEmailRequest = The email to send.
schema SendEmailRequest.to = The recipient's address.
schema SendEmailRequest.kind = `TRANSACTIONAL` or `MARKETING`. A marketing email honours a `MARKETING` suppression; a transactional one honours only `ALL`. Required.
schema SendEmailRequest.templateKey = The template to render. Omit it to send the inline `subject`, `html` and `text`.
schema SendEmailRequest.subject = The inline subject line, when no template is used.
schema SendEmailRequest.html = The inline HTML body, when no template is used.
schema SendEmailRequest.text = The inline plain-text body, when no template is used.
schema SendEmailRequest.idempotencyKey = A key that makes a retried item return the same email. The `Idempotency-Key` header does the same for a single send.
schema EmailResponse = One email of the ledger.
schema EmailResponse.kind = `TRANSACTIONAL` or `MARKETING`.
schema EmailResponse.status = `QUEUED`, `SENT`, `FAILED` or `SKIPPED`.
schema EmailResponse.statusReason = Why the email is `FAILED` or `SKIPPED`, or null.
schema EmailResponse.to = The recipient's address.
schema EmailResponse.campaignId = The campaign that sent it, or null for a single send.
schema EmailResponse.receiverId = The receiver it was sent to, or null.
schema EmailResponse.html = The rendered HTML body, or null once the body was purged.
schema EmailResponse.text = The rendered plain-text body, or null once the body was purged.
schema EmailResponse.bodyPurged = Whether the rendered body was removed after the tenant's retention. Metadata and events stay.
schema EmailResponse.deliveryUpdatedAt = When the mailer last reported on the delivery, or null.
schema EmailResponse.events = What happened to the email after it was sent, such as opens and clicks.
schema BatchRequest = The emails to send, each shaped like a single send.
schema BatchRequest.items = The emails to send.
schema BatchResultResponse = The outcome for one item of a batch.
schema BatchResultResponse.emailId = The id of the email that was recorded, or null when the item was refused.
schema BatchResultResponse.status = The status of the recorded email.
schema BatchResultResponse.reason = Why the email was skipped or failed, or null.
schema BatchResultResponse.error = Why the item was refused, or null.

# ---- settings
schema SettingsRequest = The tenant's mail settings to store, each bounded as the schema states.
schema SettingsResponse = The tenant's mail settings.
schema SettingsRequest.fromKey = The key of the default sender identity.
schema SettingsResponse.fromKey = The key of the default sender identity.
field bodyRetentionDays = How many days a rendered body is kept before it is purged.
field campaignPublishPerMinute = How many campaign emails are queued per minute across all of the tenant's campaigns.

# ---- errors specific to an operation
error POST /api/v1/campaigns/{id}/pause 409 = The campaign is not sending, so it cannot be paused.
error POST /api/v1/campaigns/{id}/resume 409 = The campaign is not paused, so it cannot be resumed.
error POST /api/v1/campaigns/{id}/cancel 409 = The campaign is in a state that cannot be cancelled.
error DELETE /api/v1/suppressions 404 = The address has no suppression.

# ---- success statuses a handler answers by what it did
status GET /t/c/{token} 302 = Redirects to the URL recorded when the email was rendered, and records the click.
status GET /t/c/{token} 200 = The link has expired or its record was purged. An HTML page says so.
