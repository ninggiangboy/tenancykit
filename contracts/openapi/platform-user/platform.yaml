---
openapi: "3.1.0"
info:
  title: "Platform API"
  version: "v1"
servers:
- url: "/"
  description: "The Platform hostname, e.g. platform.<base-domain>"
tags:
- name: "Users"
  description: "Platform administration of users: create, enable, disable, rename\
    \ and grant direct permissions."
- name: "Tenant provisioning"
  description: "Creates a tenant together with its Tenant Administrator role and first\
    \ administrator in one call."
- name: "Roles"
  description: "Platform administration of roles: their permissions, names and assignment\
    \ to users."
- name: "Tenants"
  description: "Platform administration of tenants: list, rename, deactivate and map\
    \ hostnames."
- name: "Tenant systems"
  description: "A tenant's machine callers and the API credentials they authenticate\
    \ with: issue, rotate and revoke."
- name: "Signing keys"
  description: "The public halves of the keys Platform signs suite tokens with, so\
    \ every app can verify a token."
- name: "Console feed"
  description: "The feed a console shell reads on load: the UI remotes the caller\
    \ may mount."
- name: "App entitlements"
  description: "Which apps of the suite each tenant may use."
- name: "UI remotes"
  description: "The console's UI remote registry: CI registers versions; an operator\
    \ enables, disables and activates them."
- name: "Replica snapshots"
  description: "Internal paged snapshots of Platform state that a replica rebuilds\
    \ from, merged with live change events."
- name: "Current user"
  description: "The signed-in user and the permissions they hold across the suite."
- name: "Access tokens"
  description: "The OAuth client-credentials grant a Tenant System or service client\
    \ exchanges its credential for a token."
paths:
  /api/v1/users/{id}/permissions/{code}:
    put:
      tags:
      - "Users"
      summary: "Grant or revoke a direct permission"
      description: "Grants (`grant=true`) or revokes (`grant=false`) one permission\
        \ `code` directly on the user, outside any role. Each effective change is\
        \ audited. Pass the user's `ETag` in `If-Match`; a stale version is refused.\n\
        \nCallers: platform-user, tenant-user. Requires `platform:user:manage`."
      operationId: "setPermission"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the user."
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "code"
        in: "path"
        description: "The permission code, such as `platform:tenant:read`."
        required: true
        schema:
          type: "string"
      - name: "grant"
        in: "query"
        description: "`true` to grant the permission to the user, `false` to revoke\
          \ it."
        required: true
        schema:
          type: "boolean"
      - name: "If-Match"
        in: "header"
        description: "The `ETag` of the version the caller last read. The change is\
          \ refused with `412` when the resource has moved on since."
        required: false
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      responses:
        "200":
          description: "A user of the suite."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          description: "The permission code is not in the catalog."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      x-required-permission: "platform:user:manage"
      x-allowed-callers:
      - "platform-user"
      - "tenant-user"
  /api/v1/ui-remotes/{name}:
    put:
      tags:
      - "UI remotes"
      summary: "Change a UI remote"
      description: "The operator's one write on a remote: enable or disable it, point\
        \ it at a registered version with `activeVersion` (a rollback is the same\
        \ call with an older version), and edit its `title` and `navOrder`. `enabled`\
        \ is required. Pass the remote's `ETag` in `If-Match`; a stale version is\
        \ refused.\n\nCallers: platform-user. Requires `platform:ui-remote:manage`."
      operationId: "setState"
      parameters:
      - name: "name"
        in: "path"
        description: "The name of the UI remote."
        required: true
        schema:
          type: "string"
      - name: "If-Match"
        in: "header"
        description: "The `ETag` of the version the caller last read. The change is\
          \ refused with `412` when the resource has moved on since."
        required: false
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The change an operator makes to a remote."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StateRequest"
        required: true
      responses:
        "200":
          description: "A UI remote of the console and its registered versions."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RemoteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
      x-required-permission: "platform:ui-remote:manage"
      x-allowed-callers:
      - "platform-user"
  /api/v1/tenants/{tenantId}/apps/{appCode}:
    put:
      tags:
      - "App entitlements"
      summary: "Enable or disable an app for a tenant"
      description: "Sets whether the Tenant may use the app `appCode`. Setting the\
        \ state it already has changes nothing and publishes nothing; the audit entry\
        \ names the action asked for. `enabled` is required. Pass the entitlement's\
        \ `ETag` in `If-Match`; a stale version is refused. Requires `platform:entitlement:manage`.\n\
        \nCallers: platform-user. Requires `platform:entitlement:manage`."
      operationId: "set"
      parameters:
      - name: "tenantId"
        in: "path"
        description: "The id of the tenant."
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "appCode"
        in: "path"
        description: "The code of the app, such as `billing`."
        required: true
        schema:
          type: "string"
      - name: "If-Match"
        in: "header"
        description: "The `ETag` of the version the caller last read. The change is\
          \ refused with `412` when the resource has moved on since."
        required: false
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The state to set."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntitlementRequest"
        required: true
      responses:
        "200":
          description: "A tenant's entitlement to one app."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EntitlementResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          description: "The app code is not one of the suite's apps."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      x-required-permission: "platform:entitlement:manage"
      x-allowed-callers:
      - "platform-user"
  /api/v1/tenants/{id}:
    put:
      tags:
      - "Tenants"
      summary: "Rename a tenant"
      description: "Changes the Tenant's display name; its code does not change. The\
        \ version is bumped and the new state is published. Pass the tenant's `ETag`\
        \ in `If-Match`; a stale version is refused. Requires `platform:tenant:rename`.\n\
        \nCallers: platform-user. Requires `platform:tenant:rename`."
      operationId: "rename"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the tenant."
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "If-Match"
        in: "header"
        description: "The `ETag` of the version the caller last read. The change is\
          \ refused with `412` when the resource has moved on since."
        required: false
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The new name."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
        required: true
      responses:
        "200":
          description: "A tenant of the suite."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
      x-required-permission: "platform:tenant:rename"
      x-allowed-callers:
      - "platform-user"
  /api/v1/roles/{id}:
    put:
      tags:
      - "Roles"
      summary: "Rename a role"
      description: "Changes the role's name. Pass the role's `ETag` in `If-Match`;\
        \ a stale version is refused. Requires `platform:role:manage`.\n\nCallers:\
        \ platform-user, tenant-user. Requires `platform:role:manage`."
      operationId: "rename_1"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the role."
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "If-Match"
        in: "header"
        description: "The `ETag` of the version the caller last read. The change is\
          \ refused with `412` when the resource has moved on since."
        required: false
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The new name."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
        required: true
      responses:
        "200":
          description: "A role and the permissions it grants."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
      x-required-permission: "platform:role:manage"
      x-allowed-callers:
      - "platform-user"
      - "tenant-user"
  /api/v1/roles/{id}/permissions:
    put:
      tags:
      - "Roles"
      summary: "Replace a role's permissions"
      description: "Replaces the role's whole permission set with `permissions`. Every\
        \ holder of the role has its effective access recomputed. Pass the role's\
        \ `ETag` in `If-Match`; a stale version is refused.\n\nCallers: platform-user,\
        \ tenant-user. Requires `platform:role:manage`."
      operationId: "replacePermissions"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the role."
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "If-Match"
        in: "header"
        description: "The `ETag` of the version the caller last read. The change is\
          \ refused with `412` when the resource has moved on since."
        required: false
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The role's new permission set, replacing the stored one."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionsRequest"
        required: true
      responses:
        "200":
          description: "A role and the permissions it grants."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          description: "A permission code is not in the catalog."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      x-required-permission: "platform:role:manage"
      x-allowed-callers:
      - "platform-user"
      - "tenant-user"
  /api/v1/users:
    get:
      tags:
      - "Users"
      summary: "List users"
      description: "Pages through users, with the list-query contract's filtering,\
        \ sorting and paging. `tenant_id` is a filter, and a Tenant-scope caller never\
        \ sees another Tenant's users.\n\n**Filtering, sorting and paging** follow\
        \ the list-query contract. Conditions in `filter[field][op]` are combined\
        \ with AND. For OR, use `filter[or][i][field][op]`: predicates sharing the\
        \ index `i` are AND-ed and the branches are OR-ed (at most 10 branches, 20\
        \ predicates in all, 100 values in an `in` list). `neq` and `nin` do not match\
        \ rows where the field is null. Send `limit` with either `offset` (at most\
        \ 10000) or the `cursor` taken from a previous page, never both. The body\
        \ is `{\"data\": [...], \"page\": null}`. `page_info=full` fills `page` with\
        \ `limit`, `offset`, `total` and `next_cursor`; `page_info=cursor` fills it\
        \ with `limit` and `next_cursor` alone, without counting the matching rows;\
        \ omit it for the rows alone.\n\nCallers: platform-user, tenant-user. Requires\
        \ `platform:user:read`."
      operationId: "list"
      parameters:
      - name: "filter[created_at][eq]"
        in: "query"
        description: "`created_at` eq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][gt]"
        in: "query"
        description: "`created_at` gt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][gte]"
        in: "query"
        description: "`created_at` gte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `created_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[created_at][lt]"
        in: "query"
        description: "`created_at` lt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][lte]"
        in: "query"
        description: "`created_at` lte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][neq]"
        in: "query"
        description: "`created_at` neq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `created_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[display_name][eq]"
        in: "query"
        description: "`display_name` eq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[display_name][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `display_name`."
        required: false
        schema:
          type: "string"
      - name: "filter[display_name][neq]"
        in: "query"
        description: "`display_name` neq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[display_name][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `display_name`."
        required: false
        schema:
          type: "string"
      - name: "filter[display_name][starts_with]"
        in: "query"
        description: "Case-insensitive prefix match on `display_name`."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[email][contains]"
        in: "query"
        description: "Case-insensitive substring match on `email`."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[email][eq]"
        in: "query"
        description: "`email` eq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[email][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `email`."
        required: false
        schema:
          type: "string"
      - name: "filter[email][neq]"
        in: "query"
        description: "`email` neq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[email][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `email`."
        required: false
        schema:
          type: "string"
      - name: "filter[email][starts_with]"
        in: "query"
        description: "Case-insensitive prefix match on `email`."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[id][eq]"
        in: "query"
        description: "`id` eq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[id][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `id`."
        required: false
        schema:
          type: "string"
      - name: "filter[id][neq]"
        in: "query"
        description: "`id` neq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[id][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `id`."
        required: false
        schema:
          type: "string"
      - name: "filter[scope][eq]"
        in: "query"
        description: "`scope` eq the value."
        required: false
        schema:
          type: "string"
          enum:
          - "PLATFORM"
          - "TENANT"
      - name: "filter[scope][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `scope`."
        required: false
        schema:
          type: "string"
      - name: "filter[scope][neq]"
        in: "query"
        description: "`scope` neq the value."
        required: false
        schema:
          type: "string"
          enum:
          - "PLATFORM"
          - "TENANT"
      - name: "filter[scope][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `scope`."
        required: false
        schema:
          type: "string"
      - name: "filter[status][eq]"
        in: "query"
        description: "`status` eq the value."
        required: false
        schema:
          type: "string"
          enum:
          - "ACTIVE"
          - "DISABLED"
      - name: "filter[status][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `status`."
        required: false
        schema:
          type: "string"
      - name: "filter[status][neq]"
        in: "query"
        description: "`status` neq the value."
        required: false
        schema:
          type: "string"
          enum:
          - "ACTIVE"
          - "DISABLED"
      - name: "filter[status][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `status`."
        required: false
        schema:
          type: "string"
      - name: "filter[tenant_id][eq]"
        in: "query"
        description: "`tenant_id` eq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[tenant_id][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `tenant_id`."
        required: false
        schema:
          type: "string"
      - name: "filter[tenant_id][neq]"
        in: "query"
        description: "`tenant_id` neq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[tenant_id][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `tenant_id`."
        required: false
        schema:
          type: "string"
      - name: "filter[version][eq]"
        in: "query"
        description: "`version` eq the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[version][gt]"
        in: "query"
        description: "`version` gt the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[version][gte]"
        in: "query"
        description: "`version` gte the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[version][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `version`."
        required: false
        schema:
          type: "string"
      - name: "filter[version][lt]"
        in: "query"
        description: "`version` lt the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[version][lte]"
        in: "query"
        description: "`version` lte the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[version][neq]"
        in: "query"
        description: "`version` neq the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[version][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `version`."
        required: false
        schema:
          type: "string"
      - name: "sort"
        in: "query"
        description: "Comma-separated sortable fields, each optionally prefixed with\
          \ `-` for descending: created_at, email, id. At most 4 fields; `id` is appended\
          \ to make the order total. Default: `email,id`."
        required: false
        schema:
          type: "string"
      - name: "limit"
        in: "query"
        description: "Page size, 1 to 200."
        required: false
        schema:
          type: "integer"
          format: "int32"
          default: 50
          maximum: 200
          minimum: 1
      - name: "offset"
        in: "query"
        description: "Rows to skip, at most 10000. Not combinable with `cursor`."
        required: false
        schema:
          type: "integer"
