---
openapi: "3.1.0"
info:
  title: "Billing API - Tenant Systems"
  version: "v1"
  description: "The API a Tenant System calls with the credential Billing issued to\
    \ it.\nBase URL: https://{tenant-code}.{base-domain} - the hostname selects the\
    \ Tenant.\nAuthentication: `Authorization: Bearer cbk_<key-id>_<secret>`. The\
    \ credential's scopes are the `x-required-permission` codes below; an operation\
    \ outside those scopes answers 403.\nSend `Idempotency-Key` where the operation\
    \ documents it.\nEvery resource is limited to the Customers mapped to this Tenant\
    \ System. A resource owned by another Tenant System in the same Tenant answers\
    \ 404 exactly like a resource that does not exist.\nOperations not listed here\
    \ are not available to a Tenant System."
servers:
- url: "https://{tenant-code}.{base-domain}"
  variables:
    tenant-code:
      default: "tenant-a"
    base-domain:
      default: "base-domain.com"
tags:
- name: "Billing sessions"
  description: "The Tenant System side of the customer portal: create a billing session\
    \ and revoke one."
- name: "Portal: session"
  description: "The browser side of a billing session: exchange the single-use token\
    \ for a cookie and read the session."
- name: "Refunds"
  description: "Refunds of payments."
- name: "Payments"
  description: "Wallet top-ups and the payment history. A payment never changes a\
    \ balance; only a verified Stripe event does."
- name: "Portal settings"
  description: "The tenant's allowlist of URLs a billing session may return the customer\
    \ to."
- name: "Usage"
  description: "Usage reported by tenant systems, idempotent per event, and its aggregates."
- name: "Portal: customer"
  description: "The customer the portal session was issued for."
- name: "Charges"
  description: "Charge a wallet directly or by capturing a reservation."
- name: "Reservations"
  description: "Hold part of a wallet's balance for a later charge."
- name: "Wallets"
  description: "Open and read wallets. Amounts are integers in minor units with an\
    \ ISO 4217 currency."
- name: "Webhook deliveries"
  description: "The history of attempts to deliver an event to an endpoint, and resending\
    \ one that finished. A delivery that exhausted its attempts is DEAD and stays\
    \ visible so it can be resent."
- name: "Customers"
  description: "Billing customers of the tenant, optionally mapped to a Tenant System's\
    \ own users."
- name: "Coupons"
  description: "Coupons and promotion codes. Terms are never edited, so the only writes\
    \ after creation are a deactivation and a new code."
- name: "Webhook endpoints"
  description: "Where a tenant wants its events delivered and which event types. The\
    \ signing secret is returned only when an endpoint is created or its secret rotated,\
    \ never again."
- name: "Stripe configuration"
  description: "The tenant's Stripe connection and the history of Stripe webhook processing.\
    \ Nothing here returns a secret."
- name: "Stripe incidents"
  description: "Problems with Stripe that need a person to look, and resolving them."
- name: "Rating"
  description: "What is done with a plan: cost estimates, reserving the estimate and\
    \ charging usage."
- name: "Pricing plans"
  description: "Pricing plans and their versions."
- name: "Portal: wallets and charges"
  description: "The session's customer's wallets, ledger, charges and top-ups."
- name: "Coupon redemptions"
  description: "Redeem a coupon onto a wallet by code or by id, revoke one, and read\
    \ a wallet's redemptions."
- name: "Portal: usage"
  description: "Usage reported for the session's customer."
- name: "Stripe webhooks"
  description: "Where Stripe delivers events. No login: the signature of the raw body\
    \ is the proof."
- name: "Ledger"
  description: "A wallet's append-only ledger, corrected only with reversal entries."
- name: "Portal: payments"
  description: "The session's customer's payments, refunds and the Stripe-hosted payment-methods\
    \ page."
- name: "Subscriptions"
  description: "Subscribe a wallet to a plan, read and cancel subscriptions."
- name: "Portal: invoices and subscriptions"
  description: "The session's customer's invoices and subscriptions."
- name: "Invoices"
  description: "Invoices. An invoice becomes paid only from a verified payment; no\
    \ request marks one paid."
paths:
  /api/v1/customers/{id}:
    get:
      tags:
      - "Customers"
      summary: "Get a customer"
      description: "Returns one customer; its version is also the response's `ETag`.\
        \ An unknown id answers `404`."
      operationId: "get"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the customer."
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "A billing customer."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-required-permission: "billing:customer:read"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
      security:
      - apiKey: []
    put:
      tags:
      - "Customers"
      summary: "Update a customer"
      description: "Changes the customer's display name and email. Pass the current\
        \ `ETag` in `If-Match`; a stale version is refused with `412`."
      operationId: "update"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the customer."
        required: true
        schema:
          type: "string"
      - name: "If-Match"
        in: "header"
        description: "The `ETag` of the version the caller last read. The change is\
          \ refused with `412` when the resource has moved on since."
        required: false
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The customer properties to store."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
        required: true
      responses:
        "200":
          description: "A billing customer."
          headers:
            ETag:
              description: "The resource version after this change, as a strong tag"
              schema:
                type: "string"
                example: "\"3\""
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          description: "The resource changed since the caller read it; the current\
            \ ETag is returned in the header"
          headers:
            ETag:
              description: "The current version"
              schema:
                type: "string"
                example: "\"3\""
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      x-required-permission: "billing:customer:write"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
      security:
      - apiKey: []
  /api/v1/webhook-endpoints:
    get:
      tags:
      - "Webhook endpoints"
      summary: "List webhook endpoints"
      description: "Pages through the tenant's webhook endpoints, with the list-query\
        \ contract's filtering, sorting and paging.\n\n**Filtering, sorting and paging**\
        \ follow the list-query contract. Conditions in `filter[field][op]` are combined\
        \ with AND. For OR, use `filter[or][i][field][op]`: predicates sharing the\
        \ index `i` are AND-ed and the branches are OR-ed (at most 10 branches, 20\
        \ predicates in all, 100 values in an `in` list). `neq` and `nin` do not match\
        \ rows where the field is null. Send `limit` with either `offset` (at most\
        \ 10000) or the `cursor` taken from a previous page, never both. The body\
        \ is `{\"data\": [...], \"page\": null}`. `page_info=full` fills `page` with\
        \ `limit`, `offset`, `total` and `next_cursor`; `page_info=cursor` fills it\
        \ with `limit` and `next_cursor` alone, without counting the matching rows;\
        \ omit it for the rows alone."
      operationId: "listEndpoints"
      parameters:
      - name: "filter[created_at][eq]"
        in: "query"
        description: "`created_at` eq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][gt]"
        in: "query"
        description: "`created_at` gt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][gte]"
        in: "query"
        description: "`created_at` gte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `created_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[created_at][lt]"
        in: "query"
        description: "`created_at` lt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][lte]"
        in: "query"
        description: "`created_at` lte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][neq]"
        in: "query"
        description: "`created_at` neq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `created_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[description][eq]"
        in: "query"
        description: "`description` eq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[description][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `description`."
        required: false
        schema:
          type: "string"
      - name: "filter[description][is_null]"
        in: "query"
        description: "`true` for rows where `description` is null, `false` for rows\
          \ where it is set."
        required: false
        schema:
          type: "boolean"
      - name: "filter[description][neq]"
        in: "query"
        description: "`description` neq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[description][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `description`."
        required: false
        schema:
          type: "string"
      - name: "filter[description][starts_with]"
        in: "query"
        description: "Case-insensitive prefix match on `description`."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[id][eq]"
        in: "query"
        description: "`id` eq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[id][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `id`."
        required: false
        schema:
          type: "string"
      - name: "filter[id][neq]"
        in: "query"
        description: "`id` neq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[id][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `id`."
        required: false
        schema:
          type: "string"
      - name: "filter[key_id][eq]"
        in: "query"
        description: "`key_id` eq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[key_id][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `key_id`."
        required: false
        schema:
          type: "string"
      - name: "filter[key_id][neq]"
        in: "query"
        description: "`key_id` neq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[key_id][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `key_id`."
        required: false
        schema:
          type: "string"
      - name: "filter[key_id][starts_with]"
        in: "query"
        description: "Case-insensitive prefix match on `key_id`."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[secret_rotated_at][eq]"
        in: "query"
        description: "`secret_rotated_at` eq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[secret_rotated_at][gt]"
        in: "query"
        description: "`secret_rotated_at` gt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[secret_rotated_at][gte]"
        in: "query"
        description: "`secret_rotated_at` gte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[secret_rotated_at][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `secret_rotated_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[secret_rotated_at][is_null]"
        in: "query"
        description: "`true` for rows where `secret_rotated_at` is null, `false` for\
          \ rows where it is set."
        required: false
        schema:
          type: "boolean"
      - name: "filter[secret_rotated_at][lt]"
        in: "query"
        description: "`secret_rotated_at` lt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[secret_rotated_at][lte]"
        in: "query"
        description: "`secret_rotated_at` lte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[secret_rotated_at][neq]"
        in: "query"
        description: "`secret_rotated_at` neq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[secret_rotated_at][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `secret_rotated_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[status][eq]"
        in: "query"
        description: "`status` eq the value."
        required: false
        schema:
          type: "string"
          enum:
          - "ACTIVE"
          - "DISABLED"
      - name: "filter[status][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `status`."
        required: false
        schema:
          type: "string"
      - name: "filter[status][neq]"
        in: "query"
        description: "`status` neq the value."
        required: false
        schema:
          type: "string"
          enum:
          - "ACTIVE"
          - "DISABLED"
      - name: "filter[status][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `status`."
        required: false
        schema:
          type: "string"
      - name: "filter[updated_at][eq]"
        in: "query"
        description: "`updated_at` eq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][gt]"
        in: "query"
        description: "`updated_at` gt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][gte]"
        in: "query"
        description: "`updated_at` gte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `updated_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[updated_at][lt]"
        in: "query"
        description: "`updated_at` lt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][lte]"
        in: "query"
        description: "`updated_at` lte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][neq]"
        in: "query"
        description: "`updated_at` neq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[updated_at][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `updated_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[url][eq]"
        in: "query"
        description: "`url` eq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[url][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `url`."
        required: false
        schema:
          type: "string"
      - name: "filter[url][neq]"
        in: "query"
        description: "`url` neq the value."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "filter[url][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `url`."
        required: false
        schema:
          type: "string"
      - name: "filter[url][starts_with]"
        in: "query"
        description: "Case-insensitive prefix match on `url`."
        required: false
        schema:
          type: "string"
          maxLength: 255
      - name: "sort"
        in: "query"
        description: "Comma-separated sortable fields, each optionally prefixed with\
          \ `-` for descending: created_at, id. At most 4 fields; `id` is appended\
          \ to make the order total. Default: `created_at,id`."
        required: false
        schema:
          type: "string"
      - name: "limit"
        in: "query"
        description: "Page size, 1 to 200."
        required: false
        schema:
          type: "integer"
          format: "int32"
          default: 50
          maximum: 200
          minimum: 1
      - name: "offset"
        in: "query"
        description: "Rows to skip, at most 10000. Not combinable with `cursor`."
        required: false
        schema:
          type: "integer"
          format: "int32"
          default: 0
          maximum: 10000
          minimum: 0
      - name: "cursor"
        in: "query"
        description: "The `next_cursor` of the previous page. Valid only with the\
          \ same filter and sort."
        required: false
        schema:
          type: "string"
      - name: "page_info"
        in: "query"
        description: "`full` fills `page` with the limit, offset, total and next cursor;\
          \ `cursor` fills it with the limit and the next cursor alone, so a walk\
          \ over a large listing is not counted; omit it for the rows alone."
        required: false
        schema:
          type: "string"
          enum:
          - "full"
          - "cursor"
      responses:
        "200":
          description: "A page of endpoint response rows, with the paging facts when\
            \ the request asked for them."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageEndpointResponse"
        "400":
          description: "A filter, sort, cursor or paging parameter is unknown, not\
            \ allowed for the field, or not valid for its type."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permission: "billing:webhook:read"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
      security:
      - apiKey: []
    post:
      tags:
      - "Webhook endpoints"
      summary: "Create a webhook endpoint"
      description: "Registers an HTTPS endpoint that subscribes to a subset of Billing's\
        \ event types. The signing secret is returned once, in this response, and\
        \ never again. Answers `201`."
      operationId: "createEndpoint"
      parameters:
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The endpoint to register."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEndpointRequest"
        required: true
      responses:
        "201":
          description: "An endpoint with its signing secret, shown once."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EndpointWithSecretResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      x-required-permission: "billing:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
      security:
      - apiKey: []
  /api/v1/webhook-endpoints/{id}/rotate-secret:
    post:
      tags:
      - "Webhook endpoints"
      summary: "Rotate a webhook endpoint's secret"
      description: "Replaces the endpoint's signing secret and returns the new one\
        \ once, never again."
      operationId: "rotateSecret"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the webhook endpoint."
        required: true
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      responses:
        "200":
          description: "An endpoint with its signing secret, shown once."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EndpointWithSecretResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-required-permission: "billing:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
      security:
      - apiKey: []
  /api/v1/webhook-deliveries/{id}/resend:
    post:
      tags:
      - "Webhook deliveries"
      summary: "Resend a webhook delivery"
      description: "Queues a fresh delivery of the same stored event to the same endpoint\
        \ and answers `202`: sending happens asynchronously. The original keeps its\
        \ history."
      operationId: "resend"
      parameters:
      - name: "id"
        in: "path"
        description: "The id of the webhook delivery."
        required: true
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      responses:
        "202":
          description: "One delivery of an event to an endpoint."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DeliveryResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      x-required-permission: "billing:webhook:manage"
      x-allowed-callers:
      - "tenant-user"
      - "tenant-system"
      security:
      - apiKey: []
  /api/v1/wallets:
    get:
      tags:
      - "Wallets"
      summary: "List wallets"
      description: "Pages through the tenant's wallets, with the list-query contract's\
        \ filtering, sorting and paging. A Tenant System sees and acts on the customers\
        \ mapped to it only.\n\n**Filtering, sorting and paging** follow the list-query\
        \ contract. Conditions in `filter[field][op]` are combined with AND. For OR,\
