          type: "string"
          description: "Why it failed, or null."
        ledgerEntryId:
          type: "string"
          description: "The id of the ledger entry it posted, or null."
        createdAt:
          type: "string"
          format: "date-time"
          description: "When the record was created."
        completedAt:
          type: "string"
          format: "date-time"
          description: "When it completed, or null."
    PaymentResponse:
      type: "object"
