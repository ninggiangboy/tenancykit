    DailyCount:
      type: "object"
      description: "The clicks of one day."
      properties:
        day:
          type: "string"
          format: "date"
          description: "The day."
        clicks:
          type: "integer"
          format: "int64"
          description: "The clicks on that day."
    LinkStatsView:
      type: "object"
