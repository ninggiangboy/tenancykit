# The background edge: the platform-events listener, the ingest consumer and every scheduled job. It still serves the
# actuator probe, so the web application type stays on; Flyway is off because the migrate step owns the schema.
spring:
  config:
    activate:
      on-profile: "worker & !api"
  flyway:
    enabled: false
  datasource:
    hikari:
      maximum-pool-size: ${ATTRIBUTION_WORKER_DB_POOL_SIZE:10}
      minimum-idle: ${ATTRIBUTION_WORKER_DB_MIN_IDLE:2}
      # A contended coordination row becomes a skipped tick instead of a worker stuck behind someone else's transaction.
      connection-init-sql: "SET lock_timeout = '5s'; SET idle_in_transaction_session_timeout = '60s'"
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  shutdown: graceful
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,replicaState
