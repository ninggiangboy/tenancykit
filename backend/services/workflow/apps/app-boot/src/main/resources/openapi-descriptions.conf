# Descriptions of the request and response fields, parameters and bodies of Workflow's API.
# Read by DescriptionsOpenApiCustomizer; see dev.ngb.core.openapi for the format.

# ---- parameters
param code = The code of the task group.
param status = Only rows in this status.
param /api/v1/instances status = Only instances in this status: `RUNNING`, `WAITING`, `COMPLETED`, `FAILED`, `FAILED_STUCK`, `CANCELLED`, `COMPENSATING` or `COMPENSATION_FAILED`.
param /api/v1/tasks status = Only tasks in this status: `OPEN`, `CLAIMED`, `COMPLETED`, `CANCELLED`, `ESCALATED` or `EXPIRED`.
param definition = Only instances of the definition with this code.
param correlationKey = Only instances with this correlation key.
param limit = The page size. Defaults to 50.
param offset = The number of rows to skip. Defaults to 0.
param compensate = `true` to roll back the steps that already completed before cancelling. Defaults to `false`.
param triggerId = The id of the trigger the event is for.
param version = The number of the published version, starting at 1.
param /api/v1/definitions/{id}/versions/{version} version = The number of the published version, starting at 1.
param /hooks/{triggerId} triggerId = The id of the trigger the delivery is for. The trigger's secret signs the delivery.

# ---- shared fields
field id = The id.
field name = The display name.
field code = The code, unique per tenant. It cannot change.
field status = The current status.
field version = The version of the record. It is also the `ETag`, which a conditional change sends as `If-Match`.
field createdAt = When the record was created.
field updatedAt = When the record was last changed.
field startedAt = When it started.
field finishedAt = When it finished, or null while it is still running.
field publishedAt = When it was published.
field url = The HTTPS URL events are posted to. It must resolve to a public address.
field description = A note about the endpoint.
field eventTypes = The event types the endpoint subscribes to.
field keyId = The id of the key the secret was written under. The secret itself is never returned.
field problems = Every problem found, by pointer.
field graph = The workflow graph: its nodes, edges and settings.
field input = The input of the instance, as JSON.
field filter = An expression over the event envelope that decides whether the trigger fires, or null to accept every event.
field correlation = An expression for the instance's correlation key, or null.
field timezone = The IANA time zone the cron schedule is read in.
field definitionId = The id of the workflow definition.
field instanceId = The id of the workflow instance.
field output = The output the person gave, matching the task's form.
field pointer = The JSON pointer to the offending member of the graph.
field message = What is wrong.
field secret = The secret. It is write-only: it is encrypted on the way in and never returned.

# ---- definitions
schema CreateDefinitionRequest = The definition to create. It starts with an empty draft.
schema DefinitionResponse = A workflow definition.
schema DefinitionResponse.status = `DRAFT`, `PUBLISHED` or `RETIRED`.
schema DefinitionResponse.latestVersion = The number of the newest published version, or 0 before the first publish.
schema DraftRequest = The draft graph, replacing the stored one.
schema DraftResponse = The definition with the problems found in its draft.
schema DraftResponse.definition = The definition.
schema DraftResponse.problems = The structural problems of the draft. A draft with problems is still stored; only publish refuses it.
schema ProblemResponse = One problem in a draft.
schema ProblemResponse.code = The kind of problem.
schema VersionResponse = One immutable published version of a definition.
schema VersionResponse.id = The version's id.
schema VersionResponse.version = The version's number, starting at 1.
schema VersionResponse.contentHash = A hash of the graph's content.
schema VersionResponse.publishedBy = Who published the version.
schema SimulateRequest = The sample to walk the draft with.
schema SimulateRequest.input = The input the instance would start with.
schema SimulateRequest.steps = Canned outputs for the steps that would call out, keyed by node id.
schema SimulationResponse = What a simulated walk did. Nothing was called or stored.
schema SimulationResponse.path = The ids of the nodes visited, in order.
schema SimulationResponse.decisions = The branch taken at each decision node.
schema SimulationResponse.variables = The variables at the end of the walk.
schema SimulationResponse.stoppedAt = The node the walk stopped at, or null when it reached an end.
schema SimulationResponse.problems = Why the walk could not run, by pointer.
schema DecisionResponse = One decision of the walk.
schema DecisionResponse.node = The decision node.
schema DecisionResponse.caseIndex = The index of the case that matched.
schema DecisionResponse.next = The node the walk went to.

# ---- instances
schema StartInstanceRequest = The instance to start.
schema StartInstanceRequest.definition = The id of the definition. Its newest published version is started.
schema StartInstanceRequest.correlationKey = A key that finds the instance again, or null.
schema StartedInstanceResponse = The instance that was started.
schema StartedInstanceResponse.id = The instance's id.
schema StartedInstanceResponse.status = The instance's status.
schema InstanceView = One instance of a workflow. The trigger input is never part of it.
schema InstanceView.id = The instance's id.
schema InstanceView.status = `RUNNING`, `WAITING`, `COMPLETED`, `FAILED`, `FAILED_STUCK`, `CANCELLED`, `COMPENSATING` or `COMPENSATION_FAILED`.
schema InstanceView.definitionCode = The code of the definition it runs.
schema InstanceView.version = The published version the instance is pinned to.
schema InstanceView.correlationKey = The key that finds the instance again, or null.
schema InstanceView.failureReason = Why the instance failed, or null.
schema InstanceView.liveTokens = How many steps are currently active.
schema InstanceView.steps = How many step runs were recorded.
schema InstanceView.rowVersion = The version of the instance's row.
schema RetryRequest = Which step to retry.
schema RetryRequest.nodeId = The node to retry.
schema InstanceStateResponse = The instance after an operation.
schema InstanceStateResponse.id = The instance's id.
schema InstanceStateResponse.status = The instance's status.
schema InstanceStateResponse.failureReason = Why the instance failed, or null.
schema StepRunView = One run of a step. Requests and responses are redacted.
schema StepRunView.id = The step run's id.
schema StepRunView.nodeId = The node the step ran.
schema StepRunView.attempt = The attempt's number, starting at 1.
schema StepRunView.outcome = How the step ended.
schema StepRunView.errorClass = The class of the error when the step failed, or null.
schema StepRunView.failure = The reason the step failed, or null.
schema StepRunView.response = The redacted response of the call the step made, or null.
schema StepRunView.idempotencyKey = The idempotency key the step sent. A retry sends the same one.

# ---- tasks
schema TaskView = One human task: what it asks, who it is for, when it is due and what was decided.
schema TaskView.title = The task's title.
schema TaskView.status = `OPEN`, `CLAIMED`, `COMPLETED`, `CANCELLED`, `ESCALATED` or `EXPIRED`.
schema TaskView.nodeId = The workflow node that created the task.
schema TaskView.assigneeKind = Whether the task is assigned to a user or to a group.
schema TaskView.assignee = The user or group the task is assigned to.
schema TaskView.assigneeUserId = The id of the user the task is assigned to, when it names one, or null.
schema TaskView.outcomes = The decisions a person may complete the task with.
schema TaskView.form = The form the output has to match, or null.
schema TaskView.dueAt = When the task is due, or null.
schema TaskView.escalateAt = When the task escalates, or null.
schema TaskView.expiresAt = When the task expires, or null.
schema TaskView.decision = The decision the task was completed with, or null.
schema TaskView.completedBy = Who completed the task. For a Tenant System this is the person it named, recorded as stated.
schema TaskView.completedVia = How the task was completed.
schema TaskView.completedAt = When the task was completed, or null.
schema CompleteRequest = How to complete the task.
schema CompleteRequest.decision = One of the task's `outcomes`.
schema CompleteRequest.completedBy = The person a Tenant System speaks for. It is recorded as stated, not verified.
schema ReassignRequest = Who to move the task to. Give a user or a group.
schema ReassignRequest.user = The id of the user to assign the task to.
schema ReassignRequest.group = The code of the group to assign the task to. Its members are copied onto the task.
schema GroupRequest = The task group to store.
schema GroupRequest.members = The ids of the members. Each must be an active user.
schema GroupResponse = A named list a task may be assigned to.
schema GroupResponse.members = The ids of the members.

# ---- triggers and hooks
schema CreateTriggerRequest = The trigger to create.
schema CreateTriggerRequest.kind = `APP` for a suite app's signed webhook, `EXTERNAL` for an outside system's signed webhook, or `SCHEDULE` for a cron schedule.
schema CreateTriggerRequest.source = The app code of a suite webhook, or the source name of an external one.
schema CreateTriggerRequest.eventType = The one event type that starts the workflow, or null for every type of the source.
schema CreateTriggerRequest.definitionId = The definition to start.
schema CreateTriggerRequest.input = An expression for the instance's input, or null to use the event's `data`.
schema CreateTriggerRequest.cron = The cron expression of a `SCHEDULE` trigger.
schema UpdateTriggerRequest = The fields to change. A field that is left out keeps its value.
schema UpdateTriggerRequest.eventType = The one event type that starts the workflow, or null for every type of the source.
schema UpdateTriggerRequest.input = An expression for the instance's input.
schema UpdateTriggerRequest.enabled = `false` disables the trigger.
schema TriggerResponse = A way a definition starts. The signing secret is not part of it.
schema TriggerResponse.kind = `APP`, `EXTERNAL` or `SCHEDULE`.
schema TriggerResponse.source = The app code of a suite webhook, the source name of an external one, or the kind's own name.
schema TriggerResponse.eventType = The one event type that starts the workflow, or null for every type of the source.
schema TriggerResponse.input = An expression for the instance's input, or null.
schema TriggerResponse.enabled = Whether the trigger is active.
schema TriggerWithSecretResponse = A trigger with its signing secret, shown once.
schema TriggerWithSecretResponse.trigger = The trigger.
schema TriggerWithSecretResponse.signingSecret = The secret that signs deliveries. It is shown only in this response and is never available again.
schema ReceiptResponse = The receipt of a delivered event.
schema ReceiptResponse.eventId = The id of the event.
schema ReceiptResponse.started = How many instances the event started.
schema ReceiptResponse.duplicate = Whether the event id was seen before. A duplicate starts nothing.

# ---- connections and credential
schema ConnectionRequest = The connection to store.
schema ConnectionRequest.kind = How the connection authenticates: `BEARER`, `BASIC`, `API_KEY`, `HMAC` or `NONE`.
schema ConnectionRequest.allowedHost = The one host a step may reach with this connection.
schema ConnectionRequest.headers = Extra headers sent with each call, by name.
schema ConnectionResponse = A connection. The secret is never part of it.
schema ConnectionResponse.kind = How the connection authenticates.
schema ConnectionResponse.allowedHost = The one host a step may reach with this connection.
schema ConnectionResponse.headers = Extra headers sent with each call, by name.
schema ConnectionResponse.verifiedAt = When the connection was last verified, or null.
schema RegisterRequest = The credential to store.
schema RegisterRequest.clientId = The client id of the Platform credential.
schema CredentialResponse = The Platform credential's status. The secret is never part of it.
schema CredentialResponse.clientId = The client id of the Platform credential.
schema CredentialResponse.status = `ACTIVE`, or `INVALID` when Platform no longer accepts it.

# ---- webhooks
schema CreateEndpointRequest = The endpoint to register.
schema CreateEndpointRequest.eventTypes = The event types to subscribe to, from workflow's four.
schema UpdateEndpointRequest = The fields to change. A field that is left out keeps its value.
schema UpdateEndpointRequest.status = `ACTIVE`, or `DISABLED` to pause delivery without losing queued events.
schema EndpointResponse = A webhook endpoint. The signing secret is not part of it.
schema EndpointResponse.status = `ACTIVE` or `DISABLED`.
schema EndpointResponse.secretRotatedAt = When the signing secret was last rotated, or null.
schema EndpointWithSecretResponse = An endpoint with its signing secret, shown once.
schema EndpointWithSecretResponse.endpoint = The endpoint.
schema EndpointWithSecretResponse.signingSecret = The secret that signs deliveries. It is shown only in this response and is never available again.
schema DeliveryResponse = One delivery of an event to an endpoint.
schema DeliveryResponse.endpointId = The id of the endpoint.
schema DeliveryResponse.eventId = The id of the event. A receiver should treat a repeated event id as a duplicate.
schema DeliveryResponse.eventType = The event's type.
schema DeliveryResponse.status = Where the delivery stands. `DEAD` means it exhausted its attempts.
schema DeliveryResponse.attempts = How many attempts have been made.
schema DeliveryResponse.nextAttemptAt = When the next attempt is due, or null.
schema DeliveryResponse.lastStatusCode = The HTTP status the receiver answered last, or null.
schema DeliveryResponse.lastError = The last error, or null.
schema DeliveryResponse.completedAt = When the delivery finished, or null.

# ---- event hook
body /hooks/{triggerId} = The event as the source app sent it, byte for byte. The signature in the headers covers exactly these bytes.

# ---- errors specific to an operation
error POST /hooks/{triggerId} 401 = The signature is wrong, the timestamp is stale, the trigger is unknown, or the body was tampered with. All of them answer the same.
error POST /api/v1/definitions/{id}/publish 422 = The draft is invalid. The answer lists every problem by pointer.
error POST /api/v1/webhook-endpoints 422 = The url is not https or does not resolve to a public address, or an event type is not known.
error POST /api/v1/tasks/{id}/claim 409 = The task is already claimed.
error GET /api/v1/tasks/{id} 404 = The task does not exist, or the caller may not see it. Both answer the same, because a `403` would confirm that it exists.

# ---- success statuses a handler answers by what it did
status POST /api/v1/connections 201 =
status POST /api/v1/definitions 201 =
status POST /api/v1/definitions/{id}/publish 201 =
status POST /api/v1/instances/{id}/replay 201 =
status POST /api/v1/triggers 201 =
status DELETE /api/v1/webhook-endpoints/{id} 204 = The endpoint was deleted. Its delivery history stays readable.
error POST /hooks/{triggerId} 400 =
