    post:
      tags:
      - "Emails"
      summary: "Send one email"
      description: "Renders one email for one recipient from a template (`templateKey`\
        \ and `variables`) or from an inline `subject`, `html` and `text`, records\
        \ it and queues it for delivery. A suppressed address is stored as `SKIPPED`\
        \ and a failed render as `FAILED` with the reason; neither is sent. Send an\
        \ `Idempotency-Key` so a retried call returns the same email. Answers `201`.\
        \ Requires `mailroom:email:send`.\n\nCallers: tenant-user, tenant-system.\
        \ Requires `mailroom:email:send`."
      operationId: "send"
      parameters:
      - name: "Idempotency-Key"
        in: "header"
        description: "A key the caller chooses so a retry is safe: the same key with\
          \ the same body answers the first result instead of acting twice, and the\
          \ same key with a different body is a conflict."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The email to send."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendEmailRequest"
        required: true
      responses:
        "201":
          description: "One email of the ledger."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
      x-required-permission: "mailroom:email:send"
      x-allowed-callers:
