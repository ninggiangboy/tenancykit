---
openapi: "3.1.0"
info:
  title: "Workflow API"
  description: "The API a Tenant System uses to publish and run workflows, take part\
    \ in human tasks and manage the connections and triggers that drive them."
  version: "v1"
servers:
- url: "/workflow"
  description: "Any tenant hostname: <tenant-code>.<base-domain>/workflow"
paths:
  /api/v1/triggers/{id}:
    get:
      tags:
      - "trigger-controller"
      operationId: "getTrigger"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TriggerResponse"
      x-required-permission: "workflow:trigger:manage"
    put:
      tags:
      - "trigger-controller"
      operationId: "updateTrigger"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "If-Match"
        in: "header"
        required: false
        schema:
          type: "string"
      - name: "X-Request-Id"
        in: "header"
        required: false
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTriggerRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TriggerResponse"
      x-required-permission: "workflow:trigger:manage"
  /api/v1/task-groups/{code}:
    put:
      tags:
      - "task-group-controller"
      operationId: "update"
      parameters:
      - name: "code"
        in: "path"
        required: true
        schema:
          type: "string"
      - name: "If-Match"
        in: "header"
        required: false
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GroupResponse"
      x-required-permission: "workflow:task:manage"
    delete:
      tags:
      - "task-group-controller"
      operationId: "delete"
      parameters:
      - name: "code"
        in: "path"
        required: true
        schema:
          type: "string"
      responses:
        "204":
          description: "No Content"
      x-required-permission: "workflow:task:manage"
  /api/v1/platform-credential:
    get:
      tags:
      - "platform-credential-controller"
      operationId: "status"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CredentialResponse"
      x-required-permission: "workflow:connection:manage"
    put:
      tags:
      - "platform-credential-controller"
      operationId: "register"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CredentialResponse"
      x-required-permission: "workflow:connection:manage"
  /api/v1/definitions/{id}/draft:
    put:
      tags:
      - "definition-controller"
      operationId: "putDraft"
      parameters:
      - name: "id"
        in: "path"
