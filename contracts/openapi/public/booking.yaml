          format: "uuid"
        eventId:
          type: "string"
          format: "uuid"
        eventType:
          type: "string"
        status:
          type: "string"
          enum:
          - "PENDING"
          - "DELIVERED"
          - "RETRYING"
          - "DEAD"
        attempts:
          type: "integer"
          minimum: 0
        lastStatusCode:
          type:
          - "integer"
          - "null"
        lastError:
          type:
          - "string"
          - "null"
        nextAttemptAt:
          type:
          - "string"
          - "null"
          format: "date-time"
    DeliveryPage:
      type: "object"
      required:
      - "data"
      properties:
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/Delivery"
    CustomerTokenRequest:
      type: "object"
      additionalProperties: false
      required:
      - "customerRef"
      - "scopes"
      properties:
        customerRef:
          type: "string"
          minLength: 1
          maxLength: 200
        scopes:
          type: "array"
          minItems: 1
          items:
            type: "string"
            enum:
            - "browse"
            - "hold"
            - "waitlist"
        offeringId:
          type:
          - "string"
          - "null"
          format: "uuid"
        ttlSeconds:
          type: "integer"
          minimum: 1
          maximum: 3600
    CustomerToken:
      type: "object"
      additionalProperties: false
      required:
      - "token"
      - "expiresAt"
      - "keyId"
      properties:
        token:
          type: "string"
        expiresAt:
          type: "string"
          format: "date-time"
        keyId:
          type: "string"
    Settings:
      type: "object"
      additionalProperties: false
      required:
      - "holdTtlSeconds"
      - "maxExtensionSeconds"
      - "graceSeconds"
      - "offerWindowSeconds"
      - "horizonDays"
      - "tokenTtlCapSeconds"
      - "rateLimitPerMinute"
      - "admissionCap"
      - "waitlistCapPerTarget"
      properties:
        holdTtlSeconds:
          type: "integer"
          minimum: 1
        maxExtensionSeconds:
          type: "integer"
          minimum: 0
        graceSeconds:
          type: "integer"
          minimum: 0
        offerWindowSeconds:
          type: "integer"
          minimum: 1
        horizonDays:
          type: "integer"
          minimum: 1
        tokenTtlCapSeconds:
          type: "integer"
          minimum: 1
        rateLimitPerMinute:
          type: "integer"
          minimum: 1
        admissionCap:
          type: "integer"
          minimum: 1
        waitlistCapPerTarget:
          type: "integer"
          minimum: 1
        allowedOrigins:
          type: "array"
          items:
            type: "string"
    GateSettings:
      type: "object"
      additionalProperties: false
      required:
      - "allowedOrigins"
      - "maxTokenTtlSeconds"
      properties:
        allowedOrigins:
          type: "array"
          maxItems: 20
          items:
            type: "string"
            format: "uri"
        maxTokenTtlSeconds:
          type: "integer"
          minimum: 1
          maximum: 3600
    PublicOffering:
      type: "object"
      additionalProperties: false
      required:
      - "id"
      - "name"
      - "kind"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        kind:
          type: "string"
          enum:
          - "INTERVAL"
          - "CAPACITY"
        durationMin:
          type: "integer"
        durationMax:
          type: "integer"
        durationStep:
          type: "integer"
        remaining:
          type: "integer"
          minimum: 0
          description: "Only when the offering sets `publicShowsRemaining`."
    QueueEntryRequest:
      type: "object"
      additionalProperties: false
      required:
      - "offeringId"
      properties:
        offeringId:
          type: "string"
          format: "uuid"
        sessionId:
          type:
          - "string"
          - "null"
          format: "uuid"
    QueueTicket:
      type: "object"
      additionalProperties: false
      required:
      - "ticketToken"
      - "retryAfterSeconds"
      properties:
        ticketToken:
          type: "string"
        retryAfterSeconds:
          type: "integer"
          minimum: 1
    QueueStatus:
      type: "object"
      additionalProperties: false
      required:
      - "status"
      properties:
        status:
          type: "string"
          enum:
          - "WAITING"
          - "ADMITTED"
          - "USED"
          - "EXPIRED"
          - "LEFT"
        position:
          type:
          - "integer"
          - "null"
          minimum: 0
          description: "An upper bound; ticket numbers are shared across targets."
        retryAfterSeconds:
          type:
          - "integer"
          - "null"
          minimum: 1
