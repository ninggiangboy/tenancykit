---
openapi: "3.1.0"
info:
  title: "Booking API"
  description: "The API a Tenant System uses to build versioned bookings, issue links\
    \ and read what came back, plus the public endpoints a respondent's browser calls\
    \ without credentials."
  version: "v1"
servers:
- url: "/booking"
  description: "Any tenant hostname: <tenant-code>.<base-domain>/booking"
paths:
  /p/waitlist:
    post:
      tags:
      - "public-controller"
      description: "Callers: public."
      operationId: "joinWaitlist"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicWaitlistJoin"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicWaitlistEntry"
      x-allowed-callers:
      - "public"
  /p/queue:
    post:
      tags:
      - "public-controller"
      description: "Callers: public."
      operationId: "enterQueue"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueEntry"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QueueTicketResponse"
      x-allowed-callers:
      - "public"
    delete:
      tags:
      - "public-controller"
      description: "Callers: public."
      operationId: "leaveQueue"
      responses:
        "200":
          description: "OK"
      x-allowed-callers:
      - "public"
  /p/bookings:
    post:
      tags:
      - "public-controller"
      description: "Callers: public."
      operationId: "hold"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicBookingCreate"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicBooking"
      x-allowed-callers:
      - "public"
  /p/waitlist/{entryId}:
    get:
      tags:
      - "public-controller"
      description: "Callers: public."
      operationId: "getWaitlistEntry"
      parameters:
      - name: "entryId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicWaitlistEntry"
      x-allowed-callers:
      - "public"
    delete:
      tags:
      - "public-controller"
      description: "Callers: public."
      operationId: "leaveWaitlist"
      parameters:
      - name: "entryId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "OK"
      x-allowed-callers:
      - "public"
  /p/queue/status:
    get:
      tags:
      - "public-controller"
      description: "Callers: public."
      operationId: "queueStatus"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QueueStatusResponse"
      x-allowed-callers:
      - "public"
  /p/offerings/{offeringId}:
    get:
      tags:
      - "public-controller"
      description: "Callers: public."
      operationId: "getOffering_1"
      parameters:
      - name: "offeringId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicOffering"
      x-allowed-callers:
      - "public"
  /p/offerings/{offeringId}/availability:
    get:
      tags:
      - "public-controller"
      description: "Callers: public."
      operationId: "getAvailability"
      parameters:
      - name: "offeringId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "from"
        in: "query"
        required: true
        schema:
          type: "string"
          format: "date-time"
      - name: "to"
        in: "query"
        required: true
        schema:
          type: "string"
          format: "date-time"
      - name: "durationMinutes"
        in: "query"
        required: false
        schema:
          type: "integer"
          format: "int32"
      - name: "resource"
        in: "query"
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "partySize"
        in: "query"
        required: false
        schema:
          type: "integer"
          format: "int32"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicAvailability"
      x-allowed-callers:
      - "public"
  /p/bookings/{bookingId}:
    delete:
      tags:
      - "public-controller"
      description: "Callers: public."
      operationId: "release"
      parameters:
      - name: "bookingId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "OK"
      x-allowed-callers:
      - "public"
