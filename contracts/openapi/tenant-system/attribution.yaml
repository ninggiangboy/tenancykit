      summary: "Get a link's QR code"
      description: "Returns a QR code of the link's public URL as `png` (the default)\
        \ or `svg`, `size` pixels wide (default 256).\n\nCallers: tenant-system. Requires\
        \ `attribution:link:read`."
      operationId: "qrAsTenantSystem"
      parameters:
      - name: "id"
