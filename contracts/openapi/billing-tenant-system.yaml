      properties:
        version:
          type: "integer"
          format: "int32"
          description: "The version of the plan."
        rule:
          $ref: "#/components/schemas/RuleDto"
          description: "The price rule."
        billingCycle:
          type: "string"
          description: "For a subscription: `DAILY`, `WEEKLY`, `MONTHLY`, `QUARTERLY`\
            \ or `YEARLY`."
        minCharge:
          type: "integer"
          format: "int64"
          description: "The least a charge is rounded up to, in minor units, or null."
        maxCharge:
          type: "integer"
          format: "int64"
          description: "The most a charge is capped at, in minor units, or null."
        rounding:
          type: "string"
          description: "How a fractional amount is rounded."
        validFrom:
          type: "string"
          format: "date-time"
          description: "When the version takes effect."
        validUntil:
          type: "string"
          format: "date-time"
          description: "When the version stops applying, or null."
        createdAt:
          type: "string"
          format: "date-time"
          description: "When the record was created."
        createdBy:
          type: "string"
          description: "Who published the version."
    RefundRequest:
      type: "object"
      description: "The refund to request."
      properties:
