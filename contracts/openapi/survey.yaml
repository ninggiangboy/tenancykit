        schema:
          type: string
          format: uuid
      - name: "filter[id][nin]"
        in: query
        description: Comma-separated list of up to 100 values; `nin` of `id`.
        required: false
        schema:
          type: string
      - name: "filter[name][contains]"
        in: query
        description: Case-insensitive substring match on `name`.
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[name][eq]"
        in: query
        description: '`name` eq the value.'
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[name][in]"
        in: query
        description: Comma-separated list of up to 100 values; `in` of `name`.
        required: false
        schema:
          type: string
      - name: "filter[name][neq]"
        in: query
        description: '`name` neq the value.'
        required: false
        schema:
          type: string
          maxLength: 255
      - name: "filter[name][nin]"
