          description: "The price rule."
        billingCycle:
          type: "string"
          description: "For a subscription: `DAILY`, `WEEKLY`, `MONTHLY`, `QUARTERLY`\
            \ or `YEARLY`."
        minCharge:
          type: "integer"
          format: "int64"
          description: "The least a charge is rounded up to, in minor units, or null."
        maxCharge:
          type: "integer"
          format: "int64"
          description: "The most a charge is capped at, in minor units, or null."
        rounding:
          type: "string"
          description: "How a fractional amount is rounded: `HALF_UP`, `HALF_EVEN`,\
            \ `UP` or `DOWN`."
        validFrom:
          type: "string"
          format: "date-time"
          description: "When the version takes effect."
        validUntil:
          type: "string"
          format: "date-time"
          description: "When the version stops applying, or null."
    PlanResponse:
      type: "object"
      description: "A pricing plan and its versions."
      properties:
        id:
          type: "string"
          description: "The id."
        code:
          type: "string"
          description: "The code, unique per tenant."
        name:
          type: "string"
          description: "The name."
        model:
          type: "string"
          description: "The pricing model."
        currency:
          type: "string"
          description: "The ISO 4217 currency code of the amounts."
        status:
          type: "string"
          description: "`ACTIVE` or `RETIRED`."
        createdAt:
          type: "string"
          format: "date-time"
          description: "When the record was created."
        retiredAt:
          type: "string"
          format: "date-time"
          description: "When the plan was retired, or null."
        versions:
          type: "array"
          description: "Every version, earlier ones unchanged."
          items:
            $ref: "#/components/schemas/VersionResponse"
    VersionResponse:
      type: "object"
      description: "One version of a pricing plan. Earlier versions, and every charge\
