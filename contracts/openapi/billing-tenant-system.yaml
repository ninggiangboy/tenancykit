      summary: "Open a wallet"
      description: "Opens a customer's wallet in one `currency`, as prepaid or postpaid\
        \ (`mode`, with a `creditLimit` for postpaid). Amounts are integers in minor\
        \ units. Asking again with the same settings answers the existing wallet;\
        \ different settings are a conflict, because a wallet's currency and mode\
        \ never change."
      operationId: "openWallet"
      parameters:
      - name: "X-Request-Id"
        in: "header"
        description: "An id the caller chooses for this call. It is recorded with\
          \ the call and its audit entry, so the call can be found again."
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The wallet to open."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenWalletRequest"
        required: true
      responses:
        "200":
          description: "The customer already had this wallet with the same settings,\
            \ so it is returned."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WalletResponse"
        "201":
          description: "The wallet was opened."
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WalletResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
