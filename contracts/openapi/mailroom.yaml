  /api/v1/templates/{id}/revisions:
    get:
      tags:
      - "template-controller"
      description: "**Filtering, sorting and paging** follow the list-query contract.\
        \ Conditions in `filter[field][op]` are combined with AND. For OR, use `filter[or][i][field][op]`:\
        \ predicates sharing the index `i` are AND-ed and the branches are OR-ed (at\
        \ most 10 branches, 20 predicates in all, 100 values in an `in` list). `neq`\
        \ and `nin` do not match rows where the field is null. Send `limit` with either\
        \ `offset` (at most 10000) or the `cursor` taken from a previous page, never\
        \ both. The body is `{\"data\": [...], \"page\": null}`; `page_info=true`\
        \ fills `page` with `limit`, `offset`, `total` and `next_cursor`."
      operationId: "revisions"
      parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[created_at][eq]"
        in: "query"
        description: "`created_at` eq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][gt]"
        in: "query"
        description: "`created_at` gt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][gte]"
        in: "query"
        description: "`created_at` gte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `created_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[created_at][lt]"
        in: "query"
        description: "`created_at` lt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][lte]"
        in: "query"
        description: "`created_at` lte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][neq]"
        in: "query"
        description: "`created_at` neq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[created_at][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `created_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[id][eq]"
        in: "query"
        description: "`id` eq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[id][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `id`."
        required: false
        schema:
          type: "string"
      - name: "filter[id][neq]"
        in: "query"
        description: "`id` neq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[id][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `id`."
        required: false
        schema:
          type: "string"
      - name: "filter[revision][eq]"
        in: "query"
        description: "`revision` eq the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[revision][gt]"
        in: "query"
        description: "`revision` gt the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[revision][gte]"
        in: "query"
        description: "`revision` gte the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[revision][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `revision`."
        required: false
        schema:
          type: "string"
      - name: "filter[revision][lt]"
        in: "query"
        description: "`revision` lt the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[revision][lte]"
        in: "query"
        description: "`revision` lte the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[revision][neq]"
        in: "query"
        description: "`revision` neq the value."
        required: false
        schema:
          type: "integer"
          format: "int64"
      - name: "filter[revision][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `revision`."
        required: false
        schema:
          type: "string"
      - name: "filter[subject][eq]"
        in: "query"
        description: "`subject` eq the value."
        required: false
