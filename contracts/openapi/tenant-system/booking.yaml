  /api/v1/sessions:
    get:
      tags:
      - "session-controller"
      description: "**Filtering, sorting and paging** follow the list-query contract.\
        \ Conditions in `filter[field][op]` are combined with AND. For OR, use `filter[or][i][field][op]`:\
        \ predicates sharing the index `i` are AND-ed and the branches are OR-ed (at\
        \ most 10 branches, 20 predicates in all, 100 values in an `in` list). `neq`\
        \ and `nin` do not match rows where the field is null. Send `limit` with either\
        \ `offset` (at most 10000) or the `cursor` taken from a previous page, never\
        \ both. The body is `{\"data\": [...], \"page\": null}`. `page_info=full`\
        \ fills `page` with `limit`, `offset`, `total` and `next_cursor`; `page_info=cursor`\
        \ fills it with `limit` and `next_cursor` alone, without counting the matching\
        \ rows; omit it for the rows alone.\n\nCallers: tenant-user, tenant-system.\
        \ Requires `booking:offering:read`."
      operationId: "listSessions"
      parameters:
      - name: "filter[id][eq]"
        in: "query"
        description: "`id` eq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[id][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `id`."
        required: false
        schema:
          type: "string"
      - name: "filter[id][neq]"
        in: "query"
        description: "`id` neq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[id][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `id`."
        required: false
        schema:
          type: "string"
      - name: "filter[offering_id][eq]"
        in: "query"
        description: "`offering_id` eq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[offering_id][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `offering_id`."
        required: false
        schema:
          type: "string"
      - name: "filter[offering_id][neq]"
        in: "query"
        description: "`offering_id` neq the value."
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "filter[offering_id][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `offering_id`."
        required: false
        schema:
          type: "string"
      - name: "filter[starts_at][eq]"
        in: "query"
        description: "`starts_at` eq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[starts_at][gt]"
        in: "query"
        description: "`starts_at` gt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[starts_at][gte]"
        in: "query"
        description: "`starts_at` gte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[starts_at][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `starts_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[starts_at][lt]"
        in: "query"
        description: "`starts_at` lt the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[starts_at][lte]"
        in: "query"
        description: "`starts_at` lte the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[starts_at][neq]"
        in: "query"
        description: "`starts_at` neq the value."
        required: false
        schema:
          type: "string"
          format: "date-time"
      - name: "filter[starts_at][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `starts_at`."
        required: false
        schema:
          type: "string"
      - name: "filter[status][eq]"
        in: "query"
        description: "`status` eq the value."
        required: false
        schema:
          type: "string"
          enum:
          - "CANCELLED"
          - "SCHEDULED"
      - name: "filter[status][in]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `in` of `status`."
        required: false
        schema:
          type: "string"
      - name: "filter[status][neq]"
        in: "query"
        description: "`status` neq the value."
        required: false
        schema:
          type: "string"
          enum:
          - "CANCELLED"
          - "SCHEDULED"
      - name: "filter[status][nin]"
        in: "query"
        description: "Comma-separated list of up to 100 values; `nin` of `status`."
        required: false
        schema:
          type: "string"
      - name: "sort"
        in: "query"
        description: "Comma-separated sortable fields, each optionally prefixed with\
          \ `-` for descending: id, starts_at. At most 4 fields; `id` is appended\
