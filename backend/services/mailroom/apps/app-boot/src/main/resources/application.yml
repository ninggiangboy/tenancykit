spring:
  application:
    name: mailroom
  profiles:
    # With no active profile (dev, bootRun and every default-mode test) both runtime profiles are active, which
    # keeps the all-in-one behaviour. The two profile files stay out of that run: each guards itself with an
    # on-profile expression so only a runtime that runs alone applies its settings.
    default: api,worker
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${MAILROOM_OIDC_ISSUER_URI:http://localhost:8081/realms/tenancykit}
          jwk-set-uri: ${MAILROOM_OIDC_JWK_SET_URI:${MAILROOM_OIDC_ISSUER_URI:http://localhost:8081/realms/tenancykit}/protocol/openid-connect/certs}
          audiences: mailroom
  datasource:
    url: ${MAILROOM_DB_URL:jdbc:postgresql://localhost:5432/mailroom}
    username: ${MAILROOM_DB_USER:mailroom_app}
    password: ${MAILROOM_DB_PASSWORD:mailroom_app}
  rabbitmq:
    host: ${MAILROOM_RABBITMQ_HOST:localhost}
    port: ${MAILROOM_RABBITMQ_PORT:5672}
    username: ${MAILROOM_RABBITMQ_USER:mailroom}
    password: ${MAILROOM_RABBITMQ_PASSWORD:mailroom}
    # The relay marks an outbox row only after waitForConfirmsOrDie, which needs simple publisher confirms.
    publisher-confirm-type: simple
  flyway:
    locations: classpath:db/migration
    # Migrations run as the table owner; the application connects as mailroom_app, which owns nothing.
    url: ${MAILROOM_MIGRATION_DB_URL:${MAILROOM_DB_URL:jdbc:postgresql://localhost:5432/mailroom}}
    user: ${MAILROOM_MIGRATION_DB_USER:mailroom_owner}
    password: ${MAILROOM_MIGRATION_DB_PASSWORD:mailroom_owner}
    placeholders:
      # The baseline creates mailroom_app with this password. Without the placeholder Flyway aborts the whole set.
      appDbPassword: ${MAILROOM_DB_PASSWORD:mailroom_app}
  task:
    scheduling:
      pool:
        size: ${MAILROOM_SCHEDULER_POOL_SIZE:4}
      shutdown:
        await-termination: true
        await-termination-period: 30s

server:
  port: ${MAILROOM_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,replicaState

suite:
  app-code: mailroom
  replica:
    platform-base-url: ${MAILROOM_PLATFORM_BASE_URL:http://localhost:8082}
    client-id: ${PLATFORM_MAILROOM_SERVICE_CLIENT_ID:mailroom}
    client-secret: ${PLATFORM_MAILROOM_SERVICE_CLIENT_SECRET:mailroom}
    rebuild-on-start: ${MAILROOM_REPLICA_REBUILD_ON_START:true}
    page-limit: 200
    request-timeout: PT10S
    platform-issuer: ${MAILROOM_PLATFORM_ISSUER:http://localhost:8082}
    platform-jwk-set-uri: ${MAILROOM_PLATFORM_JWK_SET_URI:http://localhost:8082/.well-known/jwks.json}
    # The worker's queue; the api runtime serves HTTP and consumes nothing.
    queue: mailroom.platform-events
    exchange: platform.events
    max-attempts: 3
    retry-backoff: PT0.5S
    refresh-skew: PT30S

mailroom:
  messaging:
    exchange: ${MAILROOM_MESSAGING_EXCHANGE:platform.events}
    queue: ${MAILROOM_MESSAGING_QUEUE:mailroom.platform-events}
  # Mailer's result event. It is mailer's exchange: mailroom only binds a queue to it.
  mailer:
    exchange: ${MAILROOM_MAILER_EVENTS_EXCHANGE:mailer.events}
    queue: ${MAILROOM_MAILER_EVENTS_QUEUE:mailroom.mailer-events}
  commands:
    exchange: ${MAILROOM_COMMANDS_EXCHANGE:mailer.commands}
    routing-key: ${MAILROOM_COMMANDS_ROUTING_KEY:email.send}
  relay:
    poll-delay: PT2S
    batch-size: 50
    max-attempts: 10
    backoff-base: PT10S
    backoff-cap: PT1H
    jitter: 0.2
    claim-deadline: PT30S
  jobs:
    enabled: ${MAILROOM_JOBS_ENABLED:true}
    # At most this many tenants run at once across all jobs; keep it below the connection pool.
    tenant-parallelism: ${MAILROOM_WORKER_TENANT_PARALLELISM:4}
  campaign:
    # The publishing tick. The per-tick budget is the tenant's per-minute cap divided by the ticks in a minute, so
    # changing this interval changes how the cap is spent but never the cap itself.
    publisher-interval: ${MAILROOM_CAMPAIGN_PUBLISHER_INTERVAL:PT5S}
    scheduler-interval: ${MAILROOM_CAMPAIGN_SCHEDULER_INTERVAL:PT5S}
  # What a tenant inherits when it has no email_settings row of its own.
  defaults:
    from-key: ${MAILROOM_DEFAULT_FROM_KEY:noreply}
    from-name: ${MAILROOM_DEFAULT_FROM_NAME:}
    reply-to: ${MAILROOM_DEFAULT_REPLY_TO:}
    body-retention-days: ${MAILROOM_DEFAULT_BODY_RETENTION_DAYS:30}
    campaign-publish-per-minute: ${MAILROOM_DEFAULT_CAMPAIGN_PUBLISH_PER_MINUTE:600}
  housekeeping:
    enabled: ${MAILROOM_HOUSEKEEPING_ENABLED:true}
    inbox-retention: P30D
    dead-outbox-retention: P7D
    campaign-recipient-retention: P365D
    batch-size: 500
    interval: PT1H
  tracking:
    # New tokens carry this key id; verification accepts every key still listed, so a rotation keeps old mail valid.
    active-key-id: ${MAILROOM_TRACKING_KEY_ID:k1}
    public-base-url: ${MAILROOM_PUBLIC_BASE_URL:http://localhost/mailroom}
    # The default is deliberately empty rather than a well-known string: TrackingConfiguration refuses to start
    # without a key, so a deployment that forgets MAILROOM_TRACKING_SECRET fails at boot instead of signing every
    # recipient's links with a secret the whole internet can read.
    keys:
      k1: ${MAILROOM_TRACKING_SECRET:}
