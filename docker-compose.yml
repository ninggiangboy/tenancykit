# Local development services. Integration tests use Testcontainers and do not need this file.
# Copy .env.example to .env and fill the values in before running `docker compose up`.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: ${BILLING_MIGRATION_DB_PASSWORD:?set it in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?set it in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?set it in .env}
      # Substituted into ops/keycloak/realm-export.json when the realm is imported.
      PLATFORM_KEYCLOAK_ADMIN_CLIENT_SECRET: ${PLATFORM_KEYCLOAK_ADMIN_CLIENT_SECRET:?set it in .env}
    ports:
      - "8081:8080"
    volumes:
      - ./ops/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${BILLING_RABBITMQ_USER:-billing}
      RABBITMQ_DEFAULT_PASS: ${BILLING_RABBITMQ_PASSWORD:-billing}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  tenant-postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: tenant
      POSTGRES_USER: tenant
      POSTGRES_PASSWORD: ${SAMPLE_TENANT_DB_PASSWORD:-tenant}
    ports:
      - "5433:5432"
    volumes:
      - tenant-postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
  rabbitmq-data:
  tenant-postgres-data:
